<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIT & GET - Daily Tasks</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#050505;
    color:white;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:430px;
    margin:auto;
    min-height:100vh;
    padding:20px;
    padding-bottom:40px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.back-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid #9DFF00;
    background:#111;
    color:#9DFF00;
    font-size:20px;
}

.header h1{
    font-size:22px;
}

.rc{
    color:#9DFF00;
    font-weight:700;
}


/* START BUTTON */

.start-btn{
    width:100%;
    height:58px;
    margin-bottom:18px;
    border:none;
    border-radius:16px;
    background:#9DFF00;
    color:#000;
    font-size:17px;
    font-weight:800;
    box-shadow:0 0 18px rgba(157,255,0,.12);
}

.start-btn:disabled{
    background:#222;
    color:#666;
    box-shadow:none;
}


/* WORKOUT LIST */

.section-title{
    font-size:18px;
    margin:4px 0 12px;
}

.task{
    background:#111;
    border:1px solid #252525;
    border-radius:18px;
    padding:16px;
    margin-bottom:12px;
    transition:.2s;
}

.task.selected{
    border:1px solid #9DFF00;
    box-shadow:0 0 12px rgba(157,255,0,.12);
}

.task-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.task-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.task-number{
    width:36px;
    height:36px;
    border-radius:50%;
    background:#1b1b1b;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9DFF00;
    font-weight:700;
}

.task-name{
    font-weight:600;
}

.status{
    color:#777;
    font-size:20px;
}

.task.selected .status{
    color:#9DFF00;
}

.task-bottom{
    margin-top:10px;
    color:#777;
    font-size:12px;
}


/* STATUS BAR */

.status-card{
    background:#111;
    border:1px solid #222;
    border-radius:20px;
    padding:18px;
    margin-top:20px;
}

.status-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.status-title{
    font-size:15px;
    color:#aaa;
}

.status-value{
    color:#9DFF00;
    font-size:18px;
    font-weight:700;
}

.progress-bg{
    width:100%;
    height:8px;
    background:#222;
    border-radius:20px;
    margin-top:15px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#9DFF00;
    border-radius:20px;
    transition:.3s;
}

.note{
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:14px;
}

</style>
</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <button class="back-btn" id="backBtn">
            ←
        </button>

        <h1>Daily Tasks</h1>

        <span class="rc" id="rcDisplay">
            0 RC
        </span>

    </div>


    <!-- START WORKOUT -->

    <button
        class="start-btn"
        id="startBtn"
        disabled>

        SELECT WORKOUT

    </button>


    <!-- WORKOUT LIST -->

    <div class="section-title">
        Workout List
    </div>

    <div id="taskList"></div>


    <!-- STATUS BAR -->

    <div class="status-card">

        <div class="status-top">

            <div>

                <div class="status-title">
                    Today's Progress
                </div>

                <div class="status-value">
                    <span id="completedCount">0</span> / 10
                </div>

            </div>

            <div class="status-value">
                🔥 <span id="streak">0</span>
            </div>

        </div>


        <div class="progress-bg">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>

    </div>


    <div class="note">
        Do Your Max • Maximum 50 Reps • 1 Set
    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey:"AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM"
    

    authDomain:
    "fitandget-b3461.firebaseapp.com",

    projectId:
    "fitandget-b3461",

    storageBucket:
    "fitandget-b3461.firebasestorage.app",

    messagingSenderId:
    "216178533513",

    appId:
    "1:216178533513:web:975f20599c7e77b9d01258"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* =========================
   WORKOUT LIST
========================= */

const workouts = [

    "Stretching",
    "Push Up",
    "Squat",
    "High Knees",
    "Lunges",
    "Mountain Climber",
    "Jumping Jack",
    "Burpees",
    "Plank",
    "Cool Down"

];


/* =========================
   VARIABLES
========================= */

let selectedWorkout = null;

let completedTasks = [];

let currentUser = null;


/* =========================
   CREATE WORKOUT LIST
========================= */

function renderTasks(){

    const list =
        document.getElementById("taskList");

    list.innerHTML = "";


    workouts.forEach((workout,index) => {

        const completed =
            completedTasks.includes(index);


        const div =
            document.createElement("div");


        div.className =
            "task" +
            (selectedWorkout === index
                ? " selected"
                : "");


        div.innerHTML = `

            <div class="task-top">

                <div class="task-left">

                    <div class="task-number">
                        ${index + 1}
                    </div>

                    <div class="task-name">
                        ${workout}
                    </div>

                </div>

                <div class="status">
                    ${completed ? "✓" : "○"}
                </div>

            </div>

            <div class="task-bottom">
                ${completed
                    ? "Completed"
                    : "Do Your Max • 1 Set"}
            </div>

        `;


        if(completed){

            div.style.opacity = "0.5";
            div.style.cursor = "not-allowed";

        }else{

            div.style.cursor = "pointer";


            div.addEventListener("click",() => {

                selectedWorkout = index;

                renderTasks();

                updateStartButton();

            });

        }


        list.appendChild(div);

    });

}


/* =========================
   START BUTTON
========================= */

function updateStartButton(){

    const btn =
        document.getElementById("startBtn");


    if(selectedWorkout === null){

        btn.disabled = true;

        btn.innerText =
            "SELECT WORKOUT";

        return;

    }


    btn.disabled = false;

    btn.innerText =
        "START " +
        workouts[selectedWorkout].toUpperCase();

}


/* =========================
   FIREBASE USER
========================= */

firebase.auth().onAuthStateChanged(async(user) => {

    if(!user){

        window.location.href =
            "index.html";

        return;

    }


    currentUser = user;


    try{

        const doc =
            await db
                .collection("users")
                .doc(user.uid)
                .get();


        if(doc.exists){

            const data =
                doc.data();


            /* RC */

            const totalPoints =
                data.totalPoints || 0;


            document.getElementById(
                "rcDisplay"
            ).innerText =
                totalPoints + " RC";


            /* STREAK */

            document.getElementById(
                "streak"
            ).innerText =
                data.streak || 0;


            /* COMPLETED TASKS */

            completedTasks =
                data.completedTasks || [];


            updateProgress();

        }


    }catch(error){

        console.error(
            "Daily task loading error:",
            error
        );

    }


    renderTasks();

    updateStartButton();

});


/* =========================
   PROGRESS
========================= */

function updateProgress(){

    const count =
        completedTasks.length;


    document.getElementById(
        "completedCount"
    ).innerText =
        count;


    const percent =
        (count / 10) * 100;


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";

}


/* =========================
   START WORKOUT
========================= */

document
.getElementById("startBtn")
.addEventListener("click",() => {

    if(selectedWorkout === null){

        return;

    }


    const workoutName =
        workouts[selectedWorkout];


    localStorage.setItem(
        "selectedWorkout",
        workoutName
    );


    window.location.href =
        "camera.html?workout=" +
        encodeURIComponent(workoutName);

});


/* =========================
   BACK
========================= */

document
.getElementById("backBtn")
.addEventListener("click",() => {

    window.location.href =
        "home.html";

});


/* =========================
   INITIAL RENDER
========================= */

renderTasks();

updateStartButton();

</script>

</body>
</html>
