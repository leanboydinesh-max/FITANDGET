<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const repCount =
    document.getElementById("repCount");

const statusBox =
    document.getElementById("status");

const workoutName =
    document.getElementById("workoutName");

const quitBtn =
    document.getElementById("quitBtn");

const finishBtn =
    document.getElementById("finishBtn");


/* =====================================================
   WORKOUT
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let workout =
    params.get("workout") ||
    localStorage.getItem("selectedWorkout") ||
    "Stretching";

workout =
    decodeURIComponent(workout);

workoutName.textContent =
    workout;


/* =====================================================
   GLOBAL STATE
===================================================== */

let reps = 0;

let camera = null;

let cameraStarted = false;

let lastRepTime = 0;

let lostFrames = 0;


/*
   MAIN MOVEMENT STATES
*/

let squatState = "STANDING";
let pushState = "UP";
let mountainState = "AWAY";
let highKneeState = "DOWN";
let lungeState = "UP";
let jackState = "CLOSED";
let burpeeState = "UP";

let plankStart = null;

let movementValue = null;

let calibrationFrames = 0;

let squatBaseline = null;
let pushBaseline = null;


/* =====================================================
   STATUS
===================================================== */

function setStatus(message,type){

    statusBox.textContent =
        message;

    statusBox.className =
        "status " + type;
}


/* =====================================================
   REP
===================================================== */

function addRep(){

    const now =
        Date.now();

    if(
        now-lastRepTime <
        550
    ){
        return;
    }

    if(
        reps>=50
    ){
        return;
    }

    lastRepTime =
        now;

    reps++;

    repCount.textContent =
        reps;
}


/* =====================================================
   VISIBILITY
===================================================== */

function visible(lm,id){

    if(
        !lm ||
        !lm[id]
    ){
        return false;
    }

    if(
        lm[id].visibility ===
        undefined
    ){
        return true;
    }

    return (
        lm[id].visibility >
        0.10
    );
}


/* =====================================================
   ANGLE
===================================================== */

function angle(a,b,c){

    if(!a || !b || !c){
        return 180;
    }

    const abx = a.x-b.x;
    const aby = a.y-b.y;

    const cbx = c.x-b.x;
    const cby = c.y-b.y;

    const dot =
        abx*cbx +
        aby*cby;

    const m1 =
        Math.sqrt(
            abx*abx+
            aby*aby
        );

    const m2 =
        Math.sqrt(
            cbx*cbx+
            cby*cby
        );

    if(
        m1===0 ||
        m2===0
    ){
        return 180;
    }

    let v =
        dot/(m1*m2);

    v =
        Math.max(
            -1,
            Math.min(1,v)
        );

    return (
        Math.acos(v)*
        180/Math.PI
    );
}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b){

    if(!a || !b){
        return 0;
    }

    return Math.sqrt(
        Math.pow(a.x-b.x,2)+
        Math.pow(a.y-b.y,2)
    );
}


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

    canvas.width =
        canvas.clientWidth;

    canvas.height =
        canvas.clientHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =====================================================
   VIDEO RECT
===================================================== */

function getVideoRect(){

    const vw =
        video.videoWidth || 720;

    const vh =
        video.videoHeight || 1280;

    const cw =
        canvas.width;

    const ch =
        canvas.height;

    const scale =
        Math.min(
            cw/vw,
            ch/vh
        );

    const width =
        vw*scale;

    const height =
        vh*scale;

    return {
        x:(cw-width)/2,
        y:(ch-height)/2,
        width,
        height
    };
}


/* =====================================================
   SCREEN POINT
===================================================== */

function screenPoint(lm){

    if(!lm){
        return null;
    }

    const r =
        getVideoRect();

    let x =
        r.x+
        lm.x*r.width;

    let y =
        r.y+
        lm.y*r.height;

    /*
       Mirror with camera.
    */

    x =
        r.x+
        r.width-
        (x-r.x);

    /*
       HARD CAMERA BOUNDARY.
    */

    x =
        Math.max(
            0,
            Math.min(
                canvas.width,
                x
            )
        );

    y =
        Math.max(
            0,
            Math.min(
                canvas.height,
                y
            )
        );

    return {
        x:x,
        y:y
    };
}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(a,b,color){

    const p1 =
        screenPoint(a);

    const p2 =
        screenPoint(b);

    if(!p1 || !p2){
        return;
    }

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.lineTo(
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth = 5;

    ctx.lineCap =
        "round";

    ctx.stroke();
}


/* =====================================================
   DRAW JOINT
===================================================== */

function drawJoint(lm,color){

    const p =
        screenPoint(lm);

    if(!p){
        return;
    }

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        6,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        color;

    ctx.fill();
}


/* =====================================================
   DRAW CHAIN
===================================================== */

function drawChain(lm,ids,color){

    for(
        let i=0;
        i<ids.length-1;
        i++
    ){

        if(
            visible(lm,ids[i]) &&
            visible(lm,ids[i+1])
        ){

            drawLine(
                lm[ids[i]],
                lm[ids[i+1]],
                color
            );
        }
    }

    ids.forEach(id=>{

        if(
            visible(lm,id)
        ){

            drawJoint(
                lm[id],
                color
            );
        }
    });
}


/* =====================================================
   TRACKING HELPER
===================================================== */

function hasAny(lm,ids){

    return ids.some(
        id=>visible(lm,id)
    );
}


/* =====================================================
   SQUAT
   MOVEMENT ONLY

   No exact pose matching.
   No arm checking.
   No exact angle requirement.

   First stable standing position becomes
   personal baseline.

   Then:
   DOWN = hip moves down
   UP   = hip returns
   REP  = down + up
===================================================== */

function squat(lm){

    const left =
        [23,25,27].every(
            id=>visible(lm,id)
        );

    const right =
        [24,26,28].every(
            id=>visible(lm,id)
        );

    if(!left && !right){

        lostFrames++;

        if(lostFrames>8){

            setStatus(
                "COME INTO CAMERA",
                "red"
            );
        }

        return;
    }

    lostFrames = 0;

    const hipY =
        (
            (visible(lm,23)
                ? lm[23].y : 0) +
            (visible(lm,24)
                ? lm[24].y : 0)
        ) /
        (
            (visible(lm,23)?1:0)+
            (visible(lm,24)?1:0)
        );

    const kneeY =
        (
            (visible(lm,25)
                ? lm[25].y : 0) +
            (visible(lm,26)
                ? lm[26].y : 0)
        ) /
        (
            (visible(lm,25)?1:0)+
            (visible(lm,26)?1:0)
        );

    const ankleY =
        (
            (visible(lm,27)
                ? lm[27].y : 0) +
            (visible(lm,28)
                ? lm[28].y : 0)
        ) /
        (
            (visible(lm,27)?1:0)+
            (visible(lm,28)?1:0)
        );

    drawChain(
        lm,
        [23,25,27],
        "#00ff66"
    );

    drawChain(
        lm,
        [24,26,28],
        "#00ff66"
    );

    /*
       Body scale.
       This makes detection adapt to
       tall/short users and camera distance.
    */

    const bodyScale =
        Math.max(
            0.20,
            Math.abs(
                ankleY-
                hipY
            )
        );

    /*
       Personal standing baseline.
       Slowly calibrate only before
       first squat.
    */

    if(
        squatBaseline===null
    ){

        squatBaseline =
            hipY;

        calibrationFrames = 0;

        setStatus(
            "SQUAT • READY",
            "green"
        );

        return;
    }

    /*
       Small slow baseline adaptation
       only while standing.
    */

    if(
        squatState==="STANDING"
    ){

        squatBaseline =
            squatBaseline*0.96+
            hipY*0.04;
    }

    const movement =
        (
            hipY-
            squatBaseline
        ) /
        bodyScale;

    /*
       0.055 is intentionally forgiving.
       We are detecting movement, not
       perfect squat form.
    */

    const DOWN_THRESHOLD =
        0.055;

    const UP_THRESHOLD =
        0.025;

    if(
        squatState==="STANDING" &&
        movement>DOWN_THRESHOLD
    ){

        squatState =
            "SQUATTING";

        setStatus(
            "SQUAT • DOWN",
            "green"
        );

        return;
    }

    if(
        squatState==="SQUATTING"
    ){

        setStatus(
            "SQUAT • UP",
            "green"
        );

        if(
            movement<
            UP_THRESHOLD
        ){

            addRep();

            squatState =
                "STANDING";
        }

        return;
    }

    setStatus(
        "SQUAT • READY",
        "green"
    );
}


/* =====================================================
   PUSH UP
   MOVEMENT ONLY

   Exact body position is NOT required.
   Uses shoulder/elbow/wrist movement.
===================================================== */

function pushUp(lm){

    const left =
        [11,13,15].every(
            id=>visible(lm,id)
        );

    const right =
        [12,14,16].every(
            id=>visible(lm,id)
        );

    if(!left && !right){

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

        return;
    }

    const side =
        left ? "L" : "R";

    const shoulder =
        side==="L"
        ? lm[11]
        : lm[12];

    const elbow =
        side==="L"
        ? lm[13]
        : lm[14];

    const wrist =
        side==="L"
        ? lm[15]
        : lm[16];

    drawChain(
        lm,
        side==="L"
        ? [11,13,15]
        : [12,14,16],
        "#00ff66"
    );

    const elbowAngle =
        angle(
            shoulder,
            elbow,
            wrist
        );

    /*
       Push-up movement:
       bent = down
       straight = up
    */

    if(
        elbowAngle<145
    ){

        pushState =
            "DOWN";

        setStatus(
            "PUSH UP • DOWN",
            "green"
        );

        return;
    }

    setStatus(
        "PUSH UP • UP",
        "green"
    );

    if(
        pushState==="DOWN" &&
        elbowAngle>155
    ){

        addRep();

        pushState =
            "UP";
    }
}


/* =====================================================
   MOUNTAIN CLIMBER
   MOVEMENT ONLY

   Pattern:
   knee moves toward chest
   then away
   alternating side is preferred,
   but exact body angle is NOT required.
===================================================== */

function mountainClimber(lm){

    const left =
        [23,25].every(
            id=>visible(lm,id)
        );

    const right =
        [24,26].every(
            id=>visible(lm,id)
        );

    if(!left && !right){

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

        return;
    }

    if(left){

        drawChain(
            lm,
            [23,25],
            "#00ff66"
        );
    }

    if(right){

        drawChain(
            lm,
            [24,26],
            "#00ff66"
        );
    }

    /*
       Knee-to-hip vertical distance.
       Smaller = knee closer to chest.
    */

    let leftRatio = 1;
    let rightRatio = 1;

    if(left){

        leftRatio =
            Math.abs(
                lm[25].y-
                lm[23].y
            );
    }

    if(right){

        rightRatio =
            Math.abs(
                lm[26].y-
                lm[24].y
            );
    }

    const kneeUp =
        Math.min(
            leftRatio,
            rightRatio
        ) < 0.30;

    const kneeAway =
        Math.min(
            leftRatio,
            rightRatio
        ) > 0.34;

    if(
        mountainState==="AWAY" &&
        kneeUp
    ){

        mountainState =
            "KNEE_UP";

        setStatus(
            "MOUNTAIN CLIMBER • KNEE",
            "green"
        );

        return;
    }

    if(
        mountainState==="KNEE_UP" &&
        kneeAway
    ){

        addRep();

        mountainState =
            "AWAY";
    }

    setStatus(
        "MOUNTAIN CLIMBER • MOVE",
        "green"
    );
}


/* =====================================================
   HIGH KNEES
   KNEE LIFT ONLY
===================================================== */

function highKnees(lm){

    const left =
        visible(lm,23) &&
        visible(lm,25);

    const right =
        visible(lm,24) &&
        visible(lm,26);

    if(!left && !right){

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

        return;
    }

    if(left){

        drawChain(
            lm,
            [23,25],
            "#00ff66"
        );
    }

    if(right){

        drawChain(
            lm,
            [24,26],
            "#00ff66"
        );
    }

    const leftLift =
        left &&
        lm[25].y <
        lm[23].y-0.08;

    const rightLift =
        right &&
        lm[26].y <
        lm[24].y-0.08;

    if(
        highKneeState==="DOWN" &&
        (leftLift || rightLift)
    ){

        addRep();

        highKneeState =
            "UP";

        setStatus(
            "HIGH KNEES • UP",
            "green"
        );

        return;
    }

    if(
        highKneeState==="UP" &&
        !leftLift &&
        !rightLift
    ){

        highKneeState =
            "DOWN";
    }

    setStatus(
        "HIGH KNEES • MOVE",
        "green"
    );
}


/* =====================================================
   LUNGES
   LEG MOVEMENT ONLY
===================================================== */

function lunges(lm){

    const left =
        [23,25,27].every(
            id=>visible(lm,id)
        );

    const right =
        [24,26,28].every(
            id=>visible(lm,id)
        );

    if(!left && !right){

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

        return;
    }

    if(left){

        drawChain(
            lm,
            [23,25,27],
            "#00ff66"
        );
    }

    if(right){

        drawChain(
            lm,
            [24,26,28],
            "#00ff66"
        );
    }

    let bent = false;
    let straight = true;

    if(left){

        const a =
            angle(
                lm[23],
                lm[25],
                lm[27]
            );

        if(a<145){
            bent=true;
        }

        if(a<150){
            straight=false;
        }
    }

    if(right){

        const a =
            angle(
                lm[24],
                lm[26],
                lm[28]
            );

        if(a<145){
            bent=true;
        }

        if(a<150){
            straight=false;
        }
    }

    if(
        lungeState==="UP" &&
        bent
    ){

        lungeState =
            "DOWN";

        setStatus(
            "LUNGE • DOWN",
            "green"
        );

        return;
    }

    if(
        lungeState==="DOWN" &&
        straight
    ){

        addRep();

        lungeState =
            "UP";
    }

    setStatus(
        "LUNGE • MOVE",
        "green"
    );
}


/* =====================================================
   JUMPING JACK
   OPEN → CLOSED
===================================================== */

function jumpingJack(lm){

    const ready =
        visible(lm,11) &&
        visible(lm,12) &&
        visible(lm,15) &&
        visible(lm,16) &&
        visible(lm,27) &&
        visible(lm,28);

    if(!ready){

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

        return;
    }

    drawChain(
        lm,
        [11,13,15],
        "#00ff66"
    );

    drawChain(
        lm,
        [12,14,16],
        "#00ff66"
    );

    drawChain(
        lm,
        [23,25,27],
        "#00ff66"
    );

    drawChain(
        lm,
        [24,26,28],
        "#00ff66"
    );

    const armsUp =
        lm[15].y<
        lm[11].y &&
        lm[16].y<
        lm[12].y;

    const legsApart =
        Math.abs(
            lm[27].x-
            lm[28].x
        )>0.15;

    const open =
        armsUp &&
        legsApart;

    if(
        jackState==="CLOSED" &&
        open
    ){

        jackState =
            "OPEN";

        setStatus(
            "JUMPING JACK • OPEN",
            "green"
        );

        return;
    }

    if(
        jackState==="OPEN" &&
        !open
    ){

        addRep();

        jackState =
            "CLOSED";
    }

    setStatus(
        "JUMPING JACK • MOVE",
        "green"
    );
}


/* =====================================================
   BURPEE
   STAND → DOWN → STAND
===================================================== */

function burpee(lm){

    const ready =
        visible(lm,11) &&
        visible(lm,23) &&
        visible(lm,25);

    if(!ready){

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

        return;
    }

    drawChain(
        lm,
        [11,23,25],
        "#00ff66"
    );

    const shoulderY =
        (
            lm[11].y+
            lm[12].y
        )/2;

    const hipY =
        (
            lm[23].y+
            lm[24].y
        )/2;

    const bodyDrop =
        hipY-
        shoulderY;

    const down =
        bodyDrop >
        0.20;

    if(
        burpeeState==="UP" &&
        down
    ){

        burpeeState =
            "DOWN";

        setStatus(
            "BURPEE • DOWN",
            "green"
        );

        return;
    }

    if(
        burpeeState==="DOWN" &&
        !down
    ){

        addRep();

        burpeeState =
            "UP";
    }

    setStatus(
        "BURPEE • MOVE",
        "green"
    );
}


/* =====================================================
   PLANK
   HOLD DETECTION
===================================================== */

function plank(lm){

    const ready =
        visible(lm,11) &&
        visible(lm,23) &&
        visible(lm,27);

    if(!ready){

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

        plankStart=null;

        return;
    }

    drawChain(
        lm,
        [11,23,27],
        "#00ff66"
    );

    if(
        plankStart===null
    ){

        plankStart =
            Date.now();

        setStatus(
            "PLANK • HOLD",
            "green"
        );

        return;
    }

    const held =
        Date.now()-
        plankStart;

    setStatus(
        "PLANK • "+
        Math.floor(held/1000)+
        "s",
        "green"
    );

    /*
       Every 3 seconds = 1 rep.
    */

    if(
        held>=3000
    ){

        addRep();

        plankStart =
            Date.now();
    }
}


/* =====================================================
   STRETCHING
   ARM MOVEMENT
===================================================== */

function stretching(lm){

    const ready =
        hasAny(
            lm,
            [11,12,13,14,15,16]
        );

    if(!ready){

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

        return;
    }

    drawChain(
        lm,
        [11,13,15],
        "#00ff66"
    );

    drawChain(
        lm,
        [12,14,16],
        "#00ff66"
    );

    const wristY =
        (
            lm[15].y+
            lm[16].y
        )/2;

    if(
        movementValue===null
    ){

        movementValue =
            wristY;

        setStatus(
            "STRETCHING • MOVE",
            "green"
        );

        return;
    }

    if(
        Math.abs(
            wristY-
            movementValue
        )>0.07
    ){

        addRep();

        movementValue =
            wristY;
    }

    setStatus(
        "STRETCHING • MOVE",
        "green"
    );
}


/* =====================================================
   COOL DOWN
===================================================== */

function coolDown(lm){

    const ready =
        hasAny(
            lm,
            [11,12,13,14,15,16]
        );

    if(!ready){

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

        return;
    }

    drawChain(
        lm,
        [11,13,15],
        "#00ff66"
    );

    drawChain(
        lm,
        [12,14,16],
        "#00ff66"
    );

    const y =
        (
            lm[15].y+
            lm[16].y
        )/2;

    if(
        movementValue===null
    ){

        movementValue=y;

        return;
    }

    if(
        Math.abs(
            y-
            movementValue
        )>0.07
    ){

        addRep();

        movementValue=y;
    }

    setStatus(
        "COOL DOWN • MOVE",
        "green"
    );
}


/* =====================================================
   POSE RESULTS
===================================================== */

function onPoseResults(results){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(
        !results.poseLandmarks
    ){

        lostFrames++;

        if(lostFrames>5){

            setStatus(
                "COME INTO CAMERA",
                "red"
            );
        }

        return;
    }

    lostFrames=0;

    const lm =
        results.poseLandmarks;

    const name =
        workout.toLowerCase();


    if(
        name.includes("stretch")
    ){

        stretching(lm);
        return;
    }


    if(
        name.includes("push")
    ){

        pushUp(lm);
        return;
    }


    if(
        name.includes("squat")
    ){

        squat(lm);
        return;
    }


    if(
        name.includes("high knee")
    ){

        highKnees(lm);
        return;
    }


    if(
        name.includes("lunge")
    ){

        lunges(lm);
        return;
    }


    if(
        name.includes("mountain")
    ){

        mountainClimber(lm);
        return;
    }


    if(
        name.includes("jumping jack")
    ){

        jumpingJack(lm);
        return;
    }


    if(
        name.includes("burpee")
    ){

        burpee(lm);
        return;
    }


    if(
        name.includes("plank")
    ){

        plank(lm);
        return;
    }


    if(
        name.includes("cool")
    ){

        coolDown(lm);
        return;
    }


    setStatus(
        "MOVE",
        "green"
    );
}


/* =====================================================
   MEDIAPIPE
===================================================== */

const pose =
    new Pose({

        locateFile:(file)=>{
            return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file;
        }

    });


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:0.40,

    minTrackingConfidence:0.40

});


pose.onResults(
    onPoseResults
);


/* =====================================================
   CAMERA
===================================================== */

async function startAI(){

    if(cameraStarted){
        return;
    }

    try{

        setStatus(
            "STARTING CAMERA...",
            "yellow"
        );

        cameraStarted=true;

        camera =
            new Camera(
                video,
                {

                    onFrame:
                    async()=>{
                        await pose.send({
                            image:video
                        });
                    },

                    width:720,
                    height:1280

                }
            );

        await camera.start();

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

    }catch(error){

        console.error(error);

        cameraStarted=false;

        setStatus(
            "CAMERA PERMISSION NEEDED",
            "red"
        );
    }
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    try{

        if(camera){

            camera.stop();
            camera=null;
        }

        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(
                    track=>{
                        track.stop();
                    }
                );
        }

    }catch(error){

        console.error(error);
    }
}


/* =====================================================
   QUIT
   NO SAVE
===================================================== */

function quitWorkout(){

    stopCamera();

    window.location.href =
        "daily-task.html";
}


/* =====================================================
   FINISH
===================================================== */

async function finishWorkout(){

    const user =
        firebase.auth()
        .currentUser;

    if(!user){

        alert(
            "Please login first."
        );

        return;
    }

    if(reps<=0){

        alert(
            "Complete at least 1 rep."
        );

        return;
    }

    const finalReps =
        Math.min(
            reps,
            50
        );

    try{

        const ref =
            db.collection("users")
            .doc(user.uid);

        const snap =
            await ref.get();

        const data =
            snap.exists
            ? snap.data()
            : {};

        const oldPoints =
            Number(
                data.totalPoints || 0
            );

        const oldTasks =
            Array.isArray(
                data.completedTasks
            )
            ? data.completedTasks
            : [];

        const tasks =
            [...oldTasks];

        if(
            !tasks.includes(workout)
        ){

            tasks.push(
                workout
            );
        }

        await ref.set({

            totalPoints:
                oldPoints+
                finalReps,

            completedTasks:
                tasks,

            lastWorkout:
                workout,

            lastWorkoutReps:
                finalReps,

            updatedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        },{
            merge:true
        });

        stopCamera();

        window.location.href =
            "daily-task.html";

    }catch(error){

        console.error(error);

        alert(
            "Could not save workout."
        );
    }
}


/* =====================================================
   BUTTONS
===================================================== */

quitBtn.addEventListener(
    "click",
    quitWorkout
);

finishBtn.addEventListener(
    "click",
    finishWorkout
);


/* =====================================================
   AUTO START
===================================================== */

window.addEventListener(
    "load",
    ()=>{

        setTimeout(
            ()=>{
                startAI();
            },
            300
        );

    }
);
