<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

#cameraBox{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#video{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;
    transform:scaleX(-1);
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#top{
    position:absolute;
    top:calc(15px + env(safe-area-inset-top));
    width:100%;
    text-align:center;
    z-index:10;
}

#workoutName{
    display:inline-block;
    padding:8px 18px;
    border-radius:20px;
    background:rgba(0,0,0,.7);
    color:#9dff00;
    font-size:20px;
    font-weight:bold;
}

#rep{
    margin-top:8px;
    font-size:50px;
    font-weight:bold;
    color:#fff;
    text-shadow:0 0 12px #000;
}

#status{
    margin-top:6px;
    font-size:14px;
    font-weight:bold;
    color:#ff3030;
    text-shadow:0 0 8px #000;
}

#buttons{
    position:absolute;
    bottom:calc(20px + env(safe-area-inset-bottom));
    width:100%;
    display:flex;
    justify-content:center;
    gap:12px;
    z-index:20;
}

button{
    border:0;
    border-radius:30px;
    padding:15px 22px;
    font-weight:bold;
    font-size:14px;
}

#quitBtn{
    background:#171717;
    color:#fff;
    border:1px solid #777;
}

#finishBtn{
    background:#9dff00;
    color:#000;
}

#loading{
    position:absolute;
    inset:0;
    z-index:50;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:15px;
    color:#fff;
}

.loader{
    width:42px;
    height:42px;
    border:4px solid #333;
    border-top-color:#9dff00;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div id="cameraBox">

<video id="video" autoplay muted playsinline></video>

<canvas id="canvas"></canvas>

<div id="top">

    <div id="workoutName">
        Workout
    </div>

    <div id="rep">
        0
    </div>

    <div id="status">
        STARTING CAMERA...
    </div>

</div>

<div id="buttons">

    <button id="quitBtn">
        QUIT WORKOUT
    </button>

    <button id="finishBtn">
        FINISH WORKOUT
    </button>

</div>

<div id="loading">

    <div class="loader"></div>

    <div>
        Starting camera...
    </div>

</div>

</div>


<script>

/* ================= FIREBASE ================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",

    authDomain:
    "fitandget-b3461.firebaseapp.com",

    projectId:
    "fitandget-b3461",

    storageBucket:
    "fitandget-b3461.firebasestorage.app",

    messagingSenderId:
    "216178533513",

    appId:
    "1:216178533513:web:975f20599c7e77b9d01258"

};

if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}

const auth =
firebase.auth();

const db =
firebase.firestore();


/* ================= ELEMENTS ================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const workoutNameEl =
document.getElementById("workoutName");

const repEl =
document.getElementById("rep");

const statusEl =
document.getElementById("status");

const loading =
document.getElementById("loading");

const quitBtn =
document.getElementById("quitBtn");

const finishBtn =
document.getElementById("finishBtn");


/* ================= WORKOUT ================= */

const params =
new URLSearchParams(location.search);

let workout =
params.get("workout") ||
localStorage.getItem("selectedWorkout") ||
"Stretching";

try{

    workout =
    decodeURIComponent(workout);

}catch(e){}

workout =
workout.trim();

workoutNameEl.textContent =
workout;


/* ================= CAMERA STATE ================= */

let stream = null;

let pose = null;

let running = true;

let processing = false;

let reps = 0;

const MAX_REPS = 50;

let tracked = false;

let lostFrames = 0;

let phase = "start";

let lastRepTime = 0;


/* ================= PLANK ================= */

let plankStart = 0;

let lastPlankSecond = 0;


/* ==================================================
   PUSH-UP TRACKING
   ================================================== */

let pushLocked = false;

let pushLostFrames = 0;

let pushTopY = null;

let pushBottomY = null;

let pushDownSeen = false;


/* ================= BASIC FUNCTIONS ================= */

function good(p){

    return !!(
        p &&
        typeof p.x === "number" &&
        typeof p.y === "number" &&
        (
            p.visibility === undefined ||
            p.visibility > .15
        )
    );

}


function req(a){

    return a.every(good);

}


function mid(a,b){

    return {

        x:(a.x+b.x)/2,

        y:(a.y+b.y)/2

    };

}


function dist(a,b){

    if(
        !good(a) ||
        !good(b)
    ){

        return 999;

    }

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


function angle(a,b,c){

    if(!req([a,b,c])){

        return 180;

    }

    const abx =
    a.x-b.x;

    const aby =
    a.y-b.y;

    const cbx =
    c.x-b.x;

    const cby =
    c.y-b.y;

    const m1 =
    Math.hypot(abx,aby);

    const m2 =
    Math.hypot(cbx,cby);

    if(!m1 || !m2){

        return 180;

    }

    return Math.acos(
        Math.max(
            -1,
            Math.min(
                1,
                (
                    abx*cbx +
                    aby*cby
                )/(m1*m2)
            )
        )
    ) * 180 / Math.PI;

}


/* ================= ADD REP ================= */

function addRep(){

    if(
        !tracked ||
        reps >= MAX_REPS
    ){

        return;

    }

    const now =
    Date.now();

    if(
        now-lastRepTime < 450
    ){

        return;

    }

    lastRepTime =
    now;

    reps++;

    repEl.textContent =
    reps;

    statusEl.textContent =
    "REP " + reps;

    statusEl.style.color =
    "#00ff66";

}


/* ================= NORMAL RESET ================= */

function resetNormal(){

    phase =
    "start";

}


/* ================= PUSH RESET ================= */

function resetPush(){

    pushLocked =
    false;

    pushLostFrames =
    0;

    pushTopY =
    null;

    pushBottomY =
    null;

    pushDownSeen =
    false;

    phase =
    "start";

}


/* ================= BODY VISIBILITY ================= */

function bodyVisible(l){

    const p = [

        l[11],
        l[12],

        l[13],
        l[14],

        l[15],
        l[16],

        l[23],
        l[24],

        l[25],
        l[26],

        l[27],
        l[28]

    ];

    return (
        p.filter(good).length >= 7
    );

}


/* ==================================================
   PUSH-UP INITIAL POSITION

   IMPORTANT:
   இந்த function ஆரம்பத்தில் மட்டும்.
   Down / Up movement-ல் இதை மீண்டும் check செய்யக்கூடாது.
   ================================================== */

function pushupStartPosition(l){

    if(
        !req([
            l[11],
            l[12],
            l[15],
            l[16],
            l[23],
            l[24],
            l[27],
            l[28]
        ])
    ){

        return false;

    }


    const s =
    mid(l[11],l[12]);

    const h =
    mid(l[23],l[24]);

    const a =
    mid(l[27],l[28]);


    const body =
    angle(
        s,
        h,
        a
    );


    const handsNear =
    Math.min(
        dist(l[15],l[11]),
        dist(l[16],l[12])
    ) < .55;


    const horizontal =
    Math.abs(
        s.y-h.y
    ) < .55;


    const notStanding =
    Math.abs(
        s.y-a.y
    ) < .85;


    return (
        body > 105 &&
        handsNear &&
        horizontal &&
        notStanding
    );

}


/* ==================================================
   PUSH-UP TRACKING AFTER LOCK
   ================================================== */

function pushupBodyStillTrackable(l){

    return req([

        l[11],
        l[12],

        l[13],
        l[14],

        l[15],
        l[16],

        l[23],
        l[24]

    ]);

}


/* ================= SKELETON ================= */

const connections = [

    [11,12],

    [11,13],
    [13,15],

    [12,14],
    [14,16],

    [11,23],
    [12,24],

    [23,24],

    [23,25],
    [25,27],

    [24,26],
    [26,28]

];


function drawPoint(p,c){

    if(!good(p)){

        return;

    }

    ctx.beginPath();

    ctx.arc(
        p.x*canvas.width,
        p.y*canvas.height,
        4,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
    c;

    ctx.fill();

}


function drawLine(a,b,c){

    if(
        !good(a) ||
        !good(b)
    ){

        return;

    }

    ctx.beginPath();

    ctx.moveTo(
        a.x*canvas.width,
        a.y*canvas.height
    );

    ctx.lineTo(
        b.x*canvas.width,
        b.y*canvas.height
    );

    ctx.strokeStyle =
    c;

    ctx.lineWidth =
    5;

    ctx.lineCap =
    "round";

    ctx.stroke();

}


/* ================= DRAW BODY ================= */

function drawBody(l){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const visible =
    bodyVisible(l);


    if(visible){

        lostFrames =
        0;

        tracked =
        true;

    }else{

        lostFrames++;

    }


    /*
       IMPORTANT:
       Push-up lock active என்றால்
       normal bodyVisible temporary failure
       காரணமாக உடனே red/reset செய்யக்கூடாது.
    */

    if(
        lostFrames > 12 &&
        !pushLocked
    ){

        tracked =
        false;

        resetNormal();

    }


    const c =
    tracked
    ? "#00ff66"
    : "#ff3030";


    connections.forEach(x=>{

        drawLine(
            l[x[0]],
            l[x[1]],
            c
        );

        drawPoint(
            l[x[0]],
            c
        );

        drawPoint(
            l[x[1]],
            c
        );

    });


    if(pushLocked){

        statusEl.textContent =
        pushDownSeen
        ? "DOWN"
        : "PUSH-UP READY";

        statusEl.style.color =
        "#00ff66";

    }else{

        statusEl.textContent =
        tracked
        ? "TRACKING"
        : "MOVE INTO CAMERA";

        statusEl.style.color =
        tracked
        ? "#00ff66"
        : "#ff3030";

    }

}


/* ==================================================
   PUSH-UP DETECTOR
   ================================================== */

function detectPushUp(l){

    /* ----------------------------------------------
       STEP 1
       PUSH-UP POSITION கண்டுபிடிக்கிறது.
       ---------------------------------------------- */

    if(!pushLocked){

        if(
            pushupStartPosition(l)
        ){

            pushLocked =
            true;

            pushLostFrames =
            0;

            tracked =
            true;


            const s =
            mid(l[11],l[12]);


            pushTopY =
            s.y;

            pushBottomY =
            s.y;

            pushDownSeen =
            false;

            phase =
            "ready";


            statusEl.textContent =
            "PUSH-UP READY";

            statusEl.style.color =
            "#00ff66";

        }

        return;

    }


    /* ----------------------------------------------
       STEP 2

       IMPORTANT FIX:

       இங்கே pushupStartPosition()
       check செய்யவில்லை.

       அதனால் கீழே போகும்போது body angle
       மாறினாலும் RED ஆகாது.
       ---------------------------------------------- */

    if(
        pushupBodyStillTrackable(l)
    ){

        pushLostFrames =
        0;

        tracked =
        true;

    }else{

        pushLostFrames++;


        /*
           Camera-வில் உண்மையாக body மறைந்தால்
           மட்டும் lock release.
        */

        if(
            pushLostFrames > 25
        ){

            pushLocked =
            false;

            pushLostFrames =
            0;

            pushTopY =
            null;

            pushBottomY =
            null;

            pushDownSeen =
            false;

            phase =
            "start";

            tracked =
            false;

            return;

        }

    }


    /* ----------------------------------------------
       CHEST / SHOULDER MOVEMENT
       ---------------------------------------------- */

    const s =
    mid(l[11],l[12]);


    const e1 =
    angle(
        l[11],
        l[13],
        l[15]
    );


    const e2 =
    angle(
        l[12],
        l[14],
        l[16]
    );


    const elbow =
    Math.min(
        e1,
        e2
    );


    /* ----------------------------------------------
       TOP POSITION
       ---------------------------------------------- */

    if(!pushDownSeen){

        if(
            pushTopY === null
        ){

            pushTopY =
            s.y;

        }


        /*
           மேலே இருக்கும்போது top position
           மெதுவாக update ஆகும்.
        */

        if(
            s.y <
            pushTopY + .035
        ){

            pushTopY =
            s.y;

        }

    }


    /* ----------------------------------------------
       DOWN PHASE
       ---------------------------------------------- */

    if(!pushDownSeen){

        const downAmount =
        s.y -
        pushTopY;


        /*
           Chest கீழே போகிறது
           + elbow bend ஆகிறது.
        */

        if(
            downAmount > .018 &&
            elbow < 172
        ){

            pushDownSeen =
            true;

            pushBottomY =
            s.y;


            statusEl.textContent =
            "DOWN";

            statusEl.style.color =
            "#00ff66";

        }

        return;

    }


    /* ----------------------------------------------
       LOWEST POSITION
       ---------------------------------------------- */

    if(
        s.y >
        pushBottomY
    ){

        pushBottomY =
        s.y;

    }


    /* ----------------------------------------------
       UP PHASE
       ---------------------------------------------- */

    const upAmount =
    pushBottomY -
    s.y;


    if(
        upAmount > .018 &&
        elbow > 135
    ){

        addRep();


        pushDownSeen =
        false;


        pushTopY =
        s.y;

        pushBottomY =
        s.y;


        statusEl.textContent =
        "PUSH-UP READY";

        statusEl.style.color =
        "#00ff66";

    }

}


/* ================= PLANK ================= */

function plankPosition(l){

    if(
        !req([
            l[11],
            l[12],
            l[23],
            l[24],
            l[27],
            l[28]
        ])
    ){

        return false;

    }


    const s =
    mid(l[11],l[12]);

    const h =
    mid(l[23],l[24]);

    const a =
    mid(l[27],l[28]);


    return (
        angle(s,h,a) > 105 &&
        Math.abs(s.y-h.y) < .50
    );

}


/* ==================================================
   OTHER WORKOUT DETECTION
   ================================================== */

function detect(l){

    if(!tracked){

        return;

    }


    const w =
    workout.toLowerCase();


    /* PUSH UP */

    if(
        w === "push up"
    ){

        detectPushUp(l);

        return;

    }


    /* STRETCHING / COOL DOWN */

    if(
        w === "stretching" ||
        w === "cool down"
    ){

        const s =
        mid(l[11],l[12]);


        const up =
        l[15].y < s.y-.04 ||
        l[16].y < s.y-.04;


        const down =
        l[15].y > s.y+.02 &&
        l[16].y > s.y+.02;


        if(
            phase === "start" &&
            down
        ){

            phase =
            "ready";

        }


        if(
            phase === "ready" &&
            up
        ){

            phase =
            "move";

        }


        if(
            phase === "move" &&
            down
        ){

            addRep();

            phase =
            "ready";

        }

        return;

    }


    /* SQUAT */

    if(
        w === "squat"
    ){

        const k =
        Math.min(
            angle(
                l[23],
                l[25],
                l[27]
            ),
            angle(
                l[24],
                l[26],
                l[28]
            )
        );


        if(
            phase === "start"
        ){

            phase =
            "ready";

        }


        if(
            phase === "ready" &&
            k < 160
        ){

            phase =
            "move";

        }


        if(
            phase === "move" &&
            k > 160
        ){

            addRep();

            phase =
            "ready";

        }

        return;

    }


    /* LUNGES */

    if(
        w === "lunges"
    ){

        const k =
        Math.min(
            angle(
                l[23],
                l[25],
                l[27]
            ),
            angle(
                l[24],
                l[26],
                l[28]
            )
        );


        if(
            phase === "start"
        ){

            phase =
            "ready";

        }


        if(
            phase === "ready" &&
            k < 155
        ){

            phase =
            "move";

        }


        if(
            phase === "move" &&
            k > 160
        ){

            addRep();

            phase =
            "ready";

        }

        return;

    }


    /* HIGH KNEES */

    if(
        w === "high knees"
    ){

        if(
            !req([
                l[23],
                l[24],
                l[25],
                l[26]
            ])
        ){

            return;

        }


        const up =
        l[25].y <
        l[23].y-.035 ||
        l[26].y <
        l[24].y-.035;


        const down =
        l[25].y >=
        l[23].y-.01 &&
        l[26].y >=
        l[24].y-.01;


        if(
            phase === "start"
        ){

            phase =
            "ready";

        }


        if(
            phase === "ready" &&
            up
        ){

            phase =
            "move";

        }


        if(
            phase === "move" &&
            down
        ){

            addRep();

            phase =
            "ready";

        }

        return;

    }


    /* MOUNTAIN CLIMBER */

    if(
        w === "mountain climber"
    ){

        if(
            !plankPosition(l)
        ){

            return;

        }


        const f =
        Math.abs(
            l[25].x-l[23].x
        )>.035 ||
        Math.abs(
            l[26].x-l[24].x
        )>.035;


        if(
            phase === "start"
        ){

            phase =
            "ready";

        }


        if(
            phase === "ready" &&
            f
        ){

            phase =
            "move";

        }


        if(
            phase === "move" &&
            !f
        ){

            addRep();

            phase =
            "ready";

        }

        return;

    }


    /* JUMPING JACK */

    if(
        w === "jumping jack"
    ){

        const feet =
        Math.abs(
            l[27].x-l[28].x
        );


        const open =
        feet > .15;


        const close =
        feet < .14;


        const s =
        mid(l[11],l[12]);


        const handsUp =
        l[15].y <
        s.y+.06 ||
        l[16].y <
        s.y+.06;


        if(
            phase === "start"
        ){

            phase =
            "ready";

        }


        if(
            phase === "ready" &&
            open &&
            handsUp
        ){

            phase =
            "move";

        }


        if(
            phase === "move" &&
            close
        ){

            addRep();

            phase =
            "ready";

        }

        return;

    }


    /* BURPEES */

    if(
        w === "burpees"
    ){

        const k =
        Math.min(
            angle(
                l[23],
                l[25],
                l[27]
            ),
            angle(
                l[24],
                l[26],
                l[28]
            )
        );


        const down =
        k < 155;


        const stand =
        k > 165;


        const jump =
        l[27].y <
        l[25].y-.02 &&
        l[28].y <
        l[26].y-.02;


        if(
            phase === "start"
        ){

            phase =
            "ready";

        }


        if(
            phase === "ready" &&
            down
        ){

            phase =
            "move";

        }


        if(
            phase === "move" &&
            stand
        ){

            phase =
            "up";

        }


        if(
            phase === "up" &&
            jump
        ){

            addRep();

            phase =
            "ready";

        }

        return;

    }


    /* PLANK */

    if(
        w === "plank"
    ){

        if(
            !plankPosition(l)
        ){

            if(plankStart){

                plankStart =
                0;

            }

            return;

        }


        if(!plankStart){

            plankStart =
            Date.now();

            lastPlankSecond =
            0;

            phase =
            "ready";

        }


        const sec =
        Math.min(
            MAX_REPS,
            Math.floor(
                (Date.now()-plankStart)/1000
            )
        );


        if(
            sec >
            lastPlankSecond
        ){

            lastPlankSecond =
            sec;

            reps =
            sec;

            repEl.textContent =
            sec;

            statusEl.textContent =
            sec+" SEC";

            statusEl.style.color =
            "#00ff66";

        }

    }

}


/* ================= MEDIAPIPE ================= */

function onResults(results){

    if(!running){

        return;

    }


    if(
        !results ||
        !results.poseLandmarks
    ){

        lostFrames++;


        if(
            lostFrames > 12 &&
            !pushLocked
        ){

            tracked =
            false;

        }

        return;

    }


    drawBody(
        results.poseLandmarks
    );


    detect(
        results.poseLandmarks
    );

}


/* ================= POSE SETUP ================= */

function setupPose(){

    pose =
    new Pose({

        locateFile:
        file =>
        "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file

    });


    pose.setOptions({

        modelComplexity:1,

        smoothLandmarks:true,

        enableSegmentation:false,

        minDetectionConfidence:.35,

        minTrackingConfidence:.35

    });


    pose.onResults(
        onResults
    );

}


/* ================= CAMERA ================= */

async function startCamera(){

    try{

        setupPose();


        stream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:720
                },

                height:{
                    ideal:1280
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        canvas.width =
        video.videoWidth ||
        720;


        canvas.height =
        video.videoHeight ||
        1280;


        loading.style.display =
        "none";


        statusEl.textContent =
        "MOVE INTO CAMERA";

        statusEl.style.color =
        "#ff3030";


        requestAnimationFrame(
            processVideo
        );


    }catch(e){

        console.error(e);


        loading.innerHTML =

        '<div style="color:#ff3030;font-weight:bold">'+
        'Camera could not start'+
        '</div>'+
        '<div style="color:#aaa;font-size:13px">'+
        'Allow camera permission and reload.'+
        '</div>';

    }

}


/* ================= PROCESS VIDEO ================= */

async function processVideo(){

    if(!running){

        return;

    }


    if(
        video.readyState >= 2 &&
        !processing
    ){

        processing =
        true;


        try{

            await pose.send({
                image:video
            });

        }catch(e){

            console.error(
                "Pose error:",
                e
            );

        }


        processing =
        false;

    }


    requestAnimationFrame(
        processVideo
    );

}


/* ================= STOP CAMERA ================= */

function stopCamera(){

    running =
    false;


    if(stream){

        stream
        .getTracks()
        .forEach(
            t=>t.stop()
        );


        stream =
        null;

    }

}


/* ================= QUIT ================= */

quitBtn.onclick = ()=>{

    stopCamera();

    location.href =
    "daily-task.html";

};


/* ================= FINISH ================= */

finishBtn.onclick =
async()=>{

    if(reps<=0){

        alert(
            "Complete at least 1 rep."
        );

        return;

    }


    const user =
    auth.currentUser;


    if(!user){

        alert(
            "Please login before saving."
        );

        return;

    }


    finishBtn.disabled =
    true;


    try{

        const ref =
        db.collection("users")
        .doc(user.uid);


        const snap =
        await ref.get();


        const data =
        snap.exists
        ? snap.data()
        : {};


        const oldPoints =
        Number(
            data.totalPoints || 0
        );


        const order = [

            "Stretching",

            "Push Up",

            "Squat",

            "High Knees",

            "Lunges",

            "Mountain Climber",

            "Jumping Jack",

            "Burpees",

            "Plank",

            "Cool Down"

        ];


        let completed =

        Array.isArray(
            data.completedTasks
        )

        ? [...data.completedTasks]

        : [];


        const index =
        order.findIndex(
            x =>
            x.toLowerCase() ===
            workout.toLowerCase()
        );


        if(
            index >= 0 &&
            !completed.includes(index)
        ){

            completed.push(index);

        }


        completed =
        [...new Set(completed)]
        .sort(
            (a,b)=>a-b
        );


        await ref.set({

            totalPoints:
            oldPoints + reps,

            completedTasks:
            completed,

            lastWorkout:
            workout,

            lastWorkoutReps:
            reps,

            updatedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

        },{

            merge:true

        });


        stopCamera();


        location.href =
        "daily-task.html";


    }catch(e){

        console.error(e);


        alert(
            "Could not save workout. Please try again."
        );


        finishBtn.disabled =
        false;

    }

};


/* ================= RESIZE ================= */

window.addEventListener(
"resize",
()=>{

    if(
        video.videoWidth &&
        video.videoHeight
    ){

        canvas.width =
        video.videoWidth;

        canvas.height =
        video.videoHeight;

    }

});


/* ================= START ================= */

startCamera();

</script>
