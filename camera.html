<script>

/* =========================

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* =========================
   ELEMENTS
========================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const repCountEl = document.getElementById("repCount");
const statusEl = document.getElementById("status");
const workoutNameEl = document.getElementById("workoutName");


/* =========================
   WORKOUT
========================= */

const params = new URLSearchParams(location.search);

let workout =
    params.get("workout") ||
    localStorage.getItem("selectedWorkout") ||
    "Stretching";

workout = decodeURIComponent(workout);

workoutNameEl.textContent = workout;


/* =========================
   STATE
========================= */

let reps = 0;
let cameraStarted = false;

let phase = "ready";
let goodPosition = false;

let lastRepTime = 0;

let poseReady = false;


/* =========================
   BASIC HELPERS
========================= */

function setStatus(text,type){

    statusEl.textContent = text;

    statusEl.className =
        "status " + type;
}


function addRep(){

    const now = Date.now();

    if(now - lastRepTime < 450){
        return;
    }

    lastRepTime = now;

    reps++;

    if(reps > 50){
        reps = 50;
    }

    repCountEl.textContent = reps;
}


function visible(lm,index){

    if(!lm || !lm[index]){
        return false;
    }

    return (lm[index].visibility || 1) > .18;
}


function angle(a,b,c){

    const abx = a.x-b.x;
    const aby = a.y-b.y;

    const cbx = c.x-b.x;
    const cby = c.y-b.y;

    const dot =
        abx*cbx +
        aby*cby;

    const mag1 =
        Math.sqrt(abx*abx+aby*aby);

    const mag2 =
        Math.sqrt(cbx*cbx+cby*cby);

    if(!mag1 || !mag2){
        return 180;
    }

    let value =
        dot/(mag1*mag2);

    value =
        Math.max(-1,Math.min(1,value));

    return Math.acos(value)*180/Math.PI;
}


/* =========================
   CANVAS
========================= */

function resizeCanvas(){

    canvas.width =
        canvas.clientWidth;

    canvas.height =
        canvas.clientHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


function mapPoint(p){

    if(!p){
        return null;
    }

    const vw =
        video.videoWidth || 720;

    const vh =
        video.videoHeight || 1280;

    const cw =
        canvas.width;

    const ch =
        canvas.height;

    const scale =
        Math.max(cw/vw,ch/vh);

    const displayW =
        vw*scale;

    const displayH =
        vh*scale;

    const cropX =
        (displayW-cw)/2;

    const cropY =
        (displayH-ch)/2;

    let x =
        p.x*displayW-cropX;

    let y =
        p.y*displayH-cropY;

    /* video is mirrored */
    x = cw-x;

    x =
        Math.max(0,Math.min(cw,x));

    y =
        Math.max(0,Math.min(ch,y));

    return {x,y};
}


function drawLine(a,b,color,width=5){

    const p1 =
        mapPoint(a);

    const p2 =
        mapPoint(b);

    if(!p1 || !p2){
        return;
    }

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.lineTo(
        p2.x,
        p2.y
    );

    ctx.strokeStyle = color;

    ctx.lineWidth = width;

    ctx.lineCap = "round";

    ctx.stroke();
}


function drawPoint(p,color){

    const q =
        mapPoint(p);

    if(!q){
        return;
    }

    ctx.beginPath();

    ctx.arc(
        q.x,
        q.y,
        6,
        0,
        Math.PI*2
    );

    ctx.fillStyle = color;

    ctx.fill();
}


/* =========================
   DRAW MAIN 3
========================= */

/* STRETCHING */

function drawStretch(lm,color){

    const pairs = [
        [11,13],
        [13,15],
        [12,14],
        [14,16]
    ];

    pairs.forEach(pair=>{
        if(
            visible(lm,pair[0]) &&
            visible(lm,pair[1])
        ){
            drawLine(
                lm[pair[0]],
                lm[pair[1]],
                color
            );
        }
    });

    [11,13,15,12,14,16]
        .forEach(i=>{
            if(visible(lm,i)){
                drawPoint(lm[i],color);
            }
        });
}


/* PUSH UP */

function getPushSide(lm){

    const left =
        [11,13,15]
        .filter(i=>visible(lm,i))
        .length;

    const right =
        [12,14,16]
        .filter(i=>visible(lm,i))
        .length;

    return left >= right ? "left" : "right";
}


function drawPush(lm,color){

    const side =
        getPushSide(lm);

    const ids =
        side==="left"
        ? [11,13,15]
        : [12,14,16];

    if(
        ids.every(i=>visible(lm,i))
    ){

        drawLine(
            lm[ids[0]],
            lm[ids[1]],
            color
        );

        drawLine(
            lm[ids[1]],
            lm[ids[2]],
            color
        );

        ids.forEach(i=>{
            drawPoint(lm[i],color);
        });
    }
}


/* SQUAT */

function getSquatSide(lm){

    const left =
        [23,25,27]
        .filter(i=>visible(lm,i))
        .length;

    const right =
        [24,26,28]
        .filter(i=>visible(lm,i))
        .length;

    return left >= right ? "left" : "right";
}


function drawSquat(lm,color){

    const side =
        getSquatSide(lm);

    const ids =
        side==="left"
        ? [23,25,27]
        : [24,26,28];

    if(
        ids.every(i=>visible(lm,i))
    ){

        drawLine(
            lm[ids[0]],
            lm[ids[1]],
            color
        );

        drawLine(
            lm[ids[1]],
            lm[ids[2]],
            color
        );

        ids.forEach(i=>{
            drawPoint(lm[i],color);
        });
    }
}


/* =========================
   MAIN 3 DETECTION
========================= */

function detectStretch(lm){

    const ok =
        visible(lm,11) &&
        visible(lm,13) &&
        visible(lm,15);

    if(!ok){

        goodPosition=false;

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }

    goodPosition=true;

    setStatus(
        "GOOD • MOVE",
        "green"
    );

    /*
      Basic stretching movement:
      wrist moves up/down.
    */

    const y =
        lm[15].y;

    if(
        !window.lastStretchY
    ){

        window.lastStretchY = y;

        return;
    }

    const diff =
        Math.abs(
            y-window.lastStretchY
        );

    if(diff > .08){

        addRep();

        window.lastStretchY = y;
    }
}


function detectPush(lm){

    const side =
        getPushSide(lm);

    const ids =
        side==="left"
        ? [11,13,15]
        : [12,14,16];

    if(
        !ids.every(i=>visible(lm,i))
    ){

        goodPosition=false;

        setStatus(
            "Move into position",
            "red"
        );

        return;
    }

    goodPosition=true;

    const shoulder =
        lm[ids[0]];

    const elbow =
        lm[ids[1]];

    const wrist =
        lm[ids[2]];

    const elbowAngle =
        angle(
            shoulder,
            elbow,
            wrist
        );

    /*
      Easy position check.
      Not too strict.
    */

    if(elbowAngle < 80){

        setStatus(
            "POSITION • TOO LOW",
            "red"
        );

    }else{

        setStatus(
            "GOOD • MOVE",
            "green"
        );
    }

    /*
      DOWN
    */

    if(
        elbowAngle < 120 &&
        phase==="ready"
    ){

        phase="down";
    }

    /*
      UP = REP
    */

    if(
        elbowAngle > 145 &&
        phase==="down"
    ){

        addRep();

        phase="ready";
    }
}


function detectSquat(lm){

    const side =
        getSquatSide(lm);

    const ids =
        side==="left"
        ? [23,25,27]
        : [24,26,28];

    if(
        !ids.every(i=>visible(lm,i))
    ){

        goodPosition=false;

        setStatus(
            "Move into position",
            "red"
        );

        return;
    }

    goodPosition=true;

    const kneeAngle =
        angle(
            lm[ids[0]],
            lm[ids[1]],
            lm[ids[2]]
        );

    /*
      Position is intentionally easy.
    */

    setStatus(
        "GOOD • MOVE",
        "green"
    );

    /*
      DOWN
    */

    if(
        kneeAngle < 125 &&
        phase==="ready"
    ){

        phase="down";
    }

    /*
      UP = REP
    */

    if(
        kneeAngle > 150 &&
        phase==="down"
    ){

        addRep();

        phase="ready";
    }
}


/* =========================
   BASIC WORKOUT DETECTION
========================= */

function basicBodyReady(lm){

    const important =
        [
            11,12,
            23,24,
            25,26,
            27,28
        ];

    return important
        .filter(i=>visible(lm,i))
        .length >= 4;
}


/* HIGH KNEES */

function detectHighKnees(lm){

    if(
        !visible(lm,23) ||
        !visible(lm,24) ||
        !visible(lm,25) ||
        !visible(lm,26)
    ){

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }

    setStatus(
        "BASIC DETECTION • MOVE",
        "green"
    );

    const left =
        Math.abs(
            lm[25].y-lm[23].y
        );

    const right =
        Math.abs(
            lm[26].y-lm[24].y
        );

    if(
        left>.15 ||
        right>.15
    ){

        addRep();
    }
}


/* JUMPING JACK */

function detectJumpingJack(lm){

    if(
        !basicBodyReady(lm)
    ){

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }

    setStatus(
        "BASIC DETECTION • MOVE",
        "green"
    );

    const armsUp =
        lm[15].y < lm[11].y ||
        lm[16].y < lm[12].y;

    const legsApart =
        Math.abs(
            lm[27].x-lm[28].x
        ) > .15;

    if(
        armsUp &&
        legsApart
    ){

        if(
            phase==="ready"
        ){

            phase="down";
        }

    }else if(
        phase==="down"
    ){

        addRep();

        phase="ready";
    }
}


/* LUNGES */

function detectLunge(lm){

    if(
        !basicBodyReady(lm)
    ){

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }

    setStatus(
        "BASIC DETECTION • MOVE",
        "green"
    );

    const leftKnee =
        angle(
            lm[23],
            lm[25],
            lm[27]
        );

    const rightKnee =
        angle(
            lm[24],
            lm[26],
            lm[28]
        );

    if(
        leftKnee<125 ||
        rightKnee<125
    ){

        phase="down";
    }

    if(
        phase==="down" &&
        leftKnee>150 &&
        rightKnee>150
    ){

        addRep();

        phase="ready";
    }
}


/* MOUNTAIN CLIMBER */

function detectMountain(lm){

    if(
        !basicBodyReady(lm)
    ){

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }

    setStatus(
        "BASIC DETECTION • MOVE",
        "green"
    );

    const left =
        lm[25].y < lm[23].y;

    const right =
        lm[26].y < lm[24].y;

    if(
        left !== window.lastMountainSide
    ){

        if(
            window.lastMountainSide !== undefined
        ){

            addRep();
        }

        window.lastMountainSide = left;
    }

    if(
        right !== window.lastMountainSide
    ){

        window.lastMountainSide = right;
    }
}


/* BURPEE */

function detectBurpee(lm){

    if(
        !basicBodyReady(lm)
    ){

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }

    setStatus(
        "BASIC DETECTION • MOVE",
        "green"
    );

    const hipY =
        (lm[23].y+lm[24].y)/2;

    const shoulderY =
        (lm[11].y+lm[12].y)/2;

    if(
        hipY-shoulderY < .12
    ){

        phase="down";
    }

    if(
        phase==="down" &&
        hipY-shoulderY > .25
    ){

        addRep();

        phase="ready";
    }
}


/* PLANK */

function detectPlank(lm){

    if(
        !visible(lm,11) ||
        !visible(lm,23)
    ){

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }

    setStatus(
        "BASIC DETECTION • HOLD",
        "green"
    );

    /*
      One rep after a simple hold.
    */

    if(
        !window.plankStart
    ){

        window.plankStart =
            Date.now();
    }

    if(
        Date.now()-
        window.plankStart > 2000
    ){

        addRep();

        window.plankStart =
            Date.now();
    }
}


/* COOL DOWN */

function detectCoolDown(lm){

    if(
        !visible(lm,11) ||
        !visible(lm,12)
    ){

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }

    setStatus(
        "BASIC DETECTION • MOVE",
        "green"
    );

    const shoulderY =
        (lm[11].y+lm[12].y)/2;

    if(
        window.lastCoolY === undefined
    ){

        window.lastCoolY =
            shoulderY;

        return;
    }

    if(
        Math.abs(
            shoulderY-window.lastCoolY
        ) > .08
    ){

        addRep();

        window.lastCoolY =
            shoulderY;
    }
}


/* =========================
   DRAW + DETECTION
========================= */

function onPoseResults(results){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(
        !results.poseLandmarks
    ){

        setStatus(
            "Come fully into camera",
            "red"
        );

        return;
    }

    const lm =
        results.poseLandmarks;

    let color =
        "#ff3030";

    /*
      Main workout position checks
    */

    if(
        workout.toLowerCase()
        .includes("push")
    ){

        const side =
            getPushSide(lm);

        const ids =
            side==="left"
            ? [11,13,15]
            : [12,14,16];

        if(
            ids.every(i=>visible(lm,i))
        ){

            color="#00ff66";
        }

        drawPush(
            lm,
            color
        );

        detectPush(lm);

        return;
    }


    if(
        workout.toLowerCase()
        .includes("squat")
    ){

        const side =
            getSquatSide(lm);

        const ids =
            side==="left"
            ? [23,25,27]
            : [24,26,28];

        if(
            ids.every(i=>visible(lm,i))
        ){

            color="#00ff66";
        }

        drawSquat(
            lm,
            color
        );

        detectSquat(lm);

        return;
    }


    if(
        workout.toLowerCase()
        .includes("stretch")
    ){

        if(
            visible(lm,11) &&
            visible(lm,13) &&
            visible(lm,15)
        ){

            color="#00ff66";
        }

        drawStretch(
            lm,
            color
        );

        detectStretch(lm);

        return;
    }


    /* =========================
       BASIC WORKOUTS
    ========================= */

    if(
        workout.toLowerCase()
        .includes("high knee")
    ){

        drawStretch(lm,color="#00ff66");

        detectHighKnees(lm);

        return;
    }


    if(
        workout.toLowerCase()
        .includes("jumping jack")
    ){

        drawStretch(lm,color="#00ff66");

        detectJumpingJack(lm);

        return;
    }


    if(
        workout.toLowerCase()
        .includes("lunge")
    ){

        drawSquat(lm,color="#00ff66");

        detectLunge(lm);

        return;
    }


    if(
        workout.toLowerCase()
        .includes("mountain")
    ){

        drawSquat(lm,color="#00ff66");

        detectMountain(lm);

        return;
    }


    if(
        workout.toLowerCase()
        .includes("burpee")
    ){

        drawSquat(lm,color="#00ff66");

        detectBurpee(lm);

        return;
    }


    if(
        workout.toLowerCase()
        .includes("plank")
    ){

        drawSquat(lm,color="#00ff66");

        detectPlank(lm);

        return;
    }


    if(
        workout.toLowerCase()
        .includes("cool")
    ){

        drawStretch(lm,color="#00ff66");

        detectCoolDown(lm);

        return;
    }


    /* fallback */

    if(
        basicBodyReady(lm)
    ){

        setStatus(
            "BASIC DETECTION • MOVE",
            "green"
        );

        drawStretch(
            lm,
            "#00ff66"
        );

    }else{

        setStatus(
            "Come into camera view",
            "red"
        );

        drawStretch(
            lm,
            "#ff3030"
        );
    }
}


/* =========================
   MEDIAPIPE
========================= */

const pose =
    new Pose({
        locateFile:(file)=>{
            return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;
        }
    });


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:.45,

    minTrackingConfidence:.45
});


pose.onResults(
    onPoseResults
);


/* =========================
   CAMERA
========================= */

let camera;


async function startAI(){

    if(cameraStarted){
        return;
    }

    try{

        setStatus(
            "Starting camera...",
            "yellow"
        );

        cameraStarted=true;

        camera =
            new Camera(
                video,
                {
                    onFrame:async()=>{

                        if(
                            video.readyState >= 2
                        ){

                            await pose.send({
                                image:video
                            });
                        }
                    },

                    width:720,

                    height:1280
                }
            );

        await camera.start();

        setStatus(
            "Come into camera view",
            "red"
        );

    }catch(error){

        console.error(error);

        cameraStarted=false;

        setStatus(
            "Camera permission needed",
            "red"
        );
    }
}


/* =========================
   QUIT
========================= */

function quitWorkout(){

    try{

        if(camera){
            camera.stop();
        }

        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(track=>{
                    track.stop();
                });
        }

    }catch(e){

        console.log(e);
    }

    /*
      IMPORTANT:
      QUIT = NO SAVE
    */

    window.location.href =
        "daily-task.html";
}


/* =========================
   FINISH
========================= */

async function finishWorkout(){

    const user =
        firebase.auth().currentUser;

    if(!user){

        alert(
            "Please login first."
        );

        return;
    }

    if(reps <= 0){

        alert(
            "Complete at least 1 rep."
        );

        return;
    }

    const finalReps =
        Math.min(reps,50);

    try{

        const ref =
            db.collection("users")
              .doc(user.uid);

        const snap =
            await ref.get();

        const data =
            snap.exists
            ? snap.data()
            : {};

        const oldPoints =
            Number(
                data.totalPoints || 0
            );

        const oldTasks =
            Array.isArray(
                data.completedTasks
            )
            ? data.completedTasks
            : [];

        const newTasks =
            [...oldTasks];

        if(
            !newTasks.includes(workout)
        ){

            newTasks.push(workout);
        }

        await ref.set({

            totalPoints:
                oldPoints + finalReps,

            completedTasks:
                newTasks,

            lastWorkout:
                workout,

            lastWorkoutReps:
                finalReps,

            updatedAt:
                firebase.firestore
                .FieldValue.serverTimestamp()

        },{

            merge:true
        });

        if(camera){

            camera.stop();
        }

        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(track=>{
                    track.stop();
                });
        }

        window.location.href =
            "daily-task.html";

    }catch(error){

        console.error(error);

        alert(
            "Could not save workout."
        );
    }
}


/* =========================
   AUTO START
========================= */

window.addEventListener(
    "load",
    ()=>{

        setTimeout(
            ()=>{
                startAI();
            },
            300
        );

    }
);

</script>
