<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:"AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",

};

if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}

const auth = firebase.auth();

const db = firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const workoutNameEl =
    document.getElementById("workoutName");

const repEl =
    document.getElementById("rep");

const statusEl =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const quitBtn =
    document.getElementById("quitBtn");

const finishBtn =
    document.getElementById("finishBtn");


/* =====================================================
   WORKOUT
===================================================== */

const params =
    new URLSearchParams(location.search);

let workout =
    params.get("workout") ||
    localStorage.getItem("selectedWorkout") ||
    "Push Up";

workout =
    decodeURIComponent(workout);

workout =
    workout.trim();

workoutNameEl.textContent =
    workout;


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let pose = null;

let running = true;

let processing = false;

let reps = 0;

const MAX_REPS = 50;

let positionReady = false;

let lostFrames = 0;

let state = "READY";

let baseline = null;

let movementStart = null;

let lastMovementTime = 0;


/* =====================================================
   HELPERS
===================================================== */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );
}


function good(point){

    return (
        point &&
        typeof point.visibility === "number" &&
        point.visibility > 0.35
    );
}


function average(a,b){

    return (a+b)/2;
}


function angle(a,b,c){

    if(
        !good(a) ||
        !good(b) ||
        !good(c)
    ){

        return 180;
    }

    const abx =
        a.x-b.x;

    const aby =
        a.y-b.y;

    const cbx =
        c.x-b.x;

    const cby =
        c.y-b.y;

    const dot =
        abx*cbx +
        aby*cby;

    const mag1 =
        Math.sqrt(
            abx*abx +
            aby*aby
        );

    const mag2 =
        Math.sqrt(
            cbx*cbx +
            cby*cby
        );

    if(!mag1 || !mag2){

        return 180;
    }

    let value =
        dot/(mag1*mag2);

    value =
        clamp(value,-1,1);

    return (
        Math.acos(value) *
        180 /
        Math.PI
    );
}


/* =====================================================
   BODY PARTS
===================================================== */

function getParts(l){

    const w =
        workout.toLowerCase();

    switch(w){

        case "push up":

            return [

                [l[11],l[13]],
                [l[13],l[15]],

                [l[12],l[14]],
                [l[14],l[16]],

                [l[11],l[12]]

            ];


        case "squat":

            return [

                [l[23],l[25]],
                [l[25],l[27]],

                [l[24],l[26]],
                [l[26],l[28]],

                [l[23],l[24]]

            ];


        case "high knees":

            return [

                [l[23],l[25]],
                [l[24],l[26]]

            ];


        case "lunges":

            return [

                [l[23],l[25]],
                [l[25],l[27]],

                [l[24],l[26]],
                [l[26],l[28]]

            ];


        case "mountain climber":

            return [

                [l[11],l[23]],
                [l[12],l[24]],

                [l[23],l[25]],
                [l[24],l[26]]

            ];


        case "jumping jack":

            return [

                [l[11],l[13]],
                [l[13],l[15]],

                [l[12],l[14]],
                [l[14],l[16]],

                [l[23],l[25]],
                [l[25],l[27]],

                [l[24],l[26]],
                [l[26],l[28]]

            ];


        case "burpees":

            return [

                [l[11],l[12]],

                [l[11],l[23]],
                [l[12],l[24]],

                [l[23],l[25]],
                [l[24],l[26]]

            ];


        case "plank":

            return [

                [l[11],l[23]],
                [l[12],l[24]],

                [l[23],l[25]],
                [l[24],l[26]]

            ];


        case "stretching":

        case "cool down":

            return [

                [l[11],l[13]],
                [l[13],l[15]],

                [l[12],l[14]],
                [l[14],l[16]]

            ];


        default:

            return [

                [l[11],l[12]],

                [l[11],l[13]],
                [l[13],l[15]],

                [l[12],l[14]],
                [l[14],l[16]],

                [l[23],l[25]],
                [l[25],l[27]],

                [l[24],l[26]],
                [l[26],l[28]]

            ];
    }
}


/* =====================================================
   DRAW POINT
===================================================== */

function drawPoint(point,color){

    if(!point) return;

    ctx.beginPath();

    ctx.arc(

        point.x *
            canvas.width,

        point.y *
            canvas.height,

        5,

        0,

        Math.PI*2

    );

    ctx.fillStyle =
        color;

    ctx.fill();
}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(a,b,color){

    if(!a || !b) return;

    ctx.beginPath();

    ctx.moveTo(

        a.x *
            canvas.width,

        a.y *
            canvas.height

    );

    ctx.lineTo(

        b.x *
            canvas.width,

        b.y *
            canvas.height

    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        6;

    ctx.lineCap =
        "round";

    ctx.stroke();
}


/* =====================================================
   BODY VISIBILITY
===================================================== */

function bodyIsVisible(landmarks){

    const parts =
        getParts(landmarks);

    let visible = 0;

    let total = parts.length;

    parts.forEach(pair=>{

        if(
            good(pair[0]) &&
            good(pair[1])
        ){

            visible++;
        }

    });

    return (
        visible >=
        Math.max(
            1,
            Math.ceil(total*0.55)
        )
    );
}


/* =====================================================
   DRAW BODY
===================================================== */

function drawBody(landmarks){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const visible =
        bodyIsVisible(landmarks);


    if(visible){

        positionReady =
            true;

        lostFrames =
            0;

    }else{

        lostFrames++;

        /*
           Don't immediately turn red.
           Allow small tracking drops.
        */

        if(lostFrames >= 15){

            positionReady =
                false;
        }

    }


    const green =
        "#00ff66";

    const red =
        "#ff3030";

    const color =
        positionReady ?
        green :
        red;


    const parts =
        getParts(landmarks);


    parts.forEach(pair=>{

        drawLine(
            pair[0],
            pair[1],
            color
        );

        drawPoint(
            pair[0],
            color
        );

        drawPoint(
            pair[1],
            color
        );

    });


    if(positionReady){

        statusEl.textContent =
            "READY • MOVE";

        statusEl.style.color =
            green;

    }else{

        statusEl.textContent =
            "MOVE INTO CAMERA";

        statusEl.style.color =
            red;
    }
}


/* =====================================================
   ADD REP
===================================================== */

function addRep(){

    if(!positionReady)
        return;

    if(reps >= MAX_REPS)
        return;

    const now =
        Date.now();

    /*
       Small protection against
       duplicate detection in
       consecutive frames.
    */

    if(
        now-lastMovementTime <
        450
    ){

        return;
    }

    lastMovementTime =
        now;

    reps++;

    repEl.textContent =
        reps;

    statusEl.textContent =
        "REP " + reps;

    statusEl.style.color =
        "#00ff66";
}


/* =====================================================
   MOVEMENT DETECTION
===================================================== */

function detectMovement(l){

    if(!positionReady)
        return;


    const w =
        workout.toLowerCase();


    /* =================================================
       PUSH UP
    ================================================= */

    if(w === "push up"){

        if(
            !good(l[11]) ||
            !good(l[12]) ||
            !good(l[13]) ||
            !good(l[14]) ||
            !good(l[15]) ||
            !good(l[16])
        ){

            return;
        }


        const leftAngle =
            angle(
                l[11],
                l[13],
                l[15]
            );

        const rightAngle =
            angle(
                l[12],
                l[14],
                l[16]
            );


        const elbow =
            Math.min(
                leftAngle,
                rightAngle
            );


        /*
           DOWN = arms bending.
           UP = arms becoming straight.

           This does not require
           an exact push-up pose.
        */

        if(elbow < 155){

            state =
                "DOWN";

        }

        else if(
            state === "DOWN" &&
            elbow > 160
        ){

            addRep();

            state =
                "UP";
        }

        return;
    }


    /* =================================================
       SQUAT
    ================================================= */

    if(w === "squat"){

        if(
            !good(l[23]) ||
            !good(l[24]) ||
            !good(l[25]) ||
            !good(l[26])
        ){

            return;
        }


        const hipY =
            average(
                l[23].y,
                l[24].y
            );


        const kneeY =
            average(
                l[25].y,
                l[26].y
            );


        const value =
            kneeY-hipY;


        if(baseline === null){

            baseline =
                value;

            return;
        }


        /*
           Re-calibrate slowly so
           different body heights
           work better.
        */

        baseline =
            baseline*0.995 +
            value*0.005;


        const delta =
            value-baseline;


        if(delta > 0.035){

            state =
                "DOWN";

        }

        else if(
            state === "DOWN" &&
            delta < 0.015
        ){

            addRep();

            state =
                "UP";
        }

        return;
    }


    /* =================================================
       HIGH KNEES
    ================================================= */

    if(w === "high knees"){

        if(
            !good(l[23]) ||
            !good(l[24]) ||
            !good(l[25]) ||
            !good(l[26])
        ){

            return;
        }


        const left =
            l[23].y-l[25].y;

        const right =
            l[24].y-l[26].y;


        const rise =
            Math.max(
                left,
                right
            );


        if(rise > 0.06){

            state =
                "KNEE_UP";

        }

        else if(
            state === "KNEE_UP" &&
            rise < 0.025
        ){

            addRep();

            state =
                "READY";
        }

        return;
    }


    /* =================================================
       LUNGES
    ================================================= */

    if(w === "lunges"){

        if(
            !good(l[23]) ||
            !good(l[24]) ||
            !good(l[25]) ||
            !good(l[26]) ||
            !good(l[27]) ||
            !good(l[28])
        ){

            return;
        }


        const left =
            angle(
                l[23],
                l[25],
                l[27]
            );


        const right =
            angle(
                l[24],
                l[26],
                l[28]
            );


        const knee =
            Math.min(
                left,
                right
            );


        if(knee < 155){

            state =
                "DOWN";

        }

        else if(
            state === "DOWN" &&
            knee > 165
        ){

            addRep();

            state =
                "UP";
        }

        return;
    }


    /* =================================================
       MOUNTAIN CLIMBER
    ================================================= */

    if(w === "mountain climber"){

        if(
            !good(l[23]) ||
            !good(l[24]) ||
            !good(l[25]) ||
            !good(l[26])
        ){

            return;
        }


        const left =
            Math.abs(
                l[25].y -
                l[23].y
            );


        const right =
            Math.abs(
                l[26].y -
                l[24].y
            );


        const value =
            Math.min(
                left,
                right
            );


        if(baseline === null){

            baseline =
                value;

            return;
        }


        if(
            value <
            baseline*0.75
        ){

            state =
                "KNEE_UP";

        }

        else if(
            state === "KNEE_UP" &&
            value >
            baseline*0.90
        ){

            addRep();

            state =
                "READY";
        }

        return;
    }


    /* =================================================
       JUMPING JACK
    ================================================= */

    if(w === "jumping jack"){

        if(
            !good(l[11]) ||
            !good(l[12]) ||
            !good(l[15]) ||
            !good(l[16])
        ){

            return;
        }


        const armsUp =
            l[15].y < l[11].y ||
            l[16].y < l[12].y;


        const feetApart =
            good(l[27]) &&
            good(l[28]) &&
            Math.abs(
                l[27].x-l[28].x
            ) > 0.22;


        const open =
            armsUp &&
            feetApart;


        if(open){

            state =
                "OPEN";

        }

        else if(
            state === "OPEN" &&
            !open
        ){

            addRep();

            state =
                "CLOSED";
        }

        return;
    }


    /* =================================================
       BURPEES
    ================================================= */

    if(w === "burpees"){

        if(
            !good(l[11]) ||
            !good(l[12]) ||
            !good(l[23]) ||
            !good(l[24])
        ){

            return;
        }


        const shoulderY =
            average(
                l[11].y,
                l[12].y
            );


        const hipY =
            average(
                l[23].y,
                l[24].y
            );


        const height =
            Math.abs(
                shoulderY-hipY
            );


        if(baseline === null){

            baseline =
                height;

            return;
        }


        if(
            height <
            baseline*0.65
        ){

            state =
                "DOWN";

        }

        else if(
            state === "DOWN" &&
            height >
            baseline*0.85
        ){

            addRep();

            state =
                "UP";
        }

        return;
    }


    /* =================================================
       PLANK
    ================================================= */

    if(w === "plank"){

        if(!movementStart){

            movementStart =
                Date.now();
        }


        /*
           One completed hold =
           one rep.

           Holding for 5 seconds
           counts once.
        */

        if(
            Date.now() -
            movementStart >=
            5000 &&
            state !== "COUNTED"
        ){

            addRep();

            state =
                "COUNTED";
        }

        return;
    }


    /* =================================================
       STRETCHING
    ================================================= */

    if(w === "stretching"){

        if(
            !good(l[15]) ||
            !good(l[16])
        ){

            return;
        }


        const wristY =
            average(
                l[15].y,
                l[16].y
            );


        if(baseline === null){

            baseline =
                wristY;

            return;
        }


        const movement =
            Math.abs(
                wristY-baseline
            );


        if(movement > 0.07){

            state =
                "MOVE";

        }

        else if(
            state === "MOVE" &&
            movement < 0.035
        ){

            addRep();

            state =
                "READY";

            baseline =
                wristY;
        }

        return;
    }


    /* =================================================
       COOL DOWN
    ================================================= */

    if(w === "cool down"){

        if(
            !good(l[15]) ||
            !good(l[16])
        ){

            return;
        }


        const wristY =
            average(
                l[15].y,
                l[16].y
            );


        if(baseline === null){

            baseline =
                wristY;

            return;
        }


        const movement =
            Math.abs(
                wristY-baseline
            );


        if(movement > 0.07){

            state =
                "MOVE";

        }

        else if(
            state === "MOVE" &&
            movement < 0.035
        ){

            addRep();

            state =
                "READY";

            baseline =
                wristY;
        }

        return;
    }

}


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onResults(results){

    if(!running)
        return;


    if(
        !results ||
        !results.poseLandmarks
    ){

        lostFrames++;

        if(lostFrames >= 15){

            positionReady =
                false;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            statusEl.textContent =
                "MOVE INTO CAMERA";

            statusEl.style.color =
                "#ff3030";
        }

        return;
    }


    const landmarks =
        results.poseLandmarks;


    drawBody(
        landmarks
    );


    if(positionReady){

        detectMovement(
            landmarks
        );
    }
}


/* =====================================================
   MEDIAPIPE SETUP
===================================================== */

function setupPose(){

    pose =
        new Pose({

            locateFile:(file)=>{

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" +
                    file
                );

            }

        });


    pose.setOptions({

        modelComplexity:1,

        smoothLandmarks:true,

        enableSegmentation:false,

        minDetectionConfidence:0.40,

        minTrackingConfidence:0.40

    });


    pose.onResults(
        onResults
    );
}


/* =====================================================
   CAMERA PROCESS LOOP
===================================================== */

async function processVideo(){

    if(!running)
        return;


    if(
        video.readyState >= 2 &&
        !processing
    ){

        processing =
            true;

        try{

            await pose.send({
                image:video
            });

        }

        catch(error){

            console.error(
                "Pose error:",
                error
            );

        }

        processing =
            false;
    }


    requestAnimationFrame(
        processVideo
    );
}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

    try{

        loading.style.display =
            "flex";


        setupPose();


        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{

                    facingMode:"user",

                    width:{
                        ideal:720
                    },

                    height:{
                        ideal:1280
                    }

                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        canvas.width =
            video.videoWidth ||
            720;

        canvas.height =
            video.videoHeight ||
            1280;


        loading.style.display =
            "none";


        processVideo();

    }

    catch(error){

        console.error(
            "Camera error:",
            error
        );


        loading.innerHTML = `

            <div
                style="
                color:#ff3030;
                font-size:18px;
                text-align:center;
                "
            >
                Camera could not start
            </div>

            <div
                style="
                font-size:13px;
                color:#aaa;
                text-align:center;
                "
            >
                Allow camera permission
                and reload.
            </div>

        `;
    }
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    running =
        false;


    if(stream){

        stream
        .getTracks()
        .forEach(track=>{

            track.stop();

        });

        stream =
            null;
    }
}


/* =====================================================
   QUIT
===================================================== */

quitBtn.onclick = ()=>{

    /*
       QUIT = NO SAVE
    */

    stopCamera();

    location.href =
        "daily-task.html";
};


/* =====================================================
   FINISH
===================================================== */

finishBtn.onclick =
async ()=>{

    if(reps <= 0){

        alert(
            "Complete at least 1 rep."
        );

        return;
    }


    const user =
        auth.currentUser;


    if(!user){

        /*
           IMPORTANT:
           Do NOT redirect to login.
        */

        alert(
            "Please login before saving."
        );

        return;
    }


    finishBtn.disabled =
        true;


    try{

        const userRef =
            db
            .collection("users")
            .doc(user.uid);


        const snap =
            await userRef.get();


        const data =
            snap.exists ?
            snap.data() :
            {};


        const oldPoints =
            Number(
                data.totalPoints || 0
            );


        /*
           completedTasks can be
           number or array in old data.
           Keep it safe.
        */

        let oldTasks =
            data.completedTasks;


        if(Array.isArray(oldTasks)){

            oldTasks =
                oldTasks.length;

        }

        else{

            oldTasks =
                Number(
                    oldTasks || 0
                );
        }


        await userRef.set({

            totalPoints:
                oldPoints + reps,

            completedTasks:
                oldTasks + 1,

            lastWorkout:
                workout,

            lastWorkoutReps:
                reps,

            updatedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        },{

            merge:true

        });


        stopCamera();


        location.href =
            "daily-task.html";

    }

    catch(error){

        console.error(
            "Save error:",
            error
        );


        alert(
            "Could not save workout. Please try again."
        );


        finishBtn.disabled =
            false;
    }

};


/* =====================================================
   IMPORTANT:
   NO AUTH REDIRECT
===================================================== */

/*
   Camera opens directly.

   We intentionally DO NOT do:

   auth.onAuthStateChanged(...)
   location.href = index.html

   This prevents the camera from
   throwing the user back to login.
*/


startCamera();

   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        if(video.videoWidth){

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;
        }

    }
);

</script>
