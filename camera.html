/* ================= ELEMENTS ================= */

/* ================= WORKOUT ================= */

const params =
new URLSearchParams(location.search);

let workout =
params.get("workout") ||

try{
    workout = decodeURIComponent(workout);

/* ================= CAMERA STATE ================= */

let stream = null;
let pose = null;

let running = true;
let processing = false;

let aiDetectedReps = 0;

const MAX_REPS = 50;

let tracked = false;
let lostFrames = 0;
let lastRepTime = 0;


/* ================= PUSH UP ================= */

let pushLocked = false;
let pushLostFrames = 0;
let pushTopY = null;
let pushBottomY = null;
let pushDownSeen = false;


/* ================= WORKOUT STATES ================= */

let squatDown = false;
let lungeDown = false;
let highKneeUp = false;
let mountainKneeActive = false;
let jumpingJackOpen = false;
let burpeeDown = false;
let burpeeStanding = false;
let stretchUp = false;


/* ================= PLANK ================= */

let plankStart = 0;
let lastPlankSecond = 0;


/* ================= BASIC FUNCTIONS ================= */

function good(p){

    return !!(
        p &&
        typeof p.x === "number" &&
        typeof p.y === "number" &&
        (
            p.visibility === undefined ||
            p.visibility > .15
        )
    );
}


function req(a){
    return a.every(good);
}


function mid(a,b){

    return {
        x:(a.x+b.x)/2,
        y:(a.y+b.y)/2
    };
}


function dist(a,b){

    if(!good(a) || !good(b)){
        return 999;
    }

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function angle(a,b,c){

    if(!req([a,b,c])){
        return 180;
    }

    const abx = a.x-b.x;
    const aby = a.y-b.y;

    const cbx = c.x-b.x;
    const cby = c.y-b.y;

    const m1 =
    Math.hypot(abx,aby);

    const m2 =
    Math.hypot(cbx,cby);

    if(!m1 || !m2){
        return 180;
    }

    return Math.acos(
        Math.max(
            -1,
            Math.min(
                1,
                (
                    abx*cbx +
                    aby*cby
                )/(m1*m2)
            )
        )
    ) * 180 / Math.PI;
}


/* ================= INTERNAL AI REP ================= */

function addAIRep(){

    if(
        !tracked ||
        aiDetectedReps >= MAX_REPS
    ){
        return;
    }

    const now = Date.now();

    if(
        now-lastRepTime < 450
    ){
        return;
    }

    lastRepTime = now;

    aiDetectedReps++;

}


/* ================= BODY VISIBILITY ================= */

function bodyVisible(l){

    const p = [

        l[11],l[12],
        l[13],l[14],
        l[15],l[16],
        l[23],l[24],
        l[25],l[26],
        l[27],l[28]

    ];

    return (
        p.filter(good).length >= 7
    );
}


/* ================= PUSH-UP START ================= */

function pushupStartPosition(l){

    if(
        !req([
            l[11],l[12],
            l[13],l[14],
            l[15],l[16],
            l[23],l[24]
        ])
    ){
        return false;
    }

    const shoulder =
    mid(l[11],l[12]);

    const hip =
    mid(l[23],l[24]);

    const leftArm =
    angle(l[11],l[13],l[15]);

    const rightArm =
    angle(l[12],l[14],l[16]);

    const armAngle =
    Math.min(leftArm,rightArm);

    const bodyAngle =
    angle(
        shoulder,
        hip,
        {
            x:hip.x,
            y:hip.y+.35
        }
    );

    const shouldersLevel =
    Math.abs(
        l[11].y-l[12].y
    ) < .12;

    const hipsLevel =
    Math.abs(
        l[23].y-l[24].y
    ) < .15;

    return (
        armAngle > 135 &&
        bodyAngle > 115 &&
        shouldersLevel &&
        hipsLevel &&
        shoulder.y < hip.y+.35
    );
}


/* ================= PUSH-UP TRACK ================= */

function pushupBodyStillTrackable(l){

    return req([

        l[11],l[12],
        l[13],l[14],
        l[15],l[16],
        l[23],l[24]

    ]);
}


/* ================= PUSH-UP DETECTOR ================= */

function detectPushUp(l){

    if(!pushLocked){

        if(pushupStartPosition(l)){

            pushLocked = true;

            pushLostFrames = 0;

            tracked = true;

            const shoulder =
            mid(l[11],l[12]);

            pushTopY =
            shoulder.y;

            pushBottomY =
            shoulder.y;

            pushDownSeen =
            false;

        }

        return;
    }


    if(
        pushupBodyStillTrackable(l)
    ){

        pushLostFrames = 0;
        tracked = true;

    }else{

        pushLostFrames++;

        if(pushLostFrames > 25){

            pushLocked = false;
            pushLostFrames = 0;

            pushTopY = null;
            pushBottomY = null;
            pushDownSeen = false;

            tracked = false;

            return;
        }
    }


    const shoulder =
    mid(l[11],l[12]);

    const hip =
    mid(l[23],l[24]);


    const leftArm =
    angle(l[11],l[13],l[15]);

    const rightArm =
    angle(l[12],l[14],l[16]);

    const armAngle =
    Math.min(leftArm,rightArm);


    const bodyScale =
    Math.max(
        .20,
        dist(shoulder,hip)
    );


    if(!pushDownSeen){

        if(
            shoulder.y < pushTopY
        ){
            pushTopY =
            shoulder.y;
        }

        const downDistance =
        shoulder.y-pushTopY;

        const realDown =
        downDistance >
        bodyScale*.22;

        const armsBent =
        armAngle < 150;

        if(
            realDown &&
            armsBent
        ){

            pushDownSeen = true;

            pushBottomY =
            shoulder.y;
        }

        return;
    }


    if(
        shoulder.y >
        pushBottomY
    ){

        pushBottomY =
        shoulder.y;
    }


    const returnedDistance =
    pushBottomY-shoulder.y;

    const returnedEnough =
    returnedDistance >
    bodyScale*.22;

    const armsStraight =
    armAngle > 155;


    if(
        returnedEnough &&
        armsStraight
    ){

        addAIRep();

        pushDownSeen = false;

        pushTopY =
        shoulder.y;

        pushBottomY =
        shoulder.y;
    }

}


/* ==================================================
   ALL WORKOUT DETECTION
   ================================================== */

function detect(l){

    if(!tracked){
        return;
    }

    const w =
    workout.toLowerCase();


    /* ================= PUSH UP ================= */

    if(w === "push up"){

        detectPushUp(l);
        return;

    }


    /* ================= SQUAT ================= */

    if(w === "squat"){

        if(!req([
            l[23],l[24],
            l[25],l[26],
            l[27],l[28]
        ])){
            return;
        }

        const leftKnee =
        angle(l[23],l[25],l[27]);

        const rightKnee =
        angle(l[24],l[26],l[28]);

        const knee =
        Math.min(
            leftKnee,
            rightKnee
        );

        if(
            !squatDown &&
            knee < 158
        ){
            squatDown = true;
        }

        if(
            squatDown &&
            knee > 164
        ){

            addAIRep();

            squatDown = false;
        }

        return;
    }


    /* ================= HIGH KNEES ================= */

    if(w === "high knees"){

        if(!req([
            l[23],l[24],
            l[25],l[26]
        ])){
            return;
        }

        const leftUp =
        l[25].y <
        l[23].y-.055;

        const rightUp =
        l[26].y <
        l[24].y-.055;

        const kneeUp =
        leftUp || rightUp;

        const leftBack =
        l[25].y >=
        l[23].y-.015;

        const rightBack =
        l[26].y >=
        l[24].y-.015;

        if(
            !highKneeUp &&
            kneeUp
        ){
            highKneeUp = true;
        }

        if(
            highKneeUp &&
            leftBack &&
            rightBack
        ){

            addAIRep();

            highKneeUp = false;
        }

        return;
    }


    /* ================= LUNGES ================= */

    if(w === "lunges"){

        if(!req([
            l[23],l[24],
            l[25],l[26],
            l[27],l[28]
        ])){
            return;
        }

        const leftKnee =
        angle(l[23],l[25],l[27]);

        const rightKnee =
        angle(l[24],l[26],l[28]);

        const knee =
        Math.min(
            leftKnee,
            rightKnee
        );

        if(
            !lungeDown &&
            knee < 150
        ){
            lungeDown = true;
        }

        if(
            lungeDown &&
            knee > 165
        ){

            addAIRep();

            lungeDown = false;
        }

        return;
    }


    /* ================= MOUNTAIN CLIMBER ================= */

    if(w === "mountain climber"){

        if(!req([
            l[11],l[12],
            l[15],l[16],
            l[23],l[24],
            l[25],l[26]
        ])){
            return;
        }

        const shoulder =
        mid(l[11],l[12]);

        const hip =
        mid(l[23],l[24]);

        if(
            Math.abs(
                shoulder.y-hip.y
            ) >= .52
        ){

            mountainKneeActive = false;
            return;
        }

        const drive =
        dist(l[25],l[16]) < .30 ||
        dist(l[26],l[15]) < .30 ||
        l[25].y < l[23].y-.08 ||
        l[26].y < l[24].y-.08;

        const back =
        l[25].y >= l[23].y-.025 &&
        l[26].y >= l[24].y-.025;

        if(
            !mountainKneeActive &&
            drive
        ){
            mountainKneeActive = true;
        }

        if(
            mountainKneeActive &&
            back
        ){

            addAIRep();

            mountainKneeActive = false;
        }

        return;
    }


    /* ================= JUMPING JACK ================= */

    if(w === "jumping jack"){

        if(!req([
            l[15],l[16],
            l[27],l[28],
            l[11],l[12]
        ])){
            return;
        }

        const shoulder =
        mid(l[11],l[12]);

        const feetDistance =
        Math.abs(
            l[27].x-l[28].x
        );

        const open =
        feetDistance > .16 &&
        l[15].y < shoulder.y+.02 &&
        l[16].y < shoulder.y+.02;

        const closed =
        feetDistance < .13 &&
        l[15].y > shoulder.y+.10 &&
        l[16].y > shoulder.y+.10;

        if(
            !jumpingJackOpen &&
            open
        ){
            jumpingJackOpen = true;
        }

        if(
            jumpingJackOpen &&
            closed
        ){

            addAIRep();

            jumpingJackOpen = false;
        }

        return;
    }


    /* ================= BURPEES ================= */

    if(w === "burpees"){

        if(!req([
            l[11],l[12],
            l[23],l[24],
            l[25],l[26],
            l[27],l[28]
        ])){
            return;
        }

        const leftKnee =
        angle(l[23],l[25],l[27]);

        const rightKnee =
        angle(l[24],l[26],l[28]);

        const knee =
        Math.min(
            leftKnee,
            rightKnee
        );

        const shoulder =
        mid(l[11],l[12]);

        const hip =
        mid(l[23],l[24]);

        const low =
        knee < 145 ||
        Math.abs(
            shoulder.y-hip.y
        ) < .50;

        const standing =
        knee > 165 &&
        Math.abs(
            l[27].y-l[28].y
        ) < .15;

        const jump =
        l[27].y <
        l[25].y-.025 &&
        l[28].y <
        l[26].y-.025;

        if(
            !burpeeDown &&
            low
        ){

            burpeeDown = true;
            burpeeStanding = false;
        }

        if(
            burpeeDown &&
            !burpeeStanding &&
            standing
        ){

            burpeeStanding = true;
        }

        if(
            burpeeStanding &&
            jump
        ){

            addAIRep();

            burpeeDown = false;
            burpeeStanding = false;
        }

        return;
    }


    /* ================= PLANK ================= */

    if(w === "plank"){

        if(!req([
            l[11],l[12],
            l[23],l[24],
            l[25],l[26]
        ])){
            return;
        }

        const shoulder =
        mid(l[11],l[12]);

        const hip =
        mid(l[23],l[24]);

        const valid =
        Math.abs(
            shoulder.y-hip.y
        ) < .55;

        if(!valid){

            if(
                plankStart &&
                Date.now()-plankStart > 1500
            ){

                plankStart = 0;
                lastPlankSecond = 0;
            }

            return;
        }

        if(!plankStart){

            plankStart =
            Date.now();

            lastPlankSecond = 0;
        }

        const sec =
        Math.min(
            MAX_REPS,
            Math.floor(
                (
                    Date.now()-
                    plankStart
                )/1000
            )
        );

        if(
            sec >
            lastPlankSecond
        ){

            lastPlankSecond = sec;

            aiDetectedReps = sec;
        }

        return;
    }


    /* ================= STRETCHING ================= */

    if(
        w === "stretching" ||
        w === "cool down"
    ){

        if(!req([
            l[11],l[12],
            l[15],l[16]
        ])){
            return;
        }

        const shoulder =
        mid(l[11],l[12]);

        const up =
        l[15].y <
        shoulder.y-.10 &&
        l[16].y <
        shoulder.y-.10;

        const down =
        l[15].y >
        shoulder.y+.05 &&
        l[16].y >
        shoulder.y+.05;

        if(
            !stretchUp &&
            up
        ){
            stretchUp = true;
        }

        if(
            stretchUp &&
            down
        ){

            addAIRep();

            stretchUp = false;
        }

        return;
    }

}


/* ================= MEDIAPIPE ================= */

function onResults(results){

    if(!running){
        return;
    }

    if(
        !results ||
        !results.poseLandmarks
    ){

        lostFrames++;

        if(lostFrames > 12){

            tracked = false;

            statusEl.textContent =
            "MOVE INTO CAMERA";

            statusEl.style.color =
            "#ff3030";
        }

        return;
    }

    const landmarks =
    results.poseLandmarks;

    if(bodyVisible(landmarks)){

        lostFrames = 0;
        tracked = true;

    }else{

        lostFrames++;

        if(lostFrames > 12){
            tracked = false;
        }
    }

    detect(landmarks);
}


/* ================= POSE SETUP ================= */

function setupPose(){

    pose =
    new Pose({

        locateFile:
        file =>
        "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file

    });

    pose.setOptions({

        modelComplexity:1,

        smoothLandmarks:true,

        enableSegmentation:false,

        minDetectionConfidence:.35,

        minTrackingConfidence:.35

    });

    pose.onResults(
        onResults
    );
}


/* ================= CAMERA ================= */

async function startCamera(){

    try{

        setupPose();

        stream =
        await navigator.mediaDevices.getUserMedia({

            video:{
                facingMode:"user",
                width:{ideal:720},
                height:{ideal:1280}
            },

            audio:false

        });

        video.srcObject =
        stream;

        await video.play();

        loading.style.display =
        "none";

        statusEl.textContent =
        "GET READY";

        runCountdown();

    }catch(e){

        console.error(e);

        loading.innerHTML =

        '<div style="color:#ff3030;font-weight:bold">'+
        'Camera could not start'+
        '</div>'+

        '<div style="color:#aaa;font-size:13px">'+
        'Allow camera permission and reload.'+
        '</div>';
    }
}


/* ================= COUNTDOWN ================= */

function runCountdown(){

    let count = 3;

    countdownEl.textContent =
    count;

    const timer =
    setInterval(()=>{

        count--;

        if(count > 0){

            countdownEl.textContent =
            count;

        }else{

            clearInterval(timer);

            countdownEl.textContent =
            "";

            statusEl.textContent =
            "WORKOUT STARTED";

            statusEl.style.color =
            "#00ff66";

            requestAnimationFrame(
                processVideo
            );
        }

    },1000);
}


/* ================= PROCESS VIDEO ================= */

async function processVideo(){

    if(!running){
        return;
    }

    if(
        video.readyState >= 2 &&
        !processing
    ){

        processing = true;

        try{

            await pose.send({
                image:video
            });

        }catch(e){

            console.error(
                "Pose error:",
                e
            );

        }

        processing = false;
    }

    requestAnimationFrame(
        processVideo
    );
}


/* ================= STOP CAMERA ================= */

function stopCamera(){

    running = false;

    if(stream){

        stream
        .getTracks()
        .forEach(
            t=>t.stop()
        );

        stream = null;
    }
}


/* ================= QUIT ================= */

quitBtn.onclick = ()=>{

    stopCamera();

    location.href =
    "daily-task.html";
};


/* ================= FINISH ================= */

finishBtn.onclick = async ()=>{

    const user =
    auth.currentUser;

    if(!user){

        alert(
            "Please login before saving."
        );

        return;
    }


    /* ================= CLAIM ================= */

    const answer =
    prompt(
        "How many reps did you complete?\n\n"+
        "Enter your actual reps:"
    );

    if(answer === null){
        return;
    }


    const claimedReps =
    Number(answer.trim());


    if(
        !Number.isInteger(claimedReps) ||
        claimedReps < 1 ||
        claimedReps > MAX_REPS
    ){

        alert(
            "Enter a number between 1 and 50."
        );

        return;
    }


    const confirmed =
    confirm(

        "You are claiming "+
        claimedReps+
        " reps.\n\n"+
        "False claims may be rejected by Admin."

    );

    if(!confirmed){
        return;
    }


    finishBtn.disabled = true;


    try{

        /* ================= AI RESULT ================= */

        const aiClearReps =
        Math.min(
            claimedReps,
            aiDetectedReps
        );

        const aiUnclearReps =
        Math.max(
            0,
            claimedReps -
            aiClearReps
        );

        const suggestedRC =
        aiClearReps;


        /* ================= WORKOUT ORDER ================= */

        const order = [

            "Stretching",
            "Push Up",
            "Squat",
            "High Knees",
            "Lunges",
            "Mountain Climber",
            "Jumping Jack",
            "Burpees",
            "Plank",
            "Cool Down"

        ];


        /* ================= USER ================= */

        const userRef =
        db.collection("users")
        .doc(user.uid);

        const snap =
        await userRef.get();

        const data =
        snap.exists
        ? snap.data()
        : {};


        /* ================= COMPLETED TASK ================= */

        let completed =
        Array.isArray(
            data.completedTasks
        )
        ? [...data.completedTasks]
        : [];


        const index =
        order.findIndex(

            x =>
            x.toLowerCase() ===
            workout.toLowerCase()

        );


        if(
            index >= 0 &&
            !completed.includes(index)
        ){

            completed.push(index);
        }


        completed =
        [...new Set(completed)]
        .sort((a,b)=>a-b);


        /* ================= VERIFICATION REQUEST ================= */

        const requestRef =
        db.collection(
            "verificationRequests"
        ).doc();


        await requestRef.set({

            uid:
            user.uid,

            workout:
            workout,

            claimedReps:
            claimedReps,

            aiDetectedReps:
            aiDetectedReps,

            aiClearReps:
            aiClearReps,

            aiUnclearReps:
            aiUnclearReps,

            suggestedRC:
            suggestedRC,

            status:
            "pending",

            adminApprovedReps:
            null,

            adminApprovedRC:
            null,

            adminNote:
            "",

            completedTaskIndex:
            index,

            submittedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp(),

            createdAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

        });


        /* ================= USER UPDATE ================= */

        await userRef.set({

            completedTasks:
            completed,

            lastWorkout:
            workout,

            lastWorkoutReps:
            claimedReps,

            lastVerificationId:
            requestRef.id,

            updatedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

        },{
            merge:true
        });


        /*
         * IMPORTANT:
         *
         * NO RC IS GIVEN HERE.
         *
         * Admin must review:
         *
         * Claimed: 32
         * Clear: 31
         * Unclear: 1
         * Suggested RC: 31
         *
         * Admin decides final RC.
         */


        stopCamera();


        alert(

            "Workout submitted!\n\n"+
            "Claimed: "+
            claimedReps+
            "\nAI Clear: "+
            aiClearReps+
            "\nAI Unclear: "+
            aiUnclearReps+
            "\nSuggested RC: "+
            suggestedRC+
            "\n\n"+
            "Waiting for Admin review."

        );


        location.href =
        "daily-task.html";


    }catch(e){

        console.error(e);

        alert(
            "Could not submit workout. Please try again."
        );

        finishBtn.disabled =
        false;
    }

};


/* ================= START ================= */

startCamera();

</script>

</body>
</html>
