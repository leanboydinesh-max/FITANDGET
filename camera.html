<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camera</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#000;
overflow:hidden;
}

.camera-screen{
position:relative;
width:100%;
height:100vh;
background:#000;
}

#camera{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
background:#111;
}

.top-bar{
position:absolute;
top:20px;
left:15px;
right:15px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:10;
}

.timer{
background:rgba(0,0,0,.6);
padding:10px 18px;
border-radius:30px;
color:#9DFF00;
font-weight:700;
border:1px solid #9DFF00;
}

.quit-btn{
background:#ff3b30;
color:#fff;
border:none;
padding:10px 18px;
border-radius:30px;
font-weight:700;
}

.center-box{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:10;
}

.ai-box{
display:flex;
align-items:center;
gap:10px;
padding:12px 20px;
border-radius:30px;
background:rgba(0,0,0,.6);
border:1px solid #9DFF00;
color:#9DFF00;
font-weight:600;
}

.ai-dot{
width:12px;
height:12px;
border-radius:50%;
background:#9DFF00;
box-shadow:0 0 15px #9DFF00;
}

.bottom-card{
position:absolute;
left:0;
right:0;
bottom:0;
padding:25px;
background:rgba(10,10,10,.95);
border-top-left-radius:30px;
border-top-right-radius:30px;
border-top:2px solid #9DFF00;
text-align:center;
z-index:10;
color:#fff;
}

.bottom-card h2{
font-size:28px;
margin-bottom:10px;
}

.set{
color:#aaa;
margin-bottom:20px;
}

.rep-box h1{
font-size:70px;
color:#9DFF00;
}

.rep-box span{
font-size:18px;
font-weight:700;
}

#nextBtn{
margin-top:20px;
width:100%;
height:55px;
border:none;
border-radius:15px;
background:#9DFF00;
color:#000;
font-size:18px;
font-weight:700;
}
</style>
</head>
<body>

<div class="camera-screen">

    <video id="camera" autoplay playsinline></video>

    <div class="top-bar">

        <div class="timer">
            ⏱ <span id="time">00:00</span>
        </div>

        <button class="quit-btn">
            QUIT
        </button>

    </div>

    <div class="center-box">

        <div class="ai-box">

            <div class="ai-dot"></div>

            <span>AI Detecting...</span>

        </div>

    </div>

    <div class="bottom-card">

        <h2 id="exerciseName">
            Push Up
        </h2>

        <p class="set">
            Do Your Max • 1 Set
        </p>

        <div class="rep-box">

            <h1 id="repCount">
                0
            </h1>

            <span>REPS</span>

        </div>

        <button id="nextBtn">
            NEXT WORKOUT →
        </button>

    </div>

</div>
<script>
// Camera Access
const video = document.getElementById("camera");

navigator.mediaDevices.getUserMedia({
    video: {
        facingMode: "user"
    },
    audio: false
})
.then(stream => {
    video.srcObject = stream;
})
navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"user"
    },
    audio:false
})
.then(stream=>{
    video.srcObject = stream;
})
.catch(err=>{
    alert(
        "Camera Error: " + err.name +
        "\n" + err.message
    );
});

// Timer
let sec = 0;

setInterval(() => {
    sec++;

    let min = Math.floor(sec / 60);
    let s = sec % 60;

    document.getElementById("time").innerText =
        String(min).padStart(2,"0") + ":" +
        String(s).padStart(2,"0");
},1000);

// Quit Button
document.querySelector(".quit-btn").onclick = () => {
    window.location.href = "dailytask.html";
};

// Next Button
document.getElementById("nextBtn").onclick = () => {
    alert("Next Workout");
};
</script>
</body>
</html>
