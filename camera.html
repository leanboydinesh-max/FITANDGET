<script>

/* =====================================================

if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}

const auth =
    firebase.auth();

const db =
    firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const workoutNameEl =
    document.getElementById("workoutName");

const repEl =
    document.getElementById("rep");

const statusEl =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const quitBtn =
    document.getElementById("quitBtn");

const finishBtn =
    document.getElementById("finishBtn");


/* =====================================================
   WORKOUT
===================================================== */

const params =
    new URLSearchParams(location.search);

let workout =
    params.get("workout") ||
    localStorage.getItem("selectedWorkout") ||
    "Stretching";

workout =
    decodeURIComponent(workout);

workout =
    workout.trim();

workoutNameEl.textContent =
    workout;


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let pose = null;

let running = true;

let processing = false;

let reps = 0;

const MAX_REPS = 50;

let positionReady = false;

let lostFrames = 0;

let state = "READY";

let baseline = null;

let movementStart = null;

let lastMovementTime = 0;


/* =====================================================
   HELPERS
===================================================== */

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );
}


function good(point){

    return (
        point &&
        typeof point.visibility === "number" &&
        point.visibility > 0.35
    );
}


function average(a,b){

    return (a+b)/2;
}


function angle(a,b,c){

    if(
        !good(a) ||
        !good(b) ||
        !good(c)
    ){

        return 180;
    }

    const abx =
        a.x-b.x;

    const aby =
        a.y-b.y;

    const cbx =
        c.x-b.x;

    const cby =
        c.y-b.y;

    const dot =
        abx*cbx +
        aby*cby;

    const mag1 =
        Math.sqrt(
            abx*abx +
            aby*aby
        );

    const mag2 =
        Math.sqrt(
            cbx*cbx +
            cby*cby
        );

    if(!mag1 || !mag2){

        return 180;
    }

    let value =
        dot/(mag1*mag2);

    value =
        clamp(value,-1,1);

    return (
        Math.acos(value) *
        180 /
        Math.PI
    );
}


/* =====================================================
   BODY PARTS
===================================================== */

function getParts(l){

    const w =
        workout.toLowerCase();

    switch(w){

        case "push up":

            return [

                [l[11],l[13]],
                [l[13],l[15]],

                [l[12],l[14]],
                [l[14],l[16]],

                [l[11],l[12]]

            ];


        case "squat":

            return [

                [l[23],l[25]],
                [l[25],l[27]],

                [l[24],l[26]],
                [l[26],l[28]],

                [l[23],l[24]]

            ];


        case "high knees":

            return [

                [l[23],l[25]],
                [l[24],l[26]]

            ];


        case "lunges":

            return [

                [l[23],l[25]],
                [l[25],l[27]],

                [l[24],l[26]],
                [l[26],l[28]]

            ];


        case "mountain climber":

            return [

                [l[11],l[23]],
                [l[12],l[24]],

                [l[23],l[25]],
                [l[24],l[26]]

            ];


        case "jumping jack":

            return [

                [l[11],l[13]],
                [l[13],l[15]],

                [l[12],l[14]],
                [l[14],l[16]],

                [l[23],l[25]],
                [l[25],l[27]],

                [l[24],l[26]],
                [l[26],l[28]]

            ];


        case "burpees":

            return [

                [l[11],l[12]],

                [l[11],l[23]],
                [l[12],l[24]],

                [l[23],l[25]],
                [l[24],l[26]]

            ];


        case "plank":

            return [

                [l[11],l[23]],
                [l[12],l[24]],

                [l[23],l[25]],
                [l[24],l[26]]

            ];


        case "stretching":

        case "cool down":

            return [

                [l[11],l[13]],
                [l[13],l[15]],

                [l[12],l[14]],
                [l[14],l[16]]

            ];


        default:

            return [

                [l[11],l[12]],

                [l[11],l[13]],
                [l[13],l[15]],

                [l[12],l[14]],
                [l[14],l[16]],

                [l[23],l[25]],
                [l[25],l[27]],

                [l[24],l[26]],
                [l[26],l[28]]

            ];
    }
}


/* =====================================================
   DRAW POINT
===================================================== */

function drawPoint(point,color){

    if(!point) return;

    ctx.beginPath();

    ctx.arc(

        point.x *
            canvas.width,

        point.y *
            canvas.height,

        5,

        0,
        Math.PI*2

    );

    ctx.fillStyle =
        color;

    ctx.fill();
}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(a,b,color){

    if(!a || !b) return;

    ctx.beginPath();

    ctx.moveTo(

        a.x *
            canvas.width,

        a.y *
            canvas.height

    );

    ctx.lineTo(

        b.x *
            canvas.width,

        b.y *
            canvas.height

    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        6;

    ctx.lineCap =
        "round";

    ctx.stroke();
}


/* =====================================================
   BODY VISIBILITY
===================================================== */

function bodyIsVisible(landmarks){

    const parts =
        getParts(landmarks);

    let visible = 0;

    const total =
        parts.length;

    parts.forEach(pair=>{

        if(
            good(pair[0]) &&
            good(pair[1])
        ){

            visible++;
        }

    });

    return (
        visible >=
        Math.max(
            1,
            Math.ceil(total*0.55)
        )
    );
}


/* =====================================================
   DRAW BODY
===================================================== */

function drawBody(landmarks){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const visible =
        bodyIsVisible(landmarks);


    if(visible){

        positionReady =
            true;

        lostFrames =
            0;

    }else{

        lostFrames++;

        if(lostFrames >= 15){

            positionReady =
                false;
        }

    }


    const green =
        "#00ff66";

    const red =
        "#ff3030";

    const color =
        positionReady
            ? green
            : red;


    const parts =
        getParts(landmarks);


    parts.forEach(pair=>{

        drawLine(
            pair[0],
            pair[1],
            color
        );

        drawPoint(
            pair[0],
            color
        );

        drawPoint(
            pair[1],
            color
        );

    });


    if(positionReady){

        statusEl.textContent =
            "READY • MOVE";

        statusEl.style.color =
            green;

    }else{

        statusEl.textContent =
            "MOVE INTO CAMERA";

        statusEl.style.color =
            red;
    }
}


/* =====================================================
   ADD REP
===================================================== */

function addRep(){

    if(!positionReady)
        return;

    if(reps >= MAX_REPS)
        return;

    const now =
        Date.now();


    /*
       Stronger duplicate protection.
    */

    if(
        now-lastMovementTime <
        800
    ){

        return;
    }


    lastMovementTime =
        now;

    reps++;

    repEl.textContent =
        reps;

    statusEl.textContent =
        "REP " + reps;

    statusEl.style.color =
        "#00ff66";
}


/* =====================================================
   MOVEMENT DETECTION
===================================================== */

function detectMovement(l){

    const w = workout.toLowerCase().trim();

    /*
    ============================================================
    COMMON HELPERS
    ============================================================
    */

    const valid = p =>
        p &&
        typeof p.x === "number" &&
        typeof p.y === "number" &&
        (p.visibility === undefined ||
         p.visibility > 0.55);

    const required = arr =>
        arr.every(valid);

    const dist = (a,b) =>
        Math.hypot(
            a.x-b.x,
            a.y-b.y
        );

    const mid = (a,b) => ({
        x:(a.x+b.x)/2,
        y:(a.y+b.y)/2
    });

    const shoulder = mid(l[11],l[12]);
    const hip = mid(l[23],l[24]);
    const knee = mid(l[25],l[26]);
    const ankle = mid(l[27],l[28]);

    const leftElbow =
        angle(l[11],l[13],l[15]);

    const rightElbow =
        angle(l[12],l[14],l[16]);

    const elbow =
        Math.min(
            leftElbow,
            rightElbow
        );

    const leftKnee =
        angle(l[23],l[25],l[27]);

    const rightKnee =
        angle(l[24],l[26],l[28]);

    const kneeAngle =
        Math.min(
            leftKnee,
            rightKnee
        );

    const leftHip =
        angle(l[11],l[23],l[25]);

    const rightHip =
        angle(l[12],l[24],l[26]);

    /*
    ============================================================
    1. STRETCHING
    Down → Hands Up → Down = 1 REP
    ============================================================
    */

    if(w === "stretching"){

        if(!required([
            l[11],l[12],
            l[15],l[16],
            l[23],l[24],
            l[25],l[26],
            l[27],l[28]
        ])){

            state = "NOT_READY";
            movementStart = null;
            return;
        }

        const standing =
            hip.y - shoulder.y > 0.08 &&
            ankle.y - knee.y > 0.08;

        if(!standing){

            state = "NOT_READY";
            movementStart = null;
            return;
        }

        const handsDown =
            l[15].y > shoulder.y &&
            l[16].y > shoulder.y;

        const handsUp =
            l[15].y < shoulder.y - 0.12 &&
            l[16].y < shoulder.y - 0.12;

        if(state === "NOT_READY"){

            if(handsDown){
                state = "READY";
            }

            return;
        }

        if(state === "READY" && handsUp){

            state = "MOVE";
            movementStart = Date.now();

            return;
        }

        if(
            state === "MOVE" &&
            handsDown &&
            movementStart &&
            Date.now()-movementStart >= 400
        ){

            addRep();

            state = "READY";
            movementStart = null;
        }

        return;
    }


    /*
    ============================================================
    2. PUSH UP
    Up → Down → Up = 1 REP
    ============================================================
    */

    if(w === "push up"){

        if(!required([
            l[11],l[12],
            l[13],l[14],
            l[15],l[16],
            l[23],l[24],
            l[25],l[26]
        ])){

            state = "NOT_READY";
            movementStart = null;
            return;
        }

        const bodyStraight =
            Math.min(
                angle(l[11],l[23],l[25]),
                angle(l[12],l[24],l[26])
            ) > 145;

        if(!bodyStraight){

            state = "NOT_READY";
            return;
        }

        if(state === "NOT_READY"){

            if(elbow > 160){
                state = "READY";
            }

            return;
        }

        if(
            state === "READY" &&
            elbow < 125
        ){

            state = "MOVE";
            movementStart = Date.now();

            return;
        }

        if(
            state === "MOVE" &&
            elbow > 160 &&
            movementStart &&
            Date.now()-movementStart >= 300
        ){

            addRep();

            state = "READY";
            movementStart = null;
        }

        return;
    }


    /*
    ============================================================
    3. SQUAT
    Standing → Down → Standing = 1 REP
    ============================================================
    */

    if(w === "squat"){

        if(!required([
            l[11],l[12],
            l[23],l[24],
            l[25],l[26],
            l[27],l[28]
        ])){

            state = "NOT_READY";
            return;
        }

        if(state === "NOT_READY"){

            if(
                kneeAngle > 160 &&
                hip.y < knee.y
            ){

                state = "READY";
            }

            return;
        }

        if(
            state === "READY" &&
            kneeAngle < 115
        ){

            state = "MOVE";
            movementStart = Date.now();

            return;
        }

        if(
            state === "MOVE" &&
            kneeAngle > 155 &&
            movementStart &&
            Date.now()-movementStart >= 300
        ){

            addRep();

            state = "READY";
            movementStart = null;
        }

        return;
    }


    /*
    ============================================================
    4. HIGH KNEES
    Left knee + Right knee = 1 REP
    ============================================================
    */

    if(w === "high knees"){

        if(!required([
            l[23],l[24],
            l[25],l[26],
            l[27],l[28]
        ])){

            state = "NOT_READY";
            return;
        }

        const leftUp =
            l[25].y <
            l[23].y - 0.10;

        const rightUp =
            l[26].y <
            l[24].y - 0.10;

        if(state === "NOT_READY"){

            state = "READY";
            movementStart = null;
            return;
        }

        if(state === "READY" && leftUp){

            state = "MOVE_LEFT";
            return;
        }

        if(
            state === "MOVE_LEFT" &&
            rightUp
        ){

            state = "MOVE_RIGHT";
            movementStart = Date.now();

            return;
        }

        if(
            state === "MOVE_RIGHT" &&
            !leftUp &&
            !rightUp &&
            movementStart &&
            Date.now()-movementStart >= 200
        ){

            addRep();

            state = "READY";
            movementStart = null;
        }

        return;
    }


    /*
    ============================================================
    5. LUNGES
    Left → Right = 1 REP
    ============================================================
    */

    if(w === "lunges"){

        if(!required([
            l[23],l[24],
            l[25],l[26],
            l[27],l[28]
        ])){

            state = "NOT_READY";
            return;
        }

        const leftBent =
            leftKnee < 120;

        const rightBent =
            rightKnee < 120;

        if(state === "NOT_READY"){

            if(
                leftKnee > 155 &&
                rightKnee > 155
            ){

                state = "READY";
            }

            return;
        }

        if(
            state === "READY" &&
            leftBent
        ){

            state = "LEFT";
            movementStart = Date.now();

            return;
        }

        if(
            state === "LEFT" &&
            rightBent
        ){

            state = "RIGHT";

            return;
        }

        if(
            state === "RIGHT" &&
            leftKnee > 155 &&
            rightKnee > 155
        ){

            addRep();

            state = "READY";
            movementStart = null;
        }

        return;
    }


    /*
    ============================================================
    6. MOUNTAIN CLIMBER
    Left knee in + Right knee in = 1 REP
    ============================================================
    */

    if(w === "mountain climber"){

        if(!required([
            l[11],l[12],
            l[23],l[24],
            l[25],l[26]
        ])){

            state = "NOT_READY";
            return;
        }

        const plank =
            Math.min(
                leftHip,
                rightHip
            ) > 145;

        if(!plank){

            state = "NOT_READY";
            return;
        }

        const leftIn =
            l[25].x >
            l[23].x - 0.15;

        const rightIn =
            l[26].x <
            l[24].x + 0.15;

        if(state === "NOT_READY"){

            state = "READY";
            return;
        }

        if(
            state === "READY" &&
            leftIn
        ){

            state = "LEFT";
            return;
        }

        if(
            state === "LEFT" &&
            rightIn
        ){

            state = "RIGHT";
            movementStart = Date.now();

            return;
        }

        if(
            state === "RIGHT" &&
            !leftIn &&
            !rightIn
        ){

            addRep();

            state = "READY";
            movementStart = null;
        }

        return;
    }


    /*
    ============================================================
    7. JUMPING JACK
    Closed → Open → Closed = 1 REP
    ============================================================
    */

    if(w === "jumping jack"){

        if(!required([
            l[11],l[12],
            l[15],l[16],
            l[23],l[24],
            l[27],l[28]
        ])){

            state = "NOT_READY";
            return;
        }

        const handsDown =
            l[15].y > shoulder.y &&
            l[16].y > shoulder.y;

        const handsUp =
            l[15].y < shoulder.y - 0.10 &&
            l[16].y < shoulder.y - 0.10;

        const feetClosed =
            Math.abs(
                l[27].x-l[28].x
            ) < 0.12;

        const feetOpen =
            Math.abs(
                l[27].x-l[28].x
            ) > 0.25;

        if(state === "NOT_READY"){

            if(handsDown && feetClosed){
                state = "READY";
            }

            return;
        }

        if(
            state === "READY" &&
            handsUp &&
            feetOpen
        ){

            state = "MOVE";
            movementStart = Date.now();

            return;
        }

        if(
            state === "MOVE" &&
            handsDown &&
            feetClosed &&
            movementStart &&
            Date.now()-movementStart >= 250
        ){

            addRep();

            state = "READY";
            movementStart = null;
        }

        return;
    }


    /*
    ============================================================
    8. BURPEES
    Standing → Down → Up + Jump = 1 REP
    ============================================================
    */

    if(w === "burpees"){

        if(!required([
            l[11],l[12],
            l[23],l[24],
            l[25],l[26],
            l[27],l[28]
        ])){

            state = "NOT_READY";
            return;
        }

        const standing =
            kneeAngle > 155;

        const down =
            kneeAngle < 120;

        const jump =
            ankle.y <
            knee.y - 0.12;

        if(state === "NOT_READY"){

            if(standing){
                state = "READY";
            }

            return;
        }

        if(
            state === "READY" &&
            down
        ){

            state = "DOWN";
            movementStart = Date.now();

            return;
        }

        if(
            state === "DOWN" &&
            standing
        ){

            state = "UP";
            return;
        }

        if(
            state === "UP" &&
            jump &&
            movementStart &&
            Date.now()-movementStart >= 500
        ){

            addRep();

            state = "READY";
            movementStart = null;
        }

        return;
    }


    /*
    ============================================================
    9. PLANK
    Correct position → TIMER
    ============================================================
    */

    if(w === "plank"){

        if(!required([
            l[11],l[12],
            l[23],l[24],
            l[25],l[26],
            l[27],l[28]
        ])){

            state = "NOT_READY";
            return;
        }

        const bodyStraight =
            Math.min(
                angle(l[11],l[23],l[25]),
                angle(l[12],l[24],l[26])
            ) > 145;

        if(!bodyStraight){

            state = "NOT_READY";
            movementStart = null;

            return;
        }

        if(state === "NOT_READY"){

            state = "READY";
            movementStart = Date.now();

            return;
        }

        /*
        Existing rep system:
        every 1 second = 1 point
        */

        if(
            state === "READY" &&
            movementStart
        ){

            const seconds =
                Math.floor(
                    (Date.now()-movementStart)/1000
                );

            if(
                seconds > 0 &&
                seconds !== lastPlankSecond
            ){

                lastPlankSecond = seconds;

                addRep();
            }
        }

        return;
    }


    /*
    ============================================================
    10. COOL DOWN
    Hands down → arms up → down = 1 REP
    ============================================================
    */

    if(w === "cool down"){

        if(!required([
            l[11],l[12],
            l[15],l[16],
            l[23],l[24]
        ])){

            state = "NOT_READY";
            return;
        }

        const armsDown =
            l[15].y > shoulder.y &&
            l[16].y > shoulder.y;

        const armsUp =
            l[15].y <
                shoulder.y - 0.08 &&
            l[16].y <
                shoulder.y - 0.08;

        if(state === "NOT_READY"){

            if(armsDown){
                state = "READY";
            }

            return;
        }

        if(
            state === "READY" &&
            armsUp
        ){

            state = "MOVE";
            movementStart = Date.now();

            return;
        }

        if(
            state === "MOVE" &&
            armsDown &&
            movementStart &&
            Date.now()-movementStart >= 700
        ){

            addRep();

            state = "READY";
            movementStart = null;
        }

        return;
    }
}
/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onResults(results){

    if(!running)
        return;


    if(
        !results ||
        !results.poseLandmarks
    ){

        lostFrames++;

        if(lostFrames >= 15){

            positionReady =
                false;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            statusEl.textContent =
                "MOVE INTO CAMERA";

            statusEl.style.color =
                "#ff3030";
        }

        return;
    }


    const landmarks =
        results.poseLandmarks;


    drawBody(
        landmarks
    );


    if(positionReady){

        detectMovement(
            landmarks
        );
    }
}


/* =====================================================
   MEDIAPIPE SETUP
===================================================== */

function setupPose(){

    pose =
        new Pose({

            locateFile:(file)=>{

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" +
                    file
                );

            }

        });


    pose.setOptions({

        modelComplexity:1,

        smoothLandmarks:true,

        enableSegmentation:false,

        minDetectionConfidence:0.50,

        minTrackingConfidence:0.50

    });


    pose.onResults(
        onResults
    );
}


/* =====================================================
   CAMERA PROCESS LOOP
===================================================== */

async function processVideo(){

    if(!running)
        return;


    if(
        video.readyState >= 2 &&
        !processing
    ){

        processing =
            true;

        try{

            await pose.send({
                image:video
            });

        }

        catch(error){

            console.error(
                "Pose error:",
                error
            );

        }

        processing =
            false;
    }


    requestAnimationFrame(
        processVideo
    );
}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

    try{

        loading.style.display =
            "flex";


        setupPose();


        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{

                    facingMode:"user",

                    width:{
                        ideal:1080
                    },

                    height:{
                        ideal:1920
                    }

                },

                audio:false

            });


        video.srcObject =
            stream;


        await video.play();


        canvas.width =
            video.videoWidth ||
            1080;

        canvas.height =
            video.videoHeight ||
            1920;


        loading.style.display =
            "none";


        processVideo();

    }

    catch(error){

        console.error(
            "Camera error:",
            error
        );


        loading.innerHTML = `

            <div
                style="
                color:#ff3030;
                font-size:18px;
                text-align:center;
                "
            >
                Camera could not start
            </div>

            <div
                style="
                font-size:13px;
                color:#aaa;
                text-align:center;
                "
            >
                Allow camera permission
                and reload.
            </div>

        `;
    }
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    running =
        false;


    if(stream){

        stream
        .getTracks()
        .forEach(track=>{

            track.stop();

        });

        stream =
            null;
    }
}


/* =====================================================
   QUIT
===================================================== */

quitBtn.onclick = ()=>{

    /*
       QUIT = NO SAVE
    */

    stopCamera();

    location.href =
        "daily-task.html";
};


/* =====================================================
   FINISH
===================================================== */

finishBtn.onclick =
async ()=>{

    if(reps <= 0){

        alert(
            "Complete at least 1 rep."
        );

        return;
    }


    const user =
        auth.currentUser;


    if(!user){

        alert(
            "Please login before saving."
        );

        return;
    }


    finishBtn.disabled =
        true;


    try{

        const userRef =
            db
            .collection("users")
            .doc(user.uid);


        const snap =
            await userRef.get();


        const data =
            snap.exists
            ? snap.data()
            : {};


        const oldPoints =
            Number(
                data.totalPoints || 0
            );


        /*
           EXACT WORKOUT ORDER
        */

        const workoutOrder = [

            "Stretching",

            "Push Up",

            "Squat",

            "High Knees",

            "Lunges",

            "Mountain Climber",

            "Jumping Jack",

            "Burpees",

            "Plank",

            "Cool Down"

        ];


        /*
           Read existing completed workouts.
        */

        let completedTasks =
            Array.isArray(
                data.completedTasks
            )
            ? [...data.completedTasks]
            : [];


        /*
           Old version may have saved
           a number instead of an array.
           Convert old progress safely.
        */

        if(
            !Array.isArray(
                data.completedTasks
            ) &&
            Number(
                data.completedTasks || 0
            ) > 0
        ){

            const oldCount =
                Math.min(
                    workoutOrder.length,
                    Number(
                        data.completedTasks
                    )
                );


            completedTasks =
                Array.from(
                    {
                        length:oldCount
                    },
                    (_,i)=>i
                );
        }


        /*
           Find current workout index.
        */

        const workoutIndex =
            workoutOrder.findIndex(
                name =>
                    name.toLowerCase() ===
                    workout.toLowerCase()
            );


        /*
           Add current workout
           only once.
        */

        if(
            workoutIndex >= 0 &&
            !completedTasks.includes(
                workoutIndex
            )
        ){

            completedTasks.push(
                workoutIndex
            );

        }


        /*
           Keep array sorted.
        */

        completedTasks =
            [...new Set(
                completedTasks
            )].sort(
                (a,b)=>a-b
            );


        /*
           SAVE
        */

        await userRef.set({

            totalPoints:
                oldPoints + reps,

            completedTasks:
                completedTasks,

            lastWorkout:
                workout,

            lastWorkoutReps:
                reps,

            updatedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        },{

            merge:true

        });


        stopCamera();


        /*
           Return to Daily Task.
           Daily Task will automatically
           select the next incomplete workout.
        */

        location.href =
            "daily-task.html";

    }

    catch(error){

        console.error(
            "Save error:",
            error
        );


        alert(
            "Could not save workout. Please try again."
        );


        finishBtn.disabled =
            false;
    }

};


/* =====================================================
   NO LOGIN REDIRECT
===================================================== */

startCamera();

    ()=>{

        if(video.videoWidth){

            canvas.width =

            canvas.height =

        }

    }
);
