<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>FIT & GET - Camera</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050805;
    color:white;
    font-family:Poppins,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:480px;
    margin:auto;
    padding:14px;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.title{
    font-size:20px;
    font-weight:800;
    color:#9dff00;
}

.back{
    border:1px solid #7cff00;
    background:#101610;
    color:#9dff00;
    border-radius:10px;
    padding:7px 12px;
    font-weight:700;
}

.cameraBox{
    position:relative;
    width:100%;
    height:72vh;
    min-height:500px;
    max-height:720px;
    background:#000;
    border-radius:20px;
    overflow:hidden;
    border:2px solid #222;
}

#video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scaleX(-1);
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.repBox{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    min-width:125px;
    text-align:center;
    background:rgba(0,0,0,.72);
    border:2px solid #9dff00;
    border-radius:16px;
    padding:7px 18px;
    z-index:5;
    box-shadow:0 0 18px rgba(157,255,0,.25);
}

.repLabel{
    font-size:11px;
    color:#aaa;
    font-weight:700;
}

#repCount{
    font-size:42px;
    line-height:45px;
    font-weight:800;
    color:#9dff00;
}

.status{
    position:absolute;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    width:88%;
    text-align:center;
    padding:10px;
    border-radius:13px;
    background:rgba(0,0,0,.75);
    font-size:14px;
    font-weight:700;
    z-index:5;
}

.status.red{
    border:2px solid #ff3030;
    color:#ff5050;
}

.status.green{
    border:2px solid #00ff66;
    color:#00ff66;
}

.status.yellow{
    border:2px solid #ffd000;
    color:#ffd000;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:14px;
}

button{
    flex:1;
    border:none;
    border-radius:13px;
    padding:13px 10px;
    font-family:Poppins,sans-serif;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
}

.start{
    background:#9dff00;
    color:#061000;
}

.quit{
    background:#241010;
    border:1px solid #ff3030;
    color:#ff5050;
}

.finish{
    background:#071e10;
    border:1px solid #00ff66;
    color:#00ff66;
}

.info{
    margin-top:12px;
    padding:12px;
    background:#0c110c;
    border-radius:13px;
    border:1px solid #202820;
    font-size:12px;
    color:#aaa;
    text-align:center;
}

#workoutName{
    color:#9dff00;
    font-weight:800;
}

.hidden{
    display:none!important;
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <div class="title">FIT & GET</div>
        <button class="back" onclick="goBack()">← Back</button>
    </div>

    <div class="cameraBox">

        <video id="video" autoplay playsinline></video>

        <canvas id="canvas"></canvas>

        <div class="repBox">
            <div class="repLabel">REP</div>
            <div id="repCount">0</div>
        </div>

        <div id="status" class="status red">
            Press START
        </div>

    </div>

    <div class="controls">
        <button class="start" onclick="startAI()">START</button>
        <button class="quit" onclick="quitWorkout()">QUIT</button>
        <button class="finish" onclick="finishWorkout()">FINISH</button>
    </div>

    <div class="info">
        Workout:
        <span id="workoutName">Loading...</span>
    </div>

</div>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey:"AIzaSyBOuzSm82-dlDXsmrwX1yWQVre0YD60cWM",
    authDomain:"fitandget-b3461.firebaseapp.com",
    projectId:"fitandget-b3461",
    storageBucket:"fitandget-b3461.firebasestorage.app",
    messagingSenderId:"216178533513",
    appId:"1:216178533513:web:975f20599c7e77b9d01258"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* =========================
   ELEMENTS
========================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const repCountEl = document.getElementById("repCount");
const statusEl = document.getElementById("status");
const workoutNameEl = document.getElementById("workoutName");


/* =========================
   WORKOUT
========================= */

let params = new URLSearchParams(location.search);

let workout =
    params.get("workout") ||
    params.get("task") ||
    localStorage.getItem("selectedWorkout") ||
    "Push Up";

workout = decodeURIComponent(workout);

workoutNameEl.textContent = workout;


/* =========================
   VARIABLES
========================= */

let camera = null;
let cameraStarted = false;

let repCount = 0;

let phase = "up";

let ready = false;

let frameDown = 0;
let frameUp = 0;

let timer = null;
let seconds = 0;

let user = null;


/* =========================
   FIREBASE USER
========================= */

firebase.auth().onAuthStateChanged(u => {
    user = u;
});


/* =========================
   CANVAS
========================= */

function resizeCanvas(){

    const rect = canvas.getBoundingClientRect();

    canvas.width = rect.width;
    canvas.height = rect.height;
}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();


/* =========================
   STATUS
========================= */

function setStatus(text,type){

    statusEl.textContent = text;

    statusEl.className = "status " + type;
}


/* =========================
   VISIBILITY
========================= */

function visible(lm,index){

    if(!lm[index]) return false;

    if(lm[index].visibility === undefined){
        return true;
    }

    return lm[index].visibility > 0.20;
}


/* =========================
   BEST SIDE
========================= */

function sideScore(lm,ids){

    let score = 0;
    let count = 0;

    ids.forEach(i => {

        if(lm[i]){

            score +=
                lm[i].visibility === undefined
                ? 1
                : lm[i].visibility;

            count++;
        }
    });

    return count ? score / count : 0;
}


/* =========================
   BEST PUSH-UP SIDE
========================= */

function getPushSide(lm){

    const left = sideScore(lm,[11,13,15]);
    const right = sideScore(lm,[12,14,16]);

    return left >= right ? "left" : "right";
}


/* =========================
   BEST SQUAT SIDE
========================= */

function getSquatSide(lm){

    const left = sideScore(lm,[23,25,27]);
    const right = sideScore(lm,[24,26,28]);

    return left >= right ? "left" : "right";
}


/* =========================
   ANGLE
========================= */

function angle(a,b,c){

    if(!a || !b || !c) return 180;

    const abx = a.x-b.x;
    const aby = a.y-b.y;

    const cbx = c.x-b.x;
    const cby = c.y-b.y;

    const dot =
        abx*cbx +
        aby*cby;

    const mag1 =
        Math.sqrt(abx*abx + aby*aby);

    const mag2 =
        Math.sqrt(cbx*cbx + cby*cby);

    if(!mag1 || !mag2) return 180;

    let value =
        dot/(mag1*mag2);

    value =
        Math.max(-1,Math.min(1,value));

    return Math.acos(value)*180/Math.PI;
}


/* =========================
   COORDINATE MAPPING
   object-fit: cover
========================= */

function mapPoint(p){

    const cw = canvas.width;
    const ch = canvas.height;

    const vw = video.videoWidth || 720;
    const vh = video.videoHeight || 1280;

    const scale =
        Math.max(cw/vw,ch/vh);

    const renderW = vw*scale;
    const renderH = vh*scale;

    const cropX = (renderW-cw)/2;
    const cropY = (renderH-ch)/2;

    let x = p.x*renderW-cropX;

    /*
      Video is mirrored visually,
      so mirror landmark X.
    */
    x = cw-x;

    let y = p.y*renderH-cropY;

    x = Math.max(0,Math.min(cw,x));
    y = Math.max(0,Math.min(ch,y));

    return {x,y};
}


/* =========================
   SAFE DRAW LINE
========================= */

function drawLine(a,b,color,width=4){

    if(!a || !b) return;

    ctx.beginPath();

    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);

    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.lineCap="round";

    ctx.stroke();
}


/* =========================
   DRAW POINT
========================= */

function drawPoint(p,color,size=6){

    if(!p) return;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        size,
        0,
        Math.PI*2
    );

    ctx.fillStyle=color;
    ctx.fill();
}


/* =========================
   PUSH-UP DRAW
========================= */

function drawPushUp(lm,color){

    const side = getPushSide(lm);

    let s,e,w;

    if(side==="left"){

        s = visible(lm,11) ? mapPoint(lm[11]) : null;
        e = visible(lm,13) ? mapPoint(lm[13]) : null;
        w = visible(lm,15) ? mapPoint(lm[15]) : null;

    }else{

        s = visible(lm,12) ? mapPoint(lm[12]) : null;
        e = visible(lm,14) ? mapPoint(lm[14]) : null;
        w = visible(lm,16) ? mapPoint(lm[16]) : null;
    }

    drawLine(s,e,color,5);
    drawLine(e,w,color,5);

    drawPoint(s,color,8);
    drawPoint(e,color,8);
    drawPoint(w,color,8);
}


/* =========================
   SQUAT DRAW
========================= */

function drawSquat(lm,color){

    const side = getSquatSide(lm);

    let h,k,a;

    if(side==="left"){

        h = visible(lm,23) ? mapPoint(lm[23]) : null;
        k = visible(lm,25) ? mapPoint(lm[25]) : null;
        a = visible(lm,27) ? mapPoint(lm[27]) : null;

    }else{

        h = visible(lm,24) ? mapPoint(lm[24]) : null;
        k = visible(lm,26) ? mapPoint(lm[26]) : null;
        a = visible(lm,28) ? mapPoint(lm[28]) : null;
    }

    drawLine(h,k,color,5);
    drawLine(k,a,color,5);

    drawPoint(h,color,8);
    drawPoint(k,color,8);
    drawPoint(a,color,8);
}


/* =========================
   PUSH-UP DETECTION
========================= */

function detectPushUp(lm){

    const side = getPushSide(lm);

    let shoulder,elbow,wrist;

    if(side==="left"){

        shoulder=lm[11];
        elbow=lm[13];
        wrist=lm[15];

    }else{

        shoulder=lm[12];
        elbow=lm[14];
        wrist=lm[16];
    }

    if(
        !shoulder ||
        !elbow ||
        !wrist
    ){
        ready=false;
        setStatus("Show your upper body","red");
        return;
    }

    /*
      Easy readiness.
      No exact body position required.
    */

    ready=true;

    const elbowAngle =
        angle(
            shoulder,
            elbow,
            wrist
        );

    if(
        elbowAngle < 115
    ){

        frameDown++;

        frameUp=0;

        setStatus(
            "DOWN ↓",
            "green"
        );

        if(
            phase==="up" &&
            frameDown>=2
        ){

            phase="down";
            frameDown=0;
        }

    }else if(
        elbowAngle > 150
    ){

        frameUp++;

        frameDown=0;

        setStatus(
            "UP ↑",
            "green"
        );

        if(
            phase==="down" &&
            frameUp>=2
        ){

            repCount++;

            updateRep();

            phase="up";

            frameUp=0;
        }

    }else{

        frameDown=0;
        frameUp=0;

        setStatus(
            "READY",
            "green"
        );
    }
}


/* =========================
   SQUAT DETECTION
========================= */

function detectSquat(lm){

    const side = getSquatSide(lm);

    let hip,knee,ankle;

    if(side==="left"){

        hip=lm[23];
        knee=lm[25];
        ankle=lm[27];

    }else{

        hip=lm[24];
        knee=lm[26];
        ankle=lm[28];
    }

    if(
        !hip ||
        !knee ||
        !ankle
    ){

        ready=false;

        setStatus(
            "Show your legs",
            "red"
        );

        return;
    }

    ready=true;

    const kneeAngle =
        angle(
            hip,
            knee,
            ankle
        );

    if(
        kneeAngle < 120
    ){

        frameDown++;

        frameUp=0;

        setStatus(
            "DOWN ↓",
            "green"
        );

        if(
            phase==="up" &&
            frameDown>=2
        ){

            phase="down";

            frameDown=0;
        }

    }else if(
        kneeAngle > 150
    ){

        frameUp++;

        frameDown=0;

        setStatus(
            "UP ↑",
            "green"
        );

        if(
            phase==="down" &&
            frameUp>=2
        ){

            repCount++;

            updateRep();

            phase="up";

            frameUp=0;
        }

    }else{

        frameDown=0;
        frameUp=0;

        setStatus(
            "READY",
            "green"
        );
    }
}


/* =========================
   REP UI
========================= */

function updateRep(){

    if(repCount>50){

        repCount=50;
    }

    repCountEl.textContent=repCount;

    if(repCount>=50){

        setStatus(
            "MAX 50 REPS",
            "green"
        );
    }
}


/* =========================
   MEDIAPIPE RESULTS
========================= */

function onPoseResults(results){

    resizeCanvas();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(!results.poseLandmarks){

        ready=false;

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }

    const lm =
        results.poseLandmarks;


    /* =====================
       PUSH UP
    ===================== */

    if(
        workout.toLowerCase().includes("push")
    ){

        const side=getPushSide(lm);

        const hasBody =
            side==="left"
            ? (
                visible(lm,11) ||
                visible(lm,13) ||
                visible(lm,15)
              )
            : (
                visible(lm,12) ||
                visible(lm,14) ||
                visible(lm,16)
              );

        if(!hasBody){

            setStatus(
                "Show your upper body",
                "red"
            );

        }else{

            /*
              Red first.
              Detection changes it to green
              once useful joints are visible.
            */

            let enough =
                side==="left"
                ? (
                    visible(lm,11) &&
                    visible(lm,13) &&
                    visible(lm,15)
                  )
                : (
                    visible(lm,12) &&
                    visible(lm,14) &&
                    visible(lm,16)
                  );

            if(enough){

                drawPushUp(
                    lm,
                    "#00ff66"
                );

                detectPushUp(lm);

            }else{

                drawPushUp(
                    lm,
                    "#ff3030"
                );

                ready=false;

                setStatus(
                    "Move your arm into view",
                    "red"
                );
            }
        }
    }


    /* =====================
       SQUAT
    ===================== */

    else if(
        workout.toLowerCase().includes("squat")
    ){

        const side=getSquatSide(lm);

        const enough =
            side==="left"
            ? (
                visible(lm,23) &&
                visible(lm,25) &&
                visible(lm,27)
              )
            : (
                visible(lm,24) &&
                visible(lm,26) &&
                visible(lm,28)
              );

        if(enough){

            drawSquat(
                lm,
                "#00ff66"
            );

            detectSquat(lm);

        }else{

            drawSquat(
                lm,
                "#ff3030"
            );

            ready=false;

            setStatus(
                "Move your legs into view",
                "red"
            );
        }
    }

    else{

        setStatus(
            "Push Up / Squat only",
            "red"
        );
    }
}


/* =========================
   START CAMERA AI
========================= */

async function startAI(){

    if(cameraStarted) return;

    try{

        setStatus(
            "Starting Camera...",
            "yellow"
        );

        cameraStarted=true;

        await camera.start();

        setStatus(
            "Move into camera view",
            "red"
        );

        startTimer();

    }catch(error){

        console.error(error);

        cameraStarted=false;

        setStatus(
            "Camera permission needed",
            "red"
        );
    }
}


/* =========================
   CAMERA
========================= */

const camera =
    new Camera(
        video,
        {
            onFrame:async()=>{

                if(!cameraStarted) return;

                try{

                    await pose.send({
                        image:video
                    });

                }catch(error){

                    console.error(error);
                }
            },

            width:720,
            height:1280
        }
    );


/* =========================
   MEDIAPIPE POSE
========================= */

const pose =
    new Pose({
        locateFile:(file)=>{
            return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file;
        }
    });


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    smoothSegmentation:false,

    minDetectionConfidence:.45,

    minTrackingConfidence:.45
});


pose.onResults(
    onPoseResults
);


/* =========================
   TIMER
========================= */

function startTimer(){

    clearInterval(timer);

    timer=setInterval(()=>{

        if(cameraStarted){

            seconds++;
        }

    },1000);
}


/* =========================
   STOP CAMERA
========================= */

function stopCamera(){

    cameraStarted=false;

    clearInterval(timer);

    try{
        camera.stop();
    }catch(e){}

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================
   QUIT
   NO SAVE
========================= */

function quitWorkout(){

    stopCamera();

    /*
      Important:
      Quit = NO RC
      Quit = NO completed task
      Quit = NO rep save
    */

    window.location.href="daily-task.html";
}


/* =========================
   FINISH
========================= */

async function finishWorkout(){

    if(!user){

        alert("Please login first.");

        return;
    }

    if(repCount<=0){

        alert("Complete at least 1 rep.");

        return;
    }

    if(repCount>50){

        repCount=50;
    }

    stopCamera();

    try{

        const ref =
            db.collection("users")
              .doc(user.uid);

        const snap =
            await ref.get();

        let data =
            snap.exists
            ? snap.data()
            : {};

        let oldPoints =
            Number(data.totalPoints || 0);

        let completedTasks =
            Array.isArray(data.completedTasks)
            ? data.completedTasks
            : [];

        const taskName =
            workout;

        /*
          Prevent duplicate completion
          for same task.
        */

        if(
            completedTasks.includes(taskName)
        ){

            alert(
                "This workout is already completed today."
            );

            window.location.href="daily-task.html";

            return;
        }

        completedTasks.push(taskName);

        await ref.set({

            totalPoints:
                oldPoints + repCount,

            completedTasks:
                completedTasks

        },{
            merge:true
        });

        alert(
            "Workout completed!\n+" +
            repCount +
            " RC"
        );

        window.location.href=
            "daily-task.html";

    }catch(error){

        console.error(error);

        alert(
            "Could not save workout."
        );
    }
}


/* =========================
   BACK
========================= */

function goBack(){

    stopCamera();

    window.location.href=
        "daily-task.html";
}


/* =========================
   INITIAL
========================= */

setStatus(
    "Press START",
    "red"
);

</script>

</body>
</html>
