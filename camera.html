<script>

/* =====================================================

const firebaseConfig = {

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();


/* =====================================================
   WORKOUTS
===================================================== */

const workouts = [

    "Stretching",
    "Push Up",
    "Squat",
    "High Knees",
    "Lunges",
    "Mountain Climber",
    "Jumping Jack",
    "Burpees",
    "Plank",
    "Cool Down"

];


const params =
    new URLSearchParams(
        window.location.search
    );


let workoutIndex =
    parseInt(
        params.get("workout"),

    );


if(
    isNaN(workoutIndex) ||

    workoutIndex >= workouts.length
){

}


document.getElementById(
    "exerciseName"
).textContent =

/* =====================================================
   VARIABLES
===================================================== */

let repCount = 0;

let currentUser = null;

let completedTasks = [];

let saving = false;

let cameraStarted = false;

let pose = null;

let camera = null;

let timerInterval = null;

let elapsedSeconds = 0;


/* workout stages */

let pushStage = 0;

let squatStage = 0;

let jackStage = 0;

let lungeStage = 0;

let kneeStage = 0;

let mountainStage = 0;

let burpeeStage = 0;

let stretchStage = 0;

let cooldownStage = 0;

let plankStart = 0;

let plankCounted = false;


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("camera");

const poseCanvas =
    document.getElementById("poseCanvas");

const poseCtx =
    poseCanvas.getContext("2d");

const repDisplay =
    document.getElementById("repCount");

const finishBtn =
    document.getElementById("finishBtn");

const quitBtn =
    document.getElementById("quitBtn");

const aiStatus =
    document.getElementById("aiStatus");

const aiBox =
    document.getElementById("aiBox");

const aiDot =
    document.getElementById("aiDot");

const timeDisplay =
    document.getElementById("time");


/* =====================================================
   AI STATUS
===================================================== */

function setAIStatus(
    message,
    type = "good"
){

    aiStatus.textContent =
        message;


    let color =
        "#00ff66";


    if(type === "bad"){
        color = "#ff3b30";
    }


    if(type === "warn"){
        color = "#ffd60a";
    }


    aiBox.style.borderColor =
        color;

    aiStatus.style.color =
        color;

    aiDot.style.background =
        color;

    aiDot.style.boxShadow =
        "0 0 14px " + color;
}


/* =====================================================
   LANDMARK HELPERS
===================================================== */

function visible(p){

    return p &&
        (
            p.visibility === undefined ||
            p.visibility > 0.45
        );
}


function point(lm,index){

    return lm[index];
}


function calculateAngle(a,b,c){

    const radians =
        Math.atan2(
            c.y - b.y,
            c.x - b.x
        )
        -
        Math.atan2(
            a.y - b.y,
            a.x - b.x
        );


    let angle =
        Math.abs(
            radians * 180 / Math.PI
        );


    if(angle > 180){
        angle = 360 - angle;
    }


    return angle;
}


/* =====================================================
   ADD REP
===================================================== */

function addRep(){

    if(repCount >= 50){

        setAIStatus(
            "MAX 50 REPS",
            "warn"
        );

        return;
    }


    repCount++;

    repDisplay.textContent =
        repCount;


    finishBtn.disabled =
        false;


    setAIStatus(
        `REP ${repCount} ✓`
    );
}


/* =====================================================
   DRAW POSE
===================================================== */

const POSE_CONNECTIONS = [

    [11,12],

    [11,13],
    [13,15],

    [12,14],
    [14,16],

    [11,23],
    [12,24],

    [23,24],

    [23,25],
    [25,27],

    [24,26],
    [26,28]

];


function resizeCanvas(){

    const rect =
        video.getBoundingClientRect();


    if(
        rect.width <= 0 ||
        rect.height <= 0
    ){

        return;
    }


    const ratio =
        window.devicePixelRatio || 1;


    poseCanvas.width =
        Math.round(
            rect.width * ratio
        );

    poseCanvas.height =
        Math.round(
            rect.height * ratio
        );


    poseCanvas.style.width =
        rect.width + "px";

    poseCanvas.style.height =
        rect.height + "px";


    poseCtx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );
}


function drawPose(landmarks){

    const width =
        poseCanvas.clientWidth;

    const height =
        poseCanvas.clientHeight;


    if(
        !width ||
        !height
    ){

        return;
    }


    poseCtx.clearRect(
        0,
        0,
        width,
        height
    );


    poseCtx.strokeStyle =
        "#00ff66";

    poseCtx.fillStyle =
        "#00ff66";

    poseCtx.lineWidth =
        4;

    poseCtx.lineCap =
        "round";


    /*
       IMPORTANT:
       Video uses object-fit:contain.
       So skeleton must use the same visible
       video rectangle.
    */

    const videoWidth =
        video.videoWidth || 720;

    const videoHeight =
        video.videoHeight || 1280;


    const videoAspect =
        videoWidth / videoHeight;

    const screenAspect =
        width / height;


    let displayWidth =
        width;

    let displayHeight =
        height;

    let offsetX = 0;

    let offsetY = 0;


    if(videoAspect > screenAspect){

        displayHeight =
            width / videoAspect;

        offsetY =
            (height - displayHeight) / 2;

    }else{

        displayWidth =
            height * videoAspect;

        offsetX =
            (width - displayWidth) / 2;
    }


    function mapPoint(p){

        return {

            x:
                offsetX +
                p.x * displayWidth,

            y:
                offsetY +
                p.y * displayHeight
        };
    }


    POSE_CONNECTIONS.forEach(
        connection => {

            const a =
                landmarks[
                    connection[0]
                ];

            const b =
                landmarks[
                    connection[1]
                ];


            if(
                visible(a) &&
                visible(b)
            ){

                const pa =
                    mapPoint(a);

                const pb =
                    mapPoint(b);


                poseCtx.beginPath();

                poseCtx.moveTo(
                    pa.x,
                    pa.y
                );

                poseCtx.lineTo(
                    pb.x,
                    pb.y
                );

                poseCtx.stroke();
            }
        }
    );


    landmarks.forEach(p => {

        if(!visible(p)){
            return;
        }


        const mapped =
            mapPoint(p);


        poseCtx.beginPath();

        poseCtx.arc(
            mapped.x,
            mapped.y,
            4,
            0,
            Math.PI * 2
        );

        poseCtx.fill();

    });
}


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(
    async user => {

        if(!user){

            window.location.href =
                "index.html";

            return;
        }


        currentUser =
            user;


        try{

            const snap =
                await db
                    .collection("users")
                    .doc(user.uid)
                    .get();


            if(snap.exists){

                const data =
                    snap.data();


                completedTasks =
                    Array.isArray(
                        data.completedTasks
                    )
                    ? data.completedTasks
                    : [];
            }


        }catch(error){

            console.error(
                "User data error:",
                error
            );
        }


        startAI();

    }
);


/* =====================================================
   START AI
===================================================== */

async function startAI(){

    if(cameraStarted){
        return;
    }


    setAIStatus(
        "Starting camera..."
    );


    try{

        pose =
            new Pose({

                locateFile:
                    file =>
                        `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`

            });


        pose.setOptions({

            modelComplexity: 1,

            smoothLandmarks: true,

            enableSegmentation: false,

            smoothSegmentation: false,

            minDetectionConfidence: 0.5,

            minTrackingConfidence: 0.5

        });


        pose.onResults(
            onPoseResults
        );


        camera =
            new Camera(
                video,
                {

                    onFrame:
                        async () => {

                            await pose.send({
                                image: video
                            });

                        },

                    width:720,

                    height:1280

                }
            );


        await camera.start();


        cameraStarted =
            true;


        resizeCanvas();


        setAIStatus(
            "AI Ready ✓"
        );


        startTimer();


    }catch(error){

        console.error(
            "AI error:",
            error
        );


        setAIStatus(
            "Camera / AI failed",
            "bad"
        );


        alert(
            "Camera start aagala. Camera permission allow pannunga."
        );
    }
}


/* =====================================================
   POSE RESULTS
===================================================== */

function onPoseResults(results){

    if(
        !results ||
        !results.poseLandmarks
    ){

        setAIStatus(
            "Move into camera view...",
            "warn"
        );

        return;
    }


    drawPose(
        results.poseLandmarks
    );


    switch(workoutIndex){

        case 0:
            detectStretching(
                results.poseLandmarks
            );
            break;


        case 1:
            detectPushUp(
                results.poseLandmarks
            );
            break;


        case 2:
            detectSquat(
                results.poseLandmarks
            );
            break;


        case 3:
            detectHighKnees(
                results.poseLandmarks
            );
            break;


        case 4:
            detectLunges(
                results.poseLandmarks
            );
            break;


        case 5:
            detectMountainClimber(
                results.poseLandmarks
            );
            break;


        case 6:
            detectJumpingJack(
                results.poseLandmarks
            );
            break;


        case 7:
            detectBurpees(
                results.poseLandmarks
            );
            break;


        case 8:
            detectPlank(
                results.poseLandmarks
            );
            break;


        case 9:
            detectCoolDown(
                results.poseLandmarks
            );
            break;
    }
}


/* =====================================================
   1. STRETCHING
===================================================== */

function detectStretching(lm){

    const ls = point(lm,11);
    const rs = point(lm,12);

    const lw = point(lm,15);
    const rw = point(lm,16);


    if(
        !visible(ls) ||
        !visible(rs) ||
        !visible(lw) ||
        !visible(rw)
    ){

        setAIStatus(
            "Show upper body...",
            "warn"
        );

        return;
    }


    const handsUp =
        lw.y < ls.y &&
        rw.y < rs.y;


    if(handsUp){

        if(stretchStage === 0){

            stretchStage = 1;

            addRep();
        }

        setAIStatus(
            "Stretch ✓"
        );

    }else{

        stretchStage = 0;

        setAIStatus(
            "Raise both hands..."
        );
    }
}


/* =====================================================
   2. PUSH UP
===================================================== */

function detectPushUp(lm){

    const ls = point(lm,11);
    const le = point(lm,13);
    const lw = point(lm,15);

    const rs = point(lm,12);
    const re = point(lm,14);
    const rw = point(lm,16);


    if(
        !visible(ls) ||
        !visible(le) ||
        !visible(lw) ||
        !visible(rs) ||
        !visible(re) ||
        !visible(rw)
    ){

        setAIStatus(
            "Show arms clearly...",
            "warn"
        );

        return;
    }


    const leftAngle =
        calculateAngle(
            ls,
            le,
            lw
        );


    const rightAngle =
        calculateAngle(
            rs,
            re,
            rw
        );


    const angle =
        (leftAngle + rightAngle) / 2;


    if(angle < 100){

        pushStage = 1;

        setAIStatus(
            "Push Up — DOWN"
        );
    }


    if(
        angle > 155 &&
        pushStage === 1
    ){

        pushStage = 0;

        addRep();

        setAIStatus(
            "Push Up ✓"
        );
    }
}


/* =====================================================
   3. SQUAT
===================================================== */

function detectSquat(lm){

    const lh = point(lm,23);
    const lk = point(lm,25);
    const la = point(lm,27);

    const rh = point(lm,24);
    const rk = point(lm,26);
    const ra = point(lm,28);


    if(
        !visible(lh) ||
        !visible(lk) ||
        !visible(la) ||
        !visible(rh) ||
        !visible(rk) ||
        !visible(ra)
    ){

        setAIStatus(
            "Show full legs...",
            "warn"
        );

        return;
    }


    const leftAngle =
        calculateAngle(
            lh,
            lk,
            la
        );


    const rightAngle =
        calculateAngle(
            rh,
            rk,
            ra
        );


    const angle =
        (leftAngle + rightAngle) / 2;


    if(angle < 105){

        squatStage = 1;

        setAIStatus(
            "Squat — DOWN"
        );
    }


    if(
        angle > 160 &&
        squatStage === 1
    ){

        squatStage = 0;

        addRep();

        setAIStatus(
            "Squat ✓"
        );
    }
}


/* =====================================================
   4. HIGH KNEES
===================================================== */

function detectHighKnees(lm){

    const lh = point(lm,23);
    const rh = point(lm,24);

    const lk = point(lm,25);
    const rk = point(lm,26);


    if(
        !visible(lh) ||
        !visible(rh) ||
        !visible(lk) ||
        !visible(rk)
    ){

        setAIStatus(
            "Show full body...",
            "warn"
        );

        return;
    }


    const leftUp =
        lk.y < lh.y + 0.08;

    const rightUp =
        rk.y < rh.y + 0.08;


    if(leftUp && kneeStage === 0){

        kneeStage = 1;

        addRep();

        setAIStatus(
            "Left Knee ✓"
        );
    }


    if(
        rightUp &&
        kneeStage === 1
    ){

        kneeStage = 2;

        addRep();

        setAIStatus(
            "Right Knee ✓"
        );
    }


    if(
        !leftUp &&
        !rightUp
    ){

        kneeStage = 0;

        setAIStatus(
            "High Knees..."
        );
    }
}


/* =====================================================
   5. LUNGES
===================================================== */

function detectLunges(lm){

    const lh = point(lm,23);
    const lk = point(lm,25);
    const la = point(lm,27);

    const rh = point(lm,24);
    const rk = point(lm,26);
    const ra = point(lm,28);


    if(
        !visible(lh) ||
        !visible(lk) ||
        !visible(la) ||
        !visible(rh) ||
        !visible(rk) ||
        !visible(ra)
    ){

        setAIStatus(
            "Show full legs...",
            "warn"
        );

        return;
    }


    const leftAngle =
        calculateAngle(
            lh,
            lk,
            la
        );


    const rightAngle =
        calculateAngle(
            rh,
            rk,
            ra
        );


    const angle =
        Math.min(
            leftAngle,
            rightAngle
        );


    if(angle < 105){

        lungeStage = 1;

        setAIStatus(
            "Lunge — DOWN"
        );
    }


    if(
        angle > 155 &&
        lungeStage === 1
    ){

        lungeStage = 0;

        addRep();

        setAIStatus(
            "Lunge ✓"
        );
    }
}


/* =====================================================
   6. MOUNTAIN CLIMBER
===================================================== */

function detectMountainClimber(lm){

    const ls = point(lm,11);
    const rs = point(lm,12);

    const lh = point(lm,23);
    const rh = point(lm,24);

    const lk = point(lm,25);
    const rk = point(lm,26);


    if(
        !visible(ls) ||
        !visible(rs) ||
        !visible(lh) ||
        !visible(rh) ||
        !visible(lk) ||
        !visible(rk)
    ){

        setAIStatus(
            "Show full body...",
            "warn"
        );

        return;
    }


    const leftNear =
        lk.y < lh.y + 0.10;

    const rightNear =
        rk.y < rh.y + 0.10;


    if(
        leftNear &&
        mountainStage === 0
    ){

        mountainStage = 1;

        addRep();

        setAIStatus(
            "Mountain Climber ✓"
        );
    }


    if(
        rightNear &&
        mountainStage === 1
    ){

        mountainStage = 2;

        addRep();

        setAIStatus(
            "Mountain Climber ✓"
        );
    }


    if(
        !leftNear &&
        !rightNear
    ){

        mountainStage = 0;

        setAIStatus(
            "Mountain Climbers..."
        );
    }
}


/* =====================================================
   7. JUMPING JACK
===================================================== */

function detectJumpingJack(lm){

    const ls = point(lm,11);
    const rs = point(lm,12);

    const lw = point(lm,15);
    const rw = point(lm,16);

    const la = point(lm,27);
    const ra = point(lm,28);


    if(
        !visible(ls) ||
        !visible(rs) ||
        !visible(lw) ||
        !visible(rw) ||
        !visible(la) ||
        !visible(ra)
    ){

        setAIStatus(
            "Show full body...",
            "warn"
        );

        return;
    }


    const handsUp =
        lw.y < ls.y &&
        rw.y < rs.y;


    const feetApart =
        Math.abs(
            la.x - ra.x
        ) > 0.18;


    if(
        handsUp &&
        feetApart
    ){

        jackStage = 1;

        setAIStatus(
            "Jack — OPEN"
        );
    }


    if(
        !handsUp &&
        !feetApart &&
        jackStage === 1
    ){

        jackStage = 0;

        addRep();

        setAIStatus(
            "Jumping Jack ✓"
        );
    }
}


/* =====================================================
   8. BURPEES
===================================================== */

function detectBurpees(lm){

    const ls = point(lm,11);
    const rs = point(lm,12);

    const lh = point(lm,23);
    const rh = point(lm,24);

    const lk = point(lm,25);
    const rk = point(lm,26);


    if(
        !visible(ls) ||
        !visible(rs) ||
        !visible(lh) ||
        !visible(rh) ||
        !visible(lk) ||
        !visible(rk)
    ){

        setAIStatus(
            "Show full body...",
            "warn"
        );

        return;
    }


    const shoulderY =
        (ls.y + rs.y) / 2;

    const hipY =
        (lh.y + rh.y) / 2;

    const kneeY =
        (lk.y + rk.y) / 2;


    const down =
        hipY >
        shoulderY + 0.12;


    const standing =
        hipY < kneeY &&
        shoulderY < kneeY;


    if(down){

        burpeeStage = 1;

        setAIStatus(
            "Burpee — DOWN"
        );
    }


    if(
        standing &&
        burpeeStage === 1
    ){

        burpeeStage = 0;

        addRep();

        setAIStatus(
            "Burpee ✓"
        );
    }
}


/* =====================================================
   9. PLANK
===================================================== */

function detectPlank(lm){

    const ls = point(lm,11);
    const rs = point(lm,12);

    const lh = point(lm,23);
    const rh = point(lm,24);

    const la = point(lm,27);
    const ra = point(lm,28);


    if(
        !visible(ls) ||
        !visible(rs) ||
        !visible(lh) ||
        !visible(rh) ||
        !visible(la) ||
        !visible(ra)
    ){

        setAIStatus(
            "Show full body...",
            "warn"
        );

        return;
    }


    const shoulderY =
        (ls.y + rs.y) / 2;

    const hipY =
        (lh.y + rh.y) / 2;

    const ankleY =
        (la.y + ra.y) / 2;


    const bodyLine =
        Math.abs(
            hipY -
            (
                (shoulderY + ankleY) / 2
            )
        );


    const plankPosition =
        bodyLine < 0.15;


    if(plankPosition){

        if(!plankStart){

            plankStart =
                Date.now();

            setAIStatus(
                "Plank started..."
            );
        }


        const seconds =
            Math.floor(
                (
                    Date.now() -
                    plankStart
                ) / 1000
            );


        if(
            seconds >= 10 &&
            !plankCounted
        ){

            plankCounted = true;

            addRep();

            setAIStatus(
                "Plank 10s ✓"
            );
        }

    }else{

        plankStart = 0;

        plankCounted = false;

        setAIStatus(
            "Hold plank position..."
        );
    }
}


/* =====================================================
   10. COOL DOWN
===================================================== */

function detectCoolDown(lm){

    const ls = point(lm,11);
    const rs = point(lm,12);

    const lw = point(lm,15);
    const rw = point(lm,16);


    if(
        !visible(ls) ||
        !visible(rs) ||
        !visible(lw) ||
        !visible(rw)
    ){

        setAIStatus(
            "Show upper body...",
            "warn"
        );

        return;
    }


    const leftDistance =
        Math.abs(
            lw.x - ls.x
        );


    const rightDistance =
        Math.abs(
            rw.x - rs.x
        );


    const armsOpen =
        leftDistance > 0.18 &&
        rightDistance > 0.18;


    if(armsOpen){

        if(
            cooldownStage === 0
        ){

            cooldownStage = 1;

            addRep();
        }


        setAIStatus(
            "Cool Down ✓"
        );

    }else{

        cooldownStage = 0;

        setAIStatus(
            "Slowly open your arms..."
        );
    }
}


/* =====================================================
   TIMER
===================================================== */

function formatTime(seconds){

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        seconds % 60;


    return String(minutes)
        .padStart(2,"0")
        + ":" +
        String(secs)
        .padStart(2,"0");
}


function startTimer(){

    if(timerInterval){
        return;
    }


    elapsedSeconds = 0;

    timeDisplay.textContent =
        "00:00";


    timerInterval =
        setInterval(() => {

            elapsedSeconds++;

            timeDisplay.textContent =
                formatTime(
                    elapsedSeconds
                );

        },1000);
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    try{

        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

            video.srcObject =
                null;
        }

    }catch(error){

        console.error(
            "Camera stop error:",
            error
        );
    }


    cameraStarted =
        false;
}


/* =====================================================
   FINISH
===================================================== */

finishBtn.onclick =
    async () => {

        if(!currentUser){

            alert(
                "Please login again."
            );

            return;
        }


        if(repCount <= 0){

            alert(
                "No reps detected yet."
            );

            return;
        }


        if(saving){
            return;
        }


        saving = true;

        finishBtn.disabled =
            true;


        try{

            const userRef =
                db
                    .collection("users")
                    .doc(
                        currentUser.uid
                    );


            const snap =
                await userRef.get();


            const data =
                snap.exists
                    ? snap.data()
                    : {};


            const tasks =
                Array.isArray(
                    data.completedTasks
                )
                ? [
                    ...data.completedTasks
                  ]
                : [];


            if(
                tasks.includes(
                    workoutIndex
                )
            ){

                alert(
                    "This workout is already completed!"
                );

                saving = false;

                finishBtn.disabled =
                    false;

                return;
            }


            tasks.push(
                workoutIndex
            );


            const oldRC =
                Number(
                    data.totalPoints || 0
                );


            const newRC =
                oldRC + repCount;


            await userRef.set(

                {

                    completedTasks:
                        tasks,

                    totalPoints:
                        newRC

                },

                {
                    merge:true
                }

            );


            stopCamera();

            clearInterval(
                timerInterval
            );

            timerInterval =
                null;


            alert(
                `Workout complete! +${repCount} RC`
            );


            window.location.href =
                "daily-task.html";


        }catch(error){

            console.error(
                "Workout save error:",
                error
            );


            alert(
                "Save failed. Please try again."
            );


            saving = false;

            finishBtn.disabled =
                false;
        }
    };


/* =====================================================
   QUIT
===================================================== */

quitBtn.onclick =
    () => {

        stopCamera();

        clearInterval(
            timerInterval
        );

        timerInterval =
