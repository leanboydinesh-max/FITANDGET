/* =================================

const params =

/* =================================

/* =================================
   VARIABLES
================================= */

let currentUser = null;

let repCount = 0;

let cameraStarted = false;

let poseReady = false;

let positionReady = false;

let saving = false;

let secondsPassed = 0;

/* =================================
   STAGES
================================= */

let pushStage = "up";
let squatStage = "up";
let jackStage = "closed";
let lungeStage = "up";
let kneeStage = "down";

let burpeeStage = "up";
let stretchStage = "down";

/* =================================
   STATUS
================================= */

function setStatus(text){
    statusEl.innerText = text;
}


/* =================================
   DRAW AI GUIDE
================================= */

function drawGuide(){

    const w =
        guideCanvas.width;

    const h =
        guideCanvas.height;

    guideCtx.clearRect(
        0,
        0,
        w,
        h
    );

    /*
       Guide is intentionally simple.

       It shows the user where to stand/
       position their body BEFORE AI counting.
    */

    guideCtx.save();

    guideCtx.lineWidth = 4;

    guideCtx.setLineDash([10,8]);

    guideCtx.strokeStyle =
        positionReady
        ? "#7CFC00"
        : "rgba(124,252,0,.65)";

    const cx = w/2;

    const headY = h*.22;

    const shoulderY = h*.32;

    const hipY = h*.53;

    const kneeY = h*.68;

    const footY = h*.84;

    const shoulderW = w*.20;

    const hipW = w*.12;

    /*
       Workout-specific guide
    */

    if(workout === "Push Up"){

        guideCtx.beginPath();

        guideCtx.moveTo(w*.28,h*.58);
        guideCtx.lineTo(w*.72,h*.58);

        guideCtx.lineTo(w*.82,h*.68);
        guideCtx.lineTo(w*.72,h*.76);

        guideCtx.lineTo(w*.28,h*.76);

        guideCtx.lineTo(w*.18,h*.68);

        guideCtx.closePath();

        guideCtx.stroke();

    }else if(workout === "Squat"){

        drawStandingGuide(
            cx,
            headY,
            shoulderY,
            hipY,
            kneeY,
            footY,
            shoulderW,
            hipW
        );

    }else if(workout === "Lunges"){

        drawStandingGuide(
            cx,
            headY,
            shoulderY,
            hipY,
            kneeY,
            footY,
            shoulderW,
            hipW
        );

    }else if(workout === "Jumping Jack"){

        guideCtx.beginPath();

        guideCtx.arc(
            cx,
            headY,
            w*.045,
            0,
            Math.PI*2
        );

        guideCtx.stroke();

        guideCtx.beginPath();

        guideCtx.moveTo(
            cx-shoulderW,
            shoulderY
        );

        guideCtx.lineTo(
            cx,
            hipY
        );

        guideCtx.lineTo(
            cx-shoulderW*1.5,
            footY
        );

        guideCtx.moveTo(
            cx+shoulderW,
            shoulderY
        );

        guideCtx.lineTo(
            cx,
            hipY
        );

        guideCtx.lineTo(
            cx+shoulderW*1.5,
            footY
        );

        guideCtx.stroke();

    }else{

        drawStandingGuide(
            cx,
            headY,
            shoulderY,
            hipY,
            kneeY,
            footY,
            shoulderW,
            hipW
        );
    }

    guideCtx.restore();
}


/* =================================
   STANDING GUIDE
================================= */

function drawStandingGuide(
    cx,
    headY,
    shoulderY,
    hipY,
    kneeY,
    footY,
    shoulderW,
    hipW
){

    guideCtx.beginPath();

    guideCtx.arc(
        cx,
        headY,
        25,
        0,
        Math.PI*2
    );

    guideCtx.moveTo(
        cx-shoulderW,
        shoulderY
    );

    guideCtx.lineTo(
        cx+shoulderW,
        shoulderY
    );

    guideCtx.moveTo(
        cx,
        shoulderY
    );

    guideCtx.lineTo(
        cx,
        hipY
    );

    guideCtx.moveTo(
        cx-hipW,
        hipY
    );

    guideCtx.lineTo(
        cx+hipW,
        hipY
    );

    guideCtx.moveTo(
        cx-hipW,
        hipY
    );

    guideCtx.lineTo(
        cx-shoulderW*.8,
        kneeY
    );

    guideCtx.lineTo(
        cx-shoulderW*.75,
        footY
    );

    guideCtx.moveTo(
        cx+hipW,
        hipY
    );

    guideCtx.lineTo(
        cx+shoulderW*.8,
        kneeY
    );

    guideCtx.lineTo(
        cx+shoulderW*.75,
        footY
    );

    guideCtx.moveTo(
        cx-shoulderW,
        shoulderY
    );

    guideCtx.lineTo(
        cx-shoulderW*1.3,
        hipY
    );

    guideCtx.moveTo(
        cx+shoulderW,
        shoulderY
    );

    guideCtx.lineTo(
        cx+shoulderW*1.3,
        hipY
    );

    guideCtx.stroke();
}


/* =================================
   CANVAS SIZE
================================= */

function resizeCanvases(){

    const rect =
        video.getBoundingClientRect();

    const w =
        Math.max(1,Math.floor(rect.width));

    const h =
        Math.max(1,Math.floor(rect.height));

    output.width = w;
    output.height = h;

    guideCanvas.width = w;
    guideCanvas.height = h;

    drawGuide();
}

window.addEventListener(
    "resize",
    resizeCanvases
);


/* =================================
   POSITION CHECK
================================= */

function checkPosition(lm){

    if(!lm || !lm[0]){
        return false;
    }

    const important = [
        11,12,
        23,24,
        25,26,
        27,28
    ];

    for(const i of important){

        if(!lm[i]){
            return false;
        }

        if(
            lm[i].visibility !== undefined &&
            lm[i].visibility < .50
        ){
            return false;
        }
    }

    /*
       Check body stays inside camera.
    */

    const points = important.map(
        i => lm[i]
    );

    const minX =
        Math.min(...points.map(p=>p.x));

    const maxX =
        Math.max(...points.map(p=>p.x));

    const minY =
        Math.min(...points.map(p=>p.y));

    const maxY =
        Math.max(...points.map(p=>p.y));

    /*
       Keep enough margin from edges.
    */

    if(minX < .08) return false;
    if(maxX > .92) return false;
    if(minY < .05) return false;
    if(maxY > .95) return false;

    /*
       Workout-specific rough position.
    */

    if(workout === "Push Up"){

        const bodyWidth =
            maxX-minX;

        if(bodyWidth < .18){
            return false;
        }
    }

    return true;
}


/* =================================
   POSITION STATE
================================= */

function updatePosition(lm){

    const ready =
        checkPosition(lm);

    if(ready){

        if(!positionReady){

            positionReady = true;

            guideStatus.innerText =
                "READY ✓";

            guideStatus.classList.add(
                "ready"
            );

            setStatus(
                "Position correct • Start!"
            );

            startTimer();
        }

    }else{

        positionReady = false;

        guideStatus.innerText =
            "Move into the AI position";

        guideStatus.classList.remove(
            "ready"
        );

        setStatus(
            "Match the AI guide position"
        );
    }

    drawGuide();
}


/* =================================
   ANGLE
================================= */

function angle(a,b,c){

    const abx=a.x-b.x;
    const aby=a.y-b.y;

    const cbx=c.x-b.x;
    const cby=c.y-b.y;

    const dot =
        abx*cbx+aby*cby;

    const m1 =
        Math.sqrt(abx*abx+aby*aby);

    const m2 =
        Math.sqrt(cbx*cbx+cby*cby);

    if(!m1 || !m2){
        return 0;
    }

    let v =
        dot/(m1*m2);

    v =
        Math.max(-1,Math.min(1,v));

    return Math.acos(v)*180/Math.PI;
}


/* =================================
   VISIBILITY
================================= */

function visible(lm,i){

    if(!lm[i]){
        return false;
    }

    return (
        lm[i].visibility === undefined ||
        lm[i].visibility > .45
    );
}


/* =================================
   ADD REP
================================= */

function addRep(){

    if(
        !positionReady ||
        finished
    ){
        return;
    }

    if(repCount >= 50){
        return;
    }

    repCount++;

    repEl.innerText =
        repCount;

    finishBtn.disabled =
        false;
}


/* =================================
   TIMER
================================= */

function startTimer(){

    if(timer){
        return;
    }

    timer =
        setInterval(()=>{

            if(
                finished ||
                !positionReady
            ){
                return;
            }

            secondsPassed++;

            const m =
                Math.floor(
                    secondsPassed/60
                );

            const s =
                secondsPassed%60;

            timeEl.innerText =
                String(m).padStart(2,"0")
                +
                ":"
                +
                String(s).padStart(2,"0");

        },1000);
}

function stopTimer(){

    if(timer){

        clearInterval(timer);

        timer=null;
    }
}


/* =================================
   DRAW USER POSE
================================= */

function drawPose(results){

    const w =
        output.width;

    const h =
        output.height;

    ctx.clearRect(
        0,
        0,
        w,
        h
    );

    if(
        !results.poseLandmarks ||
        typeof drawConnectors !== "function"
    ){
        return;
    }

    const color =
        positionReady
        ? "#7CFC00"
        : "#888";

    drawConnectors(
        ctx,
        results.poseLandmarks,
        POSE_CONNECTIONS,
        {
            color:color,
            lineWidth:3
        }
    );

    drawLandmarks(
        ctx,
        results.poseLandmarks,
        {
            color:color,
            lineWidth:1,
            radius:3
        }
    );
}


/* =================================
   POSE RESULT
================================= */

function onPoseResults(results){

    if(
        !results.poseLandmarks
    ){

        positionReady=false;

        guideStatus.innerText =
            "Move into the AI position";

        guideStatus.classList.remove(
            "ready"
        );

        setStatus(
            "Show your full body"
        );

        ctx.clearRect(
            0,
            0,
            output.width,
            output.height
        );

        return;
    }

    poseReady=true;

    drawPose(results);

    updatePosition(
        results.poseLandmarks
    );

    /*
       VERY IMPORTANT:
       Do not count reps until
       position is correct.
    */

    if(!positionReady){
        return;
    }

    detectWorkout(
        results.poseLandmarks
    );
}


/* =================================
   WORKOUT DETECTION
================================= */

function detectWorkout(lm){

    switch(workout){

        case "Push Up":
            detectPushUp(lm);
            break;

        case "Squat":
            detectSquat(lm);
            break;

        case "High Knees":
            detectHighKnees(lm);
            break;

        case "Lunges":
            detectLunges(lm);
            break;

        case "Mountain Climber":
            detectMountainClimber(lm);
            break;

        case "Jumping Jack":
            detectJumpingJack(lm);
            break;

        case "Burpees":
            detectBurpee(lm);
            break;

        case "Plank":
            detectPlank(lm);
            break;

        case "Stretching":
            detectStretching(lm);
            break;

        case "Cool Down":
            detectCoolDown(lm);
            break;
    }
}


/* =================================
   PUSH UP
================================= */

function detectPushUp(lm){

    if(
        !visible(lm,11) ||
        !visible(lm,13) ||
        !visible(lm,15)
    ){
        return;
    }

    const a =
        angle(
            lm[11],
            lm[13],
            lm[15]
        );

    if(
        a < 95 &&
        pushStage === "up"
    ){

        pushStage="down";
    }

    if(
        a > 155 &&
        pushStage === "down"
    ){

        pushStage="up";

        addRep();
    }
}


/* =================================
   SQUAT
================================= */

function detectSquat(lm){

    if(
        !visible(lm,23) ||
        !visible(lm,25) ||
        !visible(lm,27)
    ){
        return;
    }

    const left =
        angle(
            lm[23],
            lm[25],
            lm[27]
        );

    const right =
        angle(
            lm[24],
            lm[26],
            lm[28]
        );

    const knee =
        Math.min(left,right);

    if(
        knee < 105 &&
        squatStage === "up"
    ){

        squatStage="down";
    }

    if(
        knee > 155 &&
        squatStage === "down"
    ){

        squatStage="up";

        addRep();
    }
}


/* =================================
   HIGH KNEES
================================= */

function detectHighKnees(lm){

    if(
        !visible(lm,23) ||
        !visible(lm,24) ||
        !visible(lm,25) ||
        !visible(lm,26)
    ){
        return;
    }

    const left =
        lm[25].y <
        lm[23].y-.06;

    const right =
        lm[26].y <
        lm[24].y-.06;

    if(
        (left || right) &&
        kneeStage==="down"
    ){

        kneeStage="up";

        addRep();

    }else if(
        !left &&
        !right
    ){

        kneeStage="down";
    }
}


/* =================================
   LUNGES
================================= */

function detectLunges(lm){

    if(
        !visible(lm,23) ||
        !visible(lm,25) ||
        !visible(lm,27) ||
        !visible(lm,24) ||
        !visible(lm,26) ||
        !visible(lm,28)
    ){
        return;
    }

    const left =
        angle(
            lm[23],
            lm[25],
            lm[27]
        );

    const right =
        angle(
            lm[24],
            lm[26],
            lm[28]
        );

    if(
        (left<110 || right<110) &&
        lungeStage==="up"
    ){

        lungeStage="down";

    }

    if(
        left>155 &&
        right>155 &&
        lungeStage==="down"
    ){

        lungeStage="up";

        addRep();
    }
}


/* =================================
   MOUNTAIN CLIMBER
================================= */

function detectMountainClimber(lm){

    if(
        !visible(lm,23) ||
        !visible(lm,24) ||
        !visible(lm,25) ||
        !visible(lm,26)
    ){
        return;
    }

    const left =
        lm[25].x <
        lm[23].x-.07;

    const right =
        lm[26].x >
        lm[24].x+.07;

    if(
        (left || right) &&
        mountainStage==="away"
    ){

        mountainStage="near";

    }

    if(
        !left &&
        !right &&
        mountainStage==="near"
    ){

        mountainStage="away";

        addRep();
    }
}


/* =================================
   JUMPING JACK
================================= */

function detectJumpingJack(lm){

    if(
        !visible(lm,15) ||
        !visible(lm,16) ||
        !visible(lm,27) ||
        !visible(lm,28)
    ){
        return;
    }

    const arms =
        lm[15].y < lm[11].y-.08 &&
        lm[16].y < lm[12].y-.08;

    const feet =
        Math.abs(
            lm[27].x-lm[28].x
        )>.22;

    const open =
        arms && feet;

    if(
        open &&
        jackStage==="closed"
    ){

        jackStage="open";

    }

    if(
        !open &&
        jackStage==="open"
    ){

        jackStage="closed";

        addRep();
    }
}


/* =================================
   BURPEE
================================= */

function detectBurpee(lm){

    if(
        !visible(lm,23) ||
        !visible(lm,25) ||
        !visible(lm,27)
    ){
        return;
    }

    const a =
        angle(
            lm[23],
            lm[25],
            lm[27]
        );

    if(
        a<110 &&
        burpeeStage==="up"
    ){

        burpeeStage="down";

    }

    if(
        a>155 &&
        burpeeStage==="down"
    ){

        burpeeStage="up";

        addRep();
    }
}


/* =================================
   PLANK
================================= */

function detectPlank(lm){

    if(
        !visible(lm,11) ||
        !visible(lm,23) ||
        !visible(lm,27)
    ){
        return;
    }

    const a =
        angle(
            lm[11],
            lm[23],
            lm[27]
        );

    if(a>155){

        if(!plankStart){
            plankStart=Date.now();
        }

        if(
            Date.now()-plankStart>=1000 &&
            !plankCounted
        ){

            addRep();

            plankCounted=true;
        }

    }else{

        plankStart=null;
        plankCounted=false;
    }
}


/* =================================
   STRETCHING
================================= */

function detectStretching(lm){

    if(
        !visible(lm,11) ||
        !visible(lm,15)
    ){
        return;
    }

    const up =
        lm[15].y <
        lm[11].y-.10;

    if(
        up &&
        stretchStage==="down"
    ){

        stretchStage="up";

    }

    if(
        !up &&
        stretchStage==="up"
    ){

        stretchStage="down";

        addRep();
    }
}


/* =================================
   COOL DOWN
================================= */

function detectCoolDown(lm){

    if(
        !visible(lm,15) ||
        !visible(lm,16)
    ){
        return;
    }

    const up =
        lm[15].y < lm[11].y &&
        lm[16].y < lm[12].y;

    if(
        up &&
        cooldownStage==="up"
    ){

        cooldownStage="down";

    }

    if(
        !up &&
        cooldownStage==="down"
    ){

        cooldownStage="up";

        addRep();
    }
}


/* =================================
   MEDIAPIPE
================================= */

const pose =
    new Pose({

        locateFile:(file)=>{

            return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file;

        }

    });


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    smoothSegmentation:false,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55

});


pose.onResults(
    onPoseResults
);


/* =================================
   CAMERA
================================= */

const camera =
    new Camera(
        video,
        {

            onFrame:async()=>{

                if(!cameraStarted){
                    return;
                }

                try{

                    await pose.send({
                        image:video
                    });

                }catch(error){

                    console.error(
                        "Pose error:",
                        error
                    );

                }

            },

            width:720,

            height:1280

        }
    );


/* =================================
   START CAMERA
================================= */

async function startAI(){

    if(cameraStarted){
        return;
    }

    try{

        setStatus(
            "Starting Camera AI..."
        );

        cameraStarted=true;

        await camera.start();

        loading.classList.add(
            "hidden"
        );

        /*
           Wait until video has
           actual dimensions.
        */

        setTimeout(
            resizeCanvases,
            300
        );

        drawGuide();

        guideStatus.innerText =
            "Match the AI position";

    }catch(error){

        console.error(error);

        cameraStarted=false;

        loading.innerText =
            "Allow camera permission and reload";

        setStatus(
            "Camera permission required"
        );
    }
}


/* =================================
   SAVE
================================= */

async function saveCompletion(){

    if(
        saving ||
        finished ||
        !currentUser
    ){
        return;
    }

    if(repCount<=0){

        alert(
            "Do at least 1 rep before Finish."
        );

        return;
    }

    saving=true;

    finishBtn.disabled=true;

    setStatus(
        "Saving workout..."
    );

    try{

        const userRef =
            db.collection("users")
              .doc(currentUser.uid);

        const snap =
            await userRef.get();

        const data =
            snap.exists
            ? snap.data()
            : {};

        const completedTasks =
            Array.isArray(
                data.completedTasks
            )
            ? [...data.completedTasks]
            : [];

        if(
            completedTasks.includes(workout)
        ){

            finished=true;

            stopCamera();

            stopTimer();

            location.href=
                "daily-task.html";

            return;
        }

        completedTasks.push(workout);

        const oldRC =
            Number(
                data.totalPoints || 0
            );

        await userRef.set({

            totalPoints:
                oldRC+repCount,

            completedTasks:
                completedTasks

        },{
            merge:true
        });

        finished=true;

        stopCamera();

        stopTimer();

        setStatus(
            "Completed! +" +
            repCount +
            " RC"
        );

        setTimeout(()=>{

            location.href=
                "daily-task.html";

        },900);

    }catch(error){

        console.error(error);

        saving=false;

        finishBtn.disabled=false;

        setStatus(
            "Save failed"
        );
    }
}


/* =================================
   FINISH
================================= */

finishBtn.onclick=()=>{

    if(repCount<=0){

        alert(
            "Do at least 1 rep before Finish."
        );

        return;
    }

    saveCompletion();
};


/* =================================
   QUIT
================================= */

quitBtn.onclick=()=>{

    if(finished){
        return;
    }

    stopCamera();

    stopTimer();

    /*
       NO SAVE
    */

    location.href=
        "daily-task.html";
};


/* =================================
   STOP CAMERA
================================= */

function stopCamera(){

    cameraStarted=false;

    try{

        if(video.srcObject){

            video.srcObject
                .getTracks()
                .forEach(track=>{
                    track.stop();
                });

            video.srcObject=null;
        }

    }catch(error){

        console.error(error);
    }
}


/* =================================
   AUTH
================================= */

firebase.auth()
.onAuthStateChanged(
    async(user)=>{

        if(!user){

            location.href=
                "index.html";

            return;
        }

        currentUser=user;

        await startAI();

    }
);
