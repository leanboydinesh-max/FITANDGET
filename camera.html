/* =========================================================

const ctx =

const repCount =

/* =========================================================
   GLOBAL STATE
========================================================= */

let reps = 0;

let stream = null;

let cameraRunning = false;

let processingFrame = false;

let lastRepTime = 0;

let lostFrames = 0;

let personLocked = false;


/* =========================================================
   MOVEMENT STATES
========================================================= */

let squatState = "READY";

let pushState = "UP";

let mountainState = "AWAY";

let highKneeState = "DOWN";

let lungeState = "UP";

let jackState = "CLOSED";

let burpeeState = "UP";

let plankStart = null;

let armMovementBase = null;


/* =========================================================
   PERSONAL BASELINES
========================================================= */

let squatBase = null;

let pushBase = null;

let mountainBase = null;

let baselineFrames = 0;


/* =========================================================
   STATUS
========================================================= */

function setStatus(message,type){

    statusBox.textContent = message;

    statusBox.className =
        "status " + type;
}


/* =========================================================
   REP
========================================================= */

function addRep(){

    const now = Date.now();

    if(
        now-lastRepTime <
        550
    ){
        return;
    }

    if(reps >= 50){
        return;
    }

    lastRepTime = now;

    reps++;

    repCount.textContent = reps;
}


/* =========================================================
   VISIBILITY
========================================================= */

function visible(lm,id){

    if(!lm || !lm[id]){
        return false;
    }

    if(
        lm[id].visibility === undefined
    ){
        return true;
    }

    return lm[id].visibility > 0.20;
}


/* =========================================================
   ANGLE
========================================================= */

function angle(a,b,c){

    if(!a || !b || !c){
        return 180;
    }

    const abx = a.x-b.x;
    const aby = a.y-b.y;

    const cbx = c.x-b.x;
    const cby = c.y-b.y;

    const dot =
        abx*cbx +
        aby*cby;

    const m1 =
        Math.sqrt(
            abx*abx+
            aby*aby
        );

    const m2 =
        Math.sqrt(
            cbx*cbx+
            cby*cby
        );

    if(m1===0 || m2===0){
        return 180;
    }

    let value =
        dot/(m1*m2);

    value =
        Math.max(
            -1,
            Math.min(1,value)
        );

    return (
        Math.acos(value)*
        180/Math.PI
    );
}


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

    canvas.width =
        canvas.clientWidth;

    canvas.height =
        canvas.clientHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   VIDEO RECT
========================================================= */

function getVideoRect(){

    const vw =
        video.videoWidth || 720;

    const vh =
        video.videoHeight || 1280;

    const cw =
        canvas.width;

    const ch =
        canvas.height;

    const scale =
        Math.min(
            cw/vw,
            ch/vh
        );

    const width =
        vw*scale;

    const height =
        vh*scale;

    return {
        x:(cw-width)/2,
        y:(ch-height)/2,
        width,
        height
    };
}


/* =========================================================
   LANDMARK → SCREEN
========================================================= */

function screenPoint(lm){

    if(!lm){
        return null;
    }

    const r =
        getVideoRect();

    let x =
        r.x +
        lm.x*r.width;

    let y =
        r.y +
        lm.y*r.height;

    /*
       Mirror because video is mirrored.
    */

    x =
        r.x +
        r.width -
        (x-r.x);

    /*
       Never draw outside camera.
    */

    x =
        Math.max(
            0,
            Math.min(
                canvas.width,
                x
            )
        );

    y =
        Math.max(
            0,
            Math.min(
                canvas.height,
                y
            )
        );

    return {
        x,
        y
    };
}


/* =========================================================
   DRAW LINE
========================================================= */

function drawLine(a,b,color){

    const p1 =
        screenPoint(a);

    const p2 =
        screenPoint(b);

    if(!p1 || !p2){
        return;
    }

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.lineTo(
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth = 5;

    ctx.lineCap =
        "round";

    ctx.stroke();
}


/* =========================================================
   DRAW JOINT
========================================================= */

function drawJoint(lm,color){

    const p =
        screenPoint(lm);

    if(!p){
        return;
    }

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        6,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        color;

    ctx.fill();
}


/* =========================================================
   DRAW CHAIN
========================================================= */

function drawChain(lm,ids,color){

    for(
        let i=0;
        i<ids.length-1;
        i++
    ){

        if(
            visible(lm,ids[i]) &&
            visible(lm,ids[i+1])
        ){

            drawLine(
                lm[ids[i]],
                lm[ids[i+1]],
                color
            );
        }
    }

    ids.forEach(id=>{

        if(
            visible(lm,id)
        ){

            drawJoint(
                lm[id],
                color
            );
        }

    });
}


/* =========================================================
   BODY TRACKING
========================================================= */

function bodyTracked(lm,ids){

    let count = 0;

    ids.forEach(id=>{

        if(visible(lm,id)){
            count++;
        }

    });

    return count >=
        Math.max(
            2,
            Math.ceil(ids.length*0.55)
        );
}


/* =========================================================
   SQUAT
   HIP + KNEE + ANKLE
========================================================= */

function squat(lm){

    const ids = [
        23,24,
        25,26,
        27,28
    ];

    if(!bodyTracked(lm,ids)){

        lostFrames++;

        if(lostFrames>10){

            personLocked=false;

            setStatus(
                "MOVE INTO CAMERA",
                "red"
            );
        }

        return;
    }

    lostFrames=0;

    if(!personLocked){

        personLocked=true;

        squatBase=null;

        baselineFrames=0;
    }

    drawChain(
        lm,
        [23,25,27],
        "#00ff66"
    );

    drawChain(
        lm,
        [24,26,28],
        "#00ff66"
    );

    const hipValues=[];

    if(visible(lm,23)){
        hipValues.push(lm[23].y);
    }

    if(visible(lm,24)){
        hipValues.push(lm[24].y);
    }

    const kneeValues=[];

    if(visible(lm,25)){
        kneeValues.push(lm[25].y);
    }

    if(visible(lm,26)){
        kneeValues.push(lm[26].y);
    }

    if(
        hipValues.length===0 ||
        kneeValues.length===0
    ){
        return;
    }

    const hipY =
        hipValues.reduce(
            (a,b)=>a+b,
            0
        ) /
        hipValues.length;

    const kneeY =
        kneeValues.reduce(
            (a,b)=>a+b,
            0
        ) /
        kneeValues.length;

    const scale =
        Math.max(
            0.20,
            Math.abs(
                kneeY-hipY
            )
        );

    if(squatBase===null){

        squatBase=hipY;

        baselineFrames=1;

        setStatus(
            "SQUAT • READY",
            "green"
        );

        return;
    }

    if(
        squatState==="READY"
    ){

        squatBase =
            squatBase*0.97+
            hipY*0.03;
    }

    const movement =
        (
            hipY-
            squatBase
        ) /
        scale;

    /*
       Forgiving movement threshold.
    */

    if(
        squatState==="READY" &&
        movement>0.045
    ){

        squatState="DOWN";

        setStatus(
            "SQUAT • DOWN",
            "green"
        );

        return;
    }

    if(
        squatState==="DOWN"
    ){

        setStatus(
            "SQUAT • UP",
            "green"
        );

        if(
            movement<0.018
        ){

            addRep();

            squatState="READY";
        }

        return;
    }

    setStatus(
        "SQUAT • READY",
        "green"
    );
}


/* =========================================================
   PUSH UP
   SHOULDER + ELBOW + WRIST
========================================================= */

function pushUp(lm){

    const left =
        [11,13,15].every(
            id=>visible(lm,id)
        );

    const right =
        [12,14,16].every(
            id=>visible(lm,id)
        );

    if(!left && !right){

        lostFrames++;

        if(lostFrames>10){

            personLocked=false;

            setStatus(
                "MOVE INTO CAMERA",
                "red"
            );
        }

        return;
    }

    lostFrames=0;

    personLocked=true;

    /*
       Pick the clearer side.
    */

    let side;

    if(left && right){

        const leftScore =
            (lm[11].visibility||1)+
            (lm[13].visibility||1)+
            (lm[15].visibility||1);

        const rightScore =
            (lm[12].visibility||1)+
            (lm[14].visibility||1)+
            (lm[16].visibility||1);

        side =
            leftScore>=rightScore
            ? "L"
            : "R";

    }else{

        side =
            left ? "L" : "R";
    }

    const shoulder =
        side==="L"
        ? lm[11]
        : lm[12];

    const elbow =
        side==="L"
        ? lm[13]
        : lm[14];

    const wrist =
        side==="L"
        ? lm[15]
        : lm[16];

    drawChain(
        lm,
        side==="L"
        ? [11,13,15]
        : [12,14,16],
        "#00ff66"
    );

    const elbowAngle =
        angle(
            shoulder,
            elbow,
            wrist
        );

    /*
       Very forgiving:
       bent enough = down
       straight again = up
    */

    if(
        pushState==="UP" &&
        elbowAngle<145
    ){

        pushState="DOWN";

        setStatus(
            "PUSH UP • DOWN",
            "green"
        );

        return;
    }

    if(
        pushState==="DOWN"
    ){

        setStatus(
            "PUSH UP • UP",
            "green"
        );

        if(
            elbowAngle>155
        ){

            addRep();

            pushState="UP";
        }

        return;
    }

    setStatus(
        "PUSH UP • READY",
        "green"
    );
}


/* =========================================================
   MOUNTAIN CLIMBER
   SHOULDER + HIP + KNEE
========================================================= */

function mountainClimber(lm){

    const tracked =
        bodyTracked(
            lm,
            [
                11,12,
                23,24,
                25,26
            ]
        );

    if(!tracked){

        lostFrames++;

        if(lostFrames>10){

            personLocked=false;

            setStatus(
                "MOVE INTO CAMERA",
                "red"
            );
        }

        return;
    }

    lostFrames=0;

    personLocked=true;

    drawChain(
        lm,
        [11,23,25],
        "#00ff66"
    );

    drawChain(
        lm,
        [12,24,26],
        "#00ff66"
    );

    const distances=[];

    if(
        visible(lm,23) &&
        visible(lm,25)
    ){

        distances.push(
            Math.abs(
                lm[25].y-
                lm[23].y
            )
        );
    }

    if(
        visible(lm,24) &&
        visible(lm,26)
    ){

        distances.push(
            Math.abs(
                lm[26].y-
                lm[24].y
            )
        );
    }

    if(distances.length===0){
        return;
    }

    const kneeDistance =
        Math.min(...distances);

    /*
       Calibrate user's normal
       leg distance.
    */

    if(mountainBase===null){

        mountainBase =
            kneeDistance;

        setStatus(
            "MOUNTAIN CLIMBER • READY",
            "green"
        );

        return;
    }

    mountainBase =
        mountainBase*0.995+
        kneeDistance*0.005;

    const ratio =
        kneeDistance/
        Math.max(
            mountainBase,
            0.10
        );

    /*
       Knee comes toward chest.
    */

    if(
        mountainState==="AWAY" &&
        ratio<0.82
    ){

        mountainState="UP";

        setStatus(
            "MOUNTAIN CLIMBER • KNEE",
            "green"
        );

        return;
    }

    if(
        mountainState==="UP" &&
        ratio>0.96
    ){

        addRep();

        mountainState="AWAY";
    }

    setStatus(
        "MOUNTAIN CLIMBER • MOVE",
        "green"
    );
}


/* =========================================================
   HIGH KNEES
   HIP + KNEE
========================================================= */

function highKnees(lm){

    const tracked =
        bodyTracked(
            lm,
            [23,24,25,26]
        );

    if(!tracked){

        lostFrames++;

        if(lostFrames>10){

            setStatus(
                "MOVE INTO CAMERA",
                "red"
            );
        }

        return;
    }

    lostFrames=0;

    drawChain(
        lm,
        [23,25],
        "#00ff66"
    );

    drawChain(
        lm,
        [24,26],
        "#00ff66"
    );

    let lifted=false;

    if(
        visible(lm,23) &&
        visible(lm,25) &&
        lm[25].y <
        lm[23].y-0.06
    ){

        lifted=true;
    }

    if(
        visible(lm,24) &&
        visible(lm,26) &&
        lm[26].y <
        lm[24].y-0.06
    ){

        lifted=true;
    }

    if(
        highKneeState==="DOWN" &&
        lifted
    ){

        addRep();

        highKneeState="UP";

        setStatus(
            "HIGH KNEES • UP",
            "green"
        );

        return;
    }

    if(
        highKneeState==="UP" &&
        !lifted
    ){

        highKneeState="DOWN";
    }

    setStatus(
        "HIGH KNEES • MOVE",
        "green"
    );
}


/* =========================================================
   LUNGES
   HIP + KNEE + ANKLE
========================================================= */

function lunges(lm){

    const tracked =
        bodyTracked(
            lm,
            [
                23,24,
                25,26,
                27,28
            ]
        );

    if(!tracked){

        lostFrames++;

        if(lostFrames>10){

            setStatus(
                "MOVE INTO CAMERA",
                "red"
            );
        }

        return;
    }

    lostFrames=0;

    drawChain(
        lm,
        [23,25,27],
        "#00ff66"
    );

    drawChain(
        lm,
        [24,26,28],
        "#00ff66"
    );

    let bent=false;

    if(
        visible(lm,23) &&
        visible(lm,25) &&
        visible(lm,27)
    ){

        if(
            angle(
                lm[23],
                lm[25],
                lm[27]
            ) < 155
        ){

            bent=true;
        }
    }

    if(
        visible(lm,24) &&
        visible(lm,26) &&
        visible(lm,28)
    ){

        if(
            angle(
                lm[24],
                lm[26],
                lm[28]
            ) < 155
        ){

            bent=true;
        }
    }

    if(
        lungeState==="UP" &&
        bent
    ){

        lungeState="DOWN";

        setStatus(
            "LUNGE • DOWN",
            "green"
        );

        return;
    }

    if(
        lungeState==="DOWN" &&
        !bent
    ){

        addRep();

        lungeState="UP";
    }

    setStatus(
        "LUNGE • MOVE",
        "green"
    );
}


/* =========================================================
   JUMPING JACK
   ARMS + LEGS
========================================================= */

function jumpingJack(lm){

    const tracked =
        bodyTracked(
            lm,
            [
                11,12,
                15,16,
                27,28
            ]
        );

    if(!tracked){

        lostFrames++;

        if(lostFrames>10){

            setStatus(
                "MOVE INTO CAMERA",
                "red"
            );
        }

        return;
    }

    lostFrames=0;

    drawChain(
        lm,
        [11,13,15],
        "#00ff66"
    );

    drawChain(
        lm,
        [12,14,16],
        "#00ff66"
    );

    drawChain(
        lm,
        [23,25,27],
        "#00ff66"
    );

    drawChain(
        lm,
        [24,26,28],
        "#00ff66"
    );

    const armsUp =
        visible(lm,15) &&
        visible(lm,16) &&
        visible(lm,11) &&
        visible(lm,12) &&
        lm[15].y < lm[11].y &&
        lm[16].y < lm[12].y;

    const legsApart =
        visible(lm,27) &&
        visible(lm,28) &&
        Math.abs(
            lm[27].x-
            lm[28].x
        ) > 0.14;

    const open =
        armsUp &&
        legsApart;

    if(
        jackState==="CLOSED" &&
        open
    ){

        jackState="OPEN";

        setStatus(
            "JUMPING JACK • OPEN",
            "green"
        );

        return;
    }

    if(
        jackState==="OPEN" &&
        !open
    ){

        addRep();

        jackState="CLOSED";
    }

    setStatus(
        "JUMPING JACK • MOVE",
        "green"
    );
}


/* =========================================================
   BURPEE
   SHOULDER + HIP + KNEE
========================================================= */

function burpee(lm){

    const tracked =
        bodyTracked(
            lm,
            [
                11,12,
                23,24,
                25,26
            ]
        );

    if(!tracked){

        lostFrames++;

        if(lostFrames>10){

            setStatus(
                "MOVE INTO CAMERA",
                "red"
            );
        }

        return;
    }

    lostFrames=0;

    drawChain(
        lm,
        [11,23,25],
        "#00ff66"
    );

    drawChain(
        lm,
        [12,24,26],
        "#00ff66"
    );

    const shoulderY =
        (
            lm[11].y+
            lm[12].y
        )/2;

    const hipY =
        (
            lm[23].y+
            lm[24].y
        )/2;

    const distance =
        Math.abs(
            hipY-
            shoulderY
        );

    /*
       Burpee movement changes
       body shape substantially.
    */

    if(
        burpeeState==="UP" &&
        distance<0.22
    ){

        burpeeState="DOWN";

        setStatus(
            "BURPEE • DOWN",
            "green"
        );

        return;
    }

    if(
        burpeeState==="DOWN" &&
        distance>0.28
    ){

        addRep();

        burpeeState="UP";
    }

    setStatus(
        "BURPEE • MOVE",
        "green"
    );
}


/* =========================================================
   PLANK
   SHOULDER + HIP + ANKLE
========================================================= */

function plank(lm){

    const tracked =
        bodyTracked(
            lm,
            [
                11,12,
                23,24,
                27,28
            ]
        );

    if(!tracked){

        lostFrames++;

        plankStart=null;

        if(lostFrames>10){

            setStatus(
                "MOVE INTO CAMERA",
                "red"
            );
        }

        return;
    }

    lostFrames=0;

    drawChain(
        lm,
        [11,23,27],
        "#00ff66"
    );

    drawChain(
        lm,
        [12,24,28],
        "#00ff66"
    );

    /*
       Plank is a hold.
       Every 5 seconds = 1 rep.
    */

    if(plankStart===null){

        plankStart =
            Date.now();

        setStatus(
            "PLANK • HOLD",
            "green"
        );

        return;
    }

    const seconds =
        Math.floor(
            (
                Date.now()-
                plankStart
            )/1000
        );

    setStatus(
        "PLANK • "+seconds+"s",
        "green"
    );

    if(seconds>=5){

        addRep();

        plankStart =
            Date.now();
    }
}


/* =========================================================
   STRETCHING
   SHOULDERS + ELBOWS + WRISTS
========================================================= */

function stretching(lm){

    const tracked =
        bodyTracked(

                11,12,
                13,14,
                15,16

    drawChain(

    );

    const wristY =
        (
            lm[15].y+

}

/* =========================================================
   POSE RESULTS
========================================================= */

function onPoseResults(results){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(
        !results ||
        !results.poseLandmarks
    ){

        lostFrames++;

        if(lostFrames>8){

            personLocked=false;

            setStatus(
                "MOVE INTO CAMERA",
                "red"
            );
        }

        return;
    }

    const lm =
        results.poseLandmarks;

    const name =
        workout.toLowerCase();


    if(
        name.includes("stretch")
    ){

        stretching(lm);
        return;
    }


    if(
        name.includes("push")
    ){

        pushUp(lm);
        return;
    }


    if(
        name.includes("squat")
    ){

        squat(lm);
        return;
    }


    if(
        name.includes("high knee")
    ){

        highKnees(lm);
        return;
    }


    if(
        name.includes("lunge")
    ){

        lunges(lm);
        return;
    }


    if(
        name.includes("mountain")
    ){

        mountainClimber(lm);
        return;
    }


    if(
        name.includes("jumping jack")
    ){

        jumpingJack(lm);
        return;
    }


    if(
        name.includes("burpee")
    ){

        burpee(lm);
        return;
    }


    if(
        name.includes("plank")
    ){

        plank(lm);
        return;
    }


    if(
        name.includes("cool")
    ){

        coolDown(lm);
        return;
    }

    setStatus(
        "MOVE",
        "green"
    );
}


/* =========================================================
   MEDIAPIPE
========================================================= */

const pose =
    new Pose({
        locateFile:(file)=>{
            return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file;
        }
    });


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:0.40,

    minTrackingConfidence:0.40

});


pose.onResults(
    onPoseResults
);


/* =========================================================
   CAMERA
   Native getUserMedia
   More reliable than MediaPipe Camera helper.
========================================================= */

async function startCamera(){

    if(cameraRunning){
        return;
    }

    try{

        setStatus(
            "STARTING CAMERA...",
            "yellow"
        );

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Camera API unavailable"
            );
        }

        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{
                    facingMode:"user",
                    width:{
                        ideal:720
                    },
                    height:{
                        ideal:1280
                    }
                },

                audio:false
            });

        video.srcObject =
            stream;

        await video.play();

        cameraRunning=true;

        setStatus(
            "MOVE INTO CAMERA",
            "red"
        );

        processVideo();

    }catch(error){

        console.error(
            "Camera error:",
            error
        );

        cameraRunning=false;

        setStatus(
            "CAMERA PERMISSION NEEDED",
            "red"
        );
    }
}


/* =========================================================
   FRAME PROCESSING
========================================================= */

async function processVideo(){

    if(!cameraRunning){
        return;
    }

    if(
        video.readyState>=2 &&
        !processingFrame
    ){

        processingFrame=true;

        try{

            await pose.send({
                image:video
            });

        }catch(error){

            console.error(
                "Pose error:",
                error
            );

        }finally{

            processingFrame=false;
        }
    }

    requestAnimationFrame(
        processVideo
    );
}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera(){

    cameraRunning=false;

    processingFrame=false;

    if(stream){

        stream.getTracks()
            .forEach(track=>{
                track.stop();
            });

        stream=null;
    }

    video.srcObject=null;
}


/* =========================================================
   QUIT
   NO SAVE
========================================================= */

function quitWorkout(){

    stopCamera();

    window.location.href =
        "daily-task.html";
}


/* =========================================================
   FINISH
========================================================= */

async function finishWorkout(){

    const user =
        auth.currentUser;

    if(!user){

        alert(
            "Please login first."
        );

        return;
    }

    if(reps<=0){

        alert(
            "Complete at least 1 rep."
        );

        return;
    }

    const finalReps =
        Math.min(
            reps,
            50
        );

    finishBtn.disabled=true;

    try{

        const ref =
            db.collection("users")
            .doc(user.uid);

        const snap =
            await ref.get();

        const data =
            snap.exists
            ? snap.data()
            : {};

        const oldPoints =
            Number(
                data.totalPoints || 0
            );

        const oldTasks =
            Array.isArray(
                data.completedTasks
            )
            ? data.completedTasks
            : [];

        const tasks =
            [...oldTasks];

        if(
            !tasks.includes(workout)
        ){

            tasks.push(
                workout
            );
        }

        await ref.set({

            totalPoints:
                oldPoints+
                finalReps,

            completedTasks:
                tasks,

            lastWorkout:
                workout,

            lastWorkoutReps:
                finalReps,

            updatedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        },{
            merge:true
        });

        stopCamera();

        window.location.href =
            "daily-task.html";

    }catch(error){

        console.error(
            "Save error:",
            error
        );

        finishBtn.disabled=false;

        alert(
            "Could not save workout."
        );
    }
}


/* =========================================================
   BUTTONS
========================================================= */

quitBtn.addEventListener(
    "click",
    quitWorkout
);

finishBtn.addEventListener(
    "click",
    finishWorkout
);


/* =========================================================
   AUTO START
========================================================= */

window.addEventListener(
    "load",
    ()=>{

        setTimeout(
            ()=>{

                startCamera();

            },
            300
        );

    }
);
