<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>FIT & GET Camera</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050805;
    color:white;
    font-family:Poppins,sans-serif;
}

.page{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

/* ================= TOP ================= */

.top{
    height:60px;
    min-height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 10px;
    position:relative;
    z-index:20;
}

.title{
    font-size:15px;
    font-weight:700;
}

.title span{
    color:#9dff00;
}

.actions{
    display:flex;
    gap:6px;
}

button{
    border:0;
    font-family:Poppins,sans-serif;
    font-weight:700;
}

.finish{
    background:#9dff00;
    color:#071000;
    border-radius:9px;
    padding:8px 11px;
}

.quit{
    background:#242424;
    color:white;
    border-radius:9px;
    padding:8px 11px;
}

/* ================= CAMERA ================= */

.cameraWrap{
    flex:1;
    min-height:0;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0 7px;
}

.cameraBox{
    position:relative;

    width:min(97vw,520px);
    height:100%;

    max-height:calc(100dvh - 123px);

    background:#000;

    border:2px solid #252525;
    border-radius:16px;

    overflow:hidden;
}

/*
 IMPORTANT:
 Video and canvas occupy EXACTLY
 the same camera viewport.
*/

#video,
#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;
}

#video{
    object-fit:cover;
    background:#000;
}

#canvas{
    pointer-events:none;
}

/* ================= STATUS ================= */

.status{
    position:absolute;
    z-index:10;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    padding:7px 14px;

    border-radius:20px;

    background:rgba(0,0,0,.72);

    font-size:11px;
    font-weight:600;

    white-space:nowrap;
}

.status.ready{
    color:#9dff00;
    border:1px solid #9dff00;
}

.status.warn{
    color:white;
}

/* ================= GUIDE TEXT ================= */

.guide{
    position:absolute;

    left:50%;
    bottom:48px;

    transform:translateX(-50%);

    z-index:10;

    width:max-content;
    max-width:90%;

    background:rgba(0,0,0,.68);

    padding:6px 11px;

    border-radius:10px;

    font-size:10px;
    color:#ddd;

    text-align:center;
}

/* ================= TIMER ================= */

.timer{
    position:absolute;

    z-index:10;

    bottom:10px;
    left:50%;

    transform:translateX(-50%);

    background:rgba(0,0,0,.72);

    padding:5px 14px;

    border-radius:18px;

    font-size:12px;
}

/* ================= BOTTOM ================= */

.bottom{
    height:63px;
    min-height:63px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.repBox{
    text-align:center;
}

.repNumber{
    font-size:25px;
    line-height:25px;
    font-weight:700;
    color:#9dff00;
}

.repText{
    font-size:9px;
    color:#888;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .top{
        padding:7px 8px;
    }

    .title{
        font-size:13px;
    }

    .finish,
    .quit{
        padding:7px 9px;
        font-size:10px;
    }

    .cameraBox{
        width:97vw;
        border-radius:14px;
    }

}

</style>
</head>

<body>

<div class="page">

    <div class="top">

        <div class="title">
            FIT & GET • <span id="workoutName">Workout</span>
        </div>

        <div class="actions">

            <button
                class="finish"
                id="finishBtn">
                FINISH ✓
            </button>

            <button
                class="quit"
                id="quitBtn">
                QUIT
            </button>

        </div>

    </div>


    <div class="cameraWrap">

        <div class="cameraBox">

            <video
                id="video"
                autoplay
                playsinline
                muted>
            </video>

            <canvas id="canvas"></canvas>

            <div
                id="status"
                class="status warn">
                Starting Camera...
            </div>

            <div
                id="guideText"
                class="guide">
                Move into the guide
            </div>

            <div
                id="time"
                class="timer">
                00:00
            </div>

        </div>

    </div>


    <div class="bottom">

        <div class="repBox">

            <div
                id="repCount"
                class="repNumber">
                0
            </div>

            <div class="repText">
                REPS
            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",

    authDomain:
    "fitandget-b3461.firebaseapp.com",

    projectId:
    "fitandget-b3461",

    storageBucket:
    "fitandget-b3461.firebasestorage.app",

    messagingSenderId:
    "216178533513",

    appId:
    "1:216178533513:web:975f20599c7e77b9d01258"
};

firebase.initializeApp(firebaseConfig);

const db =
    firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const statusEl =
    document.getElementById("status");

const guideText =
    document.getElementById("guideText");

const workoutNameEl =
    document.getElementById("workoutName");

const repEl =
    document.getElementById("repCount");

const timeEl =
    document.getElementById("time");

const finishBtn =
    document.getElementById("finishBtn");

const quitBtn =
    document.getElementById("quitBtn");


/* =====================================================
   WORKOUT
===================================================== */

const params =
    new URLSearchParams(location.search);

let workout =
    params.get("workout") ||
    params.get("task") ||
    localStorage.getItem("selectedWorkout") ||
    "Push Up";

workout =
    decodeURIComponent(workout);

workout =
    workout.trim();

workoutNameEl.innerText =
    workout;


/* =====================================================
   ONLY THESE TWO
===================================================== */

const isPushUp =
    workout.toLowerCase().replace(/\s/g,"") ===
    "pushup";

const isSquat =
    workout.toLowerCase().replace(/\s/g,"") ===
    "squat";


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let cameraStarted = false;

let poseReady = false;

let repCount = 0;

let saving = false;

let timerStarted = false;

let secondsPassed = 0;

let timer = null;


/* =====================================================
   MOVEMENT STATES
===================================================== */

/*
 PUSH UP

 UP
 ↓
 DOWN
 ↓
 UP = REP
*/

let pushState =
    "up";


/*
 SQUAT

 UP
 ↓
 DOWN
 ↓
 UP = REP
*/

let squatState =
    "up";


/*
 Used to stop noisy AI
 from changing state every frame.
*/

let pushDownFrames = 0;
let pushUpFrames = 0;

let squatDownFrames = 0;
let squatUpFrames = 0;


/* =====================================================
   MEDIAPIPE
===================================================== */

const pose =
    new Pose({

        locateFile:(file)=>{

            return
            "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"
            + file;

        }

    });


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    smoothSegmentation:false,

    minDetectionConfidence:.60,

    minTrackingConfidence:.60

});


pose.onResults(
    onPoseResults
);


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new Camera(video,{

        onFrame:async()=>{

            if(!cameraStarted)
                return;

            try{

                await pose.send({
                    image:video
                });

            }catch(error){

                console.error(error);

            }

        },

        width:720,
        height:1280

    });


/* =====================================================
   AUTH
===================================================== */

firebase
.auth()
.onAuthStateChanged(async(user)=>{

    if(!user){

        window.location.href =
            "index.html";

        return;

    }

    currentUser =
        user;

    startCamera();

});


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

    if(cameraStarted)
        return;

    try{

        setStatus(
            "Starting Camera...",
            "warn"
        );

        cameraStarted =
            true;

        await camera.start();

        guideText.innerText =
            isPushUp
            ? "Show shoulders + chest + arms"
            : "Show hips + thighs + legs";

    }catch(error){

        console.error(error);

        cameraStarted =
            false;

        setStatus(
            "Camera permission required",
            "warn"
        );

    }

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    text,
    type="warn"
){

    statusEl.innerText =
        text;

    statusEl.className =
        "status " + type;

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    if(timerStarted)
        return;

    timerStarted =
        true;

    timer =
        setInterval(()=>{

            secondsPassed++;

            const min =
                Math.floor(
                    secondsPassed/60
                );

            const sec =
                secondsPassed%60;

            timeEl.innerText =
                String(min).padStart(2,"0")
                + ":"
                +
                String(sec).padStart(2,"0");

        },1000);

}


/* =====================================================
   CANVAS RESIZE
===================================================== */

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.round(
            rect.width*dpr
        );

    canvas.height =
        Math.round(
            rect.height*dpr
        );

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);

setTimeout(
    resizeCanvas,
    500
);


/* =====================================================
   LANDMARK → CAMERA POSITION
===================================================== */

function getPoint(lm){

    const rect =
        canvas.getBoundingClientRect();

    /*
    VIDEO IS OBJECT-FIT:COVER.

    Therefore calculate cover scale,
    then crop amount.

    This is the important fix for
    lines leaving the camera.
    */

    const vw =
        video.videoWidth || 720;

    const vh =
        video.videoHeight || 1280;

    const cw =
        rect.width;

    const ch =
        rect.height;

    const scale =
        Math.max(
            cw/vw,
            ch/vh
        );

    const shownW =
        vw*scale;

    const shownH =
        vh*scale;

    const cropX =
        (shownW-cw)/2;

    const cropY =
        (shownH-ch)/2;

    let x =
        lm.x*shownW-cropX;

    let y =
        lm.y*shownH-cropY;

    /*
    HARD CLAMP.

    Nothing can leave camera.
    */

    x =
        Math.max(
            0,
            Math.min(cw,x)
        );

    y =
        Math.max(
            0,
            Math.min(ch,y)
        );

    return {
        x:x,
        y:y
    };

}


/* =====================================================
   DRAW POINT
===================================================== */

function drawPoint(
    lm,
    radius=5
){

    if(!lm)
        return;

    const p =
        getPoint(lm);

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#9dff00";

    ctx.fill();

}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(
    a,
    b,
    width=4
){

    if(!a || !b)
        return;

    const p1 =
        getPoint(a);

    const p2 =
        getPoint(b);

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.lineTo(
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        "#9dff00";

    ctx.lineWidth =
        width;

    ctx.lineCap =
        "round";

    ctx.stroke();

}


/* =====================================================
   PUSH-UP GUIDE
===================================================== */

function drawPushGuide(lm){

    /*
    ONLY:

    shoulder
    elbow
    wrist
    chest/shoulder connection
    */

    drawLine(
        lm[11],
        lm[13]
    );

    drawLine(
        lm[13],
        lm[15]
    );

    drawLine(
        lm[12],
        lm[14]
    );

    drawLine(
        lm[14],
        lm[16]
    );

    drawLine(
        lm[11],
        lm[12]
    );

    drawPoint(
        lm[11],
        6
    );

    drawPoint(
        lm[12],
        6
    );

    drawPoint(
        lm[13],
        5
    );

    drawPoint(
        lm[14],
        5
    );

    drawPoint(
        lm[15],
        5
    );

    drawPoint(
        lm[16],
        5
    );

}


/* =====================================================
   SQUAT GUIDE
===================================================== */

function drawSquatGuide(lm){

    /*
    ONLY:

    hip
    thigh
    knee
    lower leg
    */

    drawLine(
        lm[23],
        lm[25]
    );

    drawLine(
        lm[25],
        lm[27]
    );

    drawLine(
        lm[24],
        lm[26]
    );

    drawLine(
        lm[26],
        lm[28]
    );

    drawLine(
        lm[23],
        lm[24]
    );

    drawPoint(
        lm[23],
        6
    );

    drawPoint(
        lm[24],
        6
    );

    drawPoint(
        lm[25],
        5
    );

    drawPoint(
        lm[26],
        5
    );

    drawPoint(
        lm[27],
        5
    );

    drawPoint(
        lm[28],
        5
    );

}


/* =====================================================
   ANGLE
===================================================== */

function angle(
    a,
    b,
    c
){

    const abx =
        a.x-b.x;

    const aby =
        a.y-b.y;

    const cbx =
        c.x-b.x;

    const cby =
        c.y-b.y;

    const dot =
        abx*cbx+
        aby*cby;

    const mag1 =
        Math.sqrt(
            abx*abx+
            aby*aby
        );

    const mag2 =
        Math.sqrt(
            cbx*cbx+
            cby*cby
        );

    if(
        !mag1 ||
        !mag2
    )
        return 180;

    let value =
        Math.acos(
            Math.max(
                -1,
                Math.min(
                    1,
                    dot/(mag1*mag2)
                )
            )
        )
        *180/Math.PI;

    return value;

}


/* =====================================================
   VISIBILITY
===================================================== */

function visible(
    lm,
    ids
){

    for(
        const id of ids
    ){

        if(
            !lm[id] ||
            (
                lm[id].visibility !== undefined &&
                lm[id].visibility < .50
            )
        ){

            return false;

        }

    }

    return true;

}


/* =====================================================
   PUSH-UP READY
===================================================== */

function pushUpReady(lm){

    return visible(
        lm,
        [
            11,12,
            13,14,
            15,16
        ]
    );

}


/* =====================================================
   SQUAT READY
===================================================== */

function squatReady(lm){

    return visible(
        lm,
        [
            23,24,
            25,26,
            27,28
        ]
    );

}


/* =====================================================
   PUSH-UP DETECTION
===================================================== */

function detectPushUp(lm){

    const leftElbow =
        angle(
            lm[11],
            lm[13],
            lm[15]
        );

    const rightElbow =
        angle(
            lm[12],
            lm[14],
            lm[16]
        );

    const elbow =
        (
            leftElbow+
            rightElbow
        )/2;


    /*
    DOWN

    Need BOTH arms to bend
    enough before changing state.
    */

    if(
        pushState==="up"
        &&
        elbow < 105
    ){

        pushDownFrames++;

        pushUpFrames=0;

        if(
            pushDownFrames>=4
        ){

            pushState=
                "down";

            pushDownFrames=0;

            setStatus(
                "DOWN",
                "ready"
            );

        }

    }

    /*
    UP

    Arms must actually become
    almost straight again.
    */

    else if(
        pushState==="down"
        &&
        elbow > 155
    ){

        pushUpFrames++;

        pushDownFrames=0;

        if(
            pushUpFrames>=4
        ){

            pushState=
                "up";

            pushUpFrames=0;

            addRep();

            setStatus(
                "PUSH UP • +1",
                "ready"
            );

        }

    }

    else{

        pushDownFrames=0;
        pushUpFrames=0;

    }

}


/* =====================================================
   SQUAT DETECTION
===================================================== */

function detectSquat(lm){

    const leftKnee =
        angle(
            lm[23],
            lm[25],
            lm[27]
        );

    const rightKnee =
        angle(
            lm[24],
            lm[26],
            lm[28]
        );

    const knee =
        (
            leftKnee+
            rightKnee
        )/2;


    /*
    DOWN
    */

    if(
        squatState==="up"
        &&
        knee < 110
    ){

        squatDownFrames++;

        squatUpFrames=0;

        if(
            squatDownFrames>=4
        ){

            squatState=
                "down";

            squatDownFrames=0;

            setStatus(
                "SQUAT DOWN",
                "ready"
            );

        }

    }


    /*
    UP
    */

    else if(
        squatState==="down"
        &&
        knee > 155
    ){

        squatUpFrames++;

        squatDownFrames=0;

        if(
            squatUpFrames>=4
        ){

            squatState=
                "up";

            squatUpFrames=0;

            addRep();

            setStatus(
                "SQUAT • +1",
                "ready"
            );

        }

    }

    else{

        squatDownFrames=0;
        squatUpFrames=0;

    }

}


/* =====================================================
   REP
===================================================== */

function addRep(){

    if(!poseReady)
        return;

    if(repCount>=50)
        return;

    repCount++;

    repEl.innerText =
        repCount;

}


/* =====================================================
   POSE RESULTS
===================================================== */

function onPoseResults(results){

    resizeCanvas();

    const rect =
        canvas.getBoundingClientRect();

    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );


    if(
        !results.poseLandmarks
    ){

        poseReady=false;

        setStatus(
            "Show target body parts",
            "warn"
        );

        return;

    }


    const lm =
        results.poseLandmarks;


    /* ================================================
       PUSH UP
    ================================================ */

    if(isPushUp){

        drawPushGuide(lm);

        if(
            !pushUpReady(lm)
        ){

            poseReady=false;

            setStatus(
                "Show shoulders + arms",
                "warn"
            );

            return;

        }

        if(!poseReady){

            poseReady=true;

            startTimer();

            setStatus(
                "READY • PUSH UP",
                "ready"
            );

        }

        detectPushUp(lm);

        return;

    }


    /* ================================================
       SQUAT
    ================================================ */

    if(isSquat){

        drawSquatGuide(lm);

        if(
            !squatReady(lm)
        ){

            poseReady=false;

            setStatus(
                "Show hips + legs",
                "warn"
            );

            return;

        }

        if(!poseReady){

            poseReady=true;

            startTimer();

            setStatus(
                "READY • SQUAT",
                "ready"
            );

        }

        detectSquat(lm);

        return;

    }


    /* ================================================
       OTHER WORKOUT
    ================================================ */

    poseReady=false;

    setStatus(
        "Push Up / Squat only",
        "warn"
    );

}


/* =====================================================
   FINISH
===================================================== */

finishBtn.onclick =
async function(){

    if(saving)
        return;

    if(repCount<=0){

        setStatus(
            "Complete at least 1 rep",
            "warn"
        );

        return;

    }

    if(!currentUser)
        return;

    saving=true;

    finishBtn.disabled=true;

    finishBtn.innerText=
        "SAVING...";


    try{

        const uid =
            currentUser.uid;

        const ref =
            db
            .collection("users")
            .doc(uid);

        const snap =
            await ref.get();

        const data =
            snap.exists
            ? snap.data()
            : {};

        const oldPoints =
            Number(
                data.totalPoints || 0
            );

        const oldTasks =
            Array.isArray(
                data.completedTasks
            )
            ? data.completedTasks
            : [];

        const today =
            new Date()
            .toISOString()
            .slice(0,10);

        const taskKey =
            today+"_"+workout;

        if(
            !oldTasks.includes(taskKey)
        ){

            await ref.set({

                totalPoints:
                    oldPoints+repCount,

                completedTasks:[
                    ...oldTasks,
                    taskKey
                ]

            },{
                merge:true
            });

        }

        stopCamera();

        if(timer)
            clearInterval(timer);

        window.location.href=
            "daily-task.html";


    }catch(error){

        console.error(error);

        saving=false;

        finishBtn.disabled=false;

        finishBtn.innerText=
            "FINISH ✓";

        setStatus(
            "Save failed",
            "warn"
        );

    }

};


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    cameraStarted=false;

    if(video.srcObject){

        video.srcObject
        .getTracks()
        .forEach(
            track=>{
                track.stop();
            }
        );

    }

}


/* =====================================================
   QUIT
===================================================== */

quitBtn.onclick =
function(){

    stopCamera();

    if(timer)
        clearInterval(timer);

    /*
    NO SAVE
    */

    window.location.href=
        "daily-task.html";

};


/* =====================================================
   INITIAL CANVAS
===================================================== */

resizeCanvas();
