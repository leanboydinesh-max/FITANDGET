<script>

/* =========================================
   FIREBASE
========================================= */

};


if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}


const auth =
    firebase.auth();

const db =
    firebase.firestore();



/* =========================================
   ELEMENTS
========================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const workoutNameEl =
    document.getElementById("workoutName");

const repEl =
    document.getElementById("rep");

const statusEl =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const quitBtn =
    document.getElementById("quitBtn");

const finishBtn =
    document.getElementById("finishBtn");



/* =========================================
   WORKOUT
========================================= */

const params =
    new URLSearchParams(
        location.search
    );


let workout =
    params.get("workout") ||
    localStorage.getItem(
        "selectedWorkout"
    ) ||
    "Stretching";


try{

    workout =
        decodeURIComponent(
            workout
        );

}catch(e){}


workout =
    workout.trim();


workoutNameEl.textContent =
    workout;



/* =========================================
   GLOBAL STATE
========================================= */

let stream =
    null;

let pose =
    null;

let running =
    true;

let processing =
    false;

let reps =
    0;

const MAX_REPS =
    50;

let positionReady =
    false;

let lostFrames =
    0;

let state =
    "NOT_READY";

let lastMovementTime =
    0;

let plankStart =
    0;

let lastPlankSecond =
    0;



/* =========================================
   EXERCISE MEMORY
========================================= */

let memory = {

    pushStartY:null,
    pushLowestY:null,

    squatStarted:false,

    highKneeSide:null,

    mountainSide:null,

    burpeeDown:false,
    burpeeUp:false

};



function resetMemory(){

    memory = {

        pushStartY:null,
        pushLowestY:null,

        squatStarted:false,

        highKneeSide:null,

        mountainSide:null,

        burpeeDown:false,
        burpeeUp:false

    };

    state =
        "NOT_READY";

}



/* =========================================
   HELPERS
========================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function good(point){

    return !!(

        point &&

        typeof point.x ===
            "number" &&

        typeof point.y ===
            "number" &&

        (
            point.visibility ===
                undefined ||

            point.visibility >
                0.30
        )

    );

}


function required(points){

    return points.every(
        point =>
            good(point)
    );

}


function midpoint(a,b){

    return {

        x:
            (a.x + b.x) / 2,

        y:
            (a.y + b.y) / 2

    };

}


function distance(a,b){

    if(
        !good(a) ||
        !good(b)
    ){

        return 999;

    }

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


function angle(a,b,c){

    if(
        !required([
            a,
            b,
            c
        ])
    ){

        return 180;

    }


    const abx =
        a.x - b.x;

    const aby =
        a.y - b.y;

    const cbx =
        c.x - b.x;

    const cby =
        c.y - b.y;


    const dot =
        abx * cbx +
        aby * cby;


    const mag1 =
        Math.hypot(
            abx,
            aby
        );


    const mag2 =
        Math.hypot(
            cbx,
            cby
        );


    if(
        !mag1 ||
        !mag2
    ){

        return 180;

    }


    return (

        Math.acos(

            clamp(
                dot /
                (mag1 * mag2),

                -1,
                1
            )

        ) *
        180 /
        Math.PI

    );

}



/* =========================================
   BODY VISIBILITY
========================================= */

function bodyIsVisible(l){

    const important = [

        l[11],
        l[12],

        l[13],
        l[14],

        l[15],
        l[16],

        l[23],
        l[24],

        l[25],
        l[26],

        l[27],
        l[28]

    ];


    let visible =
        0;


    important.forEach(
        point => {

            if(
                good(point)
            ){

                visible++;

            }

        }
    );


    return visible >= 8;

}



/* =========================================
   PUSH-UP POSITION
========================================= */

function isPushUpPosition(l){

    if(!required([

        l[11],
        l[12],

        l[13],
        l[14],

        l[15],
        l[16],

        l[23],
        l[24],

        l[27],
        l[28]

    ])){

        return false;

    }


    const shoulder =
        midpoint(
            l[11],
            l[12]
        );


    const hip =
        midpoint(
            l[23],
            l[24]
        );


    const ankle =
        midpoint(
            l[27],
            l[28]
        );


    /*
       Shoulder → hip → ankle
       should be reasonably straight.
    */

    const bodyAngle =
        angle(
            shoulder,
            hip,
            ankle
        );


    /*
       Torso should not be standing
       vertically.
    */

    const torsoDistance =
        Math.abs(
            shoulder.y -
            hip.y
        );


    /*
       Hands should remain around
       shoulder area.
    */

    const leftHand =
        distance(
            l[15],
            l[11]
        );

    const rightHand =
        distance(
            l[16],
            l[12]
        );


    const handsNear =
        Math.min(
            leftHand,
            rightHand
        ) < 0.30;


    /*
       Elbows should be below/around
       hand level, not arms hanging
       normally at the side.
    */

    const elbowBelow =
        (
            l[13].y >
            l[15].y - 0.08
        ) ||

        (
            l[14].y >
            l[16].y - 0.08
        );


    return (

        bodyAngle >
            140 &&

        torsoDistance <
            0.38 &&

        handsNear &&

        elbowBelow

    );

}



/* =========================================
   PLANK POSITION
========================================= */

function isPlankPosition(l){

    if(!required([

        l[11],
        l[12],

        l[15],
        l[16],

        l[23],
        l[24],

        l[27],
        l[28]

    ])){

        return false;

    }


    const shoulder =
        midpoint(
            l[11],
            l[12]
        );


    const hip =
        midpoint(
            l[23],
            l[24]
        );


    const ankle =
        midpoint(
            l[27],
            l[28]
        );


    const bodyAngle =
        angle(
            shoulder,
            hip,
            ankle
        );


    const handsNear =
        Math.min(

            distance(
                l[15],
                l[11]
            ),

            distance(
                l[16],
                l[12]
            )

        ) < 0.35;


    return (

        bodyAngle >
            135 &&

        Math.abs(
            shoulder.y -
            hip.y
        ) < 0.40 &&

        handsNear

    );

}



/* =========================================
   SKELETON
========================================= */

function getParts(l){

    return [

        [l[11],l[12]],

        [l[11],l[13]],
        [l[13],l[15]],

        [l[12],l[14]],
        [l[14],l[16]],

        [l[11],l[23]],
        [l[12],l[24]],

        [l[23],l[24]],

        [l[23],l[25]],
        [l[25],l[27]],

        [l[24],l[26]],
        [l[26],l[28]]

    ];

}



function drawPoint(
    point,
    color
){

    if(!good(point))
        return;


    ctx.beginPath();


    ctx.arc(

        point.x *
            canvas.width,

        point.y *
            canvas.height,

        4,

        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        color;

    ctx.fill();

}



function drawLine(
    a,
    b,
    color
){

    if(
        !good(a) ||
        !good(b)
    )
        return;


    ctx.beginPath();


    ctx.moveTo(

        a.x *
            canvas.width,

        a.y *
            canvas.height

    );


    ctx.lineTo(

        b.x *
            canvas.width,

        b.y *
            canvas.height

    );


    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        5;

    ctx.lineCap =
        "round";

    ctx.stroke();

}



/* =========================================
   DRAW BODY
========================================= */

function drawBody(l){

    ctx.clearRect(

        0,
        0,
        canvas.width,
        canvas.height

    );


    const visible =
        bodyIsVisible(l);


    if(visible){

        lostFrames =
            0;

        positionReady =
            true;

    }else{

        lostFrames++;

    }


    if(
        lostFrames >=
        10
    ){

        positionReady =
            false;

        resetMemory();

    }


    const color =
        positionReady
            ? "#00ff66"
            : "#ff3030";


    getParts(l).forEach(
        pair => {

            drawLine(
                pair[0],
                pair[1],
                color
            );

            drawPoint(
                pair[0],
                color
            );

            drawPoint(
                pair[1],
                color
            );

        }
    );


    if(positionReady){

        statusEl.style.color =
            "#00ff66";

        statusEl.textContent =
            "TRACKING";

    }else{

        statusEl.style.color =
            "#ff3030";

        statusEl.textContent =
            "MOVE INTO CAMERA";

    }

}



/* =========================================
   ADD REP
========================================= */

function addRep(){

    if(!positionReady)
        return;


    if(
        reps >=
        MAX_REPS
    )
        return;


    const now =
        Date.now();


    /*
       Basic anti-cheat debounce.
    */

    if(
        now -
        lastMovementTime <
        500
    ){

        return;

    }


    lastMovementTime =
        now;


    reps++;


    repEl.textContent =
        reps;


    statusEl.textContent =
        "REP " + reps;

    statusEl.style.color =
        "#00ff66";

}



/* =========================================
   MOVEMENT TRACKER
========================================= */

function detectMovement(l){

    if(!positionReady)
        return;


    const w =
        workout
        .toLowerCase()
        .trim();


    const shoulder =
        midpoint(
            l[11],
            l[12]
        );


    const hip =
        midpoint(
            l[23],
            l[24]
        );


    const leftKneeAngle =
        angle(
            l[23],
            l[25],
            l[27]
        );


    const rightKneeAngle =
        angle(
            l[24],
            l[26],
            l[28]
        );


    const kneeAngle =
        Math.min(
            leftKneeAngle,
            rightKneeAngle
        );


    const leftElbowAngle =
        angle(
            l[11],
            l[13],
            l[15]
        );


    const rightElbowAngle =
        angle(
            l[12],
            l[14],
            l[16]
        );


    const elbowAngle =
        Math.min(
            leftElbowAngle,
            rightElbowAngle
        );



    /* =====================================
       1. STRETCHING
    ===================================== */

    if(
        w ===
        "stretching"
    ){

        if(!required([

            l[11],
            l[12],
            l[15],
            l[16]

        ]))
            return;


        const handsUp =

            l[15].y <
                shoulder.y -
                0.05 ||

            l[16].y <
                shoulder.y -
                0.05;


        const handsDown =

            l[15].y >
                shoulder.y &&

            l[16].y >
                shoulder.y;


        if(
            state ===
            "NOT_READY"
        ){

            if(handsDown)
                state =
                    "READY";

            return;

        }


        if(
            state ===
                "READY" &&

            handsUp
        ){

            state =
                "MOVE";

            return;

        }


        if(
            state ===
                "MOVE" &&

            handsDown
        ){

            addRep();

            state =
                "READY";

        }

        return;

    }



    /* =====================================
       2. PUSH UP

       REAL PUSH-UP ONLY

       POSITION
       ↓
       CHEST DOWN
       ↓
       ELBOW BEND
       ↓
       CHEST UP
       ↓
       ELBOW EXTEND
       ↓
       REP
    ===================================== */

    if(
        w ===
        "push up"
    ){

        const pushPosition =
            isPushUpPosition(l);


        if(!pushPosition){

            state =
                "NOT_READY";

            memory.pushStartY =
                null;

            memory.pushLowestY =
                null;

            return;

        }


        const chestY =
            shoulder.y;


        if(
            state ===
            "NOT_READY"
        ){

            memory.pushStartY =
                chestY;

            memory.pushLowestY =
                chestY;

            state =
                "READY";

            return;

        }


        if(
            state ===
            "READY"
        ){

            if(
                chestY >
                memory.pushLowestY
            ){

                memory.pushLowestY =
                    chestY;

            }


            const chestDown =

                chestY >
                memory.pushStartY +
                0.025;


            const elbowsBent =
                elbowAngle <
                150;


            /*
               Both actual body movement
               and elbow bend are required.
            */

            if(
                chestDown &&
                elbowsBent
            ){

                state =
                    "MOVE";

            }

            return;

        }


        if(
            state ===
            "MOVE"
        ){

            if(
                chestY >
                memory.pushLowestY
            ){

                memory.pushLowestY =
                    chestY;

            }


            const chestUp =

                chestY <
                memory.pushLowestY -
                0.020;


            const elbowsExtended =
                elbowAngle >
                150;


            if(
                chestUp &&
                elbowsExtended
            ){

                addRep();


                state =
                    "READY";


                memory.pushStartY =
                    chestY;

                memory.pushLowestY =
                    chestY;

            }

        }

        return;

    }



    /* =====================================
       3. SQUAT
    ===================================== */

    if(
        w ===
        "squat"
    ){

        if(!required([

            l[23],
            l[24],
            l[25],
            l[26],
            l[27],
            l[28]

        ])){

            state =
                "NOT_READY";

            return;

        }


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;

        }


        /*
           Down.
        */

        if(
            state ===
                "READY" &&

            kneeAngle <
                145
        ){

            state =
                "MOVE";

            return;

        }


        /*
           Back to standing.
        */

        if(
            state ===
                "MOVE" &&

            kneeAngle >
                155
        ){

            addRep();

            state =
                "READY";

        }

        return;

    }



    /* =====================================
       4. HIGH KNEES

       KNEE UP
       ↓
       KNEE DOWN
       =
       REP
    ===================================== */

    if(
        w ===
        "high knees"
    ){

        if(!required([

            l[23],
            l[24],
            l[25],
            l[26]

        ]))
            return;


        const leftUp =
            l[25].y <
            l[23].y -
            0.055;


        const rightUp =
            l[26].y <
            l[24].y -
            0.055;


        const leftDown =
            !leftUp;


        const rightDown =
            !rightUp;


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;

        }


        if(
            state ===
                "READY" &&

            (
                leftUp ||
                rightUp
            )
        ){

            state =
                "MOVE";

            memory.highKneeSide =
                leftUp
                    ? "LEFT"
                    : "RIGHT";

            return;

        }


        if(
            state ===
                "MOVE"
        ){

            /*
               Knee must return down
               before another rep.
            */

            if(
                leftDown &&
                rightDown
            ){

                addRep();

                state =
                    "READY";

                memory.highKneeSide =
                    null;

            }

        }

        return;

    }



    /* =====================================
       5. LUNGES
    ===================================== */

    if(
        w ===
        "lunges"
    ){

        if(!required([

            l[23],
            l[24],
            l[25],
            l[26],
            l[27],
            l[28]

        ])){

            state =
                "NOT_READY";

            return;

        }


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;

        }


        /*
           Actual leg bend.
        */

        if(
            state ===
                "READY" &&

            kneeAngle <
                145
        ){

            state =
                "MOVE";

            return;

        }


        if(
            state ===
                "MOVE" &&

            kneeAngle >
                155
        ){

            addRep();

            state =
                "READY";

        }

        return;

    }



    /* =====================================
       6. MOUNTAIN CLIMBER

       MUST START FROM PLANK
    ===================================== */

    if(
        w ===
        "mountain climber"
    ){

        if(
            !isPlankPosition(l)
        ){

            state =
                "NOT_READY";

            return;

        }


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;

        }


        /*
           Knee comes toward chest.
        */

        const leftForward =
            Math.abs(
                l[25].x -
                l[23].x
            ) >
            0.055;


        const rightForward =
            Math.abs(
                l[26].x -
                l[24].x
            ) >
            0.055;


        const kneeForward =
            leftForward ||
            rightForward;


        if(
            state ===
                "READY" &&

            kneeForward
        ){

            state =
                "MOVE";

            return;

        }


        if(
            state ===
                "MOVE" &&

            !kneeForward
        ){

            addRep();

            state =
                "READY";

        }

        return;

    }



    /* =====================================
       7. JUMPING JACK
    ===================================== */

    if(
        w ===
        "jumping jack"
    ){

        if(!required([

            l[11],
            l[12],
            l[15],
            l[16],
            l[27],
            l[28]

        ]))
            return;


        const feetDistance =
            Math.abs(
                l[27].x -
                l[28].x
            );


        const feetOpen =
            feetDistance >
            0.18;


        const feetClosed =
            feetDistance <
            0.16;


        const handsUp =

            l[15].y <
                shoulder.y +
                0.03 ||

            l[16].y <
                shoulder.y +
                0.03;


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;

        }


        /*
           Open position.
        */

        if(
            state ===
                "READY" &&

            feetOpen &&
            handsUp
        ){

            state =
                "MOVE";

            return;

        }


        /*
           Close position.
        */

        if(
            state ===
                "MOVE" &&

            feetClosed
        ){

            addRep();

            state =
                "READY";

        }

        return;

    }



    /* =====================================
       8. BURPEES

       DOWN
       ↓
       STAND
       ↓
       JUMP
       =
       REP
    ===================================== */

    if(
        w ===
        "burpees"
    ){

        if(!required([

            l[11],
            l[12],
            l[23],
            l[24],
            l[25],
            l[26],
            l[27],
            l[28]

        ])){

            state =
                "NOT_READY";

            return;

        }


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;

        }


        const down =
            kneeAngle <
            145;


        const standing =
            kneeAngle >
            155;


        /*
           Ankles move above knees
           when jumping.
        */

        const jumping =

            l[27].y <
                l[25].y -
                0.035 &&

            l[28].y <
                l[26].y -
                0.035;


        if(
            state ===
                "READY" &&

            down
        ){

            state =
                "MOVE";

            return;

        }


        if(
            state ===
                "MOVE" &&

            standing
        ){

            state =
                "UP";

            return;

        }


        if(
            state ===
                "UP" &&

            jumping
        ){

            addRep();

            state =
                "READY";

        }

        return;

    }



    /* =====================================
       9. PLANK

       REAL PLANK HOLD

       1 SECOND = 1 COUNT
    ===================================== */

    if(
        w ===
        "plank"
    ){

        if(
            !isPlankPosition(l)
        ){

            state =
                "NOT_READY";

            plankStart =
                0;

            lastPlankSecond =
                0;

            reps =
                0;

            repEl.textContent =
                "0";

            return;

        }


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            plankStart =
                Date.now();

            lastPlankSecond =
                0;

            reps =
                0;

            repEl.textContent =
                "0";

            return;

        }


        const seconds =
            Math.min(

                MAX_REPS,

                Math.floor(

                    (
                        Date.now() -
                        plankStart
                    ) / 1000

                )

            );


        if(
            seconds >
            lastPlankSecond
        ){

            lastPlankSecond =
                seconds;

            reps =
                seconds;

            repEl.textContent =
                seconds;

            statusEl.textContent =
                seconds +
                " SEC";

            statusEl.style.color =
                "#00ff66";

        }

        return;

    }



    /* =====================================
       10. COOL DOWN
    ===================================== */

    if(
        w ===
        "cool down"
    ){

        if(!required([

            l[11],
            l[12],
            l[15],
            l[16]

        ]))
            return;


        const handsUp =

            l[15].y <
                shoulder.y -
                0.05 ||

            l[16].y <
                shoulder.y -
                0.05;


        const handsDown =

            l[15].y >
                shoulder.y &&

            l[16].y >
                shoulder.y;


        if(
            state ===
            "NOT_READY"
        ){

            if(handsDown){

                state =
                    "READY";

            }

            return;

        }


        if(
            state ===
                "READY" &&

            handsUp
        ){

            state =
                "MOVE";

            return;

        }


        if(
            state ===
                "MOVE" &&

            handsDown
        ){

            addRep();

            state =
                "READY";

        }

        return;

    }

}



/* =========================================
   MEDIAPIPE RESULTS
========================================= */

function onResults(results){

    if(!running)
        return;


    if(
        !results ||
        !results.poseLandmarks
    ){

        lostFrames++;


        if(
            lostFrames >=
            10
        ){

            positionReady =
                false;

            resetMemory();


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            statusEl.textContent =
                "MOVE INTO CAMERA";

            statusEl.style.color =
                "#ff3030";

        }


        return;

    }


    drawBody(
        results.poseLandmarks
    );


    if(positionReady){

        detectMovement(
            results.poseLandmarks
        );

    }

}



/* =========================================
   POSE
========================================= */

function setupPose(){

    pose =
        new Pose({

            locateFile:
                file =>

                    "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" +
                    file

        });


    pose.setOptions({

        modelComplexity:
            1,

        smoothLandmarks:
            true,

        enableSegmentation:
            false,

        minDetectionConfidence:
            0.45,

        minTrackingConfidence:
            0.45

    });


    pose.onResults(
        onResults
    );

}



/* =========================================
   CAMERA
========================================= */

async function startCamera(){

    try{

        loading.style.display =
            "flex";


        setupPose();


        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:
                            "user",

                        width:{
                            ideal:720
                        },

                        height:{
                            ideal:1280
                        },

                        aspectRatio:{
                            ideal:0.5625
                        }

                    },

                    audio:false

                });


        video.srcObject =
            stream;


        await video.play();


        canvas.width =
            video.videoWidth ||
            720;


        canvas.height =
            video.videoHeight ||
            1280;


        loading.style.display =
            "none";


        statusEl.textContent =
            "MOVE INTO CAMERA";

        statusEl.style.color =
            "#ff3030";


        resetMemory();


        requestAnimationFrame(
            processVideo
        );

    }
    catch(error){

        console.error(
            "Camera error:",
            error
        );


        loading.innerHTML = `

            <div
                style="
                color:#ff3030;
                font-size:18px;
                font-weight:bold;
                text-align:center;
                "
            >
                Camera could not start
            </div>

            <div
                style="
                color:#aaa;
                font-size:13px;
                text-align:center;
                margin-top:5px;
                "
            >
                Please allow camera permission
                and reload the page.
            </div>

        `;

    }

}



/* =========================================
   PROCESS CAMERA
========================================= */

async function processVideo(){

    if(!running)
        return;


    if(
        video.readyState >= 2 &&
        !processing
    ){

        processing =
            true;


        try{

            await pose.send({

                image:
                    video

            });

        }
        catch(error){

            console.error(
                "Pose error:",
                error
            );

        }


        processing =
            false;

    }


    requestAnimationFrame(
        processVideo
    );

}



/* =========================================
   STOP CAMERA
========================================= */

function stopCamera(){

    running =
        false;


    if(stream){

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        stream =
            null;

    }

}



/* =========================================
   QUIT
========================================= */

quitBtn.onclick =
    function(){

        stopCamera();


        location.href =
            "daily-task.html";

    };



/* =========================================
   FINISH
========================================= */

finishBtn.onclick =
    async function(){

        if(reps <= 0){

            alert(
                "Complete at least 1 rep."
            );

            return;

        }


        const user =
            auth.currentUser;


        if(!user){

            alert(
                "Please login before saving."
            );

            return;

        }


        finishBtn.disabled =
            true;


        try{

            const userRef =
                db
                    .collection("users")
                    .doc(user.uid);


            const snap =
                await userRef.get();


            const data =
                snap.exists
                    ? snap.data()
                    : {};


            const oldPoints =
                Number(
                    data.totalPoints ||
                    0
                );


            const workoutOrder = [

                "Stretching",

                "Push Up",

                "Squat",

                "High Knees",

                "Lunges",

                "Mountain Climber",

                "Jumping Jack",

                "Burpees",

                "Plank",

                "Cool Down"

            ];


            let completedTasks =

                Array.isArray(
                    data.completedTasks
                )

                ? [
                    ...data.completedTasks
                ]

                : [];


            const workoutIndex =

                workoutOrder.findIndex(

                    name =>

                        name.toLowerCase() ===
                        workout.toLowerCase()

                );


            if(

                workoutIndex >= 0 &&

                !completedTasks.includes(
                    workoutIndex
                )

            ){

                completedTasks.push(
                    workoutIndex
                );

            }


            completedTasks =
                [
                    ...new Set(
                        completedTasks
                    )
                ].sort(
                    (a,b) =>
                        a-b
                );


            await userRef.set({

                totalPoints:
                    oldPoints +
                    reps,

                completedTasks:
                    completedTasks,

                lastWorkout:
                    workout,

                lastWorkoutReps:
                    reps,

                updatedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            },{
                merge:true
            });


            stopCamera();


            location.href =
                "daily-task.html";

        }
        catch(error){

            console.error(
                "Save error:",
                error
            );


            alert(
                "Could not save workout. Please try again."
            );


            finishBtn.disabled =
                false;

        }

    };



/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    function(){

        if(
            video.videoWidth &&
            video.videoHeight
        ){

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;

        }

    }
);



/* =========================================
   START
========================================= */

startCamera();

</script>
