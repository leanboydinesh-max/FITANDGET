<script>

/* =====================================================

/* =====================================================

const video =

/* =====================================================
   WORKOUT

const params =

let workout =

    params.get("task") ||

workout =

workoutNameEl.textContent =

/* =====================================================
   VARIABLES
===================================================== */

let camera = null;

let cameraStarted = false;

let repCount = 0;

let user = null;

let phase = "up";

let frameDown = 0;

let frameUp = 0;

let leftRightState = false;

let holdFrames = 0;

let lastRepTime = 0;

let burpeeStage = "stand";

let initialized = false;


/* =====================================================
   AUTH
===================================================== */

firebase.auth()
.onAuthStateChanged(u => {

    user = u;

});


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

    const rect =
        canvas.getBoundingClientRect();

    canvas.width =
        rect.width;

    canvas.height =
        rect.height;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =====================================================
   STATUS
===================================================== */

function setStatus(text,type){

    statusEl.textContent =
        text;

    statusEl.className =
        "status " + type;
}


/* =====================================================
   GUIDE
===================================================== */

function setGuide(title,text){

    guideEl.innerHTML =
        `
        <div class="guideTitle">
            ${title}
        </div>

        <div class="guideText">
            ${text}
        </div>
        `;
}


function setupGuide(){

    const w =
        workout.toLowerCase();

    if(w.includes("push")){

        setGuide(
            "PUSH UP",
            "Body straight<br>Hands down<br>Chest moves"
        );

    }

    else if(w.includes("squat")){

        setGuide(
            "SQUAT",
            "Feet apart<br>Knees bend<br>Chest up"
        );

    }

    else if(w.includes("high")){

        setGuide(
            "HIGH KNEES",
            "Stand straight<br>Lift knees<br>Alternate"
        );

    }

    else if(w.includes("lunge")){

        setGuide(
            "LUNGES",
            "Step forward<br>Bend knee<br>Return"
        );

    }

    else if(w.includes("mountain")){

        setGuide(
            "MOUNTAIN CLIMBER",
            "Plank position<br>Drive knees<br>Alternate"
        );

    }

    else if(w.includes("jumping")){

        setGuide(
            "JUMPING JACK",
            "Arms up<br>Legs apart<br>Return"
        );

    }

    else if(w.includes("burpee")){

        setGuide(
            "BURPEE",
            "Stand → Down<br>Plank → Stand"
        );

    }

    else if(w.includes("plank")){

        setGuide(
            "PLANK",
            "Straight body<br>Hold position"
        );

    }

    else if(w.includes("stretch")){

        setGuide(
            "STRETCH",
            "Raise arms<br>Hold<br>Return"
        );

    }

    else{

        setGuide(
            "COOL DOWN",
            "Slow movement<br>Stretch<br>Relax"
        );
    }
}

setupGuide();


/* =====================================================
   MEDIAPIPE HELPERS
===================================================== */

function visible(lm,i){

    if(!lm[i])
        return false;

    if(lm[i].visibility === undefined)
        return true;

    return lm[i].visibility > .25;
}


function angle(a,b,c){

    if(!a || !b || !c)
        return 180;

    const abx =
        a.x-b.x;

    const aby =
        a.y-b.y;

    const cbx =
        c.x-b.x;

    const cby =
        c.y-b.y;

    const dot =
        abx*cbx +
        aby*cby;

    const mag1 =
        Math.sqrt(
            abx*abx+
            aby*aby
        );

    const mag2 =
        Math.sqrt(
            cbx*cbx+
            cby*cby
        );

    if(!mag1 || !mag2)
        return 180;

    let value =
        dot/(mag1*mag2);

    value =
        Math.max(
            -1,
            Math.min(1,value)
        );

    return Math.acos(value)
        *180/Math.PI;
}


function distance(a,b){

    if(!a || !b)
        return 999;

    return Math.sqrt(
        Math.pow(a.x-b.x,2)+
        Math.pow(a.y-b.y,2)
    );
}


/* =====================================================
   SIDE
===================================================== */

function bestSide(lm,idsLeft,idsRight){

    let left=0;

    let right=0;

    idsLeft.forEach(i=>{

        if(lm[i])
            left +=
                lm[i].visibility || 1;
    });

    idsRight.forEach(i=>{

        if(lm[i])
            right +=
                lm[i].visibility || 1;
    });

    return left >= right
        ? "left"
        : "right";
}


/* =====================================================
   MAP POINT
===================================================== */

function mapPoint(p){

    if(!p)
        return null;

    let x =
        p.x * canvas.width;

    let y =
        p.y * canvas.height;

    x =
        Math.max(
            3,
            Math.min(
                canvas.width-3,
                x
            )
        );

    y =
        Math.max(
            3,
            Math.min(
                canvas.height-3,
                y
            )
        );

    return {
        x:x,
        y:y
    };
}


/* =====================================================
   DRAW
===================================================== */

function line(a,b,color){

    const p1 =
        mapPoint(a);

    const p2 =
        mapPoint(b);

    if(!p1 || !p2)
        return;

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.lineTo(
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        5;

    ctx.lineCap =
        "round";

    ctx.stroke();
}


function point(p,color){

    const q =
        mapPoint(p);

    if(!q)
        return;

    ctx.beginPath();

    ctx.arc(
        q.x,
        q.y,
        7,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        color;

    ctx.fill();
}


function drawChain(lm,ids,color){

    for(
        let i=0;
        i<ids.length-1;
        i++
    ){

        line(
            lm[ids[i]],
            lm[ids[i+1]],
            color
        );

        point(
            lm[ids[i]],
            color
        );
    }

    point(
        lm[ids[ids.length-1]],
        color
    );
}


/* =====================================================
   REP
===================================================== */

function addRep(){

    const now =
        Date.now();

    if(
        now-lastRepTime <
        500
    )
        return;

    if(repCount >= 50)
        return;

    repCount++;

    repCountEl.textContent =
        repCount;

    lastRepTime =
        now;
}


/* =====================================================
   1. PUSH UP
   SHOULDER → ELBOW → WRIST
===================================================== */

function detectPushUp(lm){

    const side =
        bestSide(
            lm,
            [11,13,15],
            [12,14,16]
        );

    let s,e,w;

    if(side==="left"){

        s=lm[11];
        e=lm[13];
        w=lm[15];

    }else{

        s=lm[12];
        e=lm[14];
        w=lm[16];
    }

    if(
        !s ||
        !e ||
        !w
    ){

        setStatus(
            "Show your upper body",
            "red"
        );

        return false;
    }

    const a =
        angle(s,e,w);

    if(a < 120){

        frameDown++;

        frameUp=0;

        setStatus(
            "DOWN ↓",
            "green"
        );

        if(
            phase==="up" &&
            frameDown>=3
        ){

            phase="down";

            frameDown=0;
        }

    }

    else if(a > 150){

        frameUp++;

        frameDown=0;

        setStatus(
            "UP ↑",
            "green"
        );

        if(
            phase==="down" &&
            frameUp>=3
        ){

            addRep();

            phase="up";

            frameUp=0;
        }

    }

    else{

        frameDown=0;

        frameUp=0;

        setStatus(
            "READY",
            "green"
        );
    }

    return true;
}


/* =====================================================
   2. SQUAT
   HIP → KNEE → ANKLE
===================================================== */

function detectSquat(lm){

    const side =
        bestSide(
            lm,
            [23,25,27],
            [24,26,28]
        );

    let h,k,a;

    if(side==="left"){

        h=lm[23];
        k=lm[25];
        a=lm[27];

    }else{

        h=lm[24];
        k=lm[26];
        a=lm[28];
    }

    if(
        !h ||
        !k ||
        !a
    ){

        setStatus(
            "Show your legs",
            "red"
        );

        return false;
    }

    const knee =
        angle(h,k,a);

    if(knee < 125){

        frameDown++;

        frameUp=0;

        setStatus(
            "DOWN ↓",
            "green"
        );

        if(
            phase==="up" &&
            frameDown>=3
        ){

            phase="down";

            frameDown=0;
        }

    }

    else if(knee > 155){

        frameUp++;

        frameDown=0;

        setStatus(
            "UP ↑",
            "green"
        );

        if(
            phase==="down" &&
            frameUp>=3
        ){

            addRep();

            phase="up";

            frameUp=0;
        }

    }

    else{

        frameDown=0;
        frameUp=0;

        setStatus(
            "READY",
            "green"
        );
    }

    return true;
}


/* =====================================================
   3. HIGH KNEES
===================================================== */

function detectHighKnees(lm){

    const required =
        [
            23,24,
            25,26,
            27,28
        ];

    if(
        !required.every(
            i=>visible(lm,i)
        )
    ){

        setStatus(
            "Show your full legs",
            "red"
        );

        return false;
    }

    const left =
        lm[25].y < lm[23].y-.08;

    const right =
        lm[26].y < lm[24].y-.08;

    if(left !== leftRightState){

        if(left){

            leftRightState=true;

            addRep();

        }
    }

    if(right && leftRightState){

        leftRightState=false;

        addRep();
    }

    setStatus(
        "KNEES UP",
        "green"
    );

    return true;
}


/* =====================================================
   4. LUNGES
===================================================== */

function detectLunge(lm){

    const leftAngle =
        angle(
            lm[23],
            lm[25],
            lm[27]
        );

    const rightAngle =
        angle(
            lm[24],
            lm[26],
            lm[28]
        );

    if(
        !visible(lm,23) ||
        !visible(lm,25) ||
        !visible(lm,27) ||
        !visible(lm,24) ||
        !visible(lm,26) ||
        !visible(lm,28)
    ){

        setStatus(
            "Show both legs",
            "red"
        );

        return false;
    }

    const bent =
        leftAngle < 115 ||
        rightAngle < 115;

    const straight =
        leftAngle > 155 &&
        rightAngle > 155;

    if(bent){

        phase="down";

        setStatus(
            "LUNGE DOWN",
            "green"
        );

    }

    else if(
        straight &&
        phase==="down"
    ){

        addRep();

        phase="up";

        setStatus(
            "REP ✓",
            "green"
        );

    }

    else{

        setStatus(
            "READY",
            "green"
        );
    }

    return true;
}


/* =====================================================
   5. MOUNTAIN CLIMBER
===================================================== */

function detectMountain(lm){

    if(
        !visible(lm,11) ||
        !visible(lm,12) ||
        !visible(lm,23) ||
        !visible(lm,24) ||
        !visible(lm,25) ||
        !visible(lm,26)
    ){

        setStatus(
            "Show plank position",
            "red"
        );

        return false;
    }

    const leftKnee =
        lm[25];

    const rightKnee =
        lm[26];

    const leftHip =
        lm[23];

    const rightHip =
        lm[24];

    const leftMove =
        leftKnee.y <
        leftHip.y-.05;

    const rightMove =
        rightKnee.y <
        rightHip.y-.05;

    if(
        leftMove &&
        !leftRightState
    ){

        leftRightState=true;

        addRep();

        setStatus(
            "LEFT KNEE ✓",
            "green"
        );
    }

    else if(
        rightMove &&
        leftRightState
    ){

        leftRightState=false;

        addRep();

        setStatus(
            "RIGHT KNEE ✓",
            "green"
        );
    }

    else{

        setStatus(
            "READY",
            "green"
        );
    }

    return true;
}


/* =====================================================
   6. JUMPING JACK
   WRISTS UP + ANKLES APART
===================================================== */

function detectJumpingJack(lm){

    if(
        !visible(lm,15) ||
        !visible(lm,16) ||
        !visible(lm,27) ||
        !visible(lm,28)
    ){

        setStatus(
            "Show full body",
            "red"
        );

        return false;
    }

    const armsUp =
        lm[15].y <
        lm[11].y-.08 &&
        lm[16].y <
        lm[12].y-.08;

    const legsApart =
        Math.abs(
            lm[27].x-
            lm[28].x
        ) > .22;

    const open =
        armsUp &&
        legsApart;

    if(open){

        setStatus(
            "OPEN ✓",
            "green"
        );

        if(
            phase==="up"
        ){

            phase="down";
        }

    }

    else{

        if(
            phase==="down"
        ){

            addRep();

            phase="up";
        }

        setStatus(
            "READY",
            "green"
        );
    }

    return true;
}


/* =====================================================
   7. BURPEE
===================================================== */

function detectBurpee(lm){

    if(
        !visible(lm,11) ||
        !visible(lm,12) ||
        !visible(lm,23) ||
        !visible(lm,24) ||
        !visible(lm,27) ||
        !visible(lm,28)
    ){

        setStatus(
            "Show full body",
            "red"
        );

        return false;
    }

    const hipY =
        (lm[23].y+
         lm[24].y)/2;

    const ankleY =
        (lm[27].y+
         lm[28].y)/2;

    const shoulderY =
        (lm[11].y+
         lm[12].y)/2;

    const standing =
        hipY <
        ankleY-.25;

    const low =
        hipY >
        shoulderY+.05;

    if(
        burpeeStage==="stand" &&
        low
    ){

        burpeeStage="down";

        setStatus(
            "DOWN ✓",
            "green"
        );
    }

    else if(
        burpeeStage==="down" &&
        standing
    ){

        addRep();

        burpeeStage="stand";

        setStatus(
            "REP ✓",
            "green"
        );
    }

    else{

        setStatus(
            "READY",
            "green"
        );
    }

    return true;
}


/* =====================================================
   8. PLANK
===================================================== */

function detectPlank(lm){

    const side =
        bestSide(
            lm,
            [11,23,27],
            [12,24,28]
        );

    let shoulder;
    let hip;
    let ankle;

    if(side==="left"){

        shoulder=lm[11];
        hip=lm[23];
        ankle=lm[27];

    }else{

        shoulder=lm[12];
        hip=lm[24];
        ankle=lm[28];
    }

    if(
        !shoulder ||
        !hip ||
        !ankle
    ){

        setStatus(
            "Show your full body",
            "red"
        );

        holdFrames=0;

        return false;
    }

    const bodyAngle =
        angle(
            shoulder,
            hip,
            ankle
        );

    if(
        bodyAngle > 155
    ){

        holdFrames++;

        setStatus(
            "PLANK ✓",
            "green"
        );

        /*
          Plank uses time-based counting.
          Every 30 frames ≈ 1 second.
        */

        if(
            holdFrames>=30
        ){

            addRep();

            holdFrames=0;
        }

    }

    else{

        holdFrames=0;

        setStatus(
            "Straighten your body",
            "red"
        );
    }

    return true;
}


/* =====================================================
   9. STRETCHING
===================================================== */

function detectStretch(lm){

    if(
        !visible(lm,11) ||
        !visible(lm,12) ||
        !visible(lm,15) ||
        !visible(lm,16)
    ){

        setStatus(
            "Show your upper body",
            "red"
        );

        return false;
    }

    const armsUp =
        lm[15].y <
        lm[11].y-.10 &&
        lm[16].y <
        lm[12].y-.10;

    if(armsUp){

        holdFrames++;

        setStatus(
            "HOLD ✓",
            "green"
        );

        if(
            holdFrames>=30
        ){

            addRep();

            holdFrames=0;
        }

    }else{

        holdFrames=0;

        setStatus(
            "Raise your arms",
            "red"
        );
    }

    return true;
}


/* =====================================================
   10. COOL DOWN
===================================================== */

function detectCoolDown(lm){

    if(
        !visible(lm,11) ||
        !visible(lm,12) ||
        !visible(lm,15) ||
        !visible(lm,16)
    ){

        setStatus(
            "Show your upper body",
            "red"
        );

        return false;
    }

    const armDistance =
        distance(
            lm[15],
            lm[16]
        );

    /*
      Slow wide-arm movement.
    */

    if(
        armDistance > .30
    ){

        setStatus(
            "STRETCH ✓",
            "green"
        );

        holdFrames++;

        if(
            holdFrames>=45
        ){

            addRep();

            holdFrames=0;
        }

    }else{

        holdFrames=0;

        setStatus(
            "Move slowly",
            "green"
        );
    }

    return true;
}

/* =====================================================
   DETECTION ROUTER
===================================================== */

function detectWorkout(lm){

    const w =
        workout.toLowerCase();

    if(w.includes("push"))
        return detectPushUp(lm);

    if(w.includes("squat"))
        return detectSquat(lm);

    if(w.includes("high"))
        return detectHighKnees(lm);

    if(w.includes("lunge"))
        return detectLunge(lm);

    if(w.includes("mountain"))
        return detectMountain(lm);

    if(w.includes("jumping"))
        return detectJumpingJack(lm);

    if(w.includes("burpee"))
        return detectBurpee(lm);

    if(w.includes("plank"))
        return detectPlank(lm);

    if(w.includes("stretch"))
        return detectStretch(lm);

    return detectCoolDown(lm);
}


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onPoseResults(results){

    if(!cameraStarted)
        return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(
        !results ||
        !results.poseLandmarks
    ){

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }

    const lm =
        results.poseLandmarks;


    /*
      First detect if required
      body exists.
    */

    const important =
        lm.filter(
            p =>
            p &&
            (
                p.visibility === undefined ||
                p.visibility>.25
            )
        ).length;

    if(important < 5){

        drawWorkout(
            lm,
            "#ff3030"
        );

        setStatus(
            "Move into camera view",
            "red"
        );

        return;
    }


    /*
      Run workout-specific detector.
    */

    let correct =
        detectWorkout(lm);


    /*
      RED = incorrect / incomplete
      GREEN = usable position
    */

    drawWorkout(
        lm,
        correct
        ? "#00ff66"
        : "#ff3030"
    );
}


/* =====================================================
   CAMERA START
===================================================== */

async function startAI(){

    if(cameraStarted)
        return;

    try{

        setStatus(
            "Opening camera...",
            "yellow"
        );

        cameraStarted=true;

        await camera.start();

        setStatus(
            "Move into the guide position",
            "red"
        );

    }

    catch(error){

        console.error(error);

        cameraStarted=false;

        setStatus(
            "Camera permission needed",
            "red"
        );
    }
}


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new Camera(
        video,
        {

            onFrame:async()=>{

                if(!cameraStarted)
                    return;

                try{

                    await pose.send({
                        image:video
                    });

                }

                catch(error){

                    console.error(error);
                }
            },

            width:720,
            height:1280
        }
    );


/* =====================================================
   POSE
===================================================== */

const pose =
    new Pose({

        locateFile:(file)=>{

            return
            "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"
            +file;
        }
    });


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    smoothSegmentation:false,

    minDetectionConfidence:.45,

    minTrackingConfidence:.45
});


pose.onResults(
    onPoseResults
);


/* =====================================================
   STOP
===================================================== */

function stopCamera(){

    cameraStarted=false;

    try{

        camera.stop();

    }catch(e){}

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =====================================================
   QUIT
   NO SAVE
===================================================== */

function quitWorkout(){

    stopCamera();

    window.location.href =
        "daily-task.html";
}


/* =====================================================
   FINISH
===================================================== */

async function finishWorkout(){

    if(!user){

        alert(
            "Please login first."
        );

        return;
    }

    if(repCount<=0){

        alert(
            "Complete at least 1 rep."
        );

        return;
    }

    stopCamera();

    try{

        const ref =
            db.collection("users")
              .doc(user.uid);

        const snap =
            await ref.get();

        const data =
            snap.exists
            ? snap.data()
            : {};

        const oldPoints =
            Number(
                data.totalPoints || 0
            );

        let completedTasks =
            Array.isArray(
                data.completedTasks
            )
            ? data.completedTasks
            : [];

        if(
            completedTasks.includes(
                workout
            )
        ){

            alert(
                "This workout is already completed."
            );

            window.location.href =
                "daily-task.html";

            return;
        }

        completedTasks.push(
            workout
        );

        await ref.set({

            totalPoints:
                oldPoints + repCount,

            completedTasks:
                completedTasks

        },{
            merge:true
        });

        alert(
            "Workout completed!\n+" +
            repCount +
            " RC"
        );

        window.location.href =
            "daily-task.html";

    }

    catch(error){

        console.error(error);

        alert(
            "Could not save workout."
        );
    }
}


/* =====================================================
   AUTO START
===================================================== */

setStatus(
    "Opening camera...",
    "yellow"
);

setTimeout(
    ()=>{
        startAI();
    },
    300
);
