<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
>

<title>FIT & GET - AI Workout</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,Arial,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.camera-screen{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:100vh;
    background:#000;
    overflow:hidden;
}

/* CAMERA */

#camera{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
    transform:scaleX(-1);
}

/* AI BODY LINES */

#poseCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:5;
    pointer-events:none;
    transform:scaleX(-1);
}

/* TOP */

.top-bar{
    position:absolute;
    top:calc(12px + env(safe-area-inset-top));
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:30;
}

.timer{
    background:rgba(0,0,0,.72);
    padding:9px 15px;
    border-radius:25px;

    color:#9DFF00;
    font-weight:800;

    border:1px solid #9DFF00;
}

.quit-btn{
    background:#ff3b30;
    color:#fff;

    border:none;
    padding:10px 17px;

    border-radius:25px;

    font-weight:800;
}

/* AI STATUS */

.center-box{
    position:absolute;

    top:34%;
    left:50%;

    transform:translate(-50%,-50%);

    z-index:25;
}

.ai-box{
    display:flex;
    align-items:center;
    gap:9px;

    padding:10px 17px;

    border-radius:30px;

    background:rgba(0,0,0,.72);

    border:2px solid #9DFF00;

    color:#9DFF00;

    font-size:14px;
    font-weight:800;

    white-space:nowrap;

    box-shadow:0 0 15px rgba(0,0,0,.5);
}

.ai-dot{
    width:11px;
    height:11px;

    border-radius:50%;

    background:#9DFF00;

    box-shadow:0 0 14px #9DFF00;
}

/* BOTTOM CARD */

.bottom-card{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    max-height:43dvh;

    overflow-y:auto;

    padding:
        13px
        16px
        calc(12px + env(safe-area-inset-bottom));

    background:rgba(8,8,8,.96);

    border-top:
        2px solid
        #9DFF00;

    border-radius:
        24px
        24px
        0
        0;

    text-align:center;

    color:#fff;

    z-index:40;
}

.bottom-card h2{
    font-size:22px;
    margin-bottom:3px;
}

.set{
    color:#aaa;
    margin-bottom:7px;
    font-size:13px;
}

.max-text{
    color:#9DFF00;
    font-size:13px;
    font-weight:800;
}

.rep-box{
    margin-top:2px;
}

.rep-box h1{
    font-size:52px;
    color:#9DFF00;
    line-height:.95;
}

.rep-box span{
    font-size:15px;
    font-weight:800;
}

.max-limit{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

/* COMPLETE */

#completeBtn{
    margin-top:9px;

    width:100%;
    height:50px;

    border:none;
    border-radius:14px;

    background:#9DFF00;
    color:#000;

    font-size:15px;
    font-weight:900;

    box-shadow:
        0 0 15px
        rgba(157,255,0,.25);
}

#completeBtn:disabled{
    opacity:.35;
    box-shadow:none;
}

/* SMALL PHONES */

@media(max-height:650px){

    .center-box{
        top:28%;
    }

    .bottom-card{
        max-height:46dvh;
        padding-top:9px;
    }

    .bottom-card h2{
        font-size:19px;
    }

    .rep-box h1{
        font-size:42px;
    }

    #completeBtn{
        height:45px;
        margin-top:6px;
    }

}

</style>

</head>

<body>

<div class="camera-screen">

    <video
        id="camera"
        autoplay
        playsinline>
    </video>

    <canvas id="poseCanvas"></canvas>


    <!-- TOP -->

    <div class="top-bar">

        <div class="timer">
            ⏱ <span id="time">00:00</span>
        </div>

        <button
            class="quit-btn"
            id="quitBtn">

            QUIT

        </button>

    </div>


    <!-- AI STATUS -->

    <div class="center-box">

        <div
            class="ai-box"
            id="aiBox">

            <div
                class="ai-dot"
                id="aiDot">
            </div>

            <span id="aiStatus">
                Loading AI...
            </span>

        </div>

    </div>


    <!-- BOTTOM -->

    <div class="bottom-card">

        <h2 id="exerciseName">
            Workout
        </h2>

        <p class="set">
            Do Your Max • 1 Set
        </p>

        <div class="max-text">
            MAX COUNT
        </div>

        <div class="rep-box">

            <h1 id="repCount">
                0
            </h1>

            <span>
                REPS
            </span>

        </div>

        <div class="max-limit">
            Maximum 50 Reps
        </div>

        <button
            id="completeBtn"
            disabled>

            COMPLETE WORKOUT ✓

        </button>

    </div>

</div>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",

    authDomain:
    "fitandget-b3461.firebaseapp.com",

    projectId:
    "fitandget-b3461",

    storageBucket:
    "fitandget-b3461.firebasestorage.app",

    messagingSenderId:
    "216178533513",

    appId:
    "1:216178533513:web:975f20599c7e77b9d01258"

};

firebase.initializeApp(firebaseConfig);

const db =
    firebase.firestore();


/* =====================================================
   WORKOUTS
===================================================== */

const workouts = [

    "Stretching",
    "Push Up",
    "Squat",
    "High Knees",
    "Lunges",
    "Mountain Climber",
    "Jumping Jack",
    "Burpees",
    "Plank",
    "Cool Down"

];


/* =====================================================
   SELECTED WORKOUT
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let workoutIndex =
    parseInt(
        params.get("workout")
    );

if(
    isNaN(workoutIndex) ||
    workoutIndex < 0 ||
    workoutIndex >= workouts.length
){

    workoutIndex = 0;

}

const exerciseName =
    workouts[workoutIndex];

document.getElementById(
    "exerciseName"
).innerText =
    exerciseName;


/* =====================================================
   VARIABLES
===================================================== */

let repCount = 0;

let currentUser = null;

let completedTasks = [];

let saving = false;

let cameraStarted = false;

let poseReady = false;


/* Separate stages */

let pushStage = "up";

let squatStage = "up";

let jackStage = "closed";

let lungeStage = "up";

let kneeStage = "down";

let mountainStage = "away";

let burpeeStage = "up";

let stretchStage = "down";

let cooldownStage = "up";


let plankStart = 0;

let plankCounted = false;


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "camera"
    );

const repDisplay =
    document.getElementById(
        "repCount"
    );

const completeBtn =
    document.getElementById(
        "completeBtn"
    );

const aiStatus =
    document.getElementById(
        "aiStatus"
    );

const aiBox =
    document.getElementById(
        "aiBox"
    );

const aiDot =
    document.getElementById(
        "aiDot"
    );

const poseCanvas =
    document.getElementById(
        "poseCanvas"
    );

const poseCtx =
    poseCanvas.getContext("2d");


/* =====================================================
   AI STATUS
===================================================== */

function setAIStatus(
    message,
    type = "good"
){

    aiStatus.innerText =
        message;


    let color =
        "#00ff66";


    if(type === "bad"){

        color =
            "#ff3b30";

    }


    if(type === "warn"){

        color =
            "#ffd60a";

    }


    aiBox.style.borderColor =
        color;

    aiStatus.style.color =
        color;

    aiDot.style.background =
        color;

    aiDot.style.boxShadow =
        "0 0 14px " + color;

}


/* =====================================================
   VISIBILITY
===================================================== */

function visible(point){

    return point &&
        (
            point.visibility === undefined ||
            point.visibility > .45
        );

}


/* =====================================================
   DRAW BODY
===================================================== */

const POSE_CONNECTIONS = [

    [11,12],

    [11,13],
    [13,15],

    [12,14],
    [14,16],

    [11,23],
    [12,24],

    [23,24],

    [23,25],
    [25,27],

    [24,26],
    [26,28]

];


function drawPose(
    landmarks,
    type = "good"
){

    const width =
        poseCanvas.clientWidth;

    const height =
        poseCanvas.clientHeight;


    if(
        !width ||
        !height
    ){

        return;

    }


    poseCanvas.width =
        Math.round(
            width *
            devicePixelRatio
        );

    poseCanvas.height =
        Math.round(
            height *
            devicePixelRatio
        );


    poseCtx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );


    poseCtx.clearRect(
        0,
        0,
        width,
        height
    );


    let color =
        "#00ff66";


    if(type === "bad"){

        color =
            "#ff3b30";

    }


    if(type === "warn"){

        color =
            "#ffd60a";

    }


    poseCtx.strokeStyle =
        color;

    poseCtx.fillStyle =
        color;

    poseCtx.lineWidth =
        4;

    poseCtx.lineCap =
        "round";


    POSE_CONNECTIONS.forEach(
        connection => {

            const a =
                landmarks[
                    connection[0]
                ];

            const b =
                landmarks[
                    connection[1]
                ];


            if(
                visible(a) &&
                visible(b)
            ){

                poseCtx.beginPath();

                poseCtx.moveTo(
                    a.x * width,
                    a.y * height
                );

                poseCtx.lineTo(
                    b.x * width,
                    b.y * height
                );

                poseCtx.stroke();

            }

        }
    );


    landmarks.forEach(
        point => {

            if(
                visible(point)
            ){

                poseCtx.beginPath();

                poseCtx.arc(
                    point.x * width,
                    point.y * height,
                    4,
                    0,
                    Math.PI * 2
                );

                poseCtx.fill();

            }

        }
    );

}


/* =====================================================
   AUTH
===================================================== */

firebase.auth()
.onAuthStateChanged(
async(user) => {

    if(!user){

        window.location.href =
            "index.html";

        return;

    }


    currentUser =
        user;


    try{

        const userDoc =
            await db
            .collection("users")
            .doc(user.uid)
            .get();


        if(
            userDoc.exists
        ){

            const data =
                userDoc.data();


            completedTasks =
                Array.isArray(
                    data.completedTasks
                )
                ?
                data.completedTasks
                :
                [];


            if(
                completedTasks.includes(
                    workoutIndex
                )
            ){

                alert(
                    "This workout is already completed!"
                );

                window.location.href =
                    "daily-task.html";

                return;

            }

        }


        startAI();

    }
    catch(error){

        console.error(
            error
        );

        setAIStatus(
            "User loading error",
            "bad"
        );

    }

});


/* =====================================================
   MEDIAPIPE POSE
===================================================== */

const pose =
    new Pose({

        locateFile:
        (file) => {

            return (
                "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"
                +
                file
            );

        }

    });


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    smoothSegmentation:false,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55

});


pose.onResults(
    onPoseResults
);


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new Camera(
        video,
        {

            onFrame:
            async() => {

                if(
                    !cameraStarted
                ){

                    return;

                }


                try{

                    await pose.send({
                        image:video
                    });

                }
                catch(error){

                    console.error(
                        error
                    );

                }

            },

            width:720,

            height:1280

        }
    );


/* =====================================================
   START CAMERA
===================================================== */

async function startAI(){

    if(cameraStarted){

        return;

    }


    try{

        setAIStatus(
            "Starting Camera AI...",
            "warn"
        );


        cameraStarted =
            true;


        await camera.start();


        setAIStatus(
            "Show your full body",
            "warn"
        );

    }
    catch(error){

        cameraStarted =
            false;


        console.error(
            error
        );


        setAIStatus(
            "Camera permission required",
            "bad"
        );


        alert(
            "Please allow camera permission."
        );

    }

}


/* =====================================================
   ANGLE
===================================================== */

function calculateAngle(
    a,
    b,
    c
){

    const radians =
        Math.atan2(
            c.y - b.y,
            c.x - b.x
        )
        -
        Math.atan2(
            a.y - b.y,
            a.x - b.x
        );


    let angle =
        Math.abs(
            radians *
            180 /
            Math.PI
        );


    if(
        angle > 180
    ){

        angle =
            360 - angle;

    }


    return angle;

}


/* =====================================================
   ADD REP
===================================================== */

function addRep(){

    if(
        repCount >= 50
    ){

        return;

    }


    repCount++;


    repDisplay.innerText =
        repCount;


    completeBtn.disabled =
        false;

}


/* =====================================================
   POSE RESULTS
===================================================== */

function onPoseResults(
    results
){

    if(
        !results ||
        !results.poseLandmarks
    ){

        poseReady =
            false;


        poseCtx.clearRect(
            0,
            0,
            poseCanvas.width,
            poseCanvas.height
        );


        setAIStatus(
            "Move into camera view",
            "bad"
        );


        return;

    }


    poseReady =
        true;


    const lm =
        results.poseLandmarks;


    switch(exerciseName){

        case "Stretching":
            detectStretching(lm);
            break;

        case "Push Up":
            detectPushUp(lm);
            break;

        case "Squat":
            detectSquat(lm);
            break;

        case "High Knees":
            detectHighKnees(lm);
            break;

        case "Lunges":
            detectLunges(lm);
            break;

        case "Mountain Climber":
            detectMountainClimber(lm);
            break;

        case "Jumping Jack":
            detectJumpingJack(lm);
            break;

        case "Burpees":
            detectBurpees(lm);
            break;

        case "Plank":
            detectPlank(lm);
            break;

        case "Cool Down":
            detectCoolDown(lm);
            break;

    }

}


/* =====================================================
   1. STRETCHING
===================================================== */

function detectStretching(lm){

    const leftShoulder =
        lm[11];

    const rightShoulder =
        lm[12];

    const leftWrist =
        lm[15];

    const rightWrist =
        lm[16];


    if(
        !visible(leftShoulder) ||
        !visible(rightShoulder) ||
        !visible(leftWrist) ||
        !visible(rightWrist)
    ){

        setAIStatus(
            "Show upper body",
            "bad"
        );

        drawPose(
            lm,
            "bad"
        );

        return;

    }


    const handsUp =
        leftWrist.y <
        leftShoulder.y
        &&
        rightWrist.y <
        rightShoulder.y;


    if(
        handsUp &&
        stretchStage === "down"
    ){

        stretchStage =
            "up";

        setAIStatus(
            "HOLD STRETCH ✓",
            "good"
        );

    }


    else if(
        !handsUp &&
        stretchStage === "up"
    ){

        stretchStage =
            "down";

        addRep();

        setAIStatus(
            "STRETCH COMPLETE ✓",
            "good"
        );

    }


    else{

        setAIStatus(
            "ARMS UP ↑",
            "warn"
        );

    }


    drawPose(
        lm,
        handsUp ?
        "good" :
        "warn"
    );

}


/* =====================================================
   2. PUSH UP
===================================================== */

function detectPushUp(lm){

    const left = [
        lm[11],
        lm[13],
        lm[15]
    ];

    const right = [
        lm[12],
        lm[14],
        lm[16]
    ];


    const leftReady =
        left.every(visible);

    const rightReady =
        right.every(visible);


    if(
        !leftReady &&
        !rightReady
    ){

        setAIStatus(
            "Show your arms",
            "bad"
        );

        drawPose(
            lm,
            "bad"
        );

        return;

    }


    let elbowAngle;


    if(
        leftReady &&
        rightReady
    ){

        elbowAngle =
            (
                calculateAngle(
                    ...left
                )
                +
                calculateAngle(
                    ...right
                )
            ) / 2;

    }

    else if(
        leftReady
    ){

        elbowAngle =
            calculateAngle(
                ...left
            );

    }

    else{

        elbowAngle =
            calculateAngle(
                ...right
            );

    }


    if(
        elbowAngle < 110 &&
        pushStage === "up"
    ){

        pushStage =
            "down";


        setAIStatus(
            "GO LOWER ↓",
            "bad"
        );

    }


    else if(
        elbowAngle > 150 &&
        pushStage === "down"
    ){

        pushStage =
            "up";


        addRep();


        setAIStatus(
            "REP DETECTED ✓",
            "good"
        );

    }


    else if(
        elbowAngle < 135
    ){

        setAIStatus(
            "GOOD POSITION ✓",
            "good"
        );

    }


    else{

        setAIStatus(
            "GET READY ↑",
            "warn"
        );

    }


    drawPose(
        lm,
        elbowAngle < 110 ?
        "bad" :
        elbowAngle > 150 ?
        "good" :
        "warn"
    );

}


/* =====================================================
   3. SQUAT
===================================================== */

function detectSquat(lm){

    const leftAngle =
        calculateAngle(
            lm[23],
            lm[25],
            lm[27]
        );

    const rightAngle =
        calculateAngle(
            lm[24],
            lm[26],
            lm[28]
        );


    const kneeAngle =
        (
            leftAngle +
            rightAngle
        ) / 2;


    if(
        kneeAngle < 105 &&
        squatStage === "up"
    ){

        squatStage =
            "down";


        setAIStatus(
            "GOOD • NOW UP ↑",
            "good"
        );

    }


    else if(
        kneeAngle > 155 &&
        squatStage === "down"
    ){

        squatStage =
            "up";


        addRep();


        setAIStatus(
            "REP DETECTED ✓",
            "good"
        );

    }


    else if(
        kneeAngle < 125
    ){

        setAIStatus(
            "HOLD LOW • UP ↑",
            "warn"
        );

    }


    else{

        setAIStatus(
            "SQUAT DOWN ↓",
            "warn"
        );

    }


    drawPose(
        lm,
        kneeAngle < 105 ?
        "good" :
        "warn"
    );

}


/* =====================================================
   4. HIGH KNEES
===================================================== */

function detectHighKnees(lm){

    const leftHip =
        lm[23];

    const rightHip =
        lm[24];

    const leftKnee =
        lm[25];

    const rightKnee =
        lm[26];


    if(
        !visible(leftHip) ||
        !visible(rightHip) ||
        !visible(leftKnee) ||
        !visible(rightKnee)
    ){

        setAIStatus(
            "Show full body",
            "bad"
        );

        drawPose(
            lm,
            "bad"
        );

        return;

    }


    const hipY =
        (
            leftHip.y +
            rightHip.y
        ) / 2;


    const kneeY =
        Math.min(
            leftKnee.y,
            rightKnee.y
        );


    const kneeUp =
        kneeY <
        hipY - .08;


    if(
        kneeUp &&
        kneeStage === "down"
    ){

        kneeStage =
            "up";


        addRep();


        setAIStatus(
            "KNEE UP ✓",
            "good"
        );

    }


    if(
        !kneeUp &&
        kneeStage === "up"
    ){

        kneeStage =
            "down";

    }


    if(!kneeUp){

        setAIStatus(
            "LIFT KNEE HIGH ↑",
            "warn"
        );

    }


    drawPose(
        lm,
        kneeUp ?
        "good" :
        "warn"
    );

}


/* =====================================================
   5. LUNGES
===================================================== */

function detectLunges(lm){

    const leftAngle =
        calculateAngle(
            lm[23],
            lm[25],
            lm[27]
        );

    const rightAngle =
        calculateAngle(
            lm[24],
            lm[26],
            lm[28]
        );


    const kneeAngle =
        Math.min(
            leftAngle,
            rightAngle
        );


    if(
        kneeAngle < 110 &&
        lungeStage === "up"
    ){

        lungeStage =
            "down";


        setAIStatus(
            "LUNGE DOWN ↓",
            "bad"
        );

    }


    else if(
        kneeAngle > 150 &&
        lungeStage === "down"
    ){

        lungeStage =
            "up";


        addRep();


        setAIStatus(
            "REP DETECTED ✓",
            "good"
        );

    }


    else{

        setAIStatus(
            kneeAngle < 130
            ?
            "PUSH BACK UP ↑"
            :
            "STEP & LUNGE ↓",
            "warn"
        );

    }


    drawPose(
        lm,
        kneeAngle < 110 ?
        "bad" :
        "warn"
    );

}


/* =====================================================
   6. MOUNTAIN CLIMBER
===================================================== */

function detectMountainClimber(lm){

    const leftKnee =
        lm[25];

    const rightKnee =
        lm[26];

    const leftHip =
        lm[23];

    const rightHip =
        lm[24];


    if(
        !visible(leftKnee) ||
        !visible(rightKnee) ||
        !visible(leftHip) ||
        !visible(rightHip)
    ){

        setAIStatus(
            "Show your legs",
            "bad"
        );

        drawPose(
            lm,
            "bad"
        );

        return;

    }


    const leftNear =
        Math.abs(
            leftKnee.x -
            leftHip.x
        ) < .20;


    const rightNear =
        Math.abs(
            rightKnee.x -
            rightHip.x
        ) < .20;


    const kneeIn =
        leftNear ||
        rightNear;


    if(
        kneeIn &&
        mountainStage === "away"
    ){

        mountainStage =
            "in";


        addRep();


        setAIStatus(
            "KNEE IN ✓",
            "good"
        );

    }


    else if(
        !kneeIn &&
        mountainStage === "in"
    ){

        mountainStage =
            "away";


        setAIStatus(
            "NEXT KNEE ↑",
            "warn"
        );

    }


    else{

        setAIStatus(
            "BRING KNEE FORWARD ↑",
            "warn"
        );

    }


    drawPose(
        lm,
        kneeIn ?
        "good" :
        "warn"
    );

}


/* =====================================================
   7. JUMPING JACK
===================================================== */

function detectJumpingJack(lm){

    const handsUp =
        lm[15].y <
        lm[11].y
        &&
        lm[16].y <
        lm[12].y;


    const feetApart =
        Math.abs(
            lm[27].x -
            lm[28].x
        ) > .28;


    const open =
        handsUp &&
        feetApart;


    if(
        open &&
        jackStage === "closed"
    ){

        jackStage =
            "open";


        setAIStatus(
            "OPEN ✓ NOW CLOSE",
            "good"
        );

    }


    else if(
        !open &&
        jackStage === "open"
    ){

        jackStage =
            "closed";


        addRep();


        setAIStatus(
            "REP DETECTED ✓",
            "good"
        );

    }


    else{

        setAIStatus(
            open
            ?
            "CLOSE ↓"
            :
            "ARMS UP + FEET OUT ↑",
            "warn"
        );

    }


    drawPose(
        lm,
        open ?
        "good" :
        "warn"
    );

}


/* =====================================================
   8. BURPEES
===================================================== */

function detectBurpees(lm){

    const kneeAngle =
        (
            calculateAngle(
                lm[23],
                lm[25],
                lm[27]
            )
            +
            calculateAngle(
                lm[24],
                lm[26],
                lm[28]
            )
        ) / 2;


    const handsUp =
        lm[15].y <
        lm[11].y
        &&
        lm[16].y <
        lm[12].y;


    if(
        kneeAngle < 115 &&
        burpeeStage === "up"
    ){

        burpeeStage =
            "down";


        setAIStatus(
            "DOWN ✓",
            "bad"
        );

    }


    else if(
        kneeAngle > 150 &&
        handsUp &&
        burpeeStage === "down"
    ){

        burpeeStage =
            "up";


        addRep();


        setAIStatus(
            "BURPEE ✓",
            "good"
        );

    }


    else{

        setAIStatus(
            "DOWN → STAND + JUMP",
            "warn"
        );

    }


    drawPose(
        lm,
        kneeAngle < 115 ?
        "bad" :
        handsUp ?
        "good" :
        "warn"
    );

}


/* =====================================================
   9. PLANK
===================================================== */

function detectPlank(lm){

    const shoulder =
        lm[11];

    const hip =
        lm[23];

    const ankle =
        lm[27];


    if(
        !visible(shoulder) ||
        !visible(hip) ||
        !visible(ankle)
    ){

        setAIStatus(
            "Show full body",
            "bad"
        );

        drawPose(
            lm,
            "bad"
        );

        return;

    }


    const torso =
        Math.abs(
            shoulder.y -
            hip.y
        );


    const leg =
        Math.abs(
            hip.y -
            ankle.y
        );


    const straight =
        leg >
        torso * .75;


    if(straight){

        if(
            plankStart === 0
        ){

            plankStart =
                Date.now();

        }


        const seconds =
            Math.floor(
                (
                    Date.now() -
                    plankStart
                ) / 1000
            );


        if(
            seconds >= 5 &&
            !plankCounted
        ){

            plankCounted =
                true;

            addRep();


            setAIStatus(
                "5 SEC PLANK ✓",
                "good"
            );

        }


        else{

            setAIStatus(
                "GOOD PLANK • HOLD ✓",
                "good"
            );

        }

    }

    else{

        plankStart =
            0;

        plankCounted =
            false;


        setAIStatus(
            "KEEP BODY STRAIGHT",
            "bad"
        );

    }


    drawPose(
        lm,
        straight ?
        "good" :
        "bad"
    );

}


/* =====================================================
   10. COOL DOWN
===================================================== */

function detectCoolDown(lm){

    const handsLow =
        lm[15].y >
        lm[11].y
        &&
        lm[16].y >
        lm[12].y;


    if(
        !handsLow &&
        cooldownStage === "up"
    ){

        cooldownStage =
            "down";


        setAIStatus(
            "SLOW DOWN ↓",
            "warn"
        );

    }


    else if(
        handsLow &&
        cooldownStage === "down"
    ){

        cooldownStage =
            "up";


        addRep();


        setAIStatus(
            "COOL DOWN ✓",
            "good"
        );

    }


    else{

        setAIStatus(
            "SLOW MOVEMENT • BREATHE",
            "warn"
        );

    }


    drawPose(
        lm,
        handsLow ?
        "good" :
        "warn"
    );

}


/* =====================================================
   TIMER
===================================================== */

let secondsPassed =
    0;


const timer =
    setInterval(
        () => {

            secondsPassed++;


            const minutes =
                Math.floor(
                    secondsPassed /
                    60
                );


            const seconds =
                secondsPassed %
                60;


            document.getElementById(
                "time"
            ).innerText =

                String(minutes)
                .padStart(2,"0")

                +

                ":"

                +

                String(seconds)
                .padStart(2,"0");

        },

        1000
    );


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    cameraStarted =
        false;


    if(
        video.srcObject
    ){

        video.srcObject
        .getTracks()
        .forEach(
            track => {

                track.stop();

            }
        );

    }

}


/* =====================================================
   QUIT
===================================================== */

document.getElementById(
    "quitBtn"
).onclick =
() => {

    stopCamera();

    clearInterval(
        timer
    );

    /*
       IMPORTANT:
       QUIT DOES NOT SAVE
    */

    window.location.href =
        "daily-task.html";

};


/* =====================================================
   COMPLETE WORKOUT
===================================================== */

completeBtn.onclick =
async() => {

    if(saving){

        return;

    }


    if(!currentUser){

        alert(
            "Please login again."
        );

        return;

    }


    if(repCount <= 0){

        alert(
            "No reps detected yet."
        );

        return;

    }


    saving =
        true;


    completeBtn.disabled =
        true;


    completeBtn.innerText =
        "SAVING...";


    try{

        const userRef =
            db
            .collection("users")
            .doc(
                currentUser.uid
            );


        const userDoc =
            await userRef.get();


        const data =
            userDoc.exists
            ?
            userDoc.data()
            :
            {};


        let tasks =
            Array.isArray(
                data.completedTasks
            )
            ?
            [
                ...data.completedTasks
            ]
            :
            [];


        /*
           DUPLICATE PROTECTION
        */

        if(
            tasks.includes(
                workoutIndex
            )
        ){

            alert(
                "Workout already completed."
            );


            window.location.href =
                "daily-task.html";


            return;

        }


        /*
           SAVE COMPLETED TASK
        */

        tasks.push(
            workoutIndex
        );


        /*
           1 REP = 1 RC
        */

        const oldRC =
            Number(
                data.totalPoints ||
                0
            );


        const newRC =
            oldRC +
            repCount;


        await userRef.set({

            completedTasks:
                tasks,

            totalPoints:
                newRC

        },{
            merge:true
        });


        stopCamera();


        clearInterval(
            timer
        );


        alert(
            "Workout Complete! 🎉\n\n"
            +
            "+"
            +
            repCount
            +
            " RC"
        );


        window.location.href =
            "daily-task.html";

    }

    catch(error){

        console.error(
            "Workout save error:",
            error
        );


        alert(
            "Could not save workout."
        );


        saving =
            false;


        completeBtn.disabled =
            false;


        completeBtn.innerText =
            "COMPLETE WORKOUT ✓";

    }

};


/* =====================================================
   PAGE LEAVE
===================================================== */

window.addEventListener(
    "pagehide",
    () => {

        stopCamera();

    }
);

</script>
