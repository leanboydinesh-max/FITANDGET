/* ======================================
   ELEMENTS
====================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const repElement =
    document.getElementById("rep");

const statusElement =
    document.getElementById("status");

const nameElement =
    document.getElementById("name");


/* ======================================
   WORKOUT
====================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let workout =
    params.get("workout") ||
    localStorage.getItem(
        "selectedWorkout"
    ) ||

workout =

nameElement.textContent =

/* ======================================
   STATE
====================================== */

let reps = 0;

let phase = "up";

let lastRepTime = 0;

let cameraStarted = false;


/* ======================================
   STATUS
====================================== */

function status(
    text,
    color
){

    statusElement.textContent =
        text;

    statusElement.className =
        "status " + color;
}


/* ======================================
   REP
====================================== */

function countRep(){

    const now =
        Date.now();

    if(
        now-lastRepTime <
        500
    ){
        return;
    }

    lastRepTime =
        now;

    if(
        reps>=50
    ){
        return;
    }

    reps++;

    repElement.textContent =
        reps;
}


/* ======================================
   VISIBILITY
====================================== */

function isVisible(
    landmarks,
    index
){

    if(
        !landmarks ||
        !landmarks[index]
    ){
        return false;
    }

    const v =
        landmarks[index].visibility;

    return (
        v === undefined ||
        v > .15
    );
}


/* ======================================
   ANGLE
====================================== */

function getAngle(
    a,
    b,
    c
){

    if(
        !a ||
        !b ||
        !c
    ){
        return 180;
    }

    const abx =
        a.x-b.x;

    const aby =
        a.y-b.y;

    const cbx =
        c.x-b.x;

    const cby =
        c.y-b.y;

    const dot =
        abx*cbx+
        aby*cby;

    const m1 =
        Math.sqrt(
            abx*abx+
            aby*aby
        );

    const m2 =
        Math.sqrt(
            cbx*cbx+
            cby*cby
        );

    if(
        m1===0 ||
        m2===0
    ){
        return 180;
    }

    let value =
        dot/(m1*m2);

    value =
        Math.max(
            -1,
            Math.min(
                1,
                value
            )
        );

    return Math.acos(
        value
    )*180/Math.PI;
}


/* ======================================
   CANVAS SIZE
====================================== */

function resize(){

    canvas.width =
        canvas.clientWidth;

    canvas.height =
        canvas.clientHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* ======================================
   VIDEO RECTANGLE

   Matches object-fit: contain
====================================== */

function videoRect(){

    const vw =
        video.videoWidth ||
        720;

    const vh =
        video.videoHeight ||
        1280;

    const cw =
        canvas.width;

    const ch =
        canvas.height;

    const scale =
        Math.min(
            cw/vw,
            ch/vh
        );

    const w =
        vw*scale;

    const h =
        vh*scale;

    return {

        x:(cw-w)/2,

        y:(ch-h)/2,

        w:w,

        h:h
    };
}


/* ======================================
   LANDMARK → SCREEN
====================================== */

function point(
    landmark
){

    if(!landmark){
        return null;
    }

    const r =
        videoRect();

    let x =
        r.x+
        landmark.x*r.w;

    let y =
        r.y+
        landmark.y*r.h;

    /*
      Mirror
    */

    x =
        r.x+
        r.w-
        (x-r.x);

    return {
        x:x,
        y:y
    };
}


/* ======================================
   DRAW LINE
====================================== */

function line(
    a,
    b,
    color
){

    const p1 =
        point(a);

    const p2 =
        point(b);

    if(
        !p1 ||
        !p2
    ){
        return;
    }

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.lineTo(
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        5;

    ctx.lineCap =
        "round";

    ctx.stroke();
}


/* ======================================
   DRAW POINT
====================================== */

function dot(
    landmark,
    color
){

    const p =
        point(landmark);

    if(!p){
        return;
    }

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        6,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        color;

    ctx.fill();
}


/* ======================================
   PUSH UP SIDE
====================================== */

function pushSide(
    lm
){

    const left =
        [11,13,15]
        .filter(
            i=>isVisible(lm,i)
        )
        .length;

    const right =
        [12,14,16]
        .filter(
            i=>isVisible(lm,i)
        )
        .length;

    return (
        left>=right
        ? "left"
        : "right"
    );
}


/* ======================================
   PUSH UP DRAW
====================================== */

function drawPush(
    lm,
    color
){

    const side =
        pushSide(lm);

    const ids =
        side==="left"
        ? [11,13,15]
        : [12,14,16];

    if(
        !ids.every(
            i=>isVisible(lm,i)
        )
    ){
        return;
    }

    line(
        lm[ids[0]],
        lm[ids[1]],
        color
    );

    line(
        lm[ids[1]],
        lm[ids[2]],
        color
    );

    ids.forEach(
        i=>{
            dot(
                lm[i],
                color
            );
        }
    );
}


/* ======================================
   PUSH UP DETECTION
====================================== */

function detectPush(
    lm
){

    const side =
        pushSide(lm);

    const ids =
        side==="left"
        ? [11,13,15]
        : [12,14,16];

    if(
        !ids.every(
            i=>isVisible(lm,i)
        )
    ){

        status(
            "POSITION",
            "red"
        );

        phase="up";

        return;
    }

    const elbow =
        getAngle(
            lm[ids[0]],
            lm[ids[1]],
            lm[ids[2]]
        );

    /*
      Very easy movement range.
    */

    if(
        elbow < 130
    ){

        status(
            "GREEN • DOWN",
            "green"
        );

        phase="down";

        return;
    }

    status(
        "GREEN • UP",
        "green"
    );

    if(
        phase==="down" &&
        elbow>145
    ){

        countRep();

        phase="up";
    }
}


/* ======================================
   SQUAT SIDE
====================================== */

function squatSide(
    lm
){

    const left =
        [23,25,27]
        .filter(
            i=>isVisible(lm,i)
        )
        .length;

    const right =
        [24,26,28]
        .filter(
            i=>isVisible(lm,i)
        )
        .length;

    return (
        left>=right
        ? "left"
        : "right"
    );
}


/* ======================================
   SQUAT DRAW
====================================== */

function drawSquat(
    lm,
    color
){

    const side =
        squatSide(lm);

    const ids =
        side==="left"
        ? [23,25,27]
        : [24,26,28];

    if(
        !ids.every(
            i=>isVisible(lm,i)
        )
    ){
        return;
    }

    line(
        lm[ids[0]],
        lm[ids[1]],
        color
    );

    line(
        lm[ids[1]],
        lm[ids[2]],
        color
    );

    ids.forEach(
        i=>{
            dot(
                lm[i],
                color
            );
        }
    );
}


/* ======================================
   SQUAT DETECTION
====================================== */

function detectSquat(
    lm
){

    const side =
        squatSide(lm);

    const ids =
        side==="left"
        ? [23,25,27]
        : [24,26,28];

    if(
        !ids.every(
            i=>isVisible(lm,i)
        )
    ){

        status(
            "POSITION",
            "red"
        );

        phase="up";

        return;
    }

    const knee =
        getAngle(
            lm[ids[0]],
            lm[ids[1]],
            lm[ids[2]]
        );

    if(
        knee<135
    ){

        status(
            "GREEN • DOWN",
            "green"
        );

        phase="down";

        return;
    }

    status(
        "GREEN • UP",
        "green"
    );

    if(
        phase==="down" &&
        knee>145
    ){

        countRep();

        phase="up";
    }
}


/* ======================================
   STRETCHING
====================================== */

function drawStretch(
    lm,
    color
){

    const pairs=[
        [11,13],
        [13,15],
        [12,14],
        [14,16]
    ];

    pairs.forEach(
        pair=>{

            if(
                isVisible(
                    lm,
                    pair[0]
                ) &&
                isVisible(
                    lm,
                    pair[1]
                )
            ){

                line(
                    lm[pair[0]],
                    lm[pair[1]],
                    color
                );
            }
        }
    );
}


function detectStretch(
    lm
){

    if(
        !isVisible(lm,11) ||
        !isVisible(lm,13) ||
        !isVisible(lm,15)
    ){

        status(
            "POSITION",
            "red"
        );

        return;
    }

    status(
        "GREEN • MOVE",
        "green"
    );

    const y =
        lm[15].y;

    if(
        window.oldStretchY===
        undefined
    ){

        window.oldStretchY =
            y;

        return;
    }

    if(
        Math.abs(
            y-window.oldStretchY
        )>.06
    ){

        countRep();

        window.oldStretchY =
            y;
    }
}


/* ======================================
   BASIC WORKOUT
====================================== */

function basicReady(
    lm
){

    const ids=[
        11,12,
        23,24,
        25,26,
        27,28
    ];

    return (
        ids.filter(
            i=>isVisible(lm,i)
        ).length>=4
    );
}


/* HIGH KNEES */

function highKnees(
    lm
){

    if(
        !basicReady(lm)
    ){

        status(
            "POSITION",
            "red"
        );

        return;
    }

    status(
        "GREEN • MOVE",
        "green"
    );

    const left =
        lm[25].y<
        lm[23].y-.08;

    const right =
        lm[26].y<
        lm[24].y-.08;

    if(
        left ||
        right
    ){

        countRep();
    }
}


/* JUMPING JACK */

function jumpingJack(
    lm
){

    if(
        !basicReady(lm)
    ){

        status(
            "POSITION",
            "red"
        );

        return;
    }

    status(
        "GREEN • MOVE",
        "green"
    );

    const arms =
        lm[15].y<
        lm[11].y ||
        lm[16].y<
        lm[12].y;

    const legs =
        Math.abs(
            lm[27].x-
            lm[28].x
        )>.15;

    if(
        arms &&
        legs &&
        phase==="up"
    ){

        phase="down";
    }

    if(
        !arms &&
        !legs &&
        phase==="down"
    ){

        countRep();

        phase="up";
    }
}


/* LUNGES */

function lunges(
    lm
){

    if(
        !basicReady(lm)
    ){

        status(
            "POSITION",
            "red"
        );

        return;
    }

    status(
        "GREEN • MOVE",
        "green"
    );

    const left =
        getAngle(
            lm[23],
            lm[25],
            lm[27]
        );

    const right =
        getAngle(
            lm[24],
            lm[26],
            lm[28]
        );

    if(
        left<135 ||
        right<135
    ){

        phase="down";
    }

    if(
        phase==="down" &&
        left>145 &&
        right>145
    ){

        countRep();

        phase="up";
    }
}


/* MOUNTAIN CLIMBER */

function mountainClimber(
    lm
){

    if(
        !basicReady(lm)
    ){

        status(
            "POSITION",
            "red"
        );

        return;
    }

    status(
        "GREEN • MOVE",
        "green"
    );

    const left =
        lm[25].y<
        lm[23].y-.06;

    const right =
        lm[26].y<
        lm[24].y-.06;

    if(
        left ||
        right
    ){

        countRep();
    }
}


/* BURPEE */

function burpees(
    lm
){

    if(
        !basicReady(lm)
    ){

        status(
            "POSITION",
            "red"
        );

        return;
    }

    status(
        "GREEN • MOVE",
        "green"
    );

    const hip =
        (
            lm[23].y+
            lm[24].y
        )/2;

    const shoulder =
        (
            lm[11].y+
            lm[12].y
        )/2;

    if(
        hip-shoulder>.20
    ){

        phase="down";
    }

    if(
        phase==="down" &&
        hip-shoulder<.12
    ){

        countRep();

        phase="up";
    }
}


/* PLANK */

function plank(
    lm
){

    if(
        !basicReady(lm)
    ){

        status(
            "POSITION",
            "red"
        );

        window.plankStart=null;

        return;
    }

    status(
        "GREEN • HOLD",
        "green"
    );

    if(
        !window.plankStart
    ){

        window.plankStart =
            Date.now();
    }

    if(
        Date.now()-
        window.plankStart>
        2500
    ){

        countRep();

        window.plankStart =
            Date.now();
    }
}


/* COOL DOWN */

function coolDown(
    lm
){

    if(
        !isVisible(lm,11) ||
        !isVisible(lm,12)
    ){

        status(
            "POSITION",
            "red"
        );

        return;
    }

    status(
        "GREEN • MOVE",
        "green"
    );

    const y =
        (
            lm[11].y+
            lm[12].y
        )/2;

    if(
        window.oldCoolY===
        undefined
    ){

        window.oldCoolY=y;

        return;
    }

    if(
        Math.abs(
            y-window.oldCoolY
        )>.06
    ){

        countRep();

        window.oldCoolY=y;
    }
}


/* ======================================
   POSE RESULTS
====================================== */

function poseResults(
    results
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(
        !results.poseLandmarks
    ){

        status(
            "COME INTO CAMERA",
            "red"
        );

        return;
    }

    const lm =
        results.poseLandmarks;

    const name =
        workout.toLowerCase();


    /* STRETCHING */

    if(
        name.includes("stretch")
    ){

        const ok =
            isVisible(lm,11) &&
            isVisible(lm,13) &&
            isVisible(lm,15);

        drawStretch(
            lm,
            ok
            ? "#00ff66"
            : "#ff3030"
        );

        detectStretch(lm);

        return;
    }


    /* PUSH UP */

    if(
        name.includes("push")
    ){

        const side =
            pushSide(lm);

        const ids =
            side==="left"
            ? [11,13,15]
            : [12,14,16];

        const ok =
            ids.every(
                i=>isVisible(lm,i)
            );

        drawPush(
            lm,
            ok
            ? "#00ff66"
            : "#ff3030"
        );

        detectPush(lm);

        return;
    }


    /* SQUAT */

    if(
        name.includes("squat")
    ){

        const side =
            squatSide(lm);

        const ids =
            side==="left"
            ? [23,25,27]
            : [24,26,28];

        const ok =
            ids.every(
                i=>isVisible(lm,i)
            );

        drawSquat(
            lm,
            ok
            ? "#00ff66"
            : "#ff3030"
        );

        detectSquat(lm);

        return;
    }


    /* HIGH KNEES */

    if(
        name.includes("high knee")
    ){

        highKnees(lm);

        return;
    }


    /* JUMPING JACK */

    if(
        name.includes("jumping jack")
    ){

        jumpingJack(lm);

        return;
    }


    /* LUNGES */

    if(
        name.includes("lunge")
    ){

        lunges(lm);

        return;
    }


    /* MOUNTAIN CLIMBER */

    if(
        name.includes("mountain")
    ){

        mountainClimber(lm);

        return;
    }


    /* BURPEES */

    if(
        name.includes("burpee")
    ){

        burpees(lm);

        return;
    }


    /* PLANK */

    if(
        name.includes("plank")
    ){

        plank(lm);

        return;
    }


    /* COOL DOWN */

    if(
        name.includes("cool")
    ){

        coolDown(lm);

        return;
    }


    /* OTHER */

    if(
        basicReady(lm)
    ){

        status(
            "GREEN • MOVE",
            "green"
        );

    }else{

        status(
            "POSITION",
            "red"
        );
    }
}


/* ======================================
   MEDIAPIPE
====================================== */

const pose =
    new Pose({

        locateFile:(file)=>{
            return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;
        }

    });


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:.45,

    minTrackingConfidence:.45

});


pose.onResults(
    poseResults
);


/* ======================================
   CAMERA
====================================== */

let camera;


async function startCamera(){

    if(
        cameraStarted
    ){
        return;
    }

    try{

        status(
            "STARTING CAMERA",
            "yellow"
        );

        cameraStarted=true;

        camera =
            new Camera(
                video,
                {

                    onFrame:
                    async()=>{

                        if(
                            video.readyState>=2
                        ){

                            await pose.send({
                                image:video
                            });

                        }

                    },

                    width:720,

                    height:1280

                }
            );

        await camera.start();

        status(
            "POSITION",
            "red"
        );

    }catch(error){

        console.error(error);

        cameraStarted=false;

        status(
            "CAMERA PERMISSION NEEDED",
            "red"
        );
    }
}


/* ======================================
   STOP CAMERA
====================================== */

function stopCamera(){

    try{

        if(camera){
            camera.stop();
        }

        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(
                    track=>{
                        track.stop();
                    }
                );
        }

    }catch(error){

        console.log(error);
    }
}


/* ======================================
   QUIT
====================================== */

function quitWorkout(){

    stopCamera();

    /*
      NO SAVE
    */

    window.location.href =
        "daily-task.html";
}


/* ======================================
   FINISH
====================================== */

async function finishWorkout(){

    const user =
        firebase.auth()
        .currentUser;

    if(!user){

        alert(
            "Please login first."
        );

        return;
    }

    if(
        reps<=0
    ){

        alert(
            "Complete at least 1 rep."
        );

        return;
    }

    const finalReps =
        Math.min(
            reps,
            50
        );

    try{

        const ref =
            db.collection("users")
              .doc(user.uid);

        const snapshot =
            await ref.get();

        const data =
            snapshot.exists
            ? snapshot.data()
            : {};

        const oldPoints =
            Number(
                data.totalPoints ||
                0
            );

        const oldTasks =
            Array.isArray(
                data.completedTasks
            )
            ? data.completedTasks
            : [];

        const tasks =
            [...oldTasks];

        if(
            !tasks.includes(workout)
        ){

            tasks.push(
                workout
            );
        }

        await ref.set({

            totalPoints:
                oldPoints+
                finalReps,

            completedTasks:
                tasks,

            lastWorkout:
                workout,

            lastWorkoutReps:
                finalReps,

            updatedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        },{
            merge:true
        });

        stopCamera();

        window.location.href =
            "daily-task.html";

    }catch(error){

        console.error(error);

        alert(
            "Could not save workout."
        );
    }
}


/* ======================================
   AUTO OPEN
====================================== */

window.addEventListener(
    "load",
    function(){

        setTimeout(
            function(){
                startCamera();
            },
            300
        );

    }
);

</script>
