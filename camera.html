/* =========================
   CANVAS
========================= */

function resizeCanvas(){

    /*
    Canvas follows the actual camera box.
    Drawing is clipped inside canvas.
    */

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        Math.round(rect.width*dpr);

    canvas.height =
        Math.round(rect.height*dpr);

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

setTimeout(
    resizeCanvas,
    500
);

/* =========================
   VIDEO → CANVAS MAPPING
========================= */

/*
MediaPipe coordinates are based on video.
Video uses object-fit:contain.

So we calculate the real displayed
video rectangle first.

This prevents lines from going
outside the camera.
*/

function getVideoRect(){

    const box =
        canvas.getBoundingClientRect();

    const vw =
        video.videoWidth || 720;

    const vh =
        video.videoHeight || 1280;

    const cw = box.width;
    const ch = box.height;

    const scale =
        Math.min(cw/vw,ch/vh);

    const dw = vw*scale;
    const dh = vh*scale;

    const ox = (cw-dw)/2;
    const oy = (ch-dh)/2;

    return {
        x:ox,
        y:oy,
        width:dw,
        height:dh
    };
}

/* =========================
   LANDMARK POSITION
========================= */

function point(lm){

    const r = getVideoRect();

    return {
        x:r.x + lm.x*r.width,
        y:r.y + lm.y*r.height
    };
}

/* =========================
   CLAMP
========================= */

function clamp(v,min,max){

    return Math.max(
        min,
        Math.min(max,v)
    );
}

/* =========================
   DRAW POINT
========================= */

function drawPoint(
    lm,
    radius=5
){

    if(!lm) return;

    const p = point(lm);

    const r =
        canvas.getBoundingClientRect();

    const x =
        clamp(p.x,0,r.width);

    const y =
        clamp(p.y,0,r.height);

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#9dff00";

    ctx.fill();
}

/* =========================
   DRAW LINE
========================= */

function drawLine(a,b){

    if(!a || !b) return;

    const p1 = point(a);
    const p2 = point(b);

    const r =
        canvas.getBoundingClientRect();

    const x1 =
        clamp(p1.x,0,r.width);

    const y1 =
        clamp(p1.y,0,r.height);

    const x2 =
        clamp(p2.x,0,r.width);

    const y2 =
        clamp(p2.y,0,r.height);

    ctx.beginPath();

    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);

    ctx.strokeStyle =
        "#9dff00";

    ctx.lineWidth=4;

    ctx.stroke();
}

   DRAW TARGET PART
========================= */

function drawPart(

/* =========================
   ANGLE
========================= */

function angle(a,b,c){

    const abx=a.x-b.x;
    const aby=a.y-b.y;

    const cbx=c.x-b.x;
    const cby=c.y-b.y;

    const dot =
        abx*cbx +
        aby*cby;

    const mag1 =
        Math.sqrt(
            abx*abx +
            aby*aby
        );

    const mag2 =
        Math.sqrt(
            cbx*cbx +
            cby*cby
        );

    if(!mag1 || !mag2){
        return 180;
    }

    let value =
        Math.acos(
            clamp(
                dot/(mag1*mag2),
                -1,
                1
            )
        )*180/Math.PI;

    return value;
}

/* =========================
   POSITION CHECK
========================= */

function checkPosition(lm){

    if(!lm) return false;

    /*
    Basic visibility.
    */

    const important = [
        11,12,
        23,24,
        25,26,
        27,28
    ];

    let visible=0;

    important.forEach(i=>{

        if(
            lm[i] &&
            (lm[i].visibility === undefined ||
             lm[i].visibility > .45)
        ){
            visible++;
        }

    });

    if(visible < 6){
        return false;
    }

    /*
    Workout-specific readiness.
    */

    if(workout==="Push Up"){

        return (
            lm[11].visibility>.5 &&
            lm[12].visibility>.5 &&
            lm[13].visibility>.5 &&
            lm[14].visibility>.5 &&
            lm[15].visibility>.5 &&
            lm[16].visibility>.5 &&
            lm[23].visibility>.5 &&
            lm[24].visibility>.5
        );
    }

    if(workout==="Squat"){

        return (
            lm[23].visibility>.5 &&
            lm[24].visibility>.5 &&
            lm[25].visibility>.5 &&
            lm[26].visibility>.5 &&
            lm[27].visibility>.5 &&
            lm[28].visibility>.5
        );
    }

    return true;
}

/* =========================
   PUSH UP
========================= */

function detectPushUp(lm){

    const left =
        angle(
            lm[11],
            lm[13],
            lm[15]
        );

    const right =
        angle(
            lm[12],
            lm[14],
            lm[16]
        );

    const elbow =
        (left+right)/2;

    if(pushStage==="up" && elbow<100){

        pushStage="down";

        setStatus(
            "DOWN",
            "ready"
        );
    }

    else if(
        pushStage==="down" &&
        elbow>155
    ){

        pushStage="up";

        addRep();

        setStatus(
            "GOOD • PUSH UP",
            "ready"
        );
    }
}

/* =========================
   SQUAT
========================= */

function detectSquat(lm){

    const left =
        angle(
            lm[23],
            lm[25],
            lm[27]
        );

    const right =
        angle(
            lm[24],
            lm[26],
            lm[28]
        );

    const knee =
        (left+right)/2;

    if(
        squatStage==="up" &&
        knee<105
    ){

        squatStage="down";

        setStatus(
            "DOWN",
            "ready"
        );
    }

    else if(
        squatStage==="down" &&
        knee>155
    ){

        squatStage="up";

        addRep();

        setStatus(
            "GOOD • SQUAT",
            "ready"
        );
    }
}

/* =========================
   HIGH KNEES
========================= */

function detectHighKnees(lm){

    const leftHigh =
        lm[25].y <
        lm[23].y-.08;

    const rightHigh =
        lm[26].y <
        lm[24].y-.08;

    if(
        kneeStage==="down" &&
        (leftHigh || rightHigh)
    ){

        kneeStage="up";

        addRep();

    }

    if(
        kneeStage==="up" &&
        !leftHigh &&
        !rightHigh
    ){

        kneeStage="down";
    }
}

/* =========================
   LUNGES
========================= */

function detectLunge(lm){

    const left =
        angle(
            lm[23],
            lm[25],
            lm[27]
        );

    const right =
        angle(
            lm[24],
            lm[26],
            lm[28]
        );

    const bent =
        left<110 ||
        right<110;

    const straight =
        left>155 &&
        right>155;

    if(
        lungeStage==="up" &&
        bent
    ){

        lungeStage="down";
    }

    else if(
        lungeStage==="down" &&
        straight
    ){

        lungeStage="up";

        addRep();
    }
}

/* =========================
   MOUNTAIN CLIMBER
========================= */

function detectMountainClimber(lm){

    const leftKnee =
        lm[25].x;

    const rightKnee =
        lm[26].x;

    const leftHip =
        lm[23].x;

    const rightHip =
        lm[24].x;

    const leftMove =
        Math.abs(leftKnee-leftHip);

    const rightMove =
        Math.abs(rightKnee-rightHip);

    if(
        mountainStage==="away" &&
        (leftMove<.16 || rightMove<.16)
    ){

        mountainStage="near";

        addRep();
    }

    if(
        mountainStage==="near" &&
        leftMove>.20 &&
        rightMove>.20
    ){

        mountainStage="away";
    }
}

/* =========================
   JUMPING JACK
========================= */

function detectJumpingJack(lm){

    const armsUp =
        lm[15].y < lm[11].y-.05 &&
        lm[16].y < lm[12].y-.05;

    const feetApart =
        Math.abs(
            lm[27].x-lm[28].x
        )>.25;

    const open =
        armsUp && feetApart;

    if(
        jackStage==="closed" &&
        open
    ){

        jackStage="open";

        addRep();
    }

    if(
        jackStage==="open" &&
        !open
    ){

        jackStage="closed";
    }
}

/* =========================
   BURPEE
========================= */

function detectBurpee(lm){

    const leftKnee =
        angle(
            lm[23],
            lm[25],
            lm[27]
        );

    const rightKnee =
        angle(
            lm[24],
            lm[26],
            lm[28]
        );

    const kneeBend =
        leftKnee<110 ||
        rightKnee<110;

    const standing =
        leftKnee>155 &&
        rightKnee>155;

    if(
        burpeeStage==="up" &&
        kneeBend
    ){

        burpeeStage="down";
    }

    else if(
        burpeeStage==="down" &&
        standing
    ){

        burpeeStage="up";

        addRep();
    }
}

/* =========================
   PLANK
========================= */

function detectPlank(lm){

    const bodyAngle =
        angle(
            lm[11],
            lm[23],
            lm[25]
        );

    const isPlank =
        bodyAngle>150;

    if(isPlank){

        if(!plankStart){

            plankStart =
                Date.now();
        }

        if(
            !plankCounted &&
            Date.now()-plankStart>=1000
        ){

            plankCounted=true;

            addRep();

            setStatus(
                "1 SEC • PLANK",
                "ready"
            );
        }

    }else{

        plankStart=0;
        plankCounted=false;
    }
}

/* =========================
   STRETCHING
========================= */

function detectStretching(lm){

    const handsUp =
        lm[15].y <
        lm[11].y-.12 &&
        lm[16].y <
        lm[12].y-.12;

    if(
        stretchStage==="down" &&
        handsUp
    ){

        stretchStage="up";

        addRep();
    }

    if(
        stretchStage==="up" &&
        !handsUp
    ){

        stretchStage="down";
    }
}

/* =========================
   COOL DOWN
========================= */

function detectCoolDown(lm){

    const handsUp =
        lm[15].y <
        lm[11].y-.08 &&
        lm[16].y <
        lm[12].y-.08;

    if(
        cooldownStage==="down" &&
        handsUp
    ){

        cooldownStage="up";

        addRep();
    }

    if(
        cooldownStage==="up" &&
        !handsUp
    ){

        cooldownStage="down";
    }
}

/* =========================
   REP
========================= */

function addRep(){

    if(!poseReady) return;

    if(repCount>=50) return;

    repCount++;

    repEl.innerText =
        repCount;
}

/* =========================
   POSE RESULTS
========================= */

function onPoseResults(results){

    resizeCanvas();

    const rect =
        canvas.getBoundingClientRect();

    ctx.clearRect(
        0,
        0,
        rect.width,
        rect.height
    );

    if(
        !results.poseLandmarks
    ){

        poseReady=false;

        setStatus(
            "Show your full body",
            "warn"
        );

        return;
    }

    const lm =
        results.poseLandmarks;

    /*
    First check body visibility.
    */

    const ready =
        checkPosition(lm);

    if(!ready){

        poseReady=false;

        drawWorkoutGuide(lm);

        setStatus(
            "Move into the guide",
            "warn"
        );

        return;
    }

    /*
    Once ready, start timer.
    */

    if(!poseReady){

        poseReady=true;

        setStatus(
            "READY • START",
            "ready"
        );

        startTimer();
    }

    /*
    Draw ONLY target workout
    body parts.
    */

    drawWorkoutGuide(lm);

    /*
    Detection
    */

    if(workout==="Push Up"){
        detectPushUp(lm);
    }

    else if(workout==="Squat"){
        detectSquat(lm);
    }

    else if(workout==="High Knees"){
        detectHighKnees(lm);
    }

    else if(workout==="Lunges"){
        detectLunge(lm);
    }

    else if(workout==="Mountain Climber"){
        detectMountainClimber(lm);
    }

    else if(workout==="Jumping Jack"){
        detectJumpingJack(lm);
    }

    else if(workout==="Burpees"){
        detectBurpee(lm);
    }

    else if(workout==="Plank"){
        detectPlank(lm);
    }

    else if(workout==="Stretching"){
        detectStretching(lm);
    }

    else if(workout==="Cool Down"){
        detectCoolDown(lm);
    }
}

/* =========================
   SAVE COMPLETION
========================= */

async function finishWorkout(){

    if(saving) return;

    if(repCount<=0){

        setStatus(
            "Complete at least 1 rep",
            "warn"
        );

        return;
    }

    if(!currentUser) return;

    saving=true;

    finishBtn.disabled=true;

    finishBtn.innerText="SAVING...";

    try{

        const uid =
            currentUser.uid;

        const userRef =
            db.collection("users").doc(uid);

        const snap =
            await userRef.get();

        const data =
            snap.exists ?
            snap.data() :
            {};

        const oldPoints =
            Number(data.totalPoints || 0);

        const oldCompleted =
            Array.isArray(data.completedTasks)
            ? data.completedTasks
            : [];

        const today =
            new Date().toISOString().slice(0,10);

        const taskKey =
            today+"_"+workout;

        if(
            !oldCompleted.includes(taskKey)
        ){

            await userRef.set({

                totalPoints:
                    oldPoints+repCount,

                completedTasks:[
                    ...oldCompleted,
                    taskKey
                ]

            },{merge:true});

        }

        window.location.href=
            "daily-task.html";

    }catch(error){

        console.error(error);

        setStatus(
            "Save failed. Try again.",
            "warn"
        );

        saving=false;

        finishBtn.disabled=false;

        finishBtn.innerText=
            "FINISH ✓";
    }
}

/* =========================
   FINISH
========================= */

finishBtn.onclick=()=>{
    finishWorkout();
};

/* =========================
   QUIT
========================= */

function stopCamera(){

    cameraStarted=false;

    if(video.srcObject){

        video.srcObject
            .getTracks()
            .forEach(track=>{
                track.stop();
            });
    }
}

quitBtn.onclick=()=>{

    stopCamera();

    if(timer){
        clearInterval(timer);
    }

    /*
    IMPORTANT:
    QUIT = NO SAVE
    */

    window.location.href=
        "daily-task.html";
};
