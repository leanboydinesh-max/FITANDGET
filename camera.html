<script>

/* ================= FIREBASE ================= */

const firebaseConfig = {

if(!firebase.apps.length){

    firebase.initializeApp(firebaseConfig);

}

const auth = firebase.auth();
const db = firebase.firestore();


/* ================= ELEMENTS ================= */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const workoutNameEl =
document.getElementById("workoutName");

const repEl =
document.getElementById("rep");

const statusEl =
document.getElementById("status");

const loading =
document.getElementById("loading");

const quitBtn =
document.getElementById("quitBtn");

const finishBtn =
document.getElementById("finishBtn");


/* ================= WORKOUT ================= */

const params =
new URLSearchParams(location.search);

let workout =
params.get("workout") ||
localStorage.getItem("selectedWorkout") ||
"Stretching";

try{

    workout =
    decodeURIComponent(workout);

}catch(e){}

workout =
workout.trim();

workoutNameEl.textContent =
workout;


/* ================= CAMERA STATE ================= */

let stream = null;
let pose = null;
let running = true;
let processing = false;

let reps = 0;

const MAX_REPS = 50;

let tracked = false;
let lostFrames = 0;

let lastRepTime = 0;


/* ================= PUSH UP ================= */

let pushLocked = false;
let pushLostFrames = 0;
let pushTopY = null;
let pushBottomY = null;
let pushDownSeen = false;


/* ================= WORKOUT STATES ================= */

let squatDown = false;

let lungeDown = false;

let highKneeUp = false;

let mountainKneeActive = false;

let jumpingJackOpen = false;

let burpeeDown = false;

let burpeeStanding = false;

let stretchUp = false;


/* ================= PLANK ================= */

let plankStart = 0;

let lastPlankSecond = 0;


/* ================= BASIC FUNCTIONS ================= */

function good(p){

    return !!(
        p &&
        typeof p.x === "number" &&
        typeof p.y === "number" &&
        (
            p.visibility === undefined ||
            p.visibility > .15
        )
    );

}


function req(a){

    return a.every(good);

}


function mid(a,b){

    return {

        x:(a.x+b.x)/2,

        y:(a.y+b.y)/2

    };

}


function dist(a,b){

    if(
        !good(a) ||
        !good(b)
    ){

        return 999;

    }

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


function angle(a,b,c){

    if(!req([a,b,c])){

        return 180;

    }

    const abx =
    a.x-b.x;

    const aby =
    a.y-b.y;

    const cbx =
    c.x-b.x;

    const cby =
    c.y-b.y;

    const m1 =
    Math.hypot(abx,aby);

    const m2 =
    Math.hypot(cbx,cby);

    if(!m1 || !m2){

        return 180;

    }

    return Math.acos(
        Math.max(
            -1,
            Math.min(
                1,
                (
                    abx*cbx +
                    aby*cby
                )/(m1*m2)
            )
        )
    ) * 180 / Math.PI;

}


/* ================= ADD REP ================= */

function addRep(){

    if(
        !tracked ||
        reps >= MAX_REPS
    ){

        return;

    }

    const now =
    Date.now();

    if(
        now-lastRepTime < 450
    ){

        return;

    }

    lastRepTime =
    now;

    reps++;

    repEl.textContent =
    reps;

    statusEl.textContent =
    "REP " + reps;

    statusEl.style.color =
    "#00ff66";

}


/* ================= BODY VISIBILITY ================= */

function bodyVisible(l){

    const p = [

        l[11],
        l[12],

        l[13],
        l[14],

        l[15],
        l[16],

        l[23],
        l[24],

        l[25],
        l[26],

        l[27],
        l[28]

    ];

    return (
        p.filter(good).length >= 7
    );

}


/* ================= PUSH-UP START ================= */

function pushupStartPosition(l){

    if(
        !req([
            l[11],
            l[12],
            l[13],
            l[14],
            l[15],
            l[16],
            l[23],
            l[24]
        ])
    ){
        return false;
    }

    const shoulder = mid(
        l[11],
        l[12]
    );

    const hip = mid(
        l[23],
        l[24]
    );

    const leftArm = angle(
        l[11],
        l[13],
        l[15]
    );

    const rightArm = angle(
        l[12],
        l[14],
        l[16]
    );

    const armAngle = Math.min(
        leftArm,
        rightArm
    );

    const bodyAngle = angle(
        shoulder,
        hip,
        {
            x:hip.x,
            y:hip.y + .35
        }
    );

    const shouldersLevel =
        Math.abs(
            l[11].y - l[12].y
        ) < .12;

    const hipsLevel =
        Math.abs(
            l[23].y - l[24].y
        ) < .15;

    /*
     * Must look like a real push-up setup.
     * Standing / hand waving must NOT lock.
     */

    return (
        armAngle > 135 &&
        bodyAngle > 115 &&
        shouldersLevel &&
        hipsLevel &&
        shoulder.y < hip.y + .35
    );
}


/* ================= PUSH-UP TRACK ================= */

function pushupBodyStillTrackable(l){

    return req([

        l[11],
        l[12],

        l[13],
        l[14],

        l[15],
        l[16],

        l[23],
        l[24]

    ]);
}


/* ================= PUSH-UP DETECTOR ================= */

function detectPushUp(l){

    /*
     * STEP 1
     * Find the real push-up starting position.
     */

    if(!pushLocked){

        if(
            pushupStartPosition(l)
        ){

            pushLocked = true;

            pushLostFrames = 0;

            tracked = true;

            const shoulder = mid(
                l[11],
                l[12]
            );

            /*
             * TOP position from your photo 1.
             */

            pushTopY = shoulder.y;

            pushBottomY = shoulder.y;

            pushDownSeen = false;

            statusEl.textContent =
            "PUSH-UP READY";

            statusEl.style.color =
            "#00ff66";
        }

        return;
    }


    /*
     * STEP 2
     * Once locked, do NOT require the
     * original top pose every frame.
     */

    if(
        pushupBodyStillTrackable(l)
    ){

        pushLostFrames = 0;

        tracked = true;

    }else{

        pushLostFrames++;

        /*
         * Small tracking loss is allowed.
         */

        if(
            pushLostFrames > 25
        ){

            pushLocked = false;

            pushLostFrames = 0;

            pushTopY = null;

            pushBottomY = null;

            pushDownSeen = false;

            tracked = false;

            return;
        }
    }


    /*
     * Current body position
     */

    const shoulder = mid(
        l[11],
        l[12]
    );

    const hip = mid(
        l[23],
        l[24]
    );


    /*
     * Arm angle
     *
     * TOP  = roughly straight
     * DOWN = clearly bent
     */

    const leftArm = angle(
        l[11],
        l[13],
        l[15]
    );

    const rightArm = angle(
        l[12],
        l[14],
        l[16]
    );

    const armAngle = Math.min(
        leftArm,
        rightArm
    );


    /*
     * Body size normalization.
     * This makes the detector work even
     * when the camera distance changes.
     */

    const bodyScale = Math.max(
        0.20,
        dist(
            shoulder,
            hip
        )
    );


    /*
     * ==========================================
     * TOP POSITION
     * ==========================================
     *
     * This matches your first photo.
     */

    if(!pushDownSeen){

        /*
         * Keep the highest shoulder position
         * as the TOP reference.
         */

        if(
            shoulder.y <
            pushTopY
        ){

            pushTopY =
            shoulder.y;
        }


        /*
         * DOWN POSITION
         *
         * Your second/third photos:
         *
         * - chest goes down
         * - elbows bend
         * - body moves downward
         *
         * IMPORTANT:
         * Down movement alone does NOT add a rep.
         */

        const downDistance =
        shoulder.y -
        pushTopY;

        const realDown =
        downDistance >
        bodyScale * .22;

        const armsBent =
        armAngle < 150;


        if(
            realDown &&
            armsBent
        ){

            pushDownSeen = true;

            pushBottomY =
            shoulder.y;

            statusEl.textContent =
            "DOWN";

            statusEl.style.color =
            "#00ff66";
        }

        return;
    }


    /*
     * ==========================================
     * DEEP DOWN
     * ==========================================
     *
     * Photo 2 -> Photo 3 can happen here.
     *
     * It is STILL the same repetition.
     * No coin / rep is added.
     */

    if(
        shoulder.y >
        pushBottomY
    ){

        pushBottomY =
        shoulder.y;
    }


    /*
     * ==========================================
     * UP POSITION
     * ==========================================
     *
     * Must actually return toward the TOP.
     */

    const returnedDistance =
    pushBottomY -
    shoulder.y;

    const returnedEnough =
    returnedDistance >
    bodyScale * .22;

    const armsStraight =
    armAngle > 155;


    /*
     * TOP return must happen before
     * counting the repetition.
     */

    if(
        returnedEnough &&
        armsStraight
    ){

        /*
         * EXACTLY ONE REP
         */

        addRep();


        /*
         * Reset for NEXT repetition.
         */

        pushDownSeen = false;

        pushTopY =
        shoulder.y;

        pushBottomY =
        shoulder.y;

        statusEl.textContent =
        "PUSH-UP READY";

        statusEl.style.color =
        "#00ff66";
    }

}
/* ================= SKELETON ================= */

const connections = [

    [11,12],

    [11,13],
    [13,15],

    [12,14],
    [14,16],

    [11,23],
    [12,24],

    [23,24],

    [23,25],
    [25,27],

    [24,26],
    [26,28]

];


function drawPoint(p,c){

    if(!good(p)){

        return;

    }

    ctx.beginPath();

    ctx.arc(
        p.x*canvas.width,
        p.y*canvas.height,
        4,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
    c;

    ctx.fill();

}


function drawLine(a,b,c){

    if(
        !good(a) ||
        !good(b)
    ){

        return;

    }

    ctx.beginPath();

    ctx.moveTo(
        a.x*canvas.width,
        a.y*canvas.height
    );

    ctx.lineTo(
        b.x*canvas.width,
        b.y*canvas.height
    );

    ctx.strokeStyle =
    c;

    ctx.lineWidth =
    5;

    ctx.lineCap =
    "round";

    ctx.stroke();

}


/* ================= DRAW BODY ================= */

function drawBody(l){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const visible =
    bodyVisible(l);

    if(visible){

        lostFrames =
        0;

        tracked =
        true;

    }else{

        lostFrames++;

    }

    if(
        lostFrames > 12 &&
        !pushLocked
    ){

        tracked =
        false;

    }

    const c =
    tracked
    ? "#00ff66"
    : "#ff3030";

    connections.forEach(x=>{

        drawLine(
            l[x[0]],
            l[x[1]],
            c
        );

        drawPoint(
            l[x[0]],
            c
        );

        drawPoint(
            l[x[1]],
            c
        );

    });

    if(pushLocked){

        statusEl.textContent =
        pushDownSeen
        ? "DOWN"
        : "PUSH-UP READY";

        statusEl.style.color =
        "#00ff66";

    }else{

        statusEl.textContent =
        tracked
        ? "TRACKING"
        : "MOVE INTO CAMERA";

        statusEl.style.color =
        tracked
        ? "#00ff66"
        : "#ff3030";

    }

}



/* ==================================================
   ALL WORKOUT DETECTION
   ================================================== */

function detect(l){

    if(!tracked){

        return;

    }

    const w =
    workout.toLowerCase();


    /* ================= PUSH UP ================= */

    if(
        w === "push up"
    ){

        detectPushUp(l);

        return;

    }


    /* ================= SQUAT ================= */

    if(
        w === "squat"
    ){

        if(
            !req([
                l[23],
                l[24],
                l[25],
                l[26],
                l[27],
                l[28]
            ])
        ){

            return;

        }

        const leftKnee =
        angle(
            l[23],
            l[25],
            l[27]
        );

        const rightKnee =
        angle(
            l[24],
            l[26],
            l[28]
        );

        const knee =
        Math.min(
            leftKnee,
            rightKnee
        );


        /* DOWN */

        if(
            !squatDown &&
            knee < 158
        ){

            squatDown =
            true;

        }


        /* STAND = REP */

        if(
            squatDown &&
            knee > 164
        ){

            addRep();

            squatDown =
            false;

        }

        return;

    }


    /* ================= HIGH KNEES ================= */

    if(
        w === "high knees"
    ){

        if(
            !req([
                l[23],
                l[24],
                l[25],
                l[26]
            ])
        ){

            return;

        }

        const leftUp =
        l[25].y <
        l[23].y-.055;

        const rightUp =
        l[26].y <
        l[24].y-.055;

        const kneeUp =
        leftUp ||
        rightUp;


        const leftBack =
        l[25].y >=
        l[23].y-.015;

        const rightBack =
        l[26].y >=
        l[24].y-.015;


        /* KNEE UP */

        if(
            !highKneeUp &&
            kneeUp
        ){

            highKneeUp =
            true;

        }


        /* KNEE DOWN = REP */

        if(
            highKneeUp &&
            leftBack &&
            rightBack
        ){

            addRep();

            highKneeUp =
            false;

        }

        return;

    }


    /* ================= LUNGES ================= */

    if(
        w === "lunges"
    ){

        if(
            !req([
                l[23],
                l[24],
                l[25],
                l[26],
                l[27],
                l[28]
            ])
        ){

            return;

        }

        const leftKnee =
        angle(
            l[23],
            l[25],
            l[27]
        );

        const rightKnee =
        angle(
            l[24],
            l[26],
            l[28]
        );

        const knee =
        Math.min(
            leftKnee,
            rightKnee
        );


        if(
            !lungeDown &&
            knee < 150
        ){

            lungeDown =
            true;

        }


        if(
            lungeDown &&
            knee > 165
        ){

            addRep();

            lungeDown =
            false;

        }

        return;

    }


    /* ================= MOUNTAIN CLIMBER ================= */

    if(
        w === "mountain climber"
    ){

        if(
            !req([
                l[11],
                l[12],
                l[15],
                l[16],
                l[23],
                l[24],
                l[25],
                l[26]
            ])
        ){

            return;

        }

        const shoulder =
        mid(
            l[11],
            l[12]
        );

        const hip =
        mid(
            l[23],
            l[24]
        );


        /* MUST BE HORIZONTAL */

        if(
            Math.abs(
                shoulder.y-hip.y
            ) >= .52
        ){

            mountainKneeActive =
            false;

            return;

        }


        /* KNEE DRIVE */

        const drive =
        dist(
            l[25],
            l[16]
        ) < .30 ||

        dist(
            l[26],
            l[15]
        ) < .30 ||

        l[25].y <
        l[23].y-.08 ||

        l[26].y <
        l[24].y-.08;


        /* KNEES BACK */

        const back =
        l[25].y >=
        l[23].y-.025 &&

        l[26].y >=
        l[24].y-.025;


        if(
            !mountainKneeActive &&
            drive
        ){

            mountainKneeActive =
            true;

        }


        if(
            mountainKneeActive &&
            back
        ){

            addRep();

            mountainKneeActive =
            false;

        }

        return;

    }


    /* ================= JUMPING JACK ================= */

    if(
        w === "jumping jack"
    ){

        if(
            !req([
                l[15],
                l[16],
                l[27],
                l[28],
                l[11],
                l[12]
            ])
        ){

            return;

        }

        const shoulder =
        mid(
            l[11],
            l[12]
        );

        const feetDistance =
        Math.abs(
            l[27].x -
            l[28].x
        );


        /* OPEN POSITION */

        const open =
        feetDistance > .16 &&

        l[15].y <
        shoulder.y+.02 &&

        l[16].y <
        shoulder.y+.02;


        /* CLOSED POSITION */

        const closed =
        feetDistance < .13 &&

        l[15].y >
        shoulder.y+.10 &&

        l[16].y >
        shoulder.y+.10;


        if(
            !jumpingJackOpen &&
            open
        ){

            jumpingJackOpen =
            true;

        }


        if(
            jumpingJackOpen &&
            closed
        ){

            addRep();

            jumpingJackOpen =
            false;

        }

        return;

    }


    /* ================= BURPEES ================= */

    if(
        w === "burpees"
    ){

        if(
            !req([
                l[11],
                l[12],
                l[23],
                l[24],
                l[25],
                l[26],
                l[27],
                l[28]
            ])
        ){

            return;

        }


        const leftKnee =
        angle(
            l[23],
            l[25],
            l[27]
        );

        const rightKnee =
        angle(
            l[24],
            l[26],
            l[28]
        );

        const knee =
        Math.min(
            leftKnee,
            rightKnee
        );


        const shoulder =
        mid(
            l[11],
            l[12]
        );

        const hip =
        mid(
            l[23],
            l[24]
        );


        /* LOW POSITION */

        const low =
        knee < 145 ||

        Math.abs(
            shoulder.y -
            hip.y
        ) < .50;


        /* STANDING */

        const standing =
        knee > 165 &&

        Math.abs(
            l[27].y -
            l[28].y
        ) < .15;


        /* JUMP */

        const jump =
        l[27].y <
        l[25].y-.025 &&

        l[28].y <
        l[26].y-.025;


        if(
            !burpeeDown &&
            low
        ){

            burpeeDown =
            true;

            burpeeStanding =
            false;

        }


        if(
            burpeeDown &&
            !burpeeStanding &&
            standing
        ){

            burpeeStanding =
            true;

        }


        if(
            burpeeStanding &&
            jump
        ){

            addRep();

            burpeeDown =
            false;

            burpeeStanding =
            false;

        }

        return;

    }


    /* ================= PLANK ================= */

    if(
        w === "plank"
    ){

        if(
            !req([
                l[11],
                l[12],
                l[23],
                l[24],
                l[25],
                l[26]
            ])
        ){

            return;

        }


        const shoulder =
        mid(
            l[11],
            l[12]
        );

        const hip =
        mid(
            l[23],
            l[24]
        );


        const valid =
        Math.abs(
            shoulder.y -
            hip.y
        ) < .55;


        if(!valid){

            /*
             * Small temporary tracking movement
             * should not instantly reset plank.
             */

            if(
                plankStart &&
                Date.now()-plankStart > 1500
            ){

                plankStart =
                0;

                lastPlankSecond =
                0;

            }

            return;

        }


        if(!plankStart){

            plankStart =
            Date.now();

            lastPlankSecond =
            0;

        }


        const sec =
        Math.min(
            MAX_REPS,
            Math.floor(
                (
                    Date.now() -
                    plankStart
                ) / 1000
            )
        );


        if(
            sec >
            lastPlankSecond
        ){

            lastPlankSecond =
            sec;

            reps =
            sec;

            repEl.textContent =
            sec;

            statusEl.textContent =
            sec + " SEC";

            statusEl.style.color =
            "#00ff66";

        }

        return;

    }


    /* ================= STRETCHING ================= */

    if(
        w === "stretching" ||
        w === "cool down"
    ){

        if(
            !req([
                l[11],
                l[12],
                l[15],
                l[16]
            ])
        ){

            return;

        }


        const shoulder =
        mid(
            l[11],
            l[12]
        );


        /* BOTH ARMS UP */

        const up =
        l[15].y <
        shoulder.y-.10 &&

        l[16].y <
        shoulder.y-.10;


        /* BOTH ARMS DOWN */

        const down =
        l[15].y >
        shoulder.y+.05 &&

        l[16].y >
        shoulder.y+.05;


        if(
            !stretchUp &&
            up
        ){

            stretchUp =
            true;

        }


        if(
            stretchUp &&
            down
        ){

            addRep();

            stretchUp =
            false;

        }

        return;

    }

}


/* ================= MEDIAPIPE ================= */

function onResults(results){

    if(!running){

        return;

    }


    if(
        !results ||
        !results.poseLandmarks
    ){

        lostFrames++;


        if(
            lostFrames > 12 &&
            !pushLocked
        ){

            tracked =
            false;

            statusEl.textContent =
            "MOVE INTO CAMERA";

            statusEl.style.color =
            "#ff3030";

        }

        return;

    }


    drawBody(
        results.poseLandmarks
    );


    detect(
        results.poseLandmarks
    );

}


/* ================= POSE SETUP ================= */

function setupPose(){

    pose =
    new Pose({

        locateFile:
        file =>
        "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file

    });


    pose.setOptions({

        modelComplexity:1,

        smoothLandmarks:true,

        enableSegmentation:false,

        minDetectionConfidence:.35,

        minTrackingConfidence:.35

    });


    pose.onResults(
        onResults
    );

}


/* ================= CAMERA ================= */

async function startCamera(){

    try{

        setupPose();


        stream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:720
                },

                height:{
                    ideal:1280
                }

            },

            audio:false

        });


        video.srcObject =
        stream;


        await video.play();


        canvas.width =
        video.videoWidth ||
        720;

        canvas.height =
        video.videoHeight ||
        1280;


        loading.style.display =
        "none";


        statusEl.textContent =
        "MOVE INTO CAMERA";

        statusEl.style.color =
        "#ff3030";


        requestAnimationFrame(
            processVideo
        );


    }catch(e){

        console.error(e);


        loading.innerHTML =

        '<div style="color:#ff3030;font-weight:bold">'+
        'Camera could not start'+
        '</div>'+

        '<div style="color:#aaa;font-size:13px">'+
        'Allow camera permission and reload.'+
        '</div>';

    }

}


/* ================= PROCESS VIDEO ================= */

async function processVideo(){

    if(!running){

        return;

    }


    if(
        video.readyState >= 2 &&
        !processing
    ){

        processing =
        true;


        try{

            await pose.send({

                image:
                video

            });

        }catch(e){

            console.error(
                "Pose error:",
                e
            );

        }


        processing =
        false;

    }


    requestAnimationFrame(
        processVideo
    );

}


/* ================= STOP CAMERA ================= */

function stopCamera(){

    running =
    false;


    if(stream){

        stream
        .getTracks()
        .forEach(
            t=>t.stop()
        );


        stream =
        null;

    }

}


/* ================= QUIT ================= */

quitBtn.onclick = ()=>{

    stopCamera();

    location.href =
    "daily-task.html";

};


/* ================= FINISH ================= */

finishBtn.onclick =
async()=>{

    if(reps<=0){

        alert(
            "Complete at least 1 rep."
        );

        return;

    }


    const user =
    auth.currentUser;


    if(!user){

        alert(
            "Please login before saving."
        );

        return;

    }


    finishBtn.disabled =
    true;


    try{

        const ref =
        db.collection("users")
        .doc(user.uid);


        const snap =
        await ref.get();


        const data =
        snap.exists
        ? snap.data()
        : {};


        const oldPoints =
        Number(
            data.totalPoints || 0
        );


        const order = [

            "Stretching",

            "Push Up",

            "Squat",

            "High Knees",

            "Lunges",

            "Mountain Climber",

            "Jumping Jack",

            "Burpees",

            "Plank",

            "Cool Down"

        ];


        let completed =

        Array.isArray(
            data.completedTasks
        )

        ? [...data.completedTasks]

        : [];


        const index =
        order.findIndex(
            x =>
            x.toLowerCase() ===
            workout.toLowerCase()
        );


        if(
            index >= 0 &&
            !completed.includes(index)
        ){

            completed.push(index);

        }


        completed =
        [...new Set(completed)]
        .sort(
            (a,b)=>a-b
        );


        await ref.set({

            totalPoints:
            oldPoints + reps,

            completedTasks:
            completed,

            lastWorkout:
            workout,

            lastWorkoutReps:
            reps,

            updatedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

        },{
            merge:true
        });


        stopCamera();


        location.href =
        "daily-task.html";


    }catch(e){

        console.error(e);


        alert(
            "Could not save workout. Please try again."
        );


        finishBtn.disabled =
        false;

    }

};


/* ================= RESIZE ================= */

window.addEventListener(
"resize",
()=>{

    if(
        video.videoWidth &&
        video.videoHeight
    ){

        canvas.width =
        video.videoWidth;

        canvas.height =
        video.videoHeight;

    }

});


/* ================= START ================= */

startCamera();

</script>
