<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>FIT & GET - Camera</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    width:100%;
    min-height:100vh;
    overflow:hidden;
}

#cameraBox{
    position:relative;
    width:100vw;
    height:100vh;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

#video{
    width:100%;
    height:100%;
    object-fit:contain;
    transform:scaleX(-1);
}

#canvas{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

#top{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    text-align:center;
}

#workoutName{
    font-size:22px;
    font-weight:bold;
    color:#9dff00;
    text-shadow:0 0 10px #00ff66;
}

#rep{
    margin-top:8px;
    font-size:42px;
    font-weight:bold;
}

#status{
    margin-top:5px;
    font-size:15px;
    font-weight:bold;
}

#buttons{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    gap:12px;
}

button{
    border:none;
    border-radius:30px;
    padding:13px 25px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

#quitBtn{
    background:#222;
    color:white;
    border:1px solid #777;
}

#finishBtn{
    background:#9dff00;
    color:#000;
}

#loading{
    position:absolute;
    inset:0;
    z-index:20;
    background:#050505;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
}

.loader{
    width:42px;
    height:42px;
    border:4px solid #333;
    border-top-color:#9dff00;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}
</style>
</head>

<body>

<div id="cameraBox">

    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="top">
        <div id="workoutName">Workout</div>
        <div id="rep">0</div>
        <div id="status">CHECKING POSITION...</div>
    </div>

    <div id="buttons">
        <button id="quitBtn">QUIT</button>
        <button id="finishBtn">FINISH</button>
    </div>

    <div id="loading">
        <div class="loader"></div>
        <div>Starting camera...</div>
    </div>

</div>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey:"AIzaSyBOuzSm82-dlDXsmrwX1yWQVre0YD60cWM",
    authDomain:"fitandget-b3461.firebaseapp.com",
    projectId:"fitandget-b3461",
    storageBucket:"fitandget-b3461.firebasestorage.app",
    messagingSenderId:"216178533513",
    appId:"1:216178533513:web:975f20599c7e77b9d01258"
};

if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();


/* =========================
   ELEMENTS
========================= */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const workoutNameEl = document.getElementById("workoutName");
const repEl = document.getElementById("rep");
const statusEl = document.getElementById("status");

const loading = document.getElementById("loading");
const quitBtn = document.getElementById("quitBtn");
const finishBtn = document.getElementById("finishBtn");


/* =========================
   WORKOUT
========================= */

const params = new URLSearchParams(location.search);

let workout =
    params.get("workout") ||
    params.get("exercise") ||
    localStorage.getItem("selectedWorkout") ||
    "Push Up";

workout = decodeURIComponent(workout);

workoutNameEl.textContent = workout;


/* =========================
   VARIABLES
========================= */

let stream = null;
let pose = null;
let processing = false;
let running = true;

let reps = 0;

let positionReady = false;
let lostFrames = 0;

let state = "READY";

let baseline = null;
let movementStart = null;

let previousValues = [];

const MAX_REPS = 50;


/* =========================
   HELPERS
========================= */

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function dist(a,b){
    return Math.sqrt(
        Math.pow(a.x-b.x,2) +
        Math.pow(a.y-b.y,2)
    );
}

function angle(a,b,c){

    const abx = a.x-b.x;
    const aby = a.y-b.y;

    const cbx = c.x-b.x;
    const cby = c.y-b.y;

    const dot = abx*cbx + aby*cby;

    const mag1 = Math.sqrt(abx*abx+aby*aby);
    const mag2 = Math.sqrt(cbx*cbx+cby*cby);

    if(!mag1 || !mag2) return 180;

    let value = dot/(mag1*mag2);

    value = clamp(value,-1,1);

    return Math.acos(value)*180/Math.PI;
}

function good(p){
    return p && p.visibility > 0.35;
}


/* =========================
   DRAW
========================= */

function drawPoint(p,color="#00ff66"){

    if(!p) return;

    ctx.beginPath();

    ctx.arc(
        p.x*canvas.width,
        p.y*canvas.height,
        5,
        0,
        Math.PI*2
    );

    ctx.fillStyle=color;
    ctx.fill();
}


function drawLine(a,b,color="#00ff66"){

    if(!a || !b) return;

    ctx.beginPath();

    ctx.moveTo(
        a.x*canvas.width,
        a.y*canvas.height
    );

    ctx.lineTo(
        b.x*canvas.width,
        b.y*canvas.height
    );

    ctx.strokeStyle=color;
    ctx.lineWidth=6;
    ctx.lineCap="round";
    ctx.stroke();
}


/* =========================
   WORKOUT BODY PARTS
========================= */

function getParts(l){

    switch(workout.toLowerCase()){

        case "push up":
            return [
                [l[11],l[13]],
                [l[13],l[15]],
                [l[12],l[14]],
                [l[14],l[16]],
                [l[11],l[12]]
            ];

        case "squat":
            return [
                [l[23],l[25]],
                [l[25],l[27]],
                [l[24],l[26]],
                [l[26],l[28]],
                [l[23],l[24]]
            ];

        case "high knees":
            return [
                [l[23],l[25]],
                [l[24],l[26]]
            ];

        case "lunges":
            return [
                [l[23],l[25]],
                [l[25],l[27]],
                [l[24],l[26]],
                [l[26],l[28]]
            ];

        case "mountain climber":
            return [
                [l[11],l[23]],
                [l[12],l[24]],
                [l[23],l[25]],
                [l[24],l[26]]
            ];

        case "jumping jack":
            return [
                [l[11],l[13]],
                [l[13],l[15]],
                [l[12],l[14]],
                [l[14],l[16]],
                [l[23],l[25]],
                [l[25],l[27]],
                [l[24],l[26]],
                [l[26],l[28]]
            ];

        case "burpees":
            return [
                [l[11],l[12]],
                [l[11],l[23]],
                [l[12],l[24]],
                [l[23],l[25]],
                [l[24],l[26]]
            ];

        case "plank":
            return [
                [l[11],l[23]],
                [l[12],l[24]],
                [l[23],l[25]],
                [l[24],l[26]]
            ];

        case "stretching":
        case "cool down":
            return [
                [l[11],l[13]],
                [l[13],l[15]],
                [l[12],l[14]],
                [l[14],l[16]]
            ];

        default:
            return [
                [l[11],l[12]],
                [l[11],l[13]],
                [l[13],l[15]],
                [l[12],l[14]],
                [l[14],l[16]],
                [l[23],l[25]],
                [l[25],l[27]],
                [l[24],l[26]],
                [l[26],l[28]]
            ];
    }
}


/* =========================
   POSITION CHECK
========================= */

function checkPosition(l){

    const relevant = getParts(l);

    let visible = 0;

    relevant.forEach(pair=>{

        if(good(pair[0]) && good(pair[1])){
            visible++;
        }

    });

    /*
       IMPORTANT:
       Only check whether the body is visible.

       No strict:
       - angle
       - distance
       - pose
       - exact position
    */

    if(visible >= Math.max(1,Math.ceil(relevant.length*0.55))){

        if(!positionReady){

            positionReady = true;

            baseline = null;
            movementStart = null;
            state = "READY";
        }

        lostFrames = 0;

        return true;
    }

    lostFrames++;

    /*
       Small temporary tracking loss
       should NOT immediately turn red.
    */

    if(lostFrames < 15){
        return true;
    }

    positionReady = false;

    return false;
}


/* =========================
   DRAW BODY
========================= */

function drawBody(l){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const ready = checkPosition(l);

    const color = ready ? "#00ff66" : "#ff3030";

    const parts = getParts(l);

    parts.forEach(pair=>{
        drawLine(pair[0],pair[1],color);
        drawPoint(pair[0],color);
        drawPoint(pair[1],color);
    });

    if(ready){

        statusEl.textContent = "READY • MOVE";
        statusEl.style.color = "#00ff66";

    }else{

        statusEl.textContent = "MOVE INTO CAMERA";
        statusEl.style.color = "#ff3030";
    }
}


/* =========================
   ADD REP
========================= */

function addRep(){

    if(!positionReady) return;

    if(reps >= MAX_REPS) return;

    reps++;

    repEl.textContent = reps;

    statusEl.textContent = "REP " + reps;
    statusEl.style.color = "#00ff66";
}


/* =========================
   MOVEMENT DETECTION
========================= */

function detectMovement(l){

    if(!positionReady) return;

    const w = workout.toLowerCase();


    /* ================= PUSH UP ================= */

    if(w === "push up"){

        const leftAngle = angle(l[11],l[13],l[15]);
        const rightAngle = angle(l[12],l[14],l[16]);

        let elbowAngle =
            Math.min(leftAngle,rightAngle);

        if(!isFinite(elbowAngle)) return;

        /*
           No exact body position.

           Only:
           arms bend = down
           arms straighten = up
        */

        if(elbowAngle < 155){

            state = "DOWN";

        }else if(
            state === "DOWN" &&
            elbowAngle > 160
        ){

            addRep();

            state = "UP";
        }

        return;
    }


    /* ================= SQUAT ================= */

    if(w === "squat"){

        if(!good(l[23]) ||
           !good(l[24]) ||
           !good(l[25]) ||
           !good(l[26])) return;

        const leftHip = l[23];
        const rightHip = l[24];

        const leftKnee = l[25];
        const rightKnee = l[26];

        const hipY =
            (leftHip.y+rightHip.y)/2;

        const kneeY =
            (leftKnee.y+rightKnee.y)/2;

        const movement =
            kneeY-hipY;

        /*
           We only compare movement
           relative to user's own baseline.
        */

        if(baseline === null){

            baseline = movement;

            return;
        }

        const delta = movement-baseline;

        if(delta > 0.035){

            state = "DOWN";

        }else if(
            state === "DOWN" &&
            delta < 0.015
        ){

            addRep();

            state = "UP";
        }

        return;
    }


    /* ================= HIGH KNEES ================= */

    if(w === "high knees"){

        if(!good(l[23]) || !good(l[25]) ||
           !good(l[24]) || !good(l[26])) return;

        const leftRise = l[23].y-l[25].y;
        const rightRise = l[24].y-l[26].y;

        const rise = Math.max(leftRise,rightRise);

        if(rise > 0.06){

            state = "UP";

        }else if(
            state === "UP" &&
            rise < 0.025
        ){

            addRep();

            state = "DOWN";
        }

        return;
    }


    /* ================= LUNGES ================= */

    if(w === "lunges"){

        const leftAngle =
            angle(l[23],l[25],l[27]);

        const rightAngle =
            angle(l[24],l[26],l[28]);

        const kneeAngle =
            Math.min(leftAngle,rightAngle);

        if(kneeAngle < 155){

            state = "DOWN";

        }else if(
            state === "DOWN" &&
            kneeAngle > 165
        ){

            addRep();

            state = "UP";
        }

        return;
    }


    /* ================= MOUNTAIN CLIMBER ================= */

    if(w === "mountain climber"){

        if(!good(l[23]) ||
           !good(l[24]) ||
           !good(l[25]) ||
           !good(l[26])) return;

        const leftDistance =
            Math.abs(l[25].y-l[23].y);

        const rightDistance =
            Math.abs(l[26].y-l[24].y);

        const distance =
            Math.min(leftDistance,rightDistance);

        if(baseline === null){

            baseline = distance;

            return;
        }

        if(distance < baseline*0.75){

            state = "KNEE_UP";

        }else if(
            state === "KNEE_UP" &&
            distance > baseline*0.90
        ){

            addRep();

            state = "READY";
        }

        return;
    }


    /* ================= JUMPING JACK ================= */

    if(w === "jumping jack"){

        if(!good(l[11]) ||
           !good(l[12]) ||
           !good(l[15]) ||
           !good(l[16])) return;

        const armsUp =
            l[15].y < l[11].y ||
            l[16].y < l[12].y;

        const feetApart =
            Math.abs(l[27].x-l[28].x) > 0.22;

        const open = armsUp && feetApart;

        if(open){

            state = "OPEN";

        }else if(
            state === "OPEN" &&
            !open
        ){

            addRep();

            state = "CLOSED";
        }

        return;
    }


    /* ================= BURPEE ================= */

    if(w === "burpees"){

        if(!good(l[11]) ||
           !good(l[12]) ||
           !good(l[23]) ||
           !good(l[24])) return;

        const shoulderY =
            (l[11].y+l[12].y)/2;

        const hipY =
            (l[23].y+l[24].y)/2;

        const bodyHeight =
            Math.abs(shoulderY-hipY);

        if(baseline === null){

            baseline = bodyHeight;

            return;
        }

        /*
           Large body shape change = down.
           Return to normal = up.
        */

        if(bodyHeight < baseline*0.65){

            state = "DOWN";

        }else if(
            state === "DOWN" &&
            bodyHeight > baseline*0.85
        ){

            addRep();

            state = "UP";
        }

        return;
    }


    /* ================= PLANK ================= */

    if(w === "plank"){

        /*
           Plank is intentionally simple:
           if the body remains visible and
           reasonably stable, count one rep
           after holding for 5 seconds.
        */

        if(!movementStart){

            movementStart = Date.now();

        }

        if(
            Date.now()-movementStart >= 5000 &&
            state !== "COUNTED"
        ){

            addRep();

            state = "COUNTED";
        }

        return;
    }


    /* ================= STRETCHING ================= */

    if(w === "stretching"){

        if(!good(l[15]) ||
           !good(l[16])) return;

        const wristY =
            (l[15].y+l[16].y)/2;

        if(baseline === null){

            baseline = wristY;

            return;
        }

        const movement =
            Math.abs(wristY-baseline);

        if(movement > 0.07){

            state = "MOVE";

        }else if(
            state === "MOVE" &&
            movement < 0.035
        ){

            addRep();

            state = "READY";
            baseline = wristY;
        }

        return;
    }


    /* ================= COOL DOWN ================= */

    if(w === "cool down"){

        if(!good(l[15]) ||
           !good(l[16])) return;

        const wristY =
            (l[15].y+l[16].y)/2;

        if(baseline === null){

            baseline = wristY;

            return;
        }

        const movement =
            Math.abs(wristY-baseline);

        if(movement > 0.07){

            state = "MOVE";

        }else if(
            state === "MOVE" &&
            movement < 0.035
        ){

            addRep();

            state = "READY";
            baseline = wristY;
        }

        return;
    }
}


/* =========================
   POSE RESULT
========================= */

function onResults(results){

    if(!running) return;

    if(!results.poseLandmarks){

        lostFrames++;

        if(lostFrames >= 15){

            positionReady = false;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            statusEl.textContent =
                "MOVE INTO CAMERA";

            statusEl.style.color="#ff3030";
        }

        return;
    }

    lostFrames = 0;

    const landmarks =
        results.poseLandmarks;

    drawBody(landmarks);

    /*
       IMPORTANT:
       Movement analysis only happens
       after usable position is detected.
    */

    if(positionReady){

        detectMovement(landmarks);
    }
}


/* =========================
   POSE SETUP
========================= */

function setupPose(){

    pose = new Pose({

        locateFile:(file)=>{
            return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file;
        }

    });

    pose.setOptions({

        modelComplexity:1,

        smoothLandmarks:true,

        enableSegmentation:false,

        minDetectionConfidence:0.40,

        minTrackingConfidence:0.40

    });

    pose.onResults(onResults);
}


/* =========================
   CAMERA LOOP
========================= */

async function processVideo(){

    if(!running) return;

    if(
        video.readyState >= 2 &&
        !processing
    ){

        processing = true;

        try{

            await pose.send({
                image:video
            });

        }catch(e){

            console.error("Pose error:",e);

        }

        processing = false;
    }

    requestAnimationFrame(processVideo);
}


/* =========================
   START CAMERA
========================= */

async function startCamera(){

    try{

        loading.style.display="flex";

        setupPose();

        stream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",
                    width:{ideal:720},
                    height:{ideal:1280}
                },

                audio:false

            });

        video.srcObject=stream;

        await video.play();

        canvas.width =
            video.videoWidth || 720;

        canvas.height =
            video.videoHeight || 1280;

        loading.style.display="none";

        processVideo();

    }catch(error){

        console.error(error);

        loading.innerHTML=`
            <div style="color:#ff3030;font-size:18px">
                Camera could not start
            </div>
            <div style="font-size:13px;color:#aaa">
                Allow camera permission and reload.
            </div>
        `;
    }
}


/* =========================
   STOP CAMERA
========================= */

function stopCamera(){

    running=false;

    if(stream){

        stream.getTracks().forEach(track=>{
            track.stop();
        });

        stream=null;
    }
}


/* =========================
   QUIT
========================= */

quitBtn.onclick=()=>{

    /*
       QUIT = NO SAVE
    */

    stopCamera();

    location.href="daily-task.html";
};


/* =========================
   FINISH
========================= */

finishBtn.onclick=async()=>{

    if(reps <= 0){

        alert("Complete at least 1 rep.");
        return;
    }

    const user = auth.currentUser;

    if(!user){

        alert("Please login first.");
        return;
    }

    finishBtn.disabled=true;

    try{

        const userRef =
            db.collection("users").doc(user.uid);

        await db.runTransaction(async(transaction)=>{

            const snap =
                await transaction.get(userRef);

            const data =
                snap.exists ? snap.data() : {};

            const oldPoints =
                Number(data.totalPoints || 0);

            const oldTasks =
                Number(data.completedTasks || 0);

            transaction.set(

                userRef,

                {

                    totalPoints:
                        oldPoints + reps,

                    completedTasks:
                        oldTasks + 1,

                    lastWorkout:
                        workout,

                    lastWorkoutReps:
                        reps,

                    updatedAt:
                        firebase.firestore.FieldValue.serverTimestamp()

                },

                {merge:true}
            );
        });

        stopCamera();

        location.href="daily-task.html";

    }catch(error){

        console.error(error);

        alert(
            "Could not save workout. Please try again."
        );

        finishBtn.disabled=false;
    }
};


/* =========================
   AUTH + START
========================= */

auth.onAuthStateChanged(user=>{

    if(!user){

        location.href="index.html";
        return;
    }

    startCamera();

});


/* =========================
   RESIZE
========================= */

window.addEventListener("resize",()=>{

    if(video.videoWidth){

        canvas.width=video.videoWidth;
        canvas.height=video.videoHeight;
    }

});

</script>

</body>
</html>
