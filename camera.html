<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey:"AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",
    authDomain:"fitandget-b3461.firebaseapp.com",
    projectId:"fitandget-b3461",
    storageBucket:"fitandget-b3461.firebasestorage.app",
    messagingSenderId:"216178533513",
    appId:"1:216178533513:web:975f20599c7e77b9d01258"
};

if(!firebase.apps.length){
    firebase.initializeApp(firebaseConfig);
}

const auth=firebase.auth();
const db=firebase.firestore();


/* =========================
   ELEMENTS
========================= */

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const workoutNameEl=document.getElementById("workoutName");
const repEl=document.getElementById("rep");
const statusEl=document.getElementById("status");
const loading=document.getElementById("loading");

const quitBtn=document.getElementById("quitBtn");
const finishBtn=document.getElementById("finishBtn");


/* =========================
   WORKOUT
========================= */

const params=new URLSearchParams(location.search);

let workout=
    params.get("workout") ||
    localStorage.getItem("selectedWorkout") ||
    "Stretching";

try{
    workout=decodeURIComponent(workout);
}catch(e){}

workout=workout.trim();

workoutNameEl.textContent=workout;


/* =========================
   GLOBAL
========================= */

let stream=null;
let pose=null;
let running=true;
let processing=false;

let reps=0;
const MAX_REPS=50;

let tracked=false;
let lostFrames=0;

let phase="start";

let lastRepTime=0;

let plankStart=0;
let lastPlankSecond=0;


/* =========================
   MEMORY
========================= */

let memory={
    pushTop:null,
    pushBottom:null,

    squatDown:false,

    lungeDown:false,

    kneeUp:false,

    mountainForward:false,

    jackOpen:false,

    burpeeDown:false,
    burpeeStand:false,

    stretchUp:false,

    cooldownUp:false
};


function resetMovement(){

    phase="start";

    memory={
        pushTop:null,
        pushBottom:null,

        squatDown:false,
        lungeDown:false,

        kneeUp:false,

        mountainForward:false,

        jackOpen:false,

        burpeeDown:false,
        burpeeStand:false,

        stretchUp:false,

        cooldownUp:false
    };
}


/* =========================
   HELPERS
========================= */

function good(p){

    return !!(
        p &&
        typeof p.x==="number" &&
        typeof p.y==="number" &&
        (
            p.visibility===undefined ||
            p.visibility>0.20
        )
    );
}


function req(arr){
    return arr.every(good);
}


function mid(a,b){
    return {
        x:(a.x+b.x)/2,
        y:(a.y+b.y)/2
    };
}


function dist(a,b){

    if(!good(a)||!good(b)) return 999;

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function angle(a,b,c){

    if(!req([a,b,c])) return 180;

    const abx=a.x-b.x;
    const aby=a.y-b.y;

    const cbx=c.x-b.x;
    const cby=c.y-b.y;

    const dot=abx*cbx+aby*cby;

    const m1=Math.hypot(abx,aby);
    const m2=Math.hypot(cbx,cby);

    if(!m1||!m2) return 180;

    return Math.acos(
        Math.max(
            -1,
            Math.min(
                1,
                dot/(m1*m2)
            )
        )
    )*180/Math.PI;
}


function addRep(){

    if(!tracked) return;

    if(reps>=MAX_REPS) return;

    const now=Date.now();

    if(now-lastRepTime<450) return;

    lastRepTime=now;

    reps++;

    repEl.textContent=reps;

    statusEl.textContent="REP "+reps;
    statusEl.style.color="#00ff66";
}


/* =========================
   BODY TRACK
========================= */

function bodyVisible(l){

    const points=[
        l[11],l[12],
        l[13],l[14],
        l[15],l[16],
        l[23],l[24],
        l[25],l[26],
        l[27],l[28]
    ];

    let count=0;

    points.forEach(p=>{
        if(good(p)) count++;
    });

    return count>=8;
}


/* =========================
   PUSH-UP POSITION
========================= */

function pushupPosition(l){

    if(!req([
        l[11],l[12],
        l[13],l[14],
        l[15],l[16],
        l[23],l[24],
        l[27],l[28]
    ])){
        return false;
    }

    const shoulder=mid(l[11],l[12]);
    const hip=mid(l[23],l[24]);
    const ankle=mid(l[27],l[28]);

    const bodyAngle=angle(
        shoulder,
        hip,
        ankle
    );

    const handsNearShoulder=
        Math.min(
            dist(l[15],l[11]),
            dist(l[16],l[12])
        )<0.42;

    /*
       Push-up body should be
       roughly horizontal.
    */

    const horizontalBody=
        Math.abs(
            shoulder.y-hip.y
        )<0.42;

    /*
       Prevent standing position.
    */

    const notStanding=
        Math.abs(
            shoulder.y-ankle.y
        )<0.65;

    return(
        bodyAngle>125 &&
        handsNearShoulder &&
        horizontalBody &&
        notStanding
    );
}


/* =========================
   PLANK
========================= */

function plankPosition(l){

    if(!req([
        l[11],l[12],
        l[23],l[24],
        l[27],l[28]
    ])){
        return false;
    }

    const shoulder=mid(l[11],l[12]);
    const hip=mid(l[23],l[24]);
    const ankle=mid(l[27],l[28]);

    const a=angle(
        shoulder,
        hip,
        ankle
    );

    return(
        a>120 &&
        Math.abs(
            shoulder.y-hip.y
        )<0.45
    );
}


/* =========================
   DRAW
========================= */

const connections=[
    [11,12],

    [11,13],
    [13,15],

    [12,14],
    [14,16],

    [11,23],
    [12,24],

    [23,24],

    [23,25],
    [25,27],

    [24,26],
    [26,28]
];


function drawPoint(p,color){

    if(!good(p)) return;

    ctx.beginPath();

    ctx.arc(
        p.x*canvas.width,
        p.y*canvas.height,
        4,
        0,
        Math.PI*2
    );

    ctx.fillStyle=color;
    ctx.fill();
}


function drawLine(a,b,color){

    if(!good(a)||!good(b)) return;

    ctx.beginPath();

    ctx.moveTo(
        a.x*canvas.width,
        a.y*canvas.height
    );

    ctx.lineTo(
        b.x*canvas.width,
        b.y*canvas.height
    );

    ctx.strokeStyle=color;
    ctx.lineWidth=5;
    ctx.lineCap="round";
    ctx.stroke();
}


function drawBody(l){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const visible=bodyVisible(l);

    if(visible){

        lostFrames=0;
        tracked=true;

    }else{

        lostFrames++;

        if(lostFrames>8){
            tracked=false;
            resetMovement();
        }
    }

    const color=
        tracked
        ? "#00ff66"
        : "#ff3030";

    connections.forEach(pair=>{

        drawLine(
            l[pair[0]],
            l[pair[1]],
            color
        );

        drawPoint(
            l[pair[0]],
            color
        );

        drawPoint(
            l[pair[1]],
            color
        );
    });

    if(tracked){

        statusEl.textContent="TRACKING";
        statusEl.style.color="#00ff66";

    }else{

        statusEl.textContent="MOVE INTO CAMERA";
        statusEl.style.color="#ff3030";
    }
}


/* =========================
   MAIN TRACKER
========================= */

function detect(l){

    if(!tracked) return;

    const w=workout.toLowerCase();

    const shoulder=mid(l[11],l[12]);
    const hip=mid(l[23],l[24]);

    const leftKnee=angle(
        l[23],l[25],l[27]
    );

    const rightKnee=angle(
        l[24],l[26],l[28]
    );

    const knee=Math.min(
        leftKnee,
        rightKnee
    );

    const leftElbow=angle(
        l[11],l[13],l[15]
    );

    const rightElbow=angle(
        l[12],l[14],l[16]
    );

    const elbow=Math.min(
        leftElbow,
        rightElbow
    );


    /* =====================
       STRETCHING
    ===================== */

    if(w==="stretching"){

        if(!req([
            l[11],l[12],
            l[15],l[16]
        ])) return;

        const up=
            l[15].y<shoulder.y-0.04 ||
            l[16].y<shoulder.y-0.04;

        const down=
            l[15].y>shoulder.y+0.02 &&
            l[16].y>shoulder.y+0.02;

        if(phase==="start" && down){
            phase="ready";
        }

        if(phase==="ready" && up){
            phase="move";
        }

        if(phase==="move" && down){
            addRep();
            phase="ready";
        }

        return;
    }


    /* =====================
       PUSH UP
    ===================== */

    if(w==="push up"){

        if(!pushupPosition(l)){

            phase="start";
            memory.pushTop=null;
            memory.pushBottom=null;
            return;
        }

        const chest=shoulder.y;

        /*
           First establish top position.
        */

        if(phase==="start"){

            memory.pushTop=chest;
            phase="ready";
            return;
        }

        /*
           Keep updating top slightly.
        */

        if(
            phase==="ready" &&
            memory.pushTop!==null &&
            chest<memory.pushTop+0.02
        ){
            memory.pushTop=chest;
        }

        /*
           Going down.
        */

        if(phase==="ready"){

            const movedDown=
                chest>
                memory.pushTop+0.035;

            const bent=
                elbow<165;

            if(movedDown && bent){

                memory.pushBottom=chest;
                phase="move";
            }

            return;
        }

        /*
           Going back up.
        */

        if(phase==="move"){

            if(
                memory.pushBottom===null ||
                chest>memory.pushBottom
            ){
                memory.pushBottom=chest;
            }

            const movedUp=
                chest<
                memory.pushBottom-0.025;

            const extended=
                elbow>150;

            if(movedUp && extended){

                addRep();

                memory.pushTop=chest;
                memory.pushBottom=null;

                phase="ready";
            }

        }

        return;
    }


    /* =====================
       SQUAT
    ===================== */

    if(w==="squat"){

        if(!req([
            l[23],l[24],
            l[25],l[26],
            l[27],l[28]
        ])) return;

        if(phase==="start"){
            phase="ready";
        }

        if(
            phase==="ready" &&
            knee<160
        ){
            phase="move";
        }

        if(
            phase==="move" &&
            knee>160
        ){
            addRep();
            phase="ready";
        }

        return;
    }


    /* =====================
       HIGH KNEES
    ===================== */

    if(w==="high knees"){

        if(!req([
            l[23],l[24],
            l[25],l[26]
        ])) return;

        const leftUp=
            l[25].y<
            l[23].y-0.04;

        const rightUp=
            l[26].y<
            l[24].y-0.04;

        const anyUp=
            leftUp||rightUp;

        const bothDown=
            !leftUp&&!rightUp;

        if(phase==="start"){
            phase="ready";
        }

        if(
            phase==="ready" &&
            anyUp
        ){
            phase="move";
        }

        if(
            phase==="move" &&
            bothDown
        ){
            addRep();
            phase="ready";
        }

        return;
    }


    /* =====================
       LUNGES
    ===================== */

    if(w==="lunges"){

        if(phase==="start"){
            phase="ready";
        }

        if(
            phase==="ready" &&
            knee<155
        ){
            phase="move";
        }

        if(
            phase==="move" &&
            knee>160
        ){
            addRep();
            phase="ready";
        }

        return;
    }


    /* =====================
       MOUNTAIN CLIMBER
    ===================== */

    if(w==="mountain climber"){

        if(!plankPosition(l)){

            phase="start";
            return;
        }

        const leftForward=
            Math.abs(
                l[25].x-l[23].x
            )>0.04;

        const rightForward=
            Math.abs(
                l[26].x-l[24].x
            )>0.04;

        const forward=
            leftForward||
            rightForward;

        if(phase==="start"){
            phase="ready";
        }

        if(
            phase==="ready" &&
            forward
        ){
            phase="move";
        }

        if(
            phase==="move" &&
            !forward
        ){
            addRep();
            phase="ready";
        }

        return;
    }


    /* =====================
       JUMPING JACK
    ===================== */

    if(w==="jumping jack"){

        const feet=
            Math.abs(
                l[27].x-l[28].x
            );

        const open=
            feet>0.16;

        const closed=
            feet<0.14;

        const handsUp=
            l[15].y<shoulder.y+0.05 ||
            l[16].y<shoulder.y+0.05;

        if(phase==="start"){
            phase="ready";
        }

        if(
            phase==="ready" &&
            open &&
            handsUp
        ){
            phase="move";
        }

        if(
            phase==="move" &&
            closed
        ){
            addRep();
            phase="ready";
        }

        return;
    }


    /* =====================
       BURPEE
    ===================== */

    if(w==="burpees"){

        if(phase==="start"){
            phase="ready";
        }

        const down=
            knee<155;

        const stand=
            knee>165;

        const jump=
            l[27].y<
            l[25].y-0.02 &&
            l[28].y<
            l[26].y-0.02;

        if(
            phase==="ready" &&
            down
        ){
            phase="move";
        }

        if(
            phase==="move" &&
            stand
        ){
            phase="up";
        }

        if(
            phase==="up" &&
            jump
        ){
            addRep();
            phase="ready";
        }

        return;
    }


    /* =====================
       PLANK
    ===================== */

    if(w==="plank"){

        if(!plankPosition(l)){

            if(
                phase!=="start" &&
                plankStart
            ){

                /*
                   Keep completed seconds.
                   Do NOT erase the user's count.
                */

                plankStart=0;
            }

            phase="start";
            return;
        }

        if(phase==="start"){

            phase="ready";

            plankStart=Date.now();

            lastPlankSecond=0;

            reps=0;
            repEl.textContent="0";

            return;
        }

        const seconds=Math.min(
            MAX_REPS,
            Math.floor(
                (Date.now()-plankStart)/1000
            )
        );

        if(seconds>lastPlankSecond){

            lastPlankSecond=seconds;
            reps=seconds;

            repEl.textContent=seconds;

            statusEl.textContent=
                seconds+" SEC";

            statusEl.style.color=
                "#00ff66";
        }

        return;
    }


    /* =====================
       COOL DOWN
    ===================== */

    if(w==="cool down"){

        const up=
            l[15].y<shoulder.y-0.04 ||
            l[16].y<shoulder.y-0.04;

        const down=
            l[15].y>shoulder.y+0.02 &&
            l[16].y>shoulder.y+0.02;

        if(phase==="start" && down){
            phase="ready";
        }

        if(
            phase==="ready" &&
            up
        ){
            phase="move";
        }

        if(
            phase==="move" &&
            down
        ){
            addRep();
            phase="ready";
        }

        return;
    }
}


/* =========================
   MEDIAPIPE
========================= */

function onResults(results){

    if(!running) return;

    if(
        !results ||
        !results.poseLandmarks
    ){

        lostFrames++;

        if(lostFrames>8){
            tracked=false;
            resetMovement();
        }

        return;
    }

    drawBody(
        results.poseLandmarks
    );

    detect(
        results.poseLandmarks
    );
}


function setupPose(){

    pose=new Pose({
        locateFile:file=>
            "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file
    });

    pose.setOptions({

        modelComplexity:1,

        smoothLandmarks:true,

        enableSegmentation:false,

        minDetectionConfidence:0.35,

        minTrackingConfidence:0.35
    });

    pose.onResults(onResults);
}


/* =========================
   CAMERA
========================= */

async function startCamera(){

    try{

        setupPose();

        stream=
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:"user",

                    width:{
                        ideal:720
                    },

                    height:{
                        ideal:1280
                    }
                },

                audio:false
            });

        video.srcObject=stream;

        await video.play();

        canvas.width=
            video.videoWidth||720;

        canvas.height=
            video.videoHeight||1280;

        loading.style.display="none";

        statusEl.textContent=
            "MOVE INTO CAMERA";

        statusEl.style.color=
            "#ff3030";

        requestAnimationFrame(processVideo);

    }
    catch(error){

        console.error(error);

        loading.innerHTML=`
            <div style="color:#ff3030;font-weight:bold">
                Camera could not start
            </div>
            <div style="color:#aaa;font-size:13px">
                Allow camera permission and reload.
            </div>
        `;
    }
}


async function processVideo(){

    if(!running) return;

    if(
        video.readyState>=2 &&
        !processing
    ){

        processing=true;

        try{

            await pose.send({
                image:video
            });

        }
        catch(error){

            console.error(
                "Pose error:",
                error
            );
        }

        processing=false;
    }

    requestAnimationFrame(
        processVideo
    );
}


/* =========================
   STOP
========================= */

function stopCamera(){

    running=false;

    if(stream){

        stream.getTracks().forEach(
            track=>track.stop()
        );

        stream=null;
    }
}


/* =========================
   QUIT
========================= */

quitBtn.onclick=()=>{

    stopCamera();

    location.href="daily-task.html";
};


/* =========================
   FINISH
========================= */

finishBtn.onclick=async()=>{

    if(reps<=0){

        alert(
            "Complete at least 1 rep."
        );

        return;
    }

    const user=auth.currentUser;

    if(!user){

        alert(
            "Please login before saving."
        );

        return;
    }

    finishBtn.disabled=true;

    try{

        const userRef=
            db.collection("users")
              .doc(user.uid);

        const snap=
            await userRef.get();

        const data=
            snap.exists
            ? snap.data()
            : {};

        const oldPoints=
            Number(
                data.totalPoints||0
            );

        const workoutOrder=[

            "Stretching",
            "Push Up",
            "Squat",
            "High Knees",
            "Lunges",
            "Mountain Climber",
            "Jumping Jack",
            "Burpees",
            "Plank",
            "Cool Down"
        ];

        let completedTasks=
            Array.isArray(
                data.completedTasks
            )
            ? [...data.completedTasks]
            : [];

        const index=
            workoutOrder.findIndex(
                x=>
                    x.toLowerCase()===
                    workout.toLowerCase()
            );

        if(
            index>=0 &&
            !completedTasks.includes(index)
        ){

            completedTasks.push(index);
        }

        completedTasks=[
            ...new Set(
                completedTasks
            )
        ].sort((a,b)=>a-b);

        await userRef.set({

            totalPoints:
                oldPoints+reps,

            completedTasks:

                completedTasks,

            lastWorkout:
                workout,

            lastWorkoutReps:
                reps,

            updatedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        },{
            merge:true
        });

        stopCamera();

        location.href=
            "daily-task.html";

    }
    catch(error){

        console.error(error);

        alert(
            "Could not save workout. Please try again."
        );

        finishBtn.disabled=false;
    }
};


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{
        if(
            video.videoWidth &&
            video.videoHeight
        ){

            canvas.width=
                video.videoWidth;

            canvas.height=
                video.videoHeight;
        }
    }
);


/* =========================
   START
========================= */

startCamera();

</script>

</body>
</html>
