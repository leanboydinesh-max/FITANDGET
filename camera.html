<script>

/* =====================================================

};

firebase.initializeApp(firebaseConfig);

const db =
    firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const repCount =
    document.getElementById("repCount");

const statusBox =
    document.getElementById("status");

const workoutName =
    document.getElementById("workoutName");

const quitBtn =
    document.getElementById("quitBtn");

const finishBtn =
    document.getElementById("finishBtn");


/* =====================================================
   WORKOUT
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let workout =
    params.get("workout") ||
    localStorage.getItem(
        "selectedWorkout"
    ) ||
    "Stretching";

workout =
    decodeURIComponent(workout);

workoutName.textContent =
    workout;


/* =====================================================
   GLOBAL STATE
===================================================== */

let reps = 0;

let phase = "UP";

let cameraStarted = false;

let camera = null;

let lastRepTime = 0;

let movementStart = 0;

let lastMovementY = null;

let plankStart = null;

let jackPhase = "CLOSED";


/* =====================================================
   STATUS
===================================================== */

function setStatus(
    message,
    type
){

    statusBox.textContent =
        message;

    statusBox.className =
        "status " + type;
}


/* =====================================================
   REP
===================================================== */

function addRep(){

    const now =
        Date.now();

    if(
        now-lastRepTime <
        500
    ){
        return;
    }

    if(
        reps >= 50
    ){
        return;
    }

    lastRepTime =
        now;

    reps++;

    repCount.textContent =
        reps;
}


/* =====================================================
   VISIBILITY
===================================================== */

function visible(
    lm,
    index
){

    if(
        !lm ||
        !lm[index]
    ){
        return false;
    }

    if(
        lm[index].visibility ===
        undefined
    ){
        return true;
    }

    return (
        lm[index].visibility >
        0.15
    );
}


/* =====================================================
   ANGLE
===================================================== */

function angle(
    a,
    b,
    c
){

    if(
        !a ||
        !b ||
        !c
    ){
        return 180;
    }

    const abx =
        a.x-b.x;

    const aby =
        a.y-b.y;

    const cbx =
        c.x-b.x;

    const cby =
        c.y-b.y;

    const dot =
        abx*cbx+
        aby*cby;

    const m1 =
        Math.sqrt(
            abx*abx+
            aby*aby
        );

    const m2 =
        Math.sqrt(
            cbx*cbx+
            cby*cby
        );

    if(
        m1===0 ||
        m2===0
    ){
        return 180;
    }

    let value =
        dot/(m1*m2);

    value =
        Math.max(
            -1,
            Math.min(
                1,
                value
            )
        );

    return (
        Math.acos(value) *
        180 /
        Math.PI
    );
}


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

    canvas.width =
        canvas.clientWidth;

    canvas.height =
        canvas.clientHeight;
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =====================================================
   VIDEO RECTANGLE
===================================================== */

function getVideoRect(){

    const vw =
        video.videoWidth ||
        720;

    const vh =
        video.videoHeight ||
        1280;

    const cw =
        canvas.width;

    const ch =
        canvas.height;

    const scale =
        Math.min(
            cw/vw,
            ch/vh
        );

    const width =
        vw*scale;

    const height =
        vh*scale;

    return {

        x:
        (cw-width)/2,

        y:
        (ch-height)/2,

        width,

        height
    };
}


/* =====================================================
   LANDMARK TO SCREEN
===================================================== */

function screenPoint(
    landmark
){

    if(!landmark){
        return null;
    }

    const r =
        getVideoRect();

    let x =
        r.x+
        landmark.x*r.width;

    let y =
        r.y+
        landmark.y*r.height;

    /*
       Mirror to match video.
    */

    x =
        r.x+
        r.width-
        (x-r.x);

    /*
       Keep line inside camera.
    */

    x =
        Math.max(
            0,
            Math.min(
                canvas.width,
                x
            )
        );

    y =
        Math.max(
            0,
            Math.min(
                canvas.height,
                y
            )
        );

    return {
        x,
        y
    };
}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(
    a,
    b,
    color
){

    const p1 =
        screenPoint(a);

    const p2 =
        screenPoint(b);

    if(
        !p1 ||
        !p2
    ){
        return;
    }

    ctx.beginPath();

    ctx.moveTo(
        p1.x,
        p1.y
    );

    ctx.lineTo(
        p2.x,
        p2.y
    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        5;

    ctx.lineCap =
        "round";

    ctx.stroke();
}


/* =====================================================
   DRAW JOINT
===================================================== */

function drawJoint(
    lm,
    color
){

    const p =
        screenPoint(lm);

    if(!p){
        return;
    }

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        6,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        color;

    ctx.fill();
}


/* =====================================================
   DRAW CHAIN
===================================================== */

function drawChain(
    lm,
    ids,
    color
){

    for(
        let i=0;
        i<ids.length-1;
        i++
    ){

        drawLine(
            lm[ids[i]],
            lm[ids[i+1]],
            color
        );
    }

    ids.forEach(
        id=>{
            drawJoint(
                lm[id],
                color
            );
        }
    );
}


/* =====================================================
   SIDE SELECTION
===================================================== */

function bestSide(
    lm,
    leftIds,
    rightIds
){

    const left =
        leftIds.filter(
            id=>visible(lm,id)
        ).length;

    const right =
        rightIds.filter(
            id=>visible(lm,id)
        ).length;

    return (
        left>=right
        ? "LEFT"
        : "RIGHT"
    );
}


/* =====================================================
   PUSH UP
   ONLY SHOULDER → ELBOW → WRIST
===================================================== */

function pushUp(
    lm
){

    const side =
        bestSide(
            lm,
            [11,13,15],
            [12,14,16]
        );

    const ids =
        side==="LEFT"
        ? [11,13,15]
        : [12,14,16];

    const ready =
        ids.every(
            id=>visible(lm,id)
        );

    const color =
        ready
        ? "#00ff66"
        : "#ff3030";

    drawChain(
        lm,
        ids,
        color
    );

    if(!ready){

        setStatus(
            "PUSH UP • POSITION",
            "red"
        );

        phase="UP";

        return;
    }

    const elbow =
        angle(
            lm[ids[0]],
            lm[ids[1]],
            lm[ids[2]]
        );

    /*
       Down = elbow bent.
       Up = arm straight.
    */

    if(
        elbow < 130
    ){

        setStatus(
            "PUSH UP • DOWN",
            "green"
        );

        phase="DOWN";

        return;
    }

    setStatus(
        "PUSH UP • UP",
        "green"
    );

    if(
        phase==="DOWN" &&
        elbow>145
    ){

        addRep();

        phase="UP";
    }
}


/* =====================================================
   SQUAT
   ONLY HIP → KNEE → ANKLE
===================================================== */

function squat(
    lm
){

    const side =
        bestSide(
            lm,
            [23,25,27],
            [24,26,28]
        );

    const ids =
        side==="LEFT"
        ? [23,25,27]
        : [24,26,28];

    const ready =
        ids.every(
            id=>visible(lm,id)
        );

    const color =
        ready
        ? "#00ff66"
        : "#ff3030";

    /*
       ONLY LEG CHAIN.
       NO ARMS.
       NO SHOULDERS.
    */

    drawChain(
        lm,
        ids,
        color
    );

    if(!ready){

        setStatus(
            "SQUAT • POSITION",
            "red"
        );

        phase="UP";

        return;
    }

    const knee =
        angle(
            lm[ids[0]],
            lm[ids[1]],
            lm[ids[2]]
        );

    if(
        knee<135
    ){

        setStatus(
            "SQUAT • DOWN",
            "green"
        );

        phase="DOWN";

        return;
    }

    setStatus(
        "SQUAT • UP",
        "green"
    );

    if(
        phase==="DOWN" &&
        knee>145
    ){

        addRep();

        phase="UP";
    }
}


/* =====================================================
   STRETCHING
   ONLY ARM MOVEMENT
===================================================== */

function stretching(
    lm
){

    const ids=[
        11,13,15,
        12,14,16
    ];

    const ready =
        ids.some(
            id=>visible(lm,id)
        );

    const color =
        ready
        ? "#00ff66"
        : "#ff3030";

    drawChain(
        lm,
        [11,13,15],
        color
    );

    drawChain(
        lm,
        [12,14,16],
        color
    );

    if(!ready){

        setStatus(
            "STRETCHING • POSITION",
            "red"
        );

        return;
    }

    setStatus(
        "STRETCHING • MOVE",
        "green"
    );

    const wristY =
        (
            lm[15].y+
            lm[16].y
        )/2;

    if(
        lastMovementY===null
    ){

        lastMovementY =
            wristY;

        return;
    }

    if(
        Math.abs(
            wristY-
            lastMovementY
        )>.07
    ){

        addRep();

        lastMovementY =
            wristY;
    }
}


/* =====================================================
   HIGH KNEES
   ONLY HIP → KNEE
===================================================== */

function highKnees(
    lm
){

    const ready =
        visible(lm,23) &&
        visible(lm,25) &&
        visible(lm,24) &&
        visible(lm,26);

    const color =
        ready
        ? "#00ff66"
        : "#ff3030";

    drawChain(
        lm,
        [23,25],
        color
    );

    drawChain(
        lm,
        [24,26],
        color
    );

    if(!ready){

        setStatus(
            "HIGH KNEES • POSITION",
            "red"
        );

        return;
    }

    setStatus(
        "HIGH KNEES • MOVE",
        "green"
    );

    const left =
        lm[25].y<
        lm[23].y-.08;

    const right =
        lm[26].y<
        lm[24].y-.08;

    if(
        left ||
        right
    ){

        addRep();
    }
}


/* =====================================================
   LUNGES
   ONLY HIP → KNEE → ANKLE
===================================================== */

function lunges(
    lm
){

    const leftOk =
        [23,25,27].every(
            id=>visible(lm,id)
        );

    const rightOk =
        [24,26,28].every(
            id=>visible(lm,id)
        );

    const ready =
        leftOk ||
        rightOk;

    const color =
        ready
        ? "#00ff66"
        : "#ff3030";

    if(leftOk){

        drawChain(
            lm,
            [23,25,27],
            color
        );
    }

    if(rightOk){

        drawChain(
            lm,
            [24,26,28],
            color
        );
    }

    if(!ready){

        setStatus(
            "LUNGE • POSITION",
            "red"
        );

        phase="UP";

        return;
    }

    const leftAngle =
        leftOk
        ? angle(
            lm[23],
            lm[25],
            lm[27]
        )
        : 180;

    const rightAngle =
        rightOk
        ? angle(
            lm[24],
            lm[26],
            lm[28]
        )
        : 180;

    const bent =
        leftAngle<135 ||
        rightAngle<135;

    const straight =
        leftAngle>145 &&
        rightAngle>145;

    if(bent){

        setStatus(
            "LUNGE • DOWN",
            "green"
        );

        phase="DOWN";

        return;
    }

    setStatus(
        "LUNGE • UP",
        "green"
    );

    if(
        phase==="DOWN" &&
        straight
    ){

        addRep();

        phase="UP";
    }
}


/* =====================================================
   MOUNTAIN CLIMBER
   SHOULDER → HIP → KNEE
   KNEE COMES TOWARD CHEST
===================================================== */

function mountainClimber(
    lm
){

    const leftOk =
        [11,23,25].every(
            id=>visible(lm,id)
        );

    const rightOk =
        [12,24,26].every(
            id=>visible(lm,id)
        );

    const ready =
        leftOk ||
        rightOk;

    const color =
        ready
        ? "#00ff66"
        : "#ff3030";

    if(leftOk){

        drawChain(
            lm,
            [11,23,25],
            color
        );
    }

    if(rightOk){

        drawChain(
            lm,
            [12,24,26],
            color
        );
    }

    if(!ready){

        setStatus(
            "MOUNTAIN CLIMBER • POSITION",
            "red"
        );

        return;
    }

    setStatus(
        "MOUNTAIN CLIMBER • MOVE",
        "green"
    );

    const leftChest =
        lm[25].y<
        lm[23].y-.10;

    const rightChest =
        lm[26].y<
        lm[24].y-.10;

    if(
        leftChest ||
        rightChest
    ){

        addRep();
    }
}


/* =====================================================
   JUMPING JACK
   ARMS + LEGS ONLY
===================================================== */

function jumpingJack(
    lm
){

    const ready =
        visible(lm,11) &&
        visible(lm,12) &&
        visible(lm,15) &&
        visible(lm,16) &&
        visible(lm,27) &&
        visible(lm,28);

    const color =
        ready
        ? "#00ff66"
        : "#ff3030";

    if(
        visible(lm,11) &&
        visible(lm,13) &&
        visible(lm,15)
    ){

        drawChain(
            lm,
            [11,13,15],
            color
        );
    }

    if(
        visible(lm,12) &&
        visible(lm,14) &&
        visible(lm,16)
    ){

        drawChain(
            lm,
            [12,14,16],
            color
        );
    }

    if(
        visible(lm,23) &&
        visible(lm,25) &&
        visible(lm,27)
    ){

        drawChain(
            lm,
            [23,25,27],
            color
        );
    }

    if(
        visible(lm,24) &&
        visible(lm,26) &&
        visible(lm,28)
    ){

        drawChain(
            lm,
            [24,26,28],
            color
        );
    }

    if(!ready){

        setStatus(
            "JUMPING JACK • POSITION",
            "red"
        );

        return;
    }

    const armsUp =
        lm[15].y<
        lm[11].y &&
        lm[16].y<
        lm[12].y;

    const legsApart =
        Math.abs(
            lm[27].x-
            lm[28].x
        )>.15;

    const open =
        armsUp &&
        legsApart;

    if(open){

        setStatus(
            "JUMPING JACK • OPEN",
            "green"
        );

        jackPhase="OPEN";

        return;
    }

    setStatus(
        "JUMPING JACK • CLOSED",
        "green"
    );

    if(
        jackPhase==="OPEN"
    ){

        addRep();

        jackPhase="CLOSED";
    }
}


/* =====================================================
   BURPEE
   SHOULDER → HIP → KNEE
===================================================== */

function burpee(
    lm
){

    const ready =
        visible(lm,11) &&
        visible(lm,23) &&
        visible(lm,25);

    const color =
        ready
        ? "#00ff66"
        : "#ff3030";

    drawChain(
        lm,
        [11,23,25],
        color
    );

    if(!ready){

        setStatus(
            "BURPEE • POSITION",
            "red"
        );

        return;
    }

    const shoulderY =
        (
            lm[11].y+
            lm[12].y
        )/2;

    const hipY =
        (
            lm[23].y+
            lm[24].y
        )/2;

    const low =
        hipY-
        shoulderY >
        .18;

    if(low){

        setStatus(
            "BURPEE • DOWN",
            "green"
        );

        phase="DOWN";

        return;
    }

    setStatus(
        "BURPEE • UP",
        "green"
    );

    if(
        phase==="DOWN"
    ){

        addRep();

        phase="UP";
    }
}


/* =====================================================
   PLANK
   SHOULDER → HIP → ANKLE
===================================================== */

function plank(
    lm
){

    const ready =
        visible(lm,11) &&
        visible(lm,23) &&
        visible(lm,27);

    const color =
        ready
        ? "#00ff66"
        : "#ff3030";

    drawChain(
        lm,
        [11,23,27],
        color
    );

    if(!ready){

        setStatus(
            "PLANK • POSITION",
            "red"
        );

        plankStart=null;

        return;
    }

    setStatus(
        "PLANK • HOLD",
        "green"
    );

    if(
        plankStart===null
    ){

        plankStart =
            Date.now();

        return;
    }

    /*
       One plank count after
       a controlled hold.
    */

    if(
        Date.now()-
        plankStart >
        3000
    ){

        addRep();

        plankStart =
            Date.now();
    }
}


/* =====================================================
   COOL DOWN
   UPPER BODY ONLY
===================================================== */

function coolDown(
    lm
){

    const ready =
        visible(lm,11) &&
        visible(lm,13) &&
        visible(lm,15);

    const color =
        ready
        ? "#00ff66"
        : "#ff3030";

    drawChain(
        lm,
        [11,13,15],
        color
    );

    if(!ready){

        setStatus(
            "COOL DOWN • POSITION",
            "red"
        );

        return;
    }

    setStatus(
        "COOL DOWN • MOVE",
        "green"
    );

    const y =
        (
            lm[15].y+
            lm[16].y
        )/2;

    if(
        lastMovementY===null
    ){

        lastMovementY=y;

        return;
    }

    if(
        Math.abs(
            y-
            lastMovementY
        )>.07
    ){

        addRep();

        lastMovementY=y;
    }
}


/* =====================================================
   MEDIAPIPE RESULT
===================================================== */

function onPoseResults(
    results
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(
        !results.poseLandmarks
    ){

        setStatus(
            "COME INTO CAMERA",
            "red"
        );

        return;
    }

    const lm =
        results.poseLandmarks;

    const name =
        workout.toLowerCase();


    /*
       EACH WORKOUT HAS ITS
       OWN DETECTION.
    */

    if(
        name.includes("stretch")
    ){

        stretching(lm);

        return;
    }

    if(
        name.includes("push")
    ){

        pushUp(lm);

        return;
    }

    if(
        name.includes("squat")
    ){

        squat(lm);

        return;
    }

    if(
        name.includes("high knee")
    ){

        highKnees(lm);

        return;
    }

    if(
        name.includes("lunge")
    ){

        lunges(lm);

        return;
    }

    if(
        name.includes("mountain")
    ){

        mountainClimber(lm);

        return;
    }

    if(
        name.includes("jumping jack")
    ){

        jumpingJack(lm);

        return;
    }

    if(
        name.includes("burpee")
    ){

        burpee(lm);

        return;
    }

    if(
        name.includes("plank")
    ){

        plank(lm);

        return;
    }

    if(
        name.includes("cool")
    ){

        coolDown(lm);

        return;
    }

    setStatus(
        "MOVE",
        "green"
    );
}


/* =====================================================
   MEDIAPIPE POSE
===================================================== */

const pose =
    new Pose({

        locateFile: (file) => {
            return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" + file;
        }

    });


pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    minDetectionConfidence:.45,

    minTrackingConfidence:.45

});


pose.onResults(
    onPoseResults
);


/* =====================================================
   CAMERA
===================================================== */

async function startAI(){

    if(
        cameraStarted
    ){
        return;
    }

    try{

        setStatus(
            "STARTING CAMERA...",
            "yellow"
        );

        cameraStarted=true;

        camera =
            new Camera(
                video,
                {

                    onFrame:
                    async()=>{
                        await pose.send({
                            image:video
                        });
                    },

                    width:720,

                    height:1280

                }
            );

        await camera.start();

        setStatus(
            "POSITION",
            "red"
        );

    }catch(error){

        console.error(error);

        cameraStarted=false;

        setStatus(
            "CAMERA PERMISSION NEEDED",
            "red"
        );
    }
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    try{

        if(camera){

            camera.stop();

            camera=null;
        }

        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(
                    track=>{
                        track.stop();
                    }
                );
        }

    }catch(error){

        console.error(error);
    }
}


/* =====================================================
   QUIT
   NO SAVE
===================================================== */

function quitWorkout(){

    stopCamera();

    window.location.href =
        "daily-task.html";
}


/* =====================================================
   FINISH
===================================================== */

async function finishWorkout(){

    const user =
        firebase.auth()
        .currentUser;

    if(!user){

        alert(
            "Please login first."
        );

        return;
    }

    if(
        reps<=0
    ){

        alert(
            "Complete at least 1 rep."
        );

        return;
    }

    const finalReps =
        Math.min(
            reps,
            50
        );

    try{

        const ref =
            db.collection("users")
            .doc(user.uid);

        const snap =
            await ref.get();

        const data =
            snap.exists
            ? snap.data()
            : {};

        const oldPoints =
            Number(
                data.totalPoints ||
                0
            );

        const oldTasks =
            Array.isArray(
                data.completedTasks
            )
            ? data.completedTasks
            : [];

        const tasks =
            [...oldTasks];

        if(
            !tasks.includes(workout)
        ){

            tasks.push(
                workout
            );
        }

        await ref.set({

            totalPoints:
                oldPoints+
                finalReps,

            completedTasks:
                tasks,

            lastWorkout:
                workout,

            lastWorkoutReps:
                finalReps,

            updatedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        },{
            merge:true
        });

        stopCamera();

        window.location.href =
            "daily-task.html";

    }catch(error){

        console.error(error);

        alert(
            "Could not save workout."
        );
    }
}


/* =====================================================
   BUTTONS
===================================================== */

quitBtn.addEventListener(
    "click",
    quitWorkout
);

finishBtn.addEventListener(
    "click",
    finishWorkout
);


/* =====================================================
   AUTO START
===================================================== */

window.addEventListener(
    "load",
    function(){

        setTimeout(
            ()=>{
                startAI();
            },
            300
        );

    }
);

</script>
