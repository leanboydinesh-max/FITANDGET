<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;

    font-family:Arial,sans-serif;
}


/* =========================================
   CAMERA AREA
========================================= */

#cameraBox{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:#000;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;
}


/*
   IMPORTANT:

   contain = camera image is NOT cropped
   and NOT unnecessarily zoomed.
*/

#video{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;

    transform:scaleX(-1);
}


/*
   Canvas must use the exact same
   contain behaviour as video.
*/

#canvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;
}


/* =========================================
   TOP UI
========================================= */

#top{

    position:absolute;

    top:
        calc(
            15px +
            env(safe-area-inset-top)
        );

    left:0;

    width:100%;

    text-align:center;

    z-index:10;

    pointer-events:none;
}

#workoutName{

    display:inline-block;

    padding:8px 18px;

    border-radius:20px;

    background:rgba(0,0,0,.65);

    color:#9dff00;

    font-size:20px;

    font-weight:bold;

    text-shadow:
        0 0 10px #00ff66;
}

#rep{

    margin-top:8px;

    font-size:48px;

    line-height:1;

    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 12px #000;
}

#status{

    margin-top:7px;

    font-size:14px;

    font-weight:bold;

    color:#ff3030;

    text-shadow:
        0 0 8px #000;
}


/* =========================================
   BOTTOM BUTTONS
========================================= */

#buttons{

    position:absolute;

    bottom:
        calc(
            20px +
            env(safe-area-inset-bottom)
        );

    left:0;

    width:100%;

    z-index:20;

    display:flex;

    justify-content:center;

    gap:12px;

    padding:0 14px;
}

button{

    border:none;

    border-radius:30px;

    padding:15px 22px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

#quitBtn{

    background:rgba(20,20,20,.9);

    color:#fff;

    border:1px solid #777;
}

#finishBtn{

    background:#9dff00;

    color:#000;

    box-shadow:
        0 0 15px rgba(
            157,
            255,
            0,
            .35
        );
}

button:disabled{

    opacity:.45;
}


/* =========================================
   LOADING
========================================= */

#loading{

    position:absolute;

    inset:0;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:14px;

    background:#000;

    color:#fff;
}

.loader{

    width:42px;

    height:42px;

    border-radius:50%;

    border:4px solid #333;

    border-top-color:#9dff00;

    animation:
        spin 1s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================
   SMALL SCREEN
========================================= */

@media(max-width:500px){

    #workoutName{

        font-size:18px;

        padding:7px 15px;
    }

    #rep{

        font-size:42px;
    }

    #status{

        font-size:13px;
    }

    button{

        padding:14px 18px;

        font-size:14px;
    }
}

</style>

<div id="cameraBox">


    <video
        id="video"
        autoplay

    ></video>


    <canvas

    ></canvas>


    <div id="top">

        <div id="workoutName">

        </div>

        </div>

        <div>
            Starting camera...
        </div>

    </div>


</div>



<script>

/* =========================================
   FIREBASE
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",

    authDomain:
        "fitandget-b3461.firebaseapp.com",

    projectId:
        "fitandget-b3461",

    storageBucket:
        "fitandget-b3461.firebasestorage.app",

    messagingSenderId:
        "216178533513",

    appId:
        "1:216178533513:web:975f20599c7e77b9d01258"

};


if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}


const auth =
    firebase.auth();

const db =
    firebase.firestore();



/* =========================================
   ELEMENTS
========================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const workoutNameEl =
    document.getElementById("workoutName");

const repEl =
    document.getElementById("rep");

const statusEl =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const quitBtn =
    document.getElementById("quitBtn");

const finishBtn =
    document.getElementById("finishBtn");



/* =========================================
   WORKOUT
========================================= */

const params =
    new URLSearchParams(
        location.search
    );


let workout =
    params.get("workout") ||
    localStorage.getItem(
        "selectedWorkout"
    ) ||
    "Stretching";


try{

    workout =
        decodeURIComponent(
            workout
        );

}catch(e){}


workout =
    workout.trim();


workoutNameEl.textContent =
    workout;



/* =========================================
   VARIABLES
========================================= */

let stream =
    null;

let pose =
    null;

let running =
    true;

let processing =
    false;

let reps =
    0;

const MAX_REPS =
    50;

let positionReady =
    false;

let lostFrames =
    0;

let state =
    "NOT_READY";

let movementStart =
    null;

let lastMovementTime =
    0;

let lastPlankSecond =
    0;

let movementFrames =
    0;



/* =========================================
   HELPERS
========================================= */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function good(point){

    return !!(
        point &&
        typeof point.x ===
            "number" &&
        typeof point.y ===
            "number" &&
        (
            point.visibility ===
                undefined ||
            point.visibility >
                0.30
        )
    );

}


function required(points){

    return points.every(
        point =>
            good(point)
    );

}


function average(a,b){

    return (
        a + b
    ) / 2;

}


function midpoint(a,b){

    return {

        x:
            average(
                a.x,
                b.x
            ),

        y:
            average(
                a.y,
                b.y
            )

    };

}


function angle(a,b,c){

    if(
        !good(a) ||
        !good(b) ||
        !good(c)
    ){

        return 180;

    }


    const abx =
        a.x - b.x;

    const aby =
        a.y - b.y;

    const cbx =
        c.x - b.x;

    const cby =
        c.y - b.y;


    const dot =
        abx * cbx +
        aby * cby;


    const mag1 =
        Math.sqrt(
            abx * abx +
            aby * aby
        );


    const mag2 =
        Math.sqrt(
            cbx * cbx +
            cby * cby
        );


    if(
        !mag1 ||
        !mag2
    ){

        return 180;

    }


    return (
        Math.acos(
            clamp(
                dot /
                (mag1 * mag2),
                -1,
                1
            )
        ) *
        180 /
        Math.PI
    );

}


function distance(a,b){

    if(
        !good(a) ||
        !good(b)
    ){

        return 999;

    }


    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}



/* =========================================
   FULL BODY SKELETON
========================================= */

function getParts(l){

    return [

        /* shoulders */

        [l[11],l[12]],


        /* left arm */

        [l[11],l[13]],
        [l[13],l[15]],


        /* right arm */

        [l[12],l[14]],
        [l[14],l[16]],


        /* body */

        [l[11],l[23]],
        [l[12],l[24]],
        [l[23],l[24]],


        /* left leg */

        [l[23],l[25]],
        [l[25],l[27]],


        /* right leg */

        [l[24],l[26]],
        [l[26],l[28]]

    ];

}



/* =========================================
   BODY VISIBILITY
========================================= */

function bodyIsVisible(l){

    const important = [

        l[11],
        l[12],

        l[13],
        l[14],

        l[15],
        l[16],

        l[23],
        l[24],

        l[25],
        l[26],

        l[27],
        l[28]

    ];


    let visible =
        0;


    important.forEach(
        point => {

            if(good(point))
                visible++;

        }
    );


    /*
       Don't demand perfect visibility.
       8/12 is enough.
    */

    return visible >= 8;

}



/* =========================================
   DRAW POINT
========================================= */

function drawPoint(
    point,
    color
){

    if(!good(point))
        return;


    ctx.beginPath();


    ctx.arc(

        point.x *
            canvas.width,

        point.y *
            canvas.height,

        4,

        0,

        Math.PI * 2

    );


    ctx.fillStyle =
        color;

    ctx.fill();

}



/* =========================================
   DRAW LINE
========================================= */

function drawLine(
    a,
    b,
    color
){

    if(
        !good(a) ||
        !good(b)
    )
        return;


    ctx.beginPath();


    ctx.moveTo(

        a.x *
            canvas.width,

        a.y *
            canvas.height

    );


    ctx.lineTo(

        b.x *
            canvas.width,

        b.y *
            canvas.height

    );


    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        5;

    ctx.lineCap =
        "round";

    ctx.stroke();

}



/* =========================================
   DRAW BODY
========================================= */

function drawBody(l){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const visible =
        bodyIsVisible(l);


    if(visible){

        lostFrames =
            0;

        positionReady =
            true;

        movementFrames++;


    }else{

        lostFrames++;


        /*
           Give the user a little time
           before losing tracking.
        */

        if(
            lostFrames >=
            12
        ){

            positionReady =
                false;

            movementFrames =
                0;

            state =
                "NOT_READY";

            movementStart =
                null;
        }

    }


    const color =
        positionReady
            ? "#00ff66"
            : "#ff3030";


    const parts =
        getParts(l);


    parts.forEach(
        pair => {

            drawLine(
                pair[0],
                pair[1],
                color
            );

            drawPoint(
                pair[0],
                color
            );

            drawPoint(
                pair[1],
                color
            );

        }
    );


    if(positionReady){

        statusEl.textContent =
            "TRACKING • START";

        statusEl.style.color =
            "#00ff66";

    }else{

        statusEl.textContent =
            "MOVE INTO CAMERA";

        statusEl.style.color =
            "#ff3030";

    }

}



/* =========================================
   ADD REP
========================================= */

function addRep(){

    if(!positionReady)
        return;


    if(reps >= MAX_REPS)
        return;


    const now =
        Date.now();


    /*
       Anti-cheat:

       A new rep must have a small
       time gap from previous rep.
    */

    if(
        now -
        lastMovementTime <
        500
    ){

        return;

    }


    lastMovementTime =
        now;


    reps++;


    repEl.textContent =
        reps;


    statusEl.textContent =
        "REP " + reps;


    statusEl.style.color =
        "#00ff66";

}



/* =========================================
   MOVEMENT TRACKING
========================================= */

function detectMovement(l){

    if(!positionReady)
        return;


    const w =
        workout
        .toLowerCase()
        .trim();


    const shoulder =
        midpoint(
            l[11],
            l[12]
        );


    const hip =
        midpoint(
            l[23],
            l[24]
        );


    const leftKneeAngle =
        angle(
            l[23],
            l[25],
            l[27]
        );


    const rightKneeAngle =
        angle(
            l[24],
            l[26],
            l[28]
        );


    const kneeAngle =
        Math.min(
            leftKneeAngle,
            rightKneeAngle
        );


    const leftElbowAngle =
        angle(
            l[11],
            l[13],
            l[15]
        );


    const rightElbowAngle =
        angle(
            l[12],
            l[14],
            l[16]
        );


    const elbowAngle =
        Math.min(
            leftElbowAngle,
            rightElbowAngle
        );



    /* =====================================
       STRETCHING

       HAND UP
       ↓
       HAND DOWN
       =
       REP
    ===================================== */

    if(w === "stretching"){

        if(!required([
            l[11],
            l[12],
            l[15],
            l[16]
        ]))
            return;


        const handsUp =
            l[15].y <
                shoulder.y -
                0.05 ||
            l[16].y <
                shoulder.y -
                0.05;


        const handsDown =
            l[15].y >
                shoulder.y &&
            l[16].y >
                shoulder.y;


        if(
            state ===
            "NOT_READY"
        ){

            if(handsDown)
                state =
                    "READY";

            return;
        }


        if(
            state ===
                "READY" &&
            handsUp
        ){

            state =
                "MOVE";

            return;
        }


        if(
            state ===
                "MOVE" &&
            handsDown
        ){

            addRep();

            state =
                "READY";
        }


        return;
    }



    /* =====================================
       PUSH UP

       BODY DOWN
       ↓
       BODY UP
       =
       REP
    ===================================== */

    if(w === "push up"){

        if(!required([
            l[11],
            l[12],
            l[23],
            l[24],
            l[25],
            l[26]
        ]))
            return;


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;
        }


        if(
            state ===
                "READY" &&
            elbowAngle <
                145
        ){

            state =
                "MOVE";

            return;
        }


        if(
            state ===
                "MOVE" &&
            elbowAngle >
                150
        ){

            addRep();

            state =
                "READY";
        }


        return;
    }



    /* =====================================
       SQUAT

       STAND
       ↓
       SIT / DOWN
       ↓
       STAND
       =
       REP
    ===================================== */

    if(w === "squat"){

        if(!required([
            l[23],
            l[24],
            l[25],
            l[26],
            l[27],
            l[28]
        ]))
            return;


        /*
           Start ready.
        */

        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;
        }


        /*
           Human squat:

           knees bend
           body goes down.
        */

        if(
            state ===
                "READY" &&
            kneeAngle <
                145
        ){

            state =
                "MOVE";

            movementStart =
                Date.now();

            return;
        }


        /*
           Human stands back up.

           This is the important part:
           DOWN → UP = one rep.
        */

        if(
            state ===
                "MOVE" &&
            kneeAngle >
                150
        ){

            if(
                movementStart &&
                Date.now() -
                movementStart >=
                250
            ){

                addRep();

                state =
                    "READY";

                movementStart =
                    null;
            }

        }


        return;
    }



    /* =====================================
       HIGH KNEES

       KNEE UP
       ↓
       KNEE DOWN
       =
       REP
    ===================================== */

    if(w === "high knees"){

        if(!required([
            l[23],
            l[24],
            l[25],
            l[26]
        ]))
            return;


        const leftUp =
            l[25].y <
            l[23].y -
            0.06;


        const rightUp =
            l[26].y <
            l[24].y -
            0.06;


        const kneeUp =
            leftUp ||
            rightUp;


        const kneesDown =
            !leftUp &&
            !rightUp;


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;
        }


        if(
            state ===
                "READY" &&
            kneeUp
        ){

            state =
                "MOVE";

            return;
        }


        if(
            state ===
                "MOVE" &&
            kneesDown
        ){

            addRep();

            state =
                "READY";
        }


        return;
    }



    /* =====================================
       LUNGES

       DOWN
       ↓
       UP
       =
       REP
    ===================================== */

    if(w === "lunges"){

        if(!required([
            l[23],
            l[24],
            l[25],
            l[26]
        ]))
            return;


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;
        }


        if(
            state ===
                "READY" &&
            kneeAngle <
                145
        ){

            state =
                "MOVE";

            return;
        }


        if(
            state ===
                "MOVE" &&
            kneeAngle >
                150
        ){

            addRep();

            state =
                "READY";
        }


        return;
    }



    /* =====================================
       MOUNTAIN CLIMBER

       KNEE FORWARD
       ↓
       RETURN
       =
       REP
    ===================================== */

    if(w === "mountain climber"){

        if(!required([
            l[23],
            l[24],
            l[25],
            l[26]
        ]))
            return;


        const leftMove =
            Math.abs(
                l[25].x -
                l[23].x
            ) >
            0.055;


        const rightMove =
            Math.abs(
                l[26].x -
                l[24].x
            ) >
            0.055;


        const kneeMove =
            leftMove ||
            rightMove;


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;
        }


        if(
            state ===
                "READY" &&
            kneeMove
        ){

            state =
                "MOVE";

            return;
        }


        if(
            state ===
                "MOVE" &&
            !kneeMove
        ){

            addRep();

            state =
                "READY";
        }


        return;
    }



    /* =====================================
       JUMPING JACK

       OPEN
       ↓
       CLOSE
       =
       REP
    ===================================== */

    if(w === "jumping jack"){

        if(!required([
            l[11],
            l[12],
            l[15],
            l[16],
            l[27],
            l[28]
        ]))
            return;


        const feetDistance =
            Math.abs(
                l[27].x -
                l[28].x
            );


        const feetOpen =
            feetDistance >
            0.18;


        const feetClosed =
            feetDistance <
            0.16;


        const handsUp =
            l[15].y <
                shoulder.y +
                0.05 ||
            l[16].y <
                shoulder.y +
                0.05;


        const open =
            feetOpen &&
            handsUp;


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;
        }


        if(
            state ===
                "READY" &&
            open
        ){

            state =
                "MOVE";

            return;
        }


        if(
            state ===
                "MOVE" &&
            feetClosed
        ){

            addRep();

            state =
                "READY";
        }


        return;
    }



    /* =====================================
       BURPEES

       DOWN
       ↓
       STAND
       ↓
       JUMP
       =
       REP
    ===================================== */

    if(w === "burpees"){

        if(!required([
            l[23],
            l[24],
            l[25],
            l[26],
            l[27],
            l[28]
        ]))
            return;


        const down =
            kneeAngle <
            145;


        const standing =
            kneeAngle >
            150;


        const jump =
            l[27].y <
                l[25].y +
                0.04 &&
            l[28].y <
                l[26].y +
                0.04;


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;
        }


        if(
            state ===
                "READY" &&
            down
        ){

            state =
                "MOVE";

            return;
        }


        if(
            state ===
                "MOVE" &&
            standing
        ){

            state =
                "UP";

            return;
        }


        if(
            state ===
                "UP" &&
            jump
        ){

            addRep();

            state =
                "READY";
        }


        return;
    }



    /* =====================================
       PLANK

       HOLD POSITION

       1 SECOND =
       1 COUNT
    ===================================== */

    if(w === "plank"){

        if(!required([
            l[11],
            l[12],
            l[23],
            l[24],
            l[25],
            l[26]
        ])){

            state =
                "NOT_READY";

            movementStart =
                null;

            lastPlankSecond =
                0;

            return;
        }


        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            movementStart =
                Date.now();

            lastPlankSecond =
                0;

            return;
        }


        if(
            state ===
                "READY" &&
            movementStart
        ){

            const seconds =
                Math.floor(

                    (
                        Date.now() -
                        movementStart
                    ) / 1000

                );


            if(
                seconds >
                    lastPlankSecond &&
                seconds <=
                    MAX_REPS
            ){

                lastPlankSecond =
                    seconds;

                reps =
                    seconds;

                repEl.textContent =
                    seconds;

                statusEl.textContent =
                    seconds +
                    " SEC";

                statusEl.style.color =
                    "#00ff66";
            }

        }


        return;
    }



    /* =====================================
       COOL DOWN

       HAND UP
       ↓
       HAND DOWN
       =
       REP
    ===================================== */

    if(w === "cool down"){

        if(!required([
            l[11],
            l[12],
            l[15],
            l[16]
        ]))
            return;


        const handsUp =
            l[15].y <
                shoulder.y -
                0.05 ||
            l[16].y <
                shoulder.y -
                0.05;


        const handsDown =
            l[15].y >
                shoulder.y &&
            l[16].y >
                shoulder.y;


        if(
            state ===
            "NOT_READY"
        ){

            if(handsDown)
                state =
                    "READY";

            return;
        }


        if(
            state ===
                "READY" &&
            handsUp
        ){

            state =
                "MOVE";

            return;
        }


        if(
            state ===
                "MOVE" &&
            handsDown
        ){

            addRep();

            state =
                "READY";
        }


        return;
    }

}



/* =========================================
   MEDIAPIPE
========================================= */

function onResults(results){

    if(!running)
        return;


    if(
        !results ||
        !results.poseLandmarks
    ){

        lostFrames++;


        if(
            lostFrames >=
            12
        ){

            positionReady =
                false;

            state =
                "NOT_READY";

            movementStart =
                null;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            statusEl.textContent =
                "MOVE INTO CAMERA";

            statusEl.style.color =
                "#ff3030";

        }


        return;
    }


    drawBody(
        results.poseLandmarks
    );


    if(positionReady){

        detectMovement(
            results.poseLandmarks
        );

    }

}



/* =========================================
   POSE SETUP
========================================= */

function setupPose(){

    pose =
        new Pose({

            locateFile:
                file =>

                    "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" +
                    file

        });


    pose.setOptions({

        modelComplexity:
            1,

        smoothLandmarks:
            true,

        enableSegmentation:
            false,

        minDetectionConfidence:
            0.45,

        minTrackingConfidence:
            0.45

    });


    pose.onResults(
        onResults
    );

}



/* =========================================
   CAMERA
========================================= */

async function startCamera(){

    try{

        loading.style.display =
            "flex";


        setupPose();


        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:
                            "user",

                        /*
                           Portrait-friendly.
                           Do not force 1080x1920.
                        */

                        width:{
                            ideal:720
                        },

                        height:{
                            ideal:1280
                        },

                        aspectRatio:{
                            ideal:0.5625
                        }

                    },

                    audio:false

                });


        video.srcObject =
            stream;


        await video.play();


        /*
           Use actual camera dimensions.
        */

        const width =
            video.videoWidth ||
            720;


        const height =
            video.videoHeight ||
            1280;


        canvas.width =
            width;

        canvas.height =
            height;


        loading.style.display =
            "none";


        statusEl.textContent =
            "MOVE INTO CAMERA";


        statusEl.style.color =
            "#ff3030";


        requestAnimationFrame(
            processVideo
        );


    }
    catch(error){

        console.error(
            "Camera error:",
            error
        );


        loading.innerHTML = `

            <div
                style="
                color:#ff3030;
                font-size:18px;
                font-weight:bold;
                text-align:center;
                "
            >
                Camera could not start
            </div>

            <div
                style="
                color:#aaa;
                font-size:13px;
                text-align:center;
                margin-top:5px;
                "
            >
                Please allow camera permission
                and reload the page.
            </div>

        `;

    }

}



/* =========================================
   PROCESS VIDEO
========================================= */

async function processVideo(){

    if(!running)
        return;


    if(
        video.readyState >= 2 &&
        !processing
    ){

        processing =
            true;


        try{

            await pose.send({

                image:
                    video

            });

        }
        catch(error){

            console.error(
                "Pose error:",
                error
            );

        }


        processing =
            false;

    }


    requestAnimationFrame(
        processVideo
    );

}



/* =========================================
   STOP CAMERA
========================================= */

function stopCamera(){

    running =
        false;


    if(stream){

        stream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        stream =
            null;
    }

}



/* =========================================
   QUIT
========================================= */

quitBtn.onclick =
    function(){

        stopCamera();


        location.href =
            "daily-task.html";

    };



/* =========================================
   FINISH
========================================= */

finishBtn.onclick =
    async function(){

        if(reps <= 0){

            alert(
                "Complete at least 1 rep."
            );

            return;
        }


        const user =
            auth.currentUser;


        if(!user){

            alert(
                "Please login before saving."
            );

            return;
        }


        finishBtn.disabled =
            true;


        try{

            const userRef =
                db
                    .collection("users")
                    .doc(user.uid);


            const snap =
                await userRef.get();


            const data =
                snap.exists
                    ? snap.data()
                    : {};


            const oldPoints =
                Number(
                    data.totalPoints ||
                    0
                );


            const workoutOrder = [

                "Stretching",

                "Push Up",

                "Squat",

                "High Knees",

                "Lunges",

                "Mountain Climber",

                "Jumping Jack",

                "Burpees",

                "Plank",

                "Cool Down"

            ];


            let completedTasks =
                Array.isArray(
                    data.completedTasks
                )
                ? [
                    ...data.completedTasks
                ]
                : [];


            /*
               Find current workout.
            */

            const workoutIndex =
                workoutOrder.findIndex(
                    name =>
                        name.toLowerCase() ===
                        workout.toLowerCase()
                );


            if(
                workoutIndex >= 0 &&
                !completedTasks.includes(
                    workoutIndex
                )
            ){

                completedTasks.push(
                    workoutIndex
                );

            }


            completedTasks =
                [
                    ...new Set(
                        completedTasks
                    )
                ]
                .sort(
                    (a,b) =>
                        a-b
                );


            await userRef.set({

                totalPoints:
                    oldPoints +
                    reps,

                completedTasks:
                    completedTasks,

                lastWorkout:
                    workout,

                lastWorkoutReps:
                    reps,

                updatedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            },{
                merge:true
            });


            stopCamera();


            location.href =
                "daily-task.html";

        }
        catch(error){

            console.error(
                "Save error:",
                error
            );


            alert(
                "Could not save workout. Please try again."
            );


            finishBtn.disabled =
                false;

        }

    };



/* =========================================
   RESIZE
========================================= */

window.addEventListener(
    "resize",
    function(){

        /*
           Keep canvas tied to
           actual camera resolution.
        */

        if(
            video.videoWidth &&
            video.videoHeight
        ){

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;

        }

    }
);



/* =========================================
   START
========================================= */

startCamera();

</script>
