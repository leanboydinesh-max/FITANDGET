    </div>

<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
    apiKey:"AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",
    authDomain:"fitandget-b3461.firebaseapp.com",
    projectId:"fitandget-b3461",
    storageBucket:"fitandget-b3461.firebasestorage.app",
    messagingSenderId:"216178533513",
    appId:"1:216178533513:web:975f20599c7e77b9d01258"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


/* =========================
   WORKOUTS
========================= */

const workouts = [
    "Stretching",
    "Push Up",
    "Squat",
    "High Knees",
    "Lunges",
    "Mountain Climber",
    "Jumping Jack",
    "Burpees",
    "Plank",
    "Cool Down"
];


/* =========================
   GET WORKOUT
========================= */

const params = new URLSearchParams(window.location.search);

let workout =
    params.get("workout") ||
    localStorage.getItem("currentWorkout") ||
    "Push Up";

document.getElementById("workoutName").innerText = workout;


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let repCount = 0;

let cameraStarted = false;

let poseReady = false;

let saving = false;

let finished = false;

let secondsPassed = 0;

let timer = null;


/* =========================
   POSE STAGES
========================= */

let pushStage = "up";

let squatStage = "up";

let jackStage = "closed";

let lungeStage = "up";

let kneeStage = "down";

let mountainStage = "away";

let burpeeStage = "up";

let stretchStage = "down";

let cooldownStage = "up";

let plankStart = null;

let plankCounted = false;


/* =========================
   ELEMENTS
========================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("output");

const ctx =
    canvas.getContext("2d");

const repEl =
    document.getElementById("rep");

const timeEl =
    document.getElementById("time");

const statusEl =
    document.getElementById("status");

const finishBtn =
    document.getElementById("finishBtn");

const quitBtn =
    document.getElementById("quitBtn");

const loading =
    document.getElementById("loading");


/* =========================
   STATUS
========================= */

function setAIStatus(text,type="warn"){

    statusEl.innerText = text;

    statusEl.className =
        "status " + type;
}


/* =========================
   TIMER
========================= */

function startTimer(){

    if(timer){
        return;
    }

    timer = setInterval(()=>{

        if(finished){
            return;
        }

        secondsPassed++;

        const minutes =
            Math.floor(secondsPassed / 60);

        const seconds =
            secondsPassed % 60;

        timeEl.innerText =
            String(minutes).padStart(2,"0")
            + ":"
            +
            String(seconds).padStart(2,"0");

    },1000);
}


function stopTimer(){

    if(timer){

        clearInterval(timer);

        timer = null;
    }
}


/* =========================
   ANGLE
========================= */

function angle(a,b,c){

    const abx = a.x-b.x;
    const aby = a.y-b.y;

    const cbx = c.x-b.x;
    const cby = c.y-b.y;

    const dot =
        abx*cbx + aby*cby;

    const mag1 =
        Math.sqrt(abx*abx+aby*aby);

    const mag2 =
        Math.sqrt(cbx*cbx+cby*cby);

    if(!mag1 || !mag2){
        return 0;
    }

    let value =
        dot/(mag1*mag2);

    value =
        Math.max(-1,Math.min(1,value));

    return Math.acos(value)*180/Math.PI;
}


/* =========================
   DISTANCE
========================= */

function distance(a,b){

    const x = a.x-b.x;

    const y = a.y-b.y;

    return Math.sqrt(x*x+y*y);
}


/* =========================
   VISIBILITY
========================= */

function visible(lm,index){

    if(!lm[index]){
        return false;
    }

    return (
        lm[index].visibility === undefined ||
        lm[index].visibility > .45
    );
}


/* =========================
   ADD REP
========================= */

function addRep(){

    if(finished){
        return;
    }

    if(repCount >= 50){
        return;
    }

    repCount++;

    repEl.innerText = repCount;

    finishBtn.disabled = false;
}


/* =========================
   POSE RESULTS
========================= */

function onPoseResults(results){

    if(!results.poseLandmarks){
        setAIStatus(
            "Show your full body",
            "warn"
        );
        return;
    }

    poseReady = true;

    setAIStatus(
        "AI tracking • Do your max",
        "ok"
    );

    drawPose(results);

    detectWorkout(
        results.poseLandmarks
    );
}


/* =========================
   DRAW POSE
========================= */

function drawPose(results){

    const rect =
        canvas.getBoundingClientRect();

    const width =
        Math.max(1,Math.floor(rect.width));

    const height =
        Math.max(1,Math.floor(rect.height));

    if(canvas.width !== width ||
       canvas.height !== height){

        canvas.width = width;
        canvas.height = height;
    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(
        typeof drawConnectors === "function"
        &&
        typeof POSE_CONNECTIONS !== "undefined"
    ){

        drawConnectors(
            ctx,
            results.poseLandmarks,
            POSE_CONNECTIONS,
            {
                color:"#7CFC00",
                lineWidth:3
            }
        );

        drawLandmarks(
            ctx,
            results.poseLandmarks,
            {
                color:"#00ff66",
                lineWidth:1,
                radius:3
            }
        );
    }
}


/* =========================
   WORKOUT AI
========================= */

function detectWorkout(lm){

    switch(workout){

        case "Push Up":
            detectPushUp(lm);
            break;

        case "Squat":
            detectSquat(lm);
            break;

        case "High Knees":
            detectHighKnees(lm);
            break;

        case "Lunges":
            detectLunges(lm);
            break;

        case "Mountain Climber":
            detectMountainClimber(lm);
            break;

        case "Jumping Jack":
            detectJumpingJack(lm);
            break;

        case "Burpees":
            detectBurpee(lm);
            break;

        case "Plank":
            detectPlank(lm);
            break;

        case "Stretching":
            detectStretching(lm);
            break;

        case "Cool Down":
            detectCoolDown(lm);
            break;
    }
}


/* =========================
   PUSH UP
========================= */

function detectPushUp(lm){

    const shoulder =
        lm[11];

    const elbow =
        lm[13];

    const wrist =
        lm[15];

    if(
        !visible(lm,11) ||
        !visible(lm,13) ||
        !visible(lm,15)
    ){
        return;
    }

    const a =
        angle(
            shoulder,
            elbow,
            wrist
        );

    if(a < 95 && pushStage === "up"){

        pushStage = "down";

    }

    if(a > 155 && pushStage === "down"){

        pushStage = "up";

        addRep();
    }
}


/* =========================
   SQUAT
========================= */

function detectSquat(lm){

    const hip =
        lm[23];

    const knee =
        lm[25];

    const ankle =
        lm[27];

    if(
        !visible(lm,23) ||
        !visible(lm,25) ||
        !visible(lm,27)
    ){
        return;
    }

    const a =
        angle(
            hip,
            knee,
            ankle
        );

    if(a < 100 && squatStage === "up"){

        squatStage = "down";

    }

    if(a > 160 && squatStage === "down"){

        squatStage = "up";

        addRep();
    }
}


/* =========================
   HIGH KNEES
========================= */

function detectHighKnees(lm){

    const leftHip =
        lm[23];

    const leftKnee =
        lm[25];

    const rightHip =
        lm[24];

    const rightKnee =
        lm[26];

    if(
        !visible(lm,23) ||
        !visible(lm,25) ||
        !visible(lm,24) ||
        !visible(lm,26)
    ){
        return;
    }

    const left =
        leftKnee.y <
        leftHip.y - .06;

    const right =
        rightKnee.y <
        rightHip.y - .06;

    if(
        (left || right) &&
        kneeStage === "down"
    ){

        kneeStage = "up";

        addRep();

    }else if(
        !left &&
        !right
    ){

        kneeStage = "down";
    }
}


/* =========================
   LUNGES
========================= */

function detectLunges(lm){

    const left =
        angle(
            lm[23],
            lm[25],
            lm[27]
        );

    const right =
        angle(
            lm[24],
            lm[26],
            lm[28]
        );

    const bent =
        left < 105 ||
        right < 105;

    const straight =
        left > 155 &&
        right > 155;

    if(
        bent &&
        lungeStage === "up"
    ){

        lungeStage = "down";

    }

    if(
        straight &&
        lungeStage === "down"
    ){

        lungeStage = "up";

        addRep();
    }
}


/* =========================
   MOUNTAIN CLIMBER
========================= */

function detectMountainClimber(lm){

    const leftKnee =
        lm[25];

    const rightKnee =
        lm[26];

    const leftHip =
        lm[23];

    const rightHip =
        lm[24];

    if(
        !visible(lm,23) ||
        !visible(lm,25) ||
        !visible(lm,24) ||
        !visible(lm,26)
    ){
        return;
    }

    const leftForward =
        leftKnee.x <
        leftHip.x - .07;

    const rightForward =
        rightKnee.x >
        rightHip.x + .07;

    if(
        (leftForward || rightForward) &&
        mountainStage === "away"
    ){

        mountainStage = "near";

    }

    if(
        !leftForward &&
        !rightForward &&
        mountainStage === "near"
    ){

        mountainStage = "away";

        addRep();
    }
}


/* =========================
   JUMPING JACK
========================= */

function detectJumpingJack(lm){

    const leftWrist =
        lm[15];

    const rightWrist =
        lm[16];

    const leftAnkle =
        lm[27];

    const rightAnkle =
        lm[28];

    const leftShoulder =
        lm[11];

    const rightShoulder =
        lm[12];

    if(
        !visible(lm,15) ||
        !visible(lm,16) ||
        !visible(lm,27) ||
        !visible(lm,28)
    ){
        return;
    }

    const armsUp =
        leftWrist.y <
        leftShoulder.y - .08
        &&
        rightWrist.y <
        rightShoulder.y - .08;

    const feetApart =
        Math.abs(
            leftAnkle.x-rightAnkle.x
        ) > .22;

    const open =
        armsUp && feetApart;

    if(
        open &&
        jackStage === "closed"
    ){

        jackStage = "open";

    }

    if(
        !open &&
        jackStage === "open"
    ){

        jackStage = "closed";

        addRep();
    }
}


/* =========================
   BURPEE
========================= */

function detectBurpee(lm){

    const hip =
        lm[23];

    const knee =
        lm[25];

    const ankle =
        lm[27];

    const shoulder =
        lm[11];

    if(
        !visible(lm,23) ||
        !visible(lm,25) ||
        !visible(lm,27) ||
        !visible(lm,11)
    ){
        return;
    }

    const kneeAngle =
        angle(
            hip,
            knee,
            ankle
        );

    const low =
        kneeAngle < 110;

    const upright =
        kneeAngle > 155 &&
        shoulder.y < hip.y;

    if(
        low &&
        burpeeStage === "up"
    ){

        burpeeStage = "down";

    }

    if(
        upright &&
        burpeeStage === "down"
    ){

        burpeeStage = "up";

        addRep();
    }
}


/* =========================
   PLANK
========================= */

function detectPlank(lm){

    const shoulder =
        lm[11];

    const hip =
        lm[23];

    const ankle =
        lm[27];

    if(
        !visible(lm,11) ||
        !visible(lm,23) ||
        !visible(lm,27)
    ){
        return;
    }

    const bodyAngle =
        angle(
            shoulder,
            hip,
            ankle
        );

    if(
        bodyAngle > 155
    ){

        if(!plankStart){

            plankStart =
                Date.now();

        }

        const held =
            Date.now()-plankStart;

        if(
            held >= 1000 &&
            !plankCounted
        ){

            addRep();

            plankCounted = true;
        }

    }else{

        plankStart = null;

        plankCounted = false;
    }
}


/* =========================
   STRETCHING
========================= */

function detectStretching(lm){

    const shoulder =
        lm[11];

    const hip =
        lm[23];

    const wrist =
        lm[15];

    if(
        !visible(lm,11) ||
        !visible(lm,23) ||
        !visible(lm,15)
    ){
        return;
    }

    const handsUp =
        wrist.y <
        shoulder.y - .10;

    if(
        handsUp &&
        stretchStage === "down"
    ){

        stretchStage = "up";

    }

    if(
        !handsUp &&
        stretchStage === "up"
    ){

        stretchStage = "down";

        addRep();
    }
}


/* =========================
   COOL DOWN
========================= */

function detectCoolDown(lm){

    const leftWrist =
        lm[15];

    const rightWrist =
        lm[16];

    const leftShoulder =
        lm[11];

    const rightShoulder =
        lm[12];

    if(
        !visible(lm,15) ||
        !visible(lm,16)
    ){
        return;
    }

    const handsUp =
        leftWrist.y <
        leftShoulder.y
        &&
        rightWrist.y <
        rightShoulder.y;

    if(
        handsUp &&
        cooldownStage === "up"
    ){

        cooldownStage = "down";

    }

    if(
        !handsUp &&
        cooldownStage === "down"
    ){

        cooldownStage = "up";

        addRep();
    }
}


/* =========================
   MEDIAPIPE
========================= */

const pose = new Pose({

    locateFile:(file)=>{

        return "https://cdn.jsdelivr.net/npm/@mediapipe/pose/"+file;
    }

});

pose.setOptions({

    modelComplexity:1,

    smoothLandmarks:true,

    enableSegmentation:false,

    smoothSegmentation:false,

    minDetectionConfidence:.55,

    minTrackingConfidence:.55

});

pose.onResults(onPoseResults);


/* =========================
   CAMERA
========================= */

const camera =
    new Camera(
        video,
        {
            onFrame:async()=>{

                if(!cameraStarted){
                    return;
                }

                try{

                    await pose.send({
                        image:video
                    });

                }catch(error){

                    console.error(
                        "Pose error:",
                        error
                    );
                }
            },

            width:720,

            height:1280
        }
    );


/* =========================
   START AI
========================= */

async function startAI(){

    if(cameraStarted){
        return;
    }

    try{

        setAIStatus(
            "Starting Camera AI...",
            "warn"
        );

        cameraStarted = true;

        await camera.start();

        loading.classList.add("hidden");

        setAIStatus(
            "Show your full body",
            "warn"
        );

        startTimer();

    }catch(error){

        console.error(error);

        cameraStarted = false;

        loading.classList.remove("hidden");

        setAIStatus(
            "Camera permission required",
            "error"
        );

        loading.innerText =
            "Allow camera permission and reload";

    }
}


/* =========================
   SAVE COMPLETION
========================= */

async function saveCompletion(){

    if(saving || finished){
        return;
    }

    if(!currentUser){
        alert("Please login first.");
        return;
    }

    if(repCount <= 0){
        alert("Complete at least 1 rep.");
        return;
    }

    saving = true;

    finishBtn.disabled = true;

    setAIStatus(
        "Saving your workout...",
        "warn"
    );

    try{

        const userRef =
            db.collection("users")
              .doc(currentUser.uid);

        const snap =
            await userRef.get();

        const data =
            snap.exists
            ? snap.data()
            : {};

        const completedTasks =
            Array.isArray(data.completedTasks)
            ? [...data.completedTasks]
            : [];

        /*
          Prevent duplicate completion
          for the same workout.
        */

        if(
            completedTasks.includes(workout)
        ){

            alert(
                "This workout is already completed."
            );

            finished = true;

            stopCamera();

            stopTimer();

            window.location.href =
                "daily-task.html";

            return;
        }

        completedTasks.push(workout);

        const oldRC =
            Number(data.totalPoints || 0);

        const newRC =
            oldRC + repCount;

        await userRef.set({

            totalPoints:newRC,

            completedTasks:completedTasks

        },{

            merge:true

        });

        finished = true;

        stopCamera();

        stopTimer();

        setAIStatus(
            "Workout completed! +" +
            repCount +
            " RC",
            "ok"
        );

        setTimeout(()=>{

            window.location.href =
                "daily-task.html";

        },900);

    }catch(error){

        console.error(error);

        saving = false;

        finishBtn.disabled = false;

        setAIStatus(
            "Save failed. Try again.",
            "error"
        );

        alert(
            "Could not save workout."
        );
    }
}


/* =========================
   FINISH
========================= */

finishBtn.onclick = ()=>{

    if(repCount <= 0){

        alert(
            "Do at least 1 rep before Finish."
        );

        return;
    }

    saveCompletion();
};


/* =========================
   STOP CAMERA
========================= */

function stopCamera(){

    cameraStarted = false;

    try{

        if(
            video.srcObject
        ){

            video.srcObject
                .getTracks()
                .forEach(track=>{
                    track.stop();
                });

            video.srcObject = null;
        }

    }catch(error){

        console.error(error);
    }
}


/* =========================
   QUIT
========================= */

quitBtn.onclick = ()=>{

    if(finished){
        return;
    }

    stopCamera();

    stopTimer();

    /*
      IMPORTANT:
      Quit = NO SAVE
    */

    window.location.href =
        "daily-task.html";
};


/* =========================
   FIREBASE AUTH
========================= */

firebase.auth()
.onAuthStateChanged(
    async(user)=>{

        if(!user){

            window.location.href =
                "index.html";

            return;
        }

        currentUser = user;

        await startAI();

    }
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{

        if(
            canvas.width !==
            canvas.clientWidth
        ){

            canvas.width =
                canvas.clientWidth;
        }

        if(
            canvas.height !==
            canvas.clientHeight
        ){

            canvas.height =
                canvas.clientHeight;
        }
    }
);

</script>
