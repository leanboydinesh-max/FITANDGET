body{

<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",

        "fitandget-b3461.firebaseapp.com",

        "fitandget-b3461",

    storageBucket:
        "fitandget-b3461.firebasestorage.app",

    messagingSenderId:
        "216178533513",

    appId:
        "1:216178533513:web:975f20599c7e77b9d01258"
};

if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );
}

const auth =
    firebase.auth();

const db =
    firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const workoutNameEl =
    document.getElementById("workoutName");

const repEl =
    document.getElementById("rep");

const statusEl =
    document.getElementById("status");

const loading =
    document.getElementById("loading");

const quitBtn =
    document.getElementById("quitBtn");

const finishBtn =
    document.getElementById("finishBtn");


/* =====================================================
   WORKOUT
===================================================== */

const params =
    new URLSearchParams(
        location.search
    );

let workout =
    params.get("workout") ||
    localStorage.getItem(
        "selectedWorkout"
    ) ||
    "Stretching";

workout =
    decodeURIComponent(workout);

workout =
    workout.trim();

workoutNameEl.textContent =
    workout;


/* =====================================================
   VARIABLES
===================================================== */

let stream = null;

let pose = null;

let running = true;

let processing = false;

let reps = 0;

const MAX_REPS = 50;

let positionReady = false;

let lostFrames = 0;

/*
   IMPORTANT:
   Always start from NOT_READY.
*/
let state = "NOT_READY";

let movementStart = null;

let lastMovementTime = 0;

let lastPlankSecond = 0;

let lastSide = null;


/* =====================================================
   HELPERS
===================================================== */

function clamp(
    value,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );
}


function good(point){

    return (
        point &&
        typeof point.x === "number" &&
        typeof point.y === "number" &&
        (
            point.visibility === undefined ||
            point.visibility > 0.35
        )
    );
}


function required(points){

    return points.every(
        point => good(point)
    );
}


function average(a,b){

    return (a+b)/2;
}


function midpoint(a,b){

    return {

        x:(a.x+b.x)/2,

        y:(a.y+b.y)/2

    };
}


function angle(a,b,c){

    if(
        !good(a) ||
        !good(b) ||
        !good(c)
    ){

        return 180;
    }

    const abx =
        a.x-b.x;

    const aby =
        a.y-b.y;

    const cbx =
        c.x-b.x;

    const cby =
        c.y-b.y;

    const dot =
        abx*cbx +
        aby*cby;

    const mag1 =
        Math.sqrt(
            abx*abx +
            aby*aby
        );

    const mag2 =
        Math.sqrt(
            cbx*cbx +
            cby*cby
        );

    if(
        !mag1 ||
        !mag2
    ){

        return 180;
    }

    let value =
        dot/(mag1*mag2);

    value =
        clamp(
            value,
            -1,
            1
        );

    return (
        Math.acos(value) *
        180 /
        Math.PI
    );
}


function distance(a,b){

    if(
        !good(a) ||
        !good(b)
    ){

        return 999;
    }

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


/* =====================================================
   FULL BODY PARTS
===================================================== */

function getParts(l){

    return [

        /* head / shoulders */

        [l[11],l[12]],

        /* left arm */

        [l[11],l[13]],
        [l[13],l[15]],

        /* right arm */

        [l[12],l[14]],
        [l[14],l[16]],

        /* torso */

        [l[11],l[23]],
        [l[12],l[24]],
        [l[23],l[24]],

        /* left leg */

        [l[23],l[25]],
        [l[25],l[27]],

        /* right leg */

        [l[24],l[26]],
        [l[26],l[28]]

    ];
}


/* =====================================================
   DRAW POINT
===================================================== */

function drawPoint(
    point,
    color
){

    if(!good(point))
        return;

    ctx.beginPath();

    ctx.arc(

        point.x *
            canvas.width,

        point.y *
            canvas.height,

        5,

        0,

        Math.PI*2

    );

    ctx.fillStyle =
        color;

    ctx.fill();
}


/* =====================================================
   DRAW LINE
===================================================== */

function drawLine(
    a,
    b,
    color
){

    if(
        !good(a) ||
        !good(b)
    ){

        return;
    }

    ctx.beginPath();

    ctx.moveTo(

        a.x *
            canvas.width,

        a.y *
            canvas.height

    );

    ctx.lineTo(

        b.x *
            canvas.width,

        b.y *
            canvas.height

    );

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        6;

    ctx.lineCap =
        "round";

    ctx.stroke();
}


/* =====================================================
   BODY VISIBILITY
===================================================== */

function bodyIsVisible(
    landmarks
){

    const important = [

        landmarks[11],
        landmarks[12],

        landmarks[13],
        landmarks[14],

        landmarks[15],
        landmarks[16],

        landmarks[23],
        landmarks[24],

        landmarks[25],
        landmarks[26],

        landmarks[27],
        landmarks[28]

    ];

    let count = 0;

    important.forEach(
        point => {

            if(good(point)){
                count++;
            }

        }
    );

    return count >= 8;
}


/* =====================================================
   DRAW BODY
===================================================== */

function drawBody(
    landmarks
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    const visible =
        bodyIsVisible(
            landmarks
        );

    if(visible){

        positionReady =
            true;

        lostFrames = 0;

    }else{

        lostFrames++;

        if(lostFrames >= 8){

            positionReady =
                false;
        }
    }

    const green =
        "#00ff66";

    const red =
        "#ff3030";

    const color =
        positionReady
            ? green
            : red;

    const parts =
        getParts(
            landmarks
        );

    parts.forEach(
        pair => {

            drawLine(
                pair[0],
                pair[1],
                color
            );

            drawPoint(
                pair[0],
                color
            );

            drawPoint(
                pair[1],
                color
            );

        }
    );

    if(positionReady){

        statusEl.textContent =
            "TRACKING";

        statusEl.style.color =
            green;

    }else{

        statusEl.textContent =
            "MOVE INTO CAMERA";

        statusEl.style.color =
            red;
    }
}


/* =====================================================
   ADD REP
===================================================== */

function addRep(){

    if(!positionReady)
        return;

    if(reps >= MAX_REPS)
        return;

    const now =
        Date.now();

    if(
        now -
        lastMovementTime <
        800
    ){

        return;
    }

    lastMovementTime =
        now;

    reps++;

    repEl.textContent =
        reps;

    statusEl.textContent =
        "REP " + reps;

    statusEl.style.color =
        "#00ff66";
}


/* =====================================================
   MOVEMENT DETECTION
===================================================== */

function detectMovement(l){

    if(!positionReady)
        return;

    const w =
        workout
        .toLowerCase()
        .trim();


    /*
    ====================================================
    COMMON LANDMARKS
    ====================================================
    */

    const shoulder =
        midpoint(
            l[11],
            l[12]
        );

    const hip =
        midpoint(
            l[23],
            l[24]
        );

    const knee =
        midpoint(
            l[25],
            l[26]
        );

    const ankle =
        midpoint(
            l[27],
            l[28]
        );


    const leftElbow =
        angle(
            l[11],
            l[13],
            l[15]
        );

    const rightElbow =
        angle(
            l[12],
            l[14],
            l[16]
        );

    const elbow =
        Math.min(
            leftElbow,
            rightElbow
        );


    const leftKnee =
        angle(
            l[23],
            l[25],
            l[27]
        );

    const rightKnee =
        angle(
            l[24],
            l[26],
            l[28]
        );

    const kneeAngle =
        Math.min(
            leftKnee,
            rightKnee
        );


    /*
    ====================================================
    1. STRETCHING
    Standing → hands up → hands down
    ====================================================
    */

    if(w === "stretching"){

        if(!required([

            l[11],
            l[12],

            l[15],
            l[16],

            l[23],
            l[24],

            l[25],
            l[26],

            l[27],
            l[28]

        ])){

            state =
                "NOT_READY";

            movementStart =
                null;

            return;
        }

        const standing =
            hip.y -
            shoulder.y >
            0.08;

        const handsDown =
            l[15].y >
                shoulder.y &&
            l[16].y >
                shoulder.y;

        const handsUp =
            l[15].y <
                shoulder.y -
                0.12 &&
            l[16].y <
                shoulder.y -
                0.12;

        if(!standing){

            state =
                "NOT_READY";

            return;
        }

        if(
            state ===
            "NOT_READY"
        ){

            if(handsDown){

                state =
                    "READY";
            }

            return;
        }

        if(
            state ===
                "READY" &&
            handsUp
        ){

            state =
                "MOVE";

            movementStart =
                Date.now();

            return;
        }

        if(
            state ===
                "MOVE" &&
            handsDown &&
            movementStart &&
            Date.now() -
            movementStart >=
            400
        ){

            addRep();

            state =
                "READY";

            movementStart =
                null;
        }

        return;
    }


    /*
    ====================================================
    2. PUSH UP
    Straight → down → straight
    ====================================================
    */

    if(w === "push up"){

        if(!required([

            l[11],
            l[12],

            l[13],
            l[14],

            l[15],
            l[16],

            l[23],
            l[24],

            l[25],
            l[26]

        ])){

            state =
                "NOT_READY";

            return;
        }

        const bodyStraight =
            Math.min(

                angle(
                    l[11],
                    l[23],
                    l[25]
                ),

                angle(
                    l[12],
                    l[24],
                    l[26]
                )

            ) > 140;

        if(!bodyStraight){

            state =
                "NOT_READY";

            movementStart =
                null;

            return;
        }

        if(
            state ===
            "NOT_READY"
        ){

            if(elbow > 155){

                state =
                    "READY";
            }

            return;
        }

        if(
            state ===
                "READY" &&
            elbow < 120
        ){

            state =
                "MOVE";

            movementStart =
                Date.now();

            return;
        }

        if(
            state ===
                "MOVE" &&
            elbow > 155 &&
            movementStart &&
            Date.now() -
            movementStart >=
            300
        ){

            addRep();

            state =
                "READY";

            movementStart =
                null;
        }

        return;
    }


    /*
    ====================================================
    3. SQUAT
    Standing → squat → standing
    ====================================================
    */

    if(w === "squat"){

        if(!required([

            l[23],
            l[24],

            l[25],
            l[26],

            l[27],
            l[28]

        ])){

            state =
                "NOT_READY";

            return;
        }

        if(
            state ===
            "NOT_READY"
        ){

            if(
                leftKnee > 155 &&
                rightKnee > 155
            ){

                state =
                    "READY";
            }

            return;
        }

        if(
            state ===
                "READY" &&
            kneeAngle < 115
        ){

            state =
                "MOVE";

            movementStart =
                Date.now();

            return;
        }

        if(
            state ===
                "MOVE" &&
            kneeAngle > 155 &&
            movementStart &&
            Date.now() -
            movementStart >=
            300
        ){

            addRep();

            state =
                "READY";

            movementStart =
                null;
        }

        return;
    }


    /*
    ====================================================
    4. HIGH KNEES
    Left up → right up → both return
    = 1 rep
    ====================================================
    */

    if(w === "high knees"){

        if(!required([

            l[23],
            l[24],

            l[25],
            l[26]

        ])){

            state =
                "NOT_READY";

            return;
        }

        const leftUp =
            l[25].y <
            l[23].y -
            0.12;

        const rightUp =
            l[26].y <
            l[24].y -
            0.12;

        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;
        }

        if(
            state ===
                "READY" &&
            leftUp
        ){

            state =
                "LEFT";

            return;
        }

        if(
            state ===
                "LEFT" &&
            rightUp
        ){

            state =
                "RIGHT";

            movementStart =
                Date.now();

            return;
        }

        if(
            state ===
                "RIGHT" &&
            !leftUp &&
            !rightUp &&
            movementStart &&
            Date.now() -
            movementStart >=
            200
        ){

            addRep();

            state =
                "READY";

            movementStart =
                null;
        }

        return;
    }


    /*
    ====================================================
    5. LUNGES
    Left lunge → right lunge → standing
    = 1 rep
    ====================================================
    */

    if(w === "lunges"){

        if(!required([

            l[23],
            l[24],

            l[25],
            l[26],

            l[27],
            l[28]

        ])){

            state =
                "NOT_READY";

            return;
        }

        const leftBent =
            leftKnee < 120;

        const rightBent =
            rightKnee < 120;

        if(
            state ===
            "NOT_READY"
        ){

            if(
                leftKnee > 155 &&
                rightKnee > 155
            ){

                state =
                    "READY";
            }

            return;
        }

        if(
            state ===
                "READY" &&
            leftBent
        ){

            state =
                "LEFT";

            return;
        }

        if(
            state ===
                "LEFT" &&
            rightBent
        ){

            state =
                "RIGHT";

            movementStart =
                Date.now();

            return;
        }

        if(
            state ===
                "RIGHT" &&
            leftKnee > 155 &&
            rightKnee > 155
        ){

            addRep();

            state =
                "READY";

            movementStart =
                null;
        }

        return;
    }


    /*
    ====================================================
    6. MOUNTAIN CLIMBER
    Left knee in → right knee in → reset
    ====================================================
    */

    if(w === "mountain climber"){

        if(!required([

            l[11],
            l[12],

            l[23],
            l[24],

            l[25],
            l[26]

        ])){

            state =
                "NOT_READY";

            return;
        }

        const bodyAngle =
            Math.min(

                angle(
                    l[11],
                    l[23],
                    l[25]
                ),

                angle(
                    l[12],
                    l[24],
                    l[26]
                )

            );

        if(
            bodyAngle <
            135
        ){

            state =
                "NOT_READY";

            return;
        }

        const leftIn =
            l[25].x >
            l[23].x -
            0.12;

        const rightIn =
            l[26].x <
            l[24].x +
            0.12;

        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            return;
        }

        if(
            state ===
                "READY" &&
            leftIn
        ){

            state =
                "LEFT";

            return;
        }

        if(
            state ===
                "LEFT" &&
            rightIn
        ){

            state =
                "RIGHT";

            return;
        }

        if(
            state ===
                "RIGHT" &&
            !leftIn &&
            !rightIn
        ){

            addRep();

            state =
                "READY";
        }

        return;
    }


    /*
    ====================================================
    7. JUMPING JACK
    Closed → open → closed
    ====================================================
    */

    if(w === "jumping jack"){

        if(!required([

            l[11],
            l[12],

            l[15],
            l[16],

            l[23],
            l[24],

            l[27],
            l[28]

        ])){

            state =
                "NOT_READY";

            return;
        }

        const armsDown =
            l[15].y >
                shoulder.y &&
            l[16].y >
                shoulder.y;

        const armsUp =
            l[15].y <
                shoulder.y -
                0.08 &&
            l[16].y <
                shoulder.y -
                0.08;

        const feetDistance =
            Math.abs(
                l[27].x -
                l[28].x
            );

        const feetClosed =
            feetDistance <
            0.12;

        const feetOpen =
            feetDistance >
            0.25;

        if(
            state ===
            "NOT_READY"
        ){

            if(
                armsDown &&
                feetClosed
            ){

                state =
                    "READY";
            }

            return;
        }

        if(
            state ===
                "READY" &&
            armsUp &&
            feetOpen
        ){

            state =
                "MOVE";

            movementStart =
                Date.now();

            return;
        }

        if(
            state ===
                "MOVE" &&
            armsDown &&
            feetClosed &&
            movementStart &&
            Date.now() -
            movementStart >=
            250
        ){

            addRep();

            state =
                "READY";

            movementStart =
                null;
        }

        return;
    }


    /*
    ====================================================
    8. BURPEES
    Stand → down → stand → jump
    ====================================================
    */

    if(w === "burpees"){

        if(!required([

            l[11],
            l[12],

            l[23],
            l[24],

            l[25],
            l[26],

            l[27],
            l[28]

        ])){

            state =
                "NOT_READY";

            return;
        }

        const standing =
            leftKnee > 155 &&
            rightKnee > 155;

        const down =
            kneeAngle < 120;

        const jump =
            l[27].y <
                l[25].y -
                0.08 &&
            l[28].y <
                l[26].y -
                0.08;

        if(
            state ===
            "NOT_READY"
        ){

            if(standing){

                state =
                    "READY";
            }

            return;
        }

        if(
            state ===
                "READY" &&
            down
        ){

            state =
                "DOWN";

            movementStart =
                Date.now();

            return;
        }

        if(
            state ===
                "DOWN" &&
            standing
        ){

            state =
                "UP";

            return;
        }

        if(
            state ===
                "UP" &&
            jump &&
            movementStart &&
            Date.now() -
            movementStart >=
            300
        ){

            addRep();

            state =
                "READY";

            movementStart =
                null;
        }

        return;
    }


    /*
    ====================================================
    9. PLANK
    Hold correct plank.
    1 second = 1 point.
    ====================================================
    */

    if(w === "plank"){

        if(!required([

            l[11],
            l[12],

            l[23],
            l[24],

            l[25],
            l[26],

            l[27],
            l[28]

        ])){

            state =
                "NOT_READY";

            movementStart =
                null;

            return;
        }

        const bodyAngle =
            Math.min(

                angle(
                    l[11],
                    l[23],
                    l[25]
                ),

                angle(
                    l[12],
                    l[24],
                    l[26]
                )

            );

        const correctPlank =
            bodyAngle >
            145;

        if(!correctPlank){

            state =
                "NOT_READY";

            movementStart =
                null;

            lastPlankSecond =
                0;

            return;
        }

        if(
            state ===
            "NOT_READY"
        ){

            state =
                "READY";

            movementStart =
                Date.now();

            lastPlankSecond =
                0;

            return;
        }

        if(
            state ===
                "READY" &&
            movementStart
        ){

            const seconds =
                Math.floor(

                    (
                        Date.now() -
                        movementStart
                    ) / 1000

                );

            if(
                seconds >
                    lastPlankSecond &&
                seconds <=
                    MAX_REPS
            ){

                lastPlankSecond =
                    seconds;

                reps =
                    seconds;

                repEl.textContent =
                    seconds;

                statusEl.textContent =
                    seconds +
                    " SEC";

                statusEl.style.color =
                    "#00ff66";
            }
        }

        return;
    }


    /*
    ====================================================
    10. COOL DOWN
    Arms down → up → down
    ====================================================
    */

    if(w === "cool down"){

        if(!required([

            l[11],
            l[12],

            l[15],
            l[16],

            l[23],
            l[24]

        ])){

            state =
                "NOT_READY";

            return;
        }

        const armsDown =
            l[15].y >
                shoulder.y &&
            l[16].y >
                shoulder.y;

        const armsUp =
            l[15].y <
                shoulder.y -
                0.08 &&
            l[16].y <
                shoulder.y -
                0.08;

        if(
            state ===
            "NOT_READY"
        ){

            if(armsDown){

                state =
                    "READY";
            }

            return;
        }

        if(
            state ===
                "READY" &&
            armsUp
        ){

            state =
                "MOVE";

            movementStart =
                Date.now();

            return;
        }

        if(
            state ===
                "MOVE" &&
            armsDown &&
            movementStart &&
            Date.now() -
            movementStart >=
            500
        ){

            addRep();

            state =
                "READY";

            movementStart =
                null;
        }

        return;
    }
}


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onResults(
    results
){

    if(!running)
        return;

    if(
        !results ||
        !results.poseLandmarks
    ){

        lostFrames++;

        if(
            lostFrames >= 8
        ){

            positionReady =
                false;

            state =
                "NOT_READY";

            movementStart =
                null;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            statusEl.textContent =
                "MOVE INTO CAMERA";

            statusEl.style.color =
                "#ff3030";
        }

        return;
    }

    const landmarks =
        results.poseLandmarks;

    drawBody(
        landmarks
    );

    if(positionReady){

        detectMovement(
            landmarks
        );
    }
}


/* =====================================================
   MEDIAPIPE SETUP
===================================================== */

function setupPose(){

    pose =
        new Pose({

            locateFile:
                file => {

                    return (
                        "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" +
                        file
                    );
                }

        });

    pose.setOptions({

        modelComplexity:1,

        smoothLandmarks:true,

        enableSegmentation:false,

        minDetectionConfidence:
            0.50,

        minTrackingConfidence:
            0.50

    });

    pose.onResults(
        onResults
    );
}


/* =====================================================
   CAMERA PROCESS
===================================================== */

async function processVideo(){

    if(!running)
        return;

    if(
        video.readyState >= 2 &&
        !processing
    ){

        processing =
            true;

        try{

            await pose.send({

                image:
                    video

            });

        }
        catch(error){

            console.error(
                "Pose error:",
                error
            );

        }

        processing =
            false;
    }

    requestAnimationFrame(
        processVideo
    );
}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

    try{

        loading.style.display =
            "flex";

        setupPose();

        stream =
            await navigator.mediaDevices
            .getUserMedia({

                video:{

                    facingMode:
                        "user",

                    width:{
                        ideal:1080
                    },

                    height:{
                        ideal:1920
                    }

                },

                audio:false

            });

        video.srcObject =
            stream;

        await video.play();

        canvas.width =
            video.videoWidth ||
            1080;

        canvas.height =
            video.videoHeight ||
            1920;

        loading.style.display =
            "none";

        processVideo();

    }
    catch(error){

        console.error(
            "Camera error:",
            error
        );

        loading.innerHTML = `

            <div
                style="
                color:#ff3030;
                font-size:18px;
                text-align:center;
                "
            >
                Camera could not start
            </div>

            <div
                style="
                font-size:13px;
                color:#aaa;
                text-align:center;
                "
            >
                Allow camera permission
                and reload.
            </div>

        `;
    }
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

    running =
        false;

    if(stream){

        stream
        .getTracks()
        .forEach(
            track => {

                track.stop();

            }
        );

        stream =
            null;
    }
}


/* =====================================================
   QUIT
===================================================== */

quitBtn.onclick =
    ()=>{

        stopCamera();

        location.href =
            "daily-task.html";

    };


/* =====================================================
   FINISH
===================================================== */

finishBtn.onclick =
    async ()=>{

        if(reps <= 0){

            alert(
                "Complete at least 1 rep."
            );

            return;
        }

        const user =
            auth.currentUser;

        if(!user){

            alert(
                "Please login before saving."
            );

            return;
        }

        finishBtn.disabled =
            true;

        try{

            const userRef =
                db
                .collection("users")
                .doc(user.uid);

            const snap =
                await userRef.get();

            const data =
                snap.exists
                    ? snap.data()
                    : {};

            const oldPoints =
                Number(
                    data.totalPoints ||
                    0
                );

            const workoutOrder = [

                "Stretching",

                "Push Up",

                "Squat",

                "High Knees",

                "Lunges",

                "Mountain Climber",

                "Jumping Jack",

                "Burpees",

                "Plank",

                "Cool Down"

            ];

            let completedTasks =
                Array.isArray(
                    data.completedTasks
                )
                ? [
                    ...data.completedTasks
                ]
                : [];

            /*
               Backward compatibility
               for old numeric progress.
            */

            if(
                !Array.isArray(
                    data.completedTasks
                ) &&
                Number(
                    data.completedTasks ||
                    0
                ) > 0
            ){

                const oldCount =
                    Math.min(

                        workoutOrder.length,

                        Number(
                            data.completedTasks
                        )

                    );

                completedTasks =
                    Array.from(

                        {
                            length:
                                oldCount
                        },

                        (_,i)=>
                            i

                    );
            }

            const workoutIndex =
                workoutOrder.findIndex(

                    name =>
                        name.toLowerCase() ===
                        workout.toLowerCase()

                );

            if(
                workoutIndex >= 0 &&
                !completedTasks.includes(
                    workoutIndex
                )
            ){

                completedTasks.push(
                    workoutIndex
                );
            }

            completedTasks =
                [
                    ...new Set(
                        completedTasks
                    )
                ].sort(
                    (a,b)=>
                        a-b
                );

            await userRef.set({

                totalPoints:
                    oldPoints +
                    reps,

                completedTasks:
                    completedTasks,

                lastWorkout:
                    workout,

                lastWorkoutReps:
                    reps,

                updatedAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            },{
                merge:true
            });

            stopCamera();

            location.href =
                "daily-task.html";

        }
        catch(error){

            console.error(
                "Save error:",
                error
            );

            alert(
                "Could not save workout. Please try again."
            );

            finishBtn.disabled =
                false;
        }
    };


/* =====================================================
   START
===================================================== */

startCamera();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        if(video.videoWidth){

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;
        }

    }
);

</script>
