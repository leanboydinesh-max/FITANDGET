
<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fit & Get - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    background:#0f0f0f;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;

}


.app-container{

    width:100%;
    max-width:400px;
    height:100vh;
    max-height:844px;

    background:#000;

    border-radius:30px;

    padding:30px 20px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;

    position:relative;

    overflow:hidden;

    border:1px solid #1a1a1a;

}


.logo-section{

    text-align:center;
    margin-top:30px;

}


.logo-img{

    width:280px;
    max-width:100%;

}


.login-card{

    width:100%;

    background:rgba(255,255,255,0.05);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.1);

    border-radius:20px;

    padding:25px;

}


.login-title{

    text-align:center;

    font-size:20px;

    font-weight:700;

       margin-bottom:25px;
}


.google-btn{

    width:100%;
    height:52px;
    background:white;
    color:#111;
    border:none;
    border-radius:25px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;

}
.google-btn span{

    margin-right:8px;

}


.home-indicator{

    width:120px;
    height:4px;
    background:#333;
    border-radius:10px;

    position:absolute;
    bottom:8px;
    left:50%;
    transform:translateX(-50%);

}

</style>

</head>


<body>


<div class="app-container">


<div class="logo-section">

<img src="logo.png" class="logo-img">

</div>



<div class="login-card">


<div class="login-title">

CUSTOMER LOGIN

</div>



<button class="google-btn" onclick="googleLogin()">

<span>G</span> Continue with Google

</button>



</div>


<div class="home-indicator"></div>


</div>
<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


 const firebaseConfig = {
  apiKey: "AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",
  authDomain: "fitandget-b3461.firebaseapp.com",
  projectId: "fitandget-b3461",
  storageBucket: "fitandget-b3461.firebasestorage.app",
  messagingSenderId: "216178533513",
  appId: "1:216178533513:web:975f20599c7e77b9d01258"
};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);
onAuthStateChanged(auth, (user) => {
    if (user) {
        window.location.replace("home.html");
    }
});
const db = getFirestore(app);


const provider = new GoogleAuthProvider();


window.googleLogin = async function(){

try{

const result = await signInWithPopup(auth, provider);

const user = result.user;
const userRef = doc(db, "users", user.uid);

const userSnap = await getDoc(userRef);

if (!userSnap.exists()) {

  await setDoc(userRef, {
    username: user.displayName,
    email: user.email,
    photoURL: user.photoURL,
    coins: 0,
    eligibilityTokens: 0,
    totalPoints: 0,
    registered: false
  });

}

window.location.replace("home.html");
}

catch(error){

console.log(error);
alert(error.code);

}

};









</script>

</body>

</html>
