<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIT & GET - Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
    --green:#7CFC00;
    --green-soft:#9dff4d;
    --bg:#050505;
    --card:#0b0b0b;
    --card2:#101010;
    --border:#1c351c;
    --text:#ffffff;
    --muted:#777;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    background:#050505;
    color:var(--text);
    font-family:'Rajdhani',sans-serif;
}

/* subtle FG background */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(124,252,0,.07),
            transparent 35%
        );
}

/* =========================
   APP
========================= */

.app-viewport{
    position:relative;
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    padding:12px;
    background:#050505;
}

/* =========================
   HEADER
========================= */

.top-header{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #172317;
    margin-bottom:12px;
}

.header-side{
    width:42px;
    display:flex;
    justify-content:center;
}

.icon-btn{
    width:38px;
    height:38px;
    border-radius:10px;
    border:1px solid #203820;
    background:#0a0a0a;
    color:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.icon-btn:active{
    transform:scale(.94);
}

.header-center{
    flex:1;
    text-align:center;
}

.username-line{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;
}

#usernameText{
    font-family:'Orbitron',sans-serif;
    font-size:17px;
    font-weight:700;
    color:#fff;
}

.edit-name{
    color:var(--green);
    font-size:12px;
    cursor:pointer;
}

#rankText{
    margin-top:3px;
    font-family:'Orbitron',sans-serif;
    font-size:8px;
    letter-spacing:1.5px;
    color:var(--green);
}

/* =========================
   PROFILE CARD
========================= */

.profile-card{
    background:#090909;
    border:1px solid #1b321b;
    border-radius:16px;
    padding:17px;
    margin-bottom:12px;
}

.profile-main{
    display:flex;
    align-items:center;
    gap:15px;
}

/* =========================
   PROFILE IMAGE
========================= */

.avatar-wrap{
    position:relative;
    width:88px;
    height:88px;
    flex-shrink:0;
}

#profileImage{
    width:88px;
    height:88px;
    object-fit:cover;
    border-radius:50%;
    border:2px solid var(--green);
    background:#111;
}

.online-dot{
    position:absolute;
    right:1px;
    bottom:5px;
    width:14px;
    height:14px;
    border-radius:50%;
    background:var(--green);
    border:3px solid #090909;
    box-shadow:0 0 8px rgba(124,252,0,.5);
}

.upload-btn{
    position:absolute;
    left:0;
    bottom:0;

    width:27px;
    height:27px;

    border-radius:50%;
    border:1px solid var(--green);

    background:#080808;
    color:var(--green);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    cursor:pointer;
}

/* =========================
   BIO
========================= */

.profile-info{
    flex:1;
    min-width:0;
}

.bio-label{
    font-family:'Orbitron',sans-serif;
    font-size:8px;
    color:#666;
    letter-spacing:1px;
    margin-bottom:6px;
}

#bioText{
    width:100%;
    height:42px;
    resize:none;

    background:#050505;
    color:#eee;

    border:1px solid #1d351d;
    border-radius:8px;

    outline:none;
    padding:8px 10px;

    font-family:'Rajdhani',sans-serif;
    font-size:14px;
}

#bioText:focus{
    border-color:var(--green);
}

.bio-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:4px;
}

#charCount{
    font-size:9px;
    color:#555;
}

.save-bio{
    color:var(--green);
    font-family:'Orbitron',sans-serif;
    font-size:8px;
    cursor:pointer;
}

/* =========================
   LIKE / STREAK
========================= */

.profile-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.action-badge{
    flex:1;
    height:38px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:7px;

    background:#050505;
    border:1px solid #1b321b;
    border-radius:9px;

    font-family:'Rajdhani',sans-serif;
    font-size:12px;

    cursor:pointer;
}

.action-badge i{
    font-size:13px;
}

.like-badge i{
    color:#ff3d54;
}

.streak-badge i{
    color:#ff9d00;
}

.action-badge strong{
    color:#fff;
    font-family:'Orbitron',sans-serif;
    font-size:11px;
}

/* =========================
   STATS
========================= */

.stats-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    margin-bottom:12px;
}

.stat-pill{
    min-height:75px;

    background:#090909;
    border:1px solid #1b321b;
    border-radius:12px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    transition:.2s;
}

.stat-pill:active{
    transform:scale(.97);
}

.stat-pill:hover{
    border-color:#365b36;
}

.stat-icon{
    color:var(--green);
    font-size:16px;
    margin-bottom:4px;
}

.stat-name{
    font-family:'Orbitron',sans-serif;
    font-size:7px;
    color:#666;
    letter-spacing:1px;
}

.stat-value{
    color:#fff;
    font-family:'Orbitron',sans-serif;
    font-size:16px;
    font-weight:700;
    margin-top:3px;
}

/* =========================
   SECTIONS
========================= */

.section-box{
    background:#090909;
    border:1px solid #1b321b;
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:11px;
}

.section-title h3{
    font-family:'Orbitron',sans-serif;
    font-size:11px;
    font-weight:600;
    color:#fff;
}

.section-title span{
    font-family:'Orbitron',sans-serif;
    font-size:7px;
    color:var(--green);
}

/* =========================
   ACHIEVEMENTS
========================= */

#achieveContainer{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.achievement{
    min-height:82px;

    background:#050505;
    border:1px solid #172717;
    border-radius:9px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:8px;
    text-align:center;
}

.achievement i{
    color:var(--green);
    font-size:21px;
    margin-bottom:6px;
}

.achievement-name{
    color:#ddd;
    font-size:9px;
    font-weight:600;
}

.empty-state{
    grid-column:1/-1;
    padding:18px;
    text-align:center;
    color:#555;
    font-size:12px;
}

/* =========================
   CRYSTALS
========================= */

#crystalContainer{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.crystal{
    min-height:65px;

    background:#050505;
    border:1px solid #172717;
    border-radius:9px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.crystal i{
    color:#baff76;
    font-size:19px;
    margin-bottom:4px;
}

.crystal span{
    color:#777;
    font-size:8px;
}

/* =========================
   MOTTO
========================= */

.motto{
    padding:16px;
    margin-bottom:12px;

    background:#090909;
    border:1px solid #1b321b;
    border-radius:14px;

    text-align:center;
}

.motto small{
    display:block;
    color:var(--green);
    font-family:'Orbitron',sans-serif;
    font-size:7px;
    letter-spacing:2px;
    margin-bottom:6px;
}

.motto-text{
    color:#ddd;
    font-family:'Orbitron',sans-serif;
    font-size:10px;
    line-height:1.8;
}

/* =========================
   MODAL
========================= */

#customModal{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.78);
    backdrop-filter:blur(5px);

    z-index:9999;
}

.modal-box{
    width:100%;
    max-width:390px;

    background:#090909;
    border:1px solid var(--green);
    border-radius:14px;

    padding:20px;

    box-shadow:
        0 0 25px rgba(124,252,0,.12);
}

#modalTitle{
    font-family:'Orbitron',sans-serif;
    font-size:14px;
    color:var(--green);
    margin-bottom:12px;
}

#modalBody{
    color:#bbb;
    font-size:14px;
    line-height:1.5;
    margin-bottom:15px;
}

.modal-input{
    width:100%;
    padding:11px;

    background:#050505;
    border:1px solid #263d26;
    border-radius:8px;

    color:#fff;
    outline:none;

    margin-bottom:10px;
}

.modal-buttons{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.modal-btn{
    width:100%;
    min-height:40px;

    border:1px solid #294529;
    border-radius:8px;

    background:#0b0b0b;
    color:var(--green);

    font-family:'Orbitron',sans-serif;
    font-size:9px;

    cursor:pointer;
}

.modal-btn.buy{
    background:var(--green);
    color:#050505;
    border-color:var(--green);
    font-weight:800;
}

.modal-btn.close{
    color:#888;
}

/* =========================
   TOAST
========================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;

    transform:translate(-50%,20px);

    opacity:0;
    pointer-events:none;

    background:#0b0b0b;
    border:1px solid var(--green);
    border-radius:8px;

    color:var(--green);

    padding:10px 15px;

    font-family:'Orbitron',sans-serif;
    font-size:8px;

    z-index:10000;
    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   LOADING
========================= */

#loadingScreen{
    position:fixed;
    inset:0;

    background:#050505;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    z-index:20000;
}

.loading-logo{
    color:var(--green);
    font-family:'Orbitron',sans-serif;
    font-size:24px;
    font-weight:800;
    letter-spacing:3px;
}

.loading-text{
    color:#555;
    font-family:'Orbitron',sans-serif;
    font-size:7px;
    letter-spacing:2px;
    margin-top:8px;
}

.loading-bar{
    width:160px;
    height:2px;
    background:#182018;
    margin-top:14px;
    overflow:hidden;
}

.loading-bar span{
    display:block;
    width:40%;
    height:100%;
    background:var(--green);
    animation:loading 1s infinite;
}

@keyframes loading{
    from{transform:translateX(-100%)}
    to{transform:translateX(350%)}
}

@media(max-width:380px){

    .app-viewport{
        padding:10px;
    }

    .profile-card{
        padding:14px;
    }

    .avatar-wrap,
    #profileImage{
        width:78px;
        height:78px;
    }

    #usernameText{
        font-size:15px;
    }

    .stat-value{
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loadingScreen">
    <div class="loading-logo">FIT & GET</div>
    <div class="loading-text">LOADING PROFILE</div>
    <div class="loading-bar">
        <span></span>
    </div>
</div>


<div class="app-viewport">

<!-- ================= HEADER ================= -->

<header class="top-header">

    <div class="header-side">
        <button class="icon-btn" onclick="goBack()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
    </div>

    <div class="header-center">

        <div class="username-line">

            <span id="usernameText">
                User
            </span>

            <i
                class="fa-solid fa-pen edit-name"
                onclick="openUsernameEditor()">
            </i>

        </div>

        <div id="rankText">
            Rank #--
        </div>

    </div>

    <div class="header-side">

        <button
            class="icon-btn"
            onclick="openMenu()">

            <i class="fa-solid fa-ellipsis"></i>

        </button>

    </div>

</header>


<!-- ================= PROFILE ================= -->

<section class="profile-card">

    <div class="profile-main">

        <div class="avatar-wrap">

            <img
                id="profileImage"
                src=""
                alt="Profile">

            <div class="online-dot"></div>

            <label class="upload-btn">

                <i class="fa-solid fa-camera"></i>

                <input
                    id="imageInput"
                    type="file"
                    accept="image/*"
                    hidden
                    onchange="uploadImage(event)">

            </label>

        </div>


        <div class="profile-info">

            <div class="bio-label">
                BIO
            </div>

            <textarea
                id="bioText"
                maxlength="20"
                placeholder="Write something..."
                oninput="updateBioCount()"></textarea>

            <div class="bio-bottom">

                <span id="charCount">
                    0/20
                </span>

                <span
                    class="save-bio"
                    onclick="saveBio()">
                    SAVE
                </span>

            </div>

        </div>

    </div>


    <!-- LIKE / STREAK -->

    <div class="profile-actions">

        <div
            class="action-badge like-badge"
            onclick="giveLike()">

            <i class="fa-solid fa-heart"></i>

            <strong id="likeCounter">
                0
            </strong>

            <span>Likes</span>

        </div>


        <div class="action-badge streak-badge">

            <i class="fa-solid fa-fire"></i>

            <strong id="streakCounter">
                0
            </strong>

            <span>Streak</span>

        </div>

    </div>

</section>


<!-- ================= STATS ================= -->

<div class="stats-row">

    <div
        class="stat-pill"
        onclick="openShieldMenu()">

        <div class="stat-icon">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <div class="stat-name">
            SHIELD
        </div>

        <div
            class="stat-value"
            id="shieldCount">
            0
        </div>

    </div>


    <div
        class="stat-pill"
        onclick="openRCMenu()">

        <div class="stat-icon">
            <i class="fa-solid fa-bolt"></i>
        </div>

        <div class="stat-name">
            RC
        </div>

        <div
            class="stat-value"
            id="rcCount">
            0
        </div>

    </div>


    <div
        class="stat-pill"
        onclick="showInfo(
            'Eligibility Token',
            'Your current Eligibility Token balance.'
        )">

        <div class="stat-icon">
            <i class="fa-solid fa-ticket"></i>
        </div>

        <div class="stat-name">
            TOKEN
        </div>

        <div
            class="stat-value"
            id="tokenCount">
            0
        </div>

    </div>

</div>


<!-- ================= ACHIEVEMENTS ================= -->

<section class="section-box">

    <div class="section-title">

        <h3>
            ACHIEVEMENTS
        </h3>

        <span>
            MEDALS
        </span>

    </div>

    <div id="achieveContainer"></div>

</section>


<!-- ================= CRYSTALS ================= -->

<section class="section-box">

    <div class="section-title">

        <h3>
            CRYSTALS
        </h3>

        <span>
            COLLECTION
        </span>

    </div>

    <div id="crystalContainer"></div>

</section>


<!-- ================= MOTTO ================= -->

<div class="motto">

    <small>
        MY MOTTO
    </small>

    <div class="motto-text">
        Dream... Believe... Become...
    </div>

</div>

</div>


<!-- ================= MODAL ================= -->

<div id="customModal">

    <div class="modal-box">

        <div id="modalTitle">
            FIT & GET
        </div>

        <div id="modalBody"></div>

        <div id="modalInputArea"></div>

        <div class="modal-buttons">

            <button
                id="modalActionBtn"
                class="modal-btn"
                style="display:none">
            </button>

            <button
                class="modal-btn close"
                onclick="closeModal()">
                CLOSE
            </button>

        </div>

    </div>

</div>


<!-- TOAST -->

<div id="toast"></div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    updateDoc,
    onSnapshot,
    collection,
    query,
    orderBy,
    getDocs,
    runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {
    apiKey:"AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",
    authDomain:"fitandget-b3461.firebaseapp.com",
    projectId:"fitandget-b3461",
    storageBucket:"fitandget-b3461.firebasestorage.app",
    messagingSenderId:"216178533513",
    appId:"1:216178533513:web:975f20599c7e77b9d01258"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* ================= CLOUDINARY ================= */

const CLOUDINARY_CLOUD_NAME = "ey7wjwyw";
const CLOUDINARY_UPLOAD_PRESET = "FITANDGET";


/* ================= GLOBAL ================= */

let currentUser = null;
let profileUid = null;
let profileData = null;
let unsubscribeUser = null;


/* ================= DEFAULT IMAGE ================= */

const DEFAULT_IMAGE =
    "https://cdn-icons-png.flaticon.com/512/149/149071.png";


/* ================= AUTH ================= */

onAuthStateChanged(auth, async(user)=>{

    if(!user){

        window.location.href = "index.html";
        return;

    }

    currentUser = user;

    /*
       ?uid=UID இருந்தால் அந்த user's profile.
       இல்லையென்றால் current user's profile.
    */

    const params = new URLSearchParams(
        window.location.search
    );

    profileUid =
        params.get("uid") || currentUser.uid;

    await startProfileListener();

    await updateLeaderboardRank();

    document.getElementById(
        "loadingScreen"
    ).style.display = "none";

});


/* ================= PROFILE LISTENER ================= */

async function startProfileListener(){

    if(unsubscribeUser){
        unsubscribeUser();
    }

    const userRef =
        doc(db,"users",profileUid);

    unsubscribeUser =
        onSnapshot(
            userRef,
            (snap)=>{

                if(!snap.exists()){

                    showToast("Profile not found");
                    return;

                }

                profileData = snap.data();

                renderProfile(profileData);

            },
            (error)=>{

                console.error(error);

                showToast(
                    "Unable to load profile"
                );

            }
        );

}


/* ================= RENDER ================= */

function renderProfile(data){

    const username =
        data.username || "User";

    document.getElementById(
        "usernameText"
    ).textContent = username;


    const image =
        data.photoURL || DEFAULT_IMAGE;

    document.getElementById(
        "profileImage"
    ).src = image;


    const bio =
        data.bio || "";

    document.getElementById(
        "bioText"
    ).value = bio.substring(0,20);

    updateBioCount();


    const likes =
        data.loveCount ??
        data.likes ??
        0;

    document.getElementById(
        "likeCounter"
    ).textContent =
        formatNumber(likes);


    document.getElementById(
        "streakCounter"
    ).textContent =
        data.dailyStreak ?? 0;


    document.getElementById(
        "shieldCount"
    ).textContent =
        data.shield ?? 0;


    const rc =
        data.rcPoints ??
        data.rc ??
        data.coins ??
        0;

    document.getElementById(
        "rcCount"
    ).textContent =
        formatNumber(rc);


    document.getElementById(
        "tokenCount"
    ).textContent =
        data.eligibilityTokens ??
        data.tokens ??
        0;


    renderAchievements(
        data.achievements || []
    );


    renderCrystals(
        data.crystals || []
    );

}


/* ================= BIO ================= */

window.updateBioCount = function(){

    const textarea =
        document.getElementById("bioText");

    if(textarea.value.length > 20){

        textarea.value =
            textarea.value.substring(0,20);

    }

    document.getElementById(
        "charCount"
    ).textContent =
        textarea.value.length + "/20";

};


window.saveBio = async function(){

    if(!currentUser) return;

    /* Only own profile can edit */

    if(profileUid !== currentUser.uid){

        showToast(
            "You can edit only your profile"
        );

        return;

    }

    try{

        const bio =
            document.getElementById(
                "bioText"
            ).value.trim();

        await updateDoc(
            doc(db,"users",currentUser.uid),
            {
                bio:bio.substring(0,20)
            }
        );

        showToast("Bio saved");

    }catch(error){

        console.error(error);

/* ================= IMAGE UPLOAD ================= */

window.uploadImage = async function(event){

    if(!currentUser) return;

    if(profileUid !== currentUser.uid){

        showToast(
            "You can edit only your profile"
        );

        return;

    }

    const file =
        event.target.files[0];

    if(!file) return;


    if(file.size > 5 * 1024 * 1024){

        showToast(
            "Image must be below 5MB"
        );

        return;

    }


    showToast("Uploading image...");


    try{

        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );

        formData.append(
            "upload_preset",
            CLOUDINARY_UPLOAD_PRESET
        );


        const response =
            await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                {
                    method:"POST",
                    body:formData
                }
            );


        if(!response.ok){

            throw new Error(
                "Cloudinary upload failed"
            );

        }


        const result =
            await response.json();


        await updateDoc(
            doc(db,"users",currentUser.uid),
            {
                photoURL:
                    result.secure_url
            }
        );


        showToast("Profile photo updated");


    }catch(error){

        console.error(error);

        showToast(
            "Image upload failed"
        );

    }

};


/* ================= LIKE SYSTEM ================= */

/*
   One user = one like per target profile.

   users/TARGET_UID/likes/LINKER_UID

   Transaction makes the increment
   atomic.
*/

window.giveLike = async function(){

    if(!currentUser || !profileUid)
        return;


    const targetRef =
        doc(db,"users",profileUid);

    const likeRef =
        doc(
            db,
            "users",
            profileUid,
            "likes",
            currentUser.uid
        );


    try{

        const alreadyLiked =
            await runTransaction(
                db,
                async(transaction)=>{

                    const likeSnap =
                        await transaction.get(
                            likeRef
                        );

                    if(likeSnap.exists()){

                        return true;

                    }


                    const targetSnap =
                        await transaction.get(
                            targetRef
                        );


                    if(!targetSnap.exists()){

                        throw new Error(
                            "Profile not found"
                        );

                    }


                    const data =
                        targetSnap.data();


                    const currentLikes =
                        Number(
                            data.loveCount ??
                            data.likes ??
                            0
                        );


                    transaction.set(
                        likeRef,
                        {
                            uid:currentUser.uid,
                            createdAt:
                                Date.now()
                        }
                    );


                    transaction.update(
                        targetRef,
                        {
                            loveCount:
                                currentLikes + 1
                        }
                    );


                    return false;

                }
            );


        if(alreadyLiked){

            showToast(
                "Already liked ❤️"
            );

        }else{

            showToast(
                "Liked ❤️"
            );

        }

    }catch(error){

        console.error(error);

        showToast(
            "Like failed"
        );

    }

};


/* ================= LEADERBOARD ================= */

async function updateLeaderboardRank(){

    if(!currentUser) return;

    try{

        const usersQuery =
            query(
                collection(db,"users"),
                orderBy(
                    "totalPoints",
                    "desc"
                )
            );


        const snap =
            await getDocs(usersQuery);


        let rank = 0;
        let position = 0;
        let previousPoints = null;


        for(const userDoc of snap.docs){

            position++;

            const data =
                userDoc.data();

            const points =
                Number(
                    data.totalPoints || 0
                );


            if(
                previousPoints === null ||
                points < previousPoints
            ){

                rank = position;

            }


            if(
                userDoc.id === profileUid
            ){

                document.getElementById(
                    "rankText"
                ).textContent =
                    `Rank #${rank}`;

                return;

            }


            previousPoints = points;

        }


        document.getElementById(
            "rankText"
        ).textContent =
            "Rank #--";

    }catch(error){

        console.error(
            "Leaderboard error:",
            error
        );

        document.getElementById(
            "rankText"
        ).textContent =
            "Rank #--";

    }

}


/* ================= ACHIEVEMENTS ================= */

function renderAchievements(items){

    const container =
        document.getElementById(
            "achieveContainer"
        );

    if(!Array.isArray(items) ||
       items.length === 0){

        container.innerHTML = `
            <div class="empty-state">
                No achievements yet
            </div>
        `;

        return;

    }


    items.forEach(item=>{

        let name = "Achievement";
        let icon = "fa-trophy";


        if(typeof item === "string"){

            name = item;

        }else if(item){

            name =
                item.name ||
                item.title ||
                "Achievement";

            icon =
                item.icon ||
                "fa-trophy";

        }


        const card =
            document.createElement("div");

        card.className =
            "achievement";


        card.innerHTML = `
            <i class="fa-solid ${escapeHTML(icon)}"></i>
            <div class="achievement-name">
                ${escapeHTML(name)}
            </div>
        `;


        container.appendChild(card);

    });

}

/* ================= HELPERS ================= */

function formatNumber(num){

    num = Number(num) || 0;

    if(num >= 1000000){

        return (
            num / 1000000
        ).toFixed(1) + "M";

    }

    if(num >= 1000){

        return (
            num / 1000
        ).toFixed(1) + "K";

    }

    return num.toString();

}


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
