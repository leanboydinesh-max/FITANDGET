<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>FIT & GET - Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{
    --neon-primary:#7CFC00;
    --neon-dark:#39a900;
    --neon-glow:rgba(124,252,0,.42);

    --bg-dark:#030603;
    --panel-bg:rgba(8,20,8,.92);
    --box-bg:rgba(15,32,13,.82);

    --border-green:#7CFC00;

    --text-main:#ffffff;
    --text-muted:#8fa98f;

    --danger:#ff4141;
    --gold:#ffd84d;
}

/* RESET */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{
    background:
        radial-gradient(circle at 50% 0%,
        rgba(124,252,0,.13),
        transparent 35%),
        radial-gradient(circle at 0% 100%,
        rgba(124,252,0,.06),
        transparent 30%),
        #020502;

    color:var(--text-main);

    font-family:'Rajdhani',sans-serif;

    overflow:hidden;
}

/* GRID BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background-image:
        linear-gradient(
            rgba(124,252,0,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(124,252,0,.025) 1px,
            transparent 1px
        );

    background-size:28px 28px;

    pointer-events:none;
}

/* APP */

.app-viewport{
    position:relative;

    width:100%;
    max-width:600px;

    height:100vh;

    margin:auto;

    padding:12px;

    background:
        linear-gradient(
            180deg,
            rgba(4,12,5,.98),
            rgba(2,7,3,.98)
        );

    border-left:1px solid rgba(124,252,0,.45);
    border-right:1px solid rgba(124,252,0,.45);

    overflow-y:auto;
    overflow-x:hidden;

    scrollbar-width:none;
}

.app-viewport::-webkit-scrollbar{
    display:none;
}

/* HEADER */

.profile-header{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:space-between;

    min-height:48px;

    margin-bottom:10px;
}

.header-left,
.header-right{
    width:44px;
    display:flex;
    align-items:center;
}

.header-right{
    justify-content:flex-end;
}

.back-btn,
.menu-btn{
    width:38px;
    height:38px;

    border:1px solid rgba(124,252,0,.45);
    border-radius:12px;

    background:rgba(124,252,0,.06);

    color:var(--neon-primary);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.2s;
}

.back-btn:hover,
.menu-btn:hover{
    background:rgba(124,252,0,.15);
    box-shadow:0 0 14px var(--neon-glow);
}

.header-center{
    flex:1;
    text-align:center;
    min-width:0;
}

.username-line{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

#usernameText{
    margin:0;

    max-width:260px;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;

    font-family:'Orbitron',sans-serif;
    font-size:18px;
    font-weight:700;

    color:#fff;

    text-shadow:0 0 10px rgba(124,252,0,.2);
}

.edit-name-btn{
    border:0;
    background:transparent;

    color:var(--neon-primary);

    cursor:pointer;
    padding:4px;
}

#rankText{
    margin:2px 0 0;

    color:var(--neon-primary);

    font-family:'Orbitron',sans-serif;
    font-size:10px;
    font-weight:700;

    letter-spacing:1px;
}

/* PROFILE CARD */

.profile-card{
    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(10,28,11,.94),
            rgba(4,13,5,.96)
        );

    border:1px solid rgba(124,252,0,.4);

    border-radius:20px;

    padding:15px;

    box-shadow:
        0 0 18px rgba(124,252,0,.07),
        inset 0 0 25px rgba(124,252,0,.025);
}

/* TOP PROFILE AREA */

.profile-top{
    display:flex;
    align-items:center;
    gap:15px;
}

/* AVATAR */

.avatar-wrap{
    position:relative;

    width:92px;
    min-width:92px;
    height:92px;
}

#profileImage{
    width:92px;
    height:92px;

    border-radius:50%;

    object-fit:cover;

    background:#0b150b;

    border:2px solid var(--neon-primary);

    box-shadow:
        0 0 0 3px rgba(124,252,0,.08),
        0 0 20px rgba(124,252,0,.24);
}

.online-dot{
    position:absolute;

    right:2px;
    bottom:7px;

    width:16px;
    height:16px;

    background:var(--neon-primary);

    border:3px solid #071007;

    border-radius:50%;

    box-shadow:0 0 10px var(--neon-primary);
}

.upload-btn{
    position:absolute;

    left:0;
    bottom:0;

    width:29px;
    height:29px;

    border-radius:50%;

    border:1px solid var(--neon-primary);

    background:#081108;

    color:var(--neon-primary);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:12px;
}

/* BIO AREA */

.profile-info{
    flex:1;
    min-width:0;
}

#bioText{
    width:100%;
    min-height:45px;

    resize:none;

    background:rgba(0,0,0,.25);

    border:1px solid rgba(124,252,0,.2);

    border-radius:12px;

    color:#fff;

    padding:9px 10px;

    outline:none;

    font-family:'Rajdhani',sans-serif;
    font-size:14px;
}

#bioText:focus{
    border-color:var(--neon-primary);
    box-shadow:0 0 10px rgba(124,252,0,.12);
}

.bio-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:6px;
}

#charCount{
    color:var(--text-muted);
    font-size:11px;
}

/* LIKE / STREAK */

.profile-badges{
    display:flex;
    align-items:center;
    gap:7px;
}

.like-badge,
.streak-badge{
    display:flex;
    align-items:center;
    gap:5px;

    padding:6px 9px;

    border-radius:20px;

    border:1px solid rgba(124,252,0,.25);

    background:rgba(124,252,0,.06);

    font-size:12px;
    font-weight:700;
}

.like-badge{
    cursor:pointer;
    user-select:none;
}

.like-badge:hover{
    border-color:var(--neon-primary);
    box-shadow:0 0 12px rgba(124,252,0,.14);
}

.like-badge.liked{
    color:#ff5d70;
    border-color:#ff5d70;
}

.like-badge i{
    color:#ff5d70;
}

.streak-badge i{
    color:#ff9d22;
}

/* STATS */

.stats-row{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:9px;

    margin-top:13px;
}

.stat-pill{
    min-height:70px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border:1px solid rgba(124,252,0,.22);

    border-radius:15px;

    background:
        linear-gradient(
            145deg,
            rgba(124,252,0,.07),
            rgba(0,0,0,.25)
        );

    cursor:pointer;

    transition:.2s;
}

.stat-pill:hover{
    transform:translateY(-1px);

    border-color:rgba(124,252,0,.65);

    box-shadow:0 0 15px rgba(124,252,0,.12);
}

.stat-icon{
    color:var(--neon-primary);

    font-size:16px;

    margin-bottom:3px;
}

.stat-value{
    color:#fff;

    font-family:'Orbitron',sans-serif;

    font-size:17px;
    font-weight:700;
}

.stat-label{
    color:var(--text-muted);

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:.8px;
}

/* SECTION */

.section-card{
    margin-top:12px;

    padding:13px;

    background:
        linear-gradient(
            145deg,
            rgba(8,22,9,.94),
            rgba(3,9,4,.95)
        );

    border:1px solid rgba(124,252,0,.25);

    border-radius:18px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:7px;

    margin-bottom:11px;

    color:var(--neon-primary);

    font-family:'Orbitron',sans-serif;

    font-size:12px;

    letter-spacing:1px;
}

/* ACHIEVEMENTS */

.items-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:8px;
}

.item-card{
    min-height:90px;

    padding:9px 5px;

    text-align:center;

    border-radius:12px;

    border:1px solid rgba(124,252,0,.16);

    background:rgba(124,252,0,.035);
}

.item-icon{
    width:36px;
    height:36px;

    margin:0 auto 5px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:rgba(124,252,0,.08);

    color:var(--neon-primary);

    font-size:18px;
}

.item-name{
    color:#fff;

    font-size:12px;
    font-weight:700;
}

.item-desc{
    margin-top:2px;

    color:var(--text-muted);

    font-size:9px;
}

/* CRYSTALS */

.crystal-grid{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:7px;
}

.crystal-card{
    padding:8px 3px;

    text-align:center;

    border-radius:11px;

    border:1px solid rgba(124,252,0,.14);

    background:rgba(124,252,0,.035);
}

.crystal-icon{
    font-size:22px;

    color:var(--neon-primary);

    margin-bottom:3px;

    text-shadow:0 0 10px rgba(124,252,0,.35);
}

.crystal-name{
    font-size:9px;
    font-weight:700;
}

.crystal-level{
    color:var(--text-muted);
    font-size:8px;
}

/* EMPTY */

.empty-state{
    padding:15px 5px;

    text-align:center;

    color:var(--text-muted);

    font-size:12px;
}

/* MOTTO */

.motto{
    margin:12px 0 20px;

    padding:14px;

    text-align:center;

    border:1px solid rgba(124,252,0,.22);

    border-radius:16px;

    background:
        linear-gradient(
            90deg,
            rgba(124,252,0,.04),
            rgba(124,252,0,.08),
            rgba(124,252,0,.04)
        );
}

.motto-text{
    color:#fff;

    font-family:'Orbitron',sans-serif;

    font-size:13px;

    line-height:1.7;

    letter-spacing:1px;
}

.motto-text span{
    color:var(--neon-primary);

    text-shadow:0 0 9px rgba(124,252,0,.25);
}

/* MODAL */

.modal-overlay{
    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.76);

    backdrop-filter:blur(5px);
}

.modal-overlay.show{
    display:flex;
}

.custom-modal{
    width:100%;
    max-width:390px;

    background:
        linear-gradient(
            145deg,
            #0b180b,
            #030803
        );

    border:1px solid var(--neon-primary);

    border-radius:20px;

    padding:18px;

    box-shadow:
        0 0 30px rgba(124,252,0,.18),
        inset 0 0 20px rgba(124,252,0,.025);
}

.modal-title{
    margin:0 0 10px;

    color:var(--neon-primary);

    font-family:'Orbitron',sans-serif;

    font-size:17px;
}

.modal-body{
    color:#dce8dc;

    font-size:14px;

    line-height:1.5;
}

.modal-actions{
    display:flex;

    gap:9px;

    margin-top:16px;
}

.modal-btn{
    flex:1;

    min-height:42px;

    border-radius:12px;

    border:1px solid rgba(124,252,0,.4);

    background:rgba(124,252,0,.07);

    color:#fff;

    font-family:'Rajdhani',sans-serif;

    font-size:14px;
    font-weight:700;

    cursor:pointer;
}

.modal-btn.primary{
    background:var(--neon-primary);
    color:#031003;

    border-color:var(--neon-primary);

    box-shadow:0 0 14px rgba(124,252,0,.2);
}

.modal-btn.danger{
    border-color:rgba(255,65,65,.5);
    color:#ff7070;
}

/* INPUT */

.modal-input{
    width:100%;

    margin-top:12px;

    padding:11px;

    border-radius:11px;

    border:1px solid rgba(124,252,0,.25);

    background:#050b05;

    color:#fff;

    outline:none;
}

.modal-input:focus{
    border-color:var(--neon-primary);
}

/* TOAST */

#toast{
    position:fixed;

    left:50%;

    bottom:24px;

    z-index:2000;

    transform:translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:10px 15px;

    border-radius:12px;

    background:#091109;

    border:1px solid var(--neon-primary);

    color:#fff;

    font-size:13px;

    box-shadow:0 0 18px rgba(124,252,0,.2);

    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* LOADING */

#loadingScreen{
    position:fixed;

    inset:0;

    z-index:3000;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#020502;

    color:var(--neon-primary);

    font-family:'Orbitron',sans-serif;

    font-size:13px;

    letter-spacing:2px;
}

.loader{
    width:35px;
    height:35px;

    margin:0 auto 12px;

    border-radius:50%;

    border:3px solid rgba(124,252,0,.18);

    border-top-color:var(--neon-primary);

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* RESPONSIVE */

@media(max-width:430px){

    .app-viewport{
        border-left:0;
        border-right:0;
    }

    .profile-top{
        gap:11px;
    }

    .avatar-wrap,
    #profileImage{
        width:82px;
        height:82px;
        min-width:82px;
    }

    .items-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

</style>
</head>

<body>

<!-- LOADING -->

<div id="loadingScreen">
    <div style="text-align:center">
        <div class="loader"></div>
        FIT & GET
    </div>
</div>


<!-- MAIN -->

<div class="app-viewport">

    <!-- HEADER -->

    <header class="profile-header">

        <div class="header-left">
            <button class="back-btn" onclick="goBack()" aria-label="Back">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>

        <div class="header-center">

            <div class="username-line">

                <h1 id="usernameText">
                    User
                </h1>

                <button
                    class="edit-name-btn"
                    onclick="openUsernameEditor()"
                    aria-label="Edit username"
                >
                    <i class="fa-solid fa-pen"></i>
                </button>

            </div>

            <div id="rankText">
                Rank #--
            </div>

        </div>

        <div class="header-right">

            <button
                class="menu-btn"
                onclick="openMenu()"
                aria-label="Menu"
            >
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>

        </div>

    </header>


    <!-- PROFILE CARD -->

    <section class="profile-card">

        <div class="profile-top">

            <!-- AVATAR -->

            <div class="avatar-wrap">

                <img
                    id="profileImage"
                    src=""
                    alt="Profile"
                >

                <span class="online-dot"></span>

                <label
                    class="upload-btn"
                    for="imageInput"
                    title="Change photo"
                >
                    <i class="fa-solid fa-camera"></i>
                </label>

                <input
                    id="imageInput"
                    type="file"
                    accept="image/*"
                    hidden
                    onchange="uploadImage(event)"
                >

            </div>


            <!-- BIO -->

            <div class="profile-info">

                <textarea
                    id="bioText"
                    maxlength="20"
                    placeholder="Write your bio..."
                    oninput="updateBioCount()"
                    onblur="saveBio()"
                ></textarea>

                <div class="bio-bottom">

                    <span id="charCount">
                        0/20
                    </span>

                    <div class="profile-badges">

                        <div
                            class="like-badge"
                            id="likeBadge"
                            onclick="handleLike()"
                        >
                            <i class="fa-solid fa-heart"></i>
                            <span id="likeCounter">0</span>
                        </div>

                        <div class="streak-badge">

                            <i class="fa-solid fa-fire"></i>

                            <span id="streakCounter">
                                0
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- STATS -->

        <div class="stats-row">

            <div
                class="stat-pill"
                onclick="openShieldPopup()"
            >

                <div class="stat-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>

                <div
                    class="stat-value"
                    id="shieldCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Shield
                </div>

            </div>


            <div
                class="stat-pill"
                onclick="openRCPopup()"
            >

                <div class="stat-icon">
                    <i class="fa-solid fa-bolt"></i>
                </div>

                <div
                    class="stat-value"
                    id="rcCount"
                >
                    0
                </div>

                <div class="stat-label">
                    RC
                </div>

            </div>


            <div
                class="stat-pill"
                onclick="openTokenPopup()"
            >

                <div class="stat-icon">
                    <i class="fa-solid fa-ticket"></i>
                </div>

                <div
                    class="stat-value"
                    id="tokenCount"
                >
                    0
                </div>

                <div class="stat-label">
                    Token
                </div>

            </div>

        </div>

    </section>


    <!-- ACHIEVEMENTS -->

    <section class="section-card">

        <div class="section-title">

            <i class="fa-solid fa-trophy"></i>

            ACHIEVEMENTS

        </div>

        <div
            id="achieveContainer"
            class="items-grid"
        ></div>

    </section>


    <!-- CRYSTALS -->

    <section class="section-card">

        <div class="section-title">

            <i class="fa-solid fa-gem"></i>

            CRYSTALS

        </div>

        <div
            id="crystalContainer"
            class="crystal-grid"
        ></div>

    </section>


    <!-- MOTTO -->

    <div class="motto">

        <div class="motto-text">

            <span>Dream.</span>
            <br>

            Believe.

            <br>

            <span>Become.</span>

        </div>

    </div>

</div>


<!-- MODAL -->

<div
    id="customModal"
    class="modal-overlay"
    onclick="modalOutsideClick(event)"
>

    <div class="custom-modal">

        <h2
            id="modalTitle"
            class="modal-title"
        >
            FIT & GET
        </h2>

        <div
            id="modalBody"
            class="modal-body"
        ></div>

        <div
            id="modalInputArea"
        ></div>

        <div
            id="modalActions"
            class="modal-actions"
        >

            <button
                class="modal-btn"
                onclick="closeModal()"
            >
                CLOSE
            </button>

        </div>

    </div>

</div>


<!-- TOAST -->

<div id="toast"></div>


<script type="module">

/* FIREBASE */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    updateDoc,
    onSnapshot,
    collection,
    query,
    orderBy,
    getDocs,
    runTransaction,
    setDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* CONFIG */

const firebaseConfig = {

    apiKey:
        "AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",

    authDomain:
        "fitandget-b3461.firebaseapp.com",

    projectId:
        "fitandget-b3461",

    storageBucket:
        "fitandget-b3461.firebasestorage.app",

    messagingSenderId:
        "216178533513",

    appId:
        "1:216178533513:web:975f20599c7e77b9d01258"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* CLOUDINARY */

const CLOUDINARY_CLOUD_NAME =
    "ey7wjwyw";

const CLOUDINARY_UPLOAD_PRESET =
    "FITANDGET";


/* GLOBALS */

let currentUser = null;

let unsubscribeUser = null;

let targetUid = null;

let targetUserData = {};

let currentUserLikedTarget = false;


/* GET PROFILE UID */

const urlParams =
    new URLSearchParams(
        window.location.search
    );

const requestedUid =
    urlParams.get("uid");


/*
If ?uid= is present,
show that user's profile.

Otherwise show logged-in user's profile.
*/


/* AUTH */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        currentUser = user;

        targetUid =
            requestedUid || user.uid;

        await startProfileListener();

        await updateLeaderboardRank();

        document
            .getElementById("loadingScreen")
            .style.display = "none";

/* PROFILE LISTENER */

async function startProfileListener(){

    if(unsubscribeUser){
        unsubscribeUser();
    }

    const userRef =
        doc(
            db,
            "users",
            targetUid
        );


    unsubscribeUser =
        onSnapshot(
            userRef,
            async (snap) => {

                if(!snap.exists()){

                    showToast(
                        "Profile not found"
                    );

                    return;

                }

                const data =
                    snap.data();

                targetUserData =
                    data;


                /* USERNAME */

                document
                    .getElementById(
                        "usernameText"
                    )
                    .textContent =
                    data.username ||
                    "User";


                /* PHOTO */

                const photo =
                    data.photoURL ||
                    "";

                document
                    .getElementById(
                        "profileImage"
                    )
                    .src =
                    photo ||
                    createAvatar(
                        data.username ||
                        "User"
                    );


                /* BIO */

                const bio =
                    data.bio || "";

                const bioBox =
                    document
                    .getElementById(
                        "bioText"
                    );

                bioBox.value =
                    bio.substring(
                        0,
                        20
                    );

                updateBioCount();


                /* LIKES */

                const likes =
                    Number(
                        data.loveCount ??
                        data.likes ??
                        0
                    );

                document
                    .getElementById(
                        "likeCounter"
                    )
                    .textContent =
                    formatNumber(likes);


                /* STREAK */

                document
                    .getElementById(
                        "streakCounter"
                    )
                    .textContent =
                    formatNumber(
                        data.dailyStreak ??
                        0
                    );


                /* SHIELD */

                document
                    .getElementById(
                        "shieldCount"
                    )
                    .textContent =
                    formatNumber(
                        data.shield ??
                        0
                    );


                /* RC */

                document
                    .getElementById(
                        "rcCount"
                    )
                    .textContent =
                    formatNumber(
                        data.rcPoints ??
                        data.rc ??
                        data.coins ??
                        0
                    );


                /* TOKEN */

                document
                    .getElementById(
                        "tokenCount"
                    )
                    .textContent =
                    formatNumber(
                        data.eligibilityTokens ??
                        data.tokens ??
                        0
                    );


                /* ACHIEVEMENTS */

                renderAchievements(
                    data.achievements ||

                );


                /* CRYSTALS */

                renderCrystals(
                    data.crystals ||
                    []

            },
            (error) => {

                console.error(error);

        );

/* LIKE */

window.handleLike =
async function(){

    if(!currentUser){

        showToast(
            "Login required"
        );

        return;

    }


    if(!targetUid){

        return;

    }


    const likeRef =
        doc(
            db,
            "users",
            targetUid,
            "likes",
            currentUser.uid
        );


    const profileRef =
        doc(
            db,
            "users",
            targetUid
        );


    try{

        const result =
            await runTransaction(
                db,
                async (transaction) => {

                    const likeSnap =
                        await transaction.get(
                            likeRef
                        );

                    const profileSnap =
                        await transaction.get(
                            profileRef
                        );


                    if(!profileSnap.exists()){

                        throw new Error(
                            "Profile does not exist"
                        );

                    }


                    if(likeSnap.exists()){

                        return {
                            alreadyLiked:true
                        };

                    }


                    const data =
                        profileSnap.data();


                    const oldCount =
                        Number(
                            data.loveCount ??
                            data.likes ??
                            0
                        );


                    transaction.set(
                        likeRef,
                        {
                            uid:
                                currentUser.uid,

                            createdAt:
                                new Date()
                        }
                    );


                    transaction.update(
                        profileRef,
                        {
                            loveCount:
                                oldCount + 1
                        }
                    );


                    return {
                        alreadyLiked:false
                    };

                }
            );


        if(
            result.alreadyLiked
        ){

            currentUserLikedTarget =
                true;

            updateLikeUI();

            showToast(
                "You already liked this profile"
            );

            return;

        }


        currentUserLikedTarget =
            true;

        updateLikeUI();

        showToast(
            "❤️ Like added"
        );

    }
    catch(error){

        console.error(
            "Like error:",
            error
        );

        showToast(
            "Like failed"
        );

    }

};

/* IMAGE UPLOAD */

window.uploadImage =
async function(event){

    if(
        !currentUser ||
        targetUid !== currentUser.uid
    ){

        showToast(
            "You can only edit your own profile"
        );

        return;

    }


    const file =
        event.target.files[0];


    if(!file){
        return;
    }


    if(
        file.size >
        5 * 1024 * 1024
    ){

        showToast(
            "Image must be below 5MB"
        );

        return;

    }


    showToast(
        "Uploading..."
    );


    try{

        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );

        formData.append(
            "upload_preset",
            CLOUDINARY_UPLOAD_PRESET
        );


        const response =
            await fetch(
                `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                {
                    method:"POST",
                    body:formData
                }
            );


        const result =
            await response.json();


        if(
            !result.secure_url
        ){

            throw new Error(
                "Upload failed"
            );

        }


        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                photoURL:
                    result.secure_url
            }
        );


        showToast(
            "Profile photo updated"
        );

    }
    catch(error){

        console.error(error);

        showToast(
            "Image upload failed"
        );

    }

};

/* ACHIEVEMENTS */

function renderAchievements(
    achievements
){

    const container =
        document.getElementById(
            "achieveContainer"
        );


    container.innerHTML = "";


    if(
        !Array.isArray(
            achievements
        ) ||
        achievements.length === 0
    ){

        container.innerHTML = `
            <div
                class="empty-state"
                style="grid-column:1/-1"
            >
                <i class="fa-solid fa-trophy"></i>
                <br>
                No achievements yet.
            </div>
        `;

        return;

    }


    achievements
        .slice(0,6)
        .forEach(
            (achievement) => {

                let name =
                    "Achievement";

                let desc =
                    "Completed";

                let icon =
                    "fa-medal";


                if(
                    typeof achievement ===
                    "string"
                ){

                    name =
                        achievement;

                }
                else if(
                    achievement &&
                    typeof achievement ===
                    "object"
                ){

                    name =
                        achievement.name ||
                        achievement.title ||
                        name;

                    desc =
                        achievement.description ||
                        achievement.desc ||
                        achievement.status ||
                        desc;

                    icon =
                        achievement.icon ||
                        icon;

                }


                container.innerHTML += `

                    <div class="item-card">

                        <div class="item-icon">

                            <i class="fa-solid ${escapeHTML(icon)}"></i>

                        </div>

                        <div class="item-name">
                            ${escapeHTML(name)}
                        </div>

                        <div class="item-desc">
                            ${escapeHTML(desc)}
                        </div>

                    </div>

                `;

            }
        );

}

/* LEADERBOARD RANK */

async function updateLeaderboardRank(){

    if(!currentUser){
        return;
    }


    try{

        const usersRef =
            collection(
                db,
                "users"
            );


        const q =
            query(
                usersRef,
                orderBy(
                    "totalPoints",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(q);


        let position = 0;

        let rank = 0;

        let previousPoints =
            null;


        snapshot.forEach(
            (userDoc) => {

                position++;


                const data =
                    userDoc.data();


                const points =
                    Number(
                        data.totalPoints ||
                        0
                    );


                if(
                    previousPoints === null ||
                    points < previousPoints
                ){

                    rank =
                        position;

                }


                if(
                    userDoc.id ===
                    targetUid
                ){

                    document
                        .getElementById(
                            "rankText"
                        )
                        .textContent =
                        `Rank #${rank}`;

                }


                previousPoints =
                    points;

            }
        );


    }
    catch(error){

        console.error(
            "Leaderboard error:",
            error
        );


        document
            .getElementById(
                "rankText"
            )
            .textContent =
            "Rank #--";

    }

}

/* FORMAT */

function formatNumber(
    number
){

    const value =
        Number(number || 0);


    if(
        value >= 1000000
    ){

        return (
            value / 1000000
        ).toFixed(1) + "M";

    }


    if(
        value >= 1000
    ){

        return (
            value / 1000
        ).toFixed(1) + "K";

    }


    return String(value);

}


/* ESCAPE HTML */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* DEFAULT AVATAR */

function createAvatar(
    name
){

    const letter =
        String(name || "U")
        .trim()
        .charAt(0)
        .toUpperCase();


    const svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="200"
            height="200"
        >

            <rect
                width="200"
                height="200"
                fill="#071007"
            />

            <circle
                cx="100"
                cy="100"
                r="78"
                fill="#102010"
                stroke="#7CFC00"
                stroke-width="4"
            />

            <text
                x="100"
                y="120"
                text-anchor="middle"
                font-size="80"
                font-family="Arial"
                font-weight="bold"
                fill="#7CFC00"
            >
                ${letter}
            </text>

        </svg>

    `;


    return (
        "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(svg)
    );

}
