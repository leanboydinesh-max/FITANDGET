<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050505;
color:#fff;
overflow-x:hidden;
}

.container{
width:100%;
max-width:430px;
margin:auto;
padding:20px;
padding-bottom:100px;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.left{
display:flex;
align-items:center;
gap:12px;
}

.menu{
font-size:24px;
color:#fff;
cursor:pointer;
}

.username{
font-size:18px;
font-weight:600;
color:#fff;
}

.right{
display:flex;
gap:18px;
}

.right i{
font-size:22px;
cursor:pointer;
color:#fff;
transition:.3s;
}

.right i:hover{
color:#7CFC00;
}

/* LOGO */

.logo{
text-align:center;
margin-top:10px;
margin-bottom:30px;
}

.logo img{
width:170px;
}

.logo h1{
margin-top:12px;
font-size:30px;
font-weight:700;
color:#7CFC00;
}

.logo p{
margin-top:10px;
font-size:14px;
line-height:24px;
color:#cfcfcf;
}

/* COMMON CARD */

.card{
background:#111;
border:1px solid #222;
border-radius:20px;
padding:18px;
box-shadow:0 0 15px rgba(124,252,0,.15);
margin-bottom:10px;
}

.row{
display:flex;
gap:15px;
}

.card h3{
color:#7CFC00;
margin-bottom:12px;
font-size:18px;
}

.card p{
font-size:14px;
line-height:22px;
color:#d8d8d8;
}

.progress{
width:100%;
height:8px;
background:#333;
border-radius:20px;
margin-top:12px;
overflow:hidden;
}

.progress span{
display:block;
width:70%;
height:100%;
background:#7CFC00;
}
.section-title{
font-size:22px;
color:#7CFC00;
margin:5px 0 5px;
font-weight:700;
}

.event-card{
background:#111;
border:1px solid #222;
border-radius:20px;
padding:18px;
margin-bottom:18px;
box-shadow:0 0 15px rgba(124,252,0,.15);
}

.event-card h3{
color:#7CFC00;
margin-bottom:10px;
}

.event-card p{
margin-bottom:15px;
color:#ccc;
}

.event-card button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#7CFC00;
font-weight:bold;
cursor:pointer;
}
</style>
