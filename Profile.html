<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Updated Premium Gamer Profile HUD - Insta Bio</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --neon-primary: #00ff66;
      --neon-glow: rgba(0, 255, 102, 0.4);
      --bg-dark: #030a05;
      --panel-bg: rgba(8, 26, 14, 0.85);
      --box-bg: rgba(14, 42, 23, 0.7);
      --border-green: #00ff66;
      --text-main: #ffffff;
      --text-muted: #83b890;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(0, 255, 102, 0.15) 0%, transparent 70%),
        linear-gradient(rgba(0, 255, 102, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 102, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 25px 25px, 25px 25px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-viewport {
      width: 100%;
      height: 100%;
      background: rgba(3, 12, 6, 0.95);
      border: 2px solid var(--border-green);
      box-shadow: inset 0 0 25px var(--neon-glow), 0 0 35px var(--neon-glow);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    /* HEADER */
    .header-bar {
      background: var(--panel-bg);
      border: 1px solid var(--border-green);
      border-radius: 12px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 15px var(--neon-glow);
      backdrop-filter: blur(8px);
    }

    .header-btn {
      background: var(--box-bg);
      border: 1px solid var(--border-green);
      color: var(--neon-primary);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .header-center {
      text-align: center;
    }

    .username-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .username {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-primary);
      background: transparent;
      border: none;
      outline: none;
      text-align: center;
    }

    .username[contenteditable="true"] {
      border-bottom: 2px dashed var(--neon-primary);
      background: rgba(0, 255, 102, 0.1);
      color: var(--neon-primary);
    }

    .edit-btn {
      color: var(--neon-primary);
      cursor: pointer;
      font-size: 13px;
    }

    .leaderboard-rank {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: var(--neon-primary);
      margin-top: 2px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* MAIN PROFILE HUD CARD */
    .profile-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-green);
      border-radius: 14px;
      padding: 12px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.1);
      backdrop-filter: blur(8px);
    }

    .profile-top-layout {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* AVATAR + NEON BORDER */
    .avatar-wrapper {
      position: relative;
      width: 75px;
      height: 75px;
      flex-shrink: 0;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, var(--neon-primary), transparent, var(--neon-primary));
      background-size: 200% 200%;
      animation: neonGlowRotate 3s linear infinite;
    }

    @keyframes neonGlowRotate {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--box-bg);
      display: block;
    }

    .status-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 12px;
      height: 12px;
      background-color: var(--neon-primary);
      border-radius: 50%;
      border: 2px solid #000;
      box-shadow: 0 0 8px var(--neon-primary);
    }

    .add-pic-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--neon-primary);
      color: #000;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      border: 2px solid #000;
      box-shadow: 0 0 8px var(--neon-primary);
    }

    /* INSTAGRAM STYLE BIO SECTION */
    .bio-container {
      flex-grow: 1;
      background: var(--box-bg);
      border: 1px solid rgba(0, 255, 102, 0.4);
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .bio-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--neon-primary);
      font-family: 'Orbitron', sans-serif;
      margin-bottom: 4px;
    }

    .insta-bio-input {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      outline: none;
      line-height: 1.2;
    }

    .insta-bio-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-weight: normal;
    }

    .counter-badge {
      background: rgba(0, 255, 102, 0.15);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid var(--neon-primary);
    }

    /* RIGHT BADGES */
    .top-right-badges {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .like-badge, .streak-badge {
      background: var(--box-bg);
      border: 1px solid var(--border-green);
      border-radius: 8px;
      padding: 5px 8px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 0 8px var(--neon-glow);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .icon-heart { color: #ff3366; filter: drop-shadow(0 0 5px #ff3366); }
    .icon-fire { color: #ff9900; filter: drop-shadow(0 0 5px #ff9900); }

    /* OPEN STATS ROW WITH CLEAR TEXT LABELS */
    .open-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--box-bg);
      border: 1px solid rgba(0, 255, 102, 0.4);
      border-radius: 10px;
      padding: 10px 5px;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid var(--border-green);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .stat-pill:active {
      transform: scale(0.95);
      background: var(--neon-primary);
      color: #000;
    }

    .stat-pill i {
      font-size: 0.95rem;
      color: var(--neon-primary);
    }

    .stat-pill:active i {
      color: #000;
    }

    .stat-pill span {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ACHIEVEMENTS & CRYSTALS SECTIONS */
    .sections-box {
      background: var(--panel-bg);
      border: 1px solid var(--border-green);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-grow: 1;
      box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.1);
      backdrop-filter: blur(8px);
    }

    .slider-header {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: var(--neon-primary);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .items-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      min-height: 75px;
      align-items: center;
    }

    .items-container.grid-view {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow-x: visible;
    }

    .card-item {
      height: 75px;
      background: var(--box-bg);
      border: 1px solid var(--border-green);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.15);
    }

    .items-container:not(.grid-view) .card-item {
      min-width: 85px;
      flex-shrink: 0;
    }

    .card-item i {
      font-size: 20px;
      color: var(--neon-primary);
      filter: drop-shadow(0 0 5px var(--neon-primary));
    }

    .card-item span {
      font-size: 0.7rem;
      font-weight: bold;
      color: #fff;
    }

    .empty-msg {
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      border: 1px dashed rgba(0, 255, 102, 0.2);
      padding: 15px;
      border-radius: 8px;
    }

    .motto-banner {
      background: var(--panel-bg);
      border: 1px dashed var(--border-green);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: #fff;
      text-shadow: 0 0 8px var(--neon-primary);
      letter-spacing: 1px;
    }

    /* GLASS POPUP MODAL */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(8, 30, 15, 0.9);
      border: 2px solid var(--border-green);
      border-radius: 16px;
      padding: 20px;
      width: 80%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 0 30px var(--neon-glow);
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      color: var(--neon-primary);
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .modal-body {
      font-size: 0.85rem;
      color: #d0ebd5;
      margin-bottom: 15px;
    }

    .modal-close-btn {
      background: var(--neon-primary);
      color: #000;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
    }
  </style>
</head>
<body>

  <div class="app-viewport">

    <!-- HEADER -->
    <div class="header-bar">
      <button class="header-btn" onclick="openModal('Navigation', 'Back button pressed.')">
        <i class="fa-solid fa-arrow-left"></i>
      </button>

      <div class="header-center">
        <div class="username-wrapper">
          <span class="username" id="usernameText" contenteditable="false">CYBER_KING</span>
          <i class="fa-solid fa-pen-to-square edit-btn" onclick="toggleEditUsername()"></i>
        </div>
        <div class="leaderboard-rank">Rank #01</div>
      </div>

      <button class="header-btn" onclick="openModal('Menu', 'Main menu options.')">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- MAIN PROFILE CARD -->
    <div class="profile-card">
      <div class="profile-top-layout">
        
        <!-- AVATAR -->
        <div class="avatar-wrapper">
          <img id="profileImage" class="avatar-img" src="https://via.placeholder.com/80/0e2a17/00ff66?text=Gamer" alt="Profile">
          <div class="status-dot"></div>
          <label for="imageUpload" class="add-pic-btn">
            <i class="fa-solid fa-plus"></i>
          </label>
          <input type="file" id="imageUpload" style="display:none" accept="image/*" onchange="uploadImage(event)">
        </div>

        <!-- INSTAGRAM STYLE BIO SECTION -->
        <div class="bio-container">
          <div class="bio-header">
            <span>Bio</span>
            <span class="counter-badge" id="charCount">0/60</span>
          </div>
          <input type="text" id="bioText" class="insta-bio-input" maxlength="60" placeholder="Add Instagram style bio..." oninput="updateBioCount()">
        </div>

        <!-- RIGHT BADGES -->
        <div class="top-right-badges">
          <div class="like-badge" onclick="increaseLike()">
            <i class="fa-solid fa-heart icon-heart"></i>
            <span style="font-size: 0.75rem; font-weight: bold; color: var(--neon-primary);" id="likeCounter">0</span>
          </div>
          <div class="streak-badge" onclick="openModal('Streak Details', 'Current Login Streak: 7 Days!')">
            <i class="fa-solid fa-fire icon-fire"></i>
            <span style="font-size: 0.75rem;">7D</span>
          </div>
        </div>
      </div>

      <!-- OPEN STATS ROW -->
      <div class="open-stats-row">
        <div class="stat-pill" onclick="openModal('Shield Info', 'Shield Protection Level 9 Active')">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Shield</span>
        </div>
        <div class="stat-pill" onclick="openModal('RC Point Info', 'Total RC Balance: 2,450')">
          <i class="fa-solid fa-coins"></i>
          <span>RC</span>
        </div>
        <div class="stat-pill" onclick="openModal('Token Info', 'Eligibility Token Validated')">
          <i class="fa-solid fa-ticket"></i>
          <span>Token</span>
        </div>
      </div>
    </div>

    <!-- ACHIEVEMENTS & CRYSTALS SECTIONS -->
    <div class="sections-box">
      <!-- Achievements -->
      <div>
        <div class="slider-header">
          <span>Achievements</span>
          <span style="font-size: 0.65rem; color: var(--text-muted);">Claimed Only</span>
        </div>
        <div class="items-container" id="achieveContainer"></div>
      </div>

      <!-- Crystals -->
      <div>
        <div class="slider-header">
          <span>Crystals</span>
          <span style="font-size: 0.65rem; color: var(--text-muted);">Event Items Only</span>
        </div>
        <div class="items-container" id="crystalContainer"></div>
      </div>
    </div>

    <!-- BOTTOM MOTTO -->
    <div class="motto-banner">
      Dream... Believe... Become...
    </div>

  </div>

  <!-- GLASS MODAL POPUP -->
  <div class="modal-overlay" id="customModal">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">Info</div>
      <div class="modal-body" id="modalBody">Details...</div>
      <button class="modal-close-btn" onclick="closeModal()">CLOSE</button>
    </div>
  </div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOuzSm82d-lDXsmrwX1yWQVre0YD60cWM",
  authDomain: "fitandget-b3461.firebaseapp.com",
  projectId: "fitandget-b3461",
  storageBucket: "fitandget-b3461.firebasestorage.app",
  messagingSenderId: "216178533513",
  appId: "1:216178533513:web:975f20599c7e77b9d01258"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "index.html";
    return;
  }

  const snap = await getDoc(doc(db, "users", user.uid));

  if (!snap.exists()) return;

  const data = snap.data();

  // Username
  document.getElementById("usernameText").textContent =
    data.username || "User";

  // Profile Photo
  if (data.photoURL) {
    document.getElementById("profileImage").src = data.photoURL;
  }

  // Bio
  if (data.bio) {
    document.getElementById("bioText").value = data.bio;
  }

});

</script>
</body>
  </html>
